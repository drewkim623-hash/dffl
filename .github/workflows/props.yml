name: Player props

# Pulls this week's NFL player props for DFFL-rostered players and scores each
# against Sleeper's projection (build-props.mjs -> data/props.json).
#
# The Odds API free plan is 500 requests a month and a full slate costs about
# 56 (14 games x 4 markets), so this runs twice a week: Thursday afternoon,
# when the week's props are up, and Sunday morning, once inactives are known.
# Games already under way are not re-pulled. build-props.mjs also stops
# before the account drops under 30 requests.
on:
  schedule:
    - cron: "30 20 * * 4"     # Thu 15:30 EST / 16:30 EDT
    - cron: "45 15 * * 0"     # Sun 10:45 EST / 11:45 EDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: props
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Price the props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node build-props.mjs

      - name: Commit the board
        run: |
          git config user.name  "dffl-data[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/props.json
          if git diff --staged --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Data: player props"
          # Only data/props.json changed, so a rebase onto newer data commits
          # cannot conflict. No force push.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i * 10))
          done
          echo "::error::Could not push the props board after three tries."
          exit 1
