# Refresh injury return estimates between the weekly builds.
#
# consensus.mjs reconciles the audit (injury-returns.json) with Sleeper/ESPN
# projections and the DraftKings props signal, build-injuries.mjs rewrites the
# snapshot the site reads, and injury-returns.mjs adds the return dates back.
#
# Cron is UTC and does not follow daylight saving, so each slot is listed for
# both EDT and EST, plus a catch-up 30 minutes later, and the gate below works
# out which New York slot (if any) this run is for:
#   09:20 every day, 18:20 Monday and Thursday, 11:50 and 15:50 Sunday.
# A run is for a slot when it starts from 10 minutes before to 55 minutes
# after it. Delays only make a scheduled run later, so the off-DST copy that
# fires 60 minutes late never passes, and the one that fires 60 minutes early
# passes only if GitHub held it back 50 minutes or more (it is then on time).
# A run goes ahead only if no earlier scheduled run for the same slot got its
# commit step through: GitHub drops or delays scheduled runs at busy times,
# and a 20-minute poll arriving while a refresh is pending in the shared
# concurrency group replaces the pending refresh, so the catch-up covers both.
# On Sundays (New York) the run waits, up to 25 minutes, while a
# weekly-data.yml run is queued or in progress (both write injuries.json),
# then goes ahead; publish-data.sh rebases over whatever that run pushed.
#
# The odds are computed in the browser from index.html and these files, so the
# refreshed injuries are read back off the site into data/odds-snapshot.json
# (build-email.mjs only writes that file; it never sends) and the line history.

name: Injury refresh

on:
  schedule:
    - cron: "20,50 13,14 * * *"       # 09:20 (+ 09:50 catch-up), EDT / EST
    - cron: "20,50 22,23 * * 1,4"     # Mon/Thu 18:20 (+ 18:50 catch-up), EDT / EST
    - cron: "50 15,16,19,20 * * 0"    # Sun 11:50 and 15:50, EDT / EST
    - cron: "20 16,17,20,21 * * 0"    # Sun 12:20 and 16:20 catch-ups, EDT / EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but skip the commit and push"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

# Shared with sleeper-poll.yml: both write the same files and push to main.
# weekly-data.yml keeps its own group so a queued poll can never cancel a
# pending weekly-data run (GitHub keeps one pending run per group); the Sunday
# gate above waits while weekly-data is queued or running.
concurrency:
  group: sleeper-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on New York local time
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          repo="${{ github.repository }}"
          read -r dow hh mm <<< "$(TZ=America/New_York date '+%u %H %M')"
          now=$((10#$hh * 60 + 10#$mm))
          targets="560"                                   # 09:20 any day
          if [ "$dow" = 1 ] || [ "$dow" = 4 ]; then targets="$targets 1100"; fi  # 18:20 Mon/Thu
          if [ "$dow" = 7 ]; then targets="$targets 710 950"; fi                 # 11:50, 15:50 Sun
          go=false; late=0
          for t in $targets; do
            d=$((now - t))
            if [ $d -ge -10 ] && [ $d -lt 55 ]; then go=true; late=$d; fi
          done
          echo "New York $hh:$mm (day $dow): go=$go"
          # Already done: an earlier scheduled run for this slot whose commit
          # step succeeded (it pushed, or found nothing to push).
          if [ "$go" = true ]; then
            since=$(( $(date +%s) - (late + 10) * 60 ))
            ids=$(gh run list --repo "$repo" --workflow injury-refresh.yml --event schedule --limit 30 \
              --json databaseId,createdAt --jq ".[] | select((.createdAt | fromdateiso8601) >= $since) | .databaseId") || ids=""
            for id in $ids; do
              [ "$id" = "${{ github.run_id }}" ] && continue
              n=$(gh api "repos/$repo/actions/runs/$id/jobs" \
                --jq '[.jobs[].steps[]? | select(.name == "Commit anything that changed" and .conclusion == "success")] | length') || n=0
              if [ "${n:-0}" -gt 0 ]; then
                echo "Run $id already refreshed this slot; skipping."
                go=false
                break
              fi
            done
          fi
          # Sunday: wait out a weekly-data run, then go ahead.
          if [ "$go" = true ] && [ "$dow" = 7 ]; then
            for i in $(seq 1 10); do
              busy=0
              for st in in_progress queued; do
                n=$(gh run list --repo "$repo" --workflow weekly-data.yml --status "$st" --json databaseId --jq length) || n=0
                busy=$((busy + ${n:-0}))
              done
              if [ "$busy" -eq 0 ]; then break; fi
              echo "Sunday: $busy weekly-data run(s) queued or in progress; waiting ($i of 10)."
              sleep 150
            done
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Always exits 0; a feed that fails falls back to data/consensus-cache/.
      # A stale or no-change run writes nothing.
      - name: Reconcile the injury consensus
        if: steps.gate.outputs.go == 'true'
        run: node consensus.mjs

      - name: Refresh the injury snapshot
        if: steps.gate.outputs.go == 'true'
        run: node build-injuries.mjs

      # After the snapshot on purpose, as in weekly-data.yml: build-injuries.mjs
      # rewrites injuries.json without the return fields, so they are added back here.
      - name: Estimate injury return dates
        if: steps.gate.outputs.go == 'true'
        run: node injury-returns.mjs

      # After projections (build-injuries.mjs), before the odds are read.
      - name: Price each roster against the ones it fielded
        if: steps.gate.outputs.go == 'true'
        run: node build-roster-weeks.mjs || echo "::warning::roster weeks not updated"

      - name: Install the browser for the odds snapshot
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Writes data/odds-snapshot.json and nothing else; it never sends.
      - name: Snapshot what the site is showing
        if: steps.gate.outputs.go == 'true'
        run: node build-email.mjs

      - name: Add this run's odds reading to the line history
        if: steps.gate.outputs.go == 'true'
        run: node build-odds-history.mjs || echo "::warning::odds history not updated"

      # So the next sleeper-poll.yml run does not redo this one's work.
      - name: Record the Sleeper fingerprint
        if: steps.gate.outputs.go == 'true'
        run: node sleeper-fingerprint.mjs --write

      # publish-data.sh: rebase onto origin and push, up to 5 attempts with
      # backoff; a failed push keeps the commit, a conflicting rebase resets to
      # origin and reruns the builds below. No force push.
      - name: Commit anything that changed
        if: steps.gate.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name  "dffl-data[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rebuild='
            node consensus.mjs
            node build-injuries.mjs
            node injury-returns.mjs
            node build-roster-weeks.mjs || echo "::warning::roster weeks not updated"
            node build-email.mjs
            node build-odds-history.mjs || echo "::warning::odds history not updated"
            node sleeper-fingerprint.mjs --write
          '
          bash publish-data.sh "Data: injury refresh" "$rebuild" \
            data injuries.json injury-returns.json injury-returns-cache.json \
            data/odds-snapshot.json data/odds-history.json data/sleeper-fingerprint.json
