      A.rows.slice().sort((a, b) => a.pick - b.pick).map(r => `<tr>
        <td class="num">${r.pick}</td><td class="num">${r.round}</td>
        <td>${pill(r)}${kmark(r)}</td>
        <td>${r.uid ? esc(nameOf(r.uid)) : "—"}</td>
        <td class="num">${scored ? f1(r.pts) : "—"}</td>
        <td class="num ${r.value >= 0 ? "pos-t" : "neg-t"}">${scored ? `${r.value >= 0 ? "+" : ""}${r.value}` : "—"}</td></tr>`)));
  }

  function draw() {
    const s = drafted.find(x => x.season === sel.value);
    const A = draftAnalysis(s.picks, s.playerPts, s.uidOf);
    // If Sleeper didn't return per-player scoring, every value would be
    // meaningless. Show the board without value rather than fake numbers.
    const scored = !!A && A.rows.filter(r => r.pts > 0).length >= A.rows.length * 0.25;
    drawHighlights(s, scored ? A : null);
    if (!scored && viewSel.value === "list") {
      host.innerHTML = "";
      host.appendChild(el("div", "empty",
        `<b>Draft board only for ${esc(s.season)}</b>Sleeper hasn't returned per-player scoring for this
         season, so steals and busts can't be calculated. The picks themselves are below.`));
      drawList(s, A, false);
      return;
    }
    if (viewSel.value === "board") return drawBoard(s, A, scored);
    if (viewSel.value === "mgr") return drawByManager(s, A, scored);
    drawList(s, A, scored);
  }
  sel.onchange = draw; viewSel.onchange = draw;
  // The board needs the draft's slot order, which is another request per season.
  // Draw the highlights now and leave the board itself until somebody opens the
  // tab, so booting the page still costs nothing extra.
  drawHighlights(drafted[0], null);
  p._draw = draw;
  return p;
}

/* =============================================== POWER ============== */
/*
 * ESPN-style weekly power rankings.
 *
 * The whole point of a power ranking is that it disagrees with the standings,
 * so the blend below is written down on the page rather than kept in here. Four
 * measures, every one of them already visible elsewhere on the site:
 *
 *   all-play (40%)  every week, a team is compared with all eleven others
 *                   instead of the one it happened to be scheduled against.
 *                   It is the least luck-dependent thing in the data.
 *   form    (25%)   the same measure over the last three weeks only, because a
 *                   team in September is not the team it is in November.
 *   points  (20%)   raw scoring, scaled across the league that week. Says
 *                   nothing about who you played.
 *   record  (15%)   what actually decides the season — and the noisiest of the
 *                   four, which is why it carries the least.
 *
 * Ranked cumulatively: the week-8 board knows everything through week 8 and
 * nothing after it, so the movement between two boards is real movement.
 */
const POWER_W = { allPlay: 0.40, form: 0.25, points: 0.20, record: 0.15 };
const FORM_WEEKS = 3;

/** Every season's boards, built once and shared by the Power tab and the recaps. */
let POWERMAP = null;
function allPowerRankings() {
  if (POWERMAP) return POWERMAP;
  POWERMAP = new Map();
  for (const s of DB.seasons) {
    if (!s.games.some(g => !g.playoff)) continue;
    const r = powerRankings(s);
    if (r) POWERMAP.set(s.season, r);
  }
  return POWERMAP;
}

/** Every regular-season week of a season, as a map of manager to what he scored. */
function weeklyScores(season) {
  const lastReg = (season.pws || 15) - 1;
  const byWeek = new Map();
  for (const g of season.games) {
    if (g.playoff || g.week > lastReg) continue;
    if (!byWeek.has(g.week)) byWeek.set(g.week, []);
    byWeek.get(g.week).push({ uid: g.a.uid, pts: g.a.pts, opp: g.b.uid, oppPts: g.b.pts },
      { uid: g.b.uid, pts: g.b.pts, opp: g.a.uid, oppPts: g.a.pts });
  }
  return byWeek;
}

/**
 * The board for every week of a season, each one built only from what had
 * happened by then.
 */
function powerRankings(season) {
  const byWeek = weeklyScores(season);
  const weeks = [...byWeek.keys()].sort((a, b) => a - b);
  if (!weeks.length) return null;
  const uids = [...new Set([...byWeek.values()].flat().map(x => x.uid))];
  if (uids.length < 2) return null;

  const acc = new Map(uids.map(u => [u, { apW: 0, apL: 0, pf: 0, w: 0, l: 0, t: 0, g: 0 }]));
  const boards = [];
  let prevRank = null;

  for (const wk of weeks) {
    const rows = byWeek.get(wk);
    // All-play: beat everybody who scored less that week, lose to everybody who
    // scored more. Exactly the measure the Managers tab already reports.
    for (const x of rows) {
      const a = acc.get(x.uid);
      for (const y of rows) {
        if (y === x) continue;
        if (x.pts > y.pts) a.apW++; else if (x.pts < y.pts) a.apL++;
      }
      a.pf += x.pts; a.g++;
      if (x.pts > x.oppPts) a.w++; else if (x.pts < x.oppPts) a.l++; else a.t++;
    }

    // Form is the same all-play arithmetic over the last three weeks only.
    const window = weeks.filter(w => w <= wk && w > wk - FORM_WEEKS);
    const form = new Map(uids.map(u => [u, { w: 0, l: 0 }]));
    for (const w of window) for (const x of byWeek.get(w)) {
      const f = form.get(x.uid);
      if (!f) continue;
      for (const y of byWeek.get(w)) {
        if (y === x) continue;
        if (x.pts > y.pts) f.w++; else if (x.pts < y.pts) f.l++;
      }
    }

    const pfs = uids.map(u => acc.get(u).pf);
    const lo = Math.min(...pfs), hi = Math.max(...pfs);
    const board = uids.map(uid => {
      const a = acc.get(uid), f = form.get(uid);
      const apT = a.apW + a.apL, fT = f.w + f.l, dec = a.w + a.l + a.t;
      const apPct = apT ? a.apW / apT : 0;
      const formPct = fT ? f.w / fT : apPct;
      const pfNorm = hi > lo ? (a.pf - lo) / (hi - lo) : 0.5;
      const winPct = dec ? (a.w + a.t / 2) / dec : 0;
      return {
        uid, apPct, formPct, pfNorm, winPct,
        pf: a.pf, w: a.w, l: a.l, t: a.t, g: a.g,
        score: POWER_W.allPlay * apPct + POWER_W.form * formPct
          + POWER_W.points * pfNorm + POWER_W.record * winPct,
      };
    }).sort((x, y) => y.score - x.score || y.pf - x.pf);

    board.forEach((r, i) => {
      r.rank = i + 1;
      // Week one has nothing behind it, so nothing moved.
      r.prev = prevRank ? (prevRank.get(r.uid) ?? null) : null;
      r.move = r.prev == null ? null : r.prev - r.rank;
    });
    prevRank = new Map(board.map(r => [r.uid, r.rank]));
    boards.push({ season: season.season, week: wk, rows: board });
  }

  // One rank history per manager, for the sparklines.
  const history = new Map(uids.map(u => [u, boards.map(b => b.rows.find(r => r.uid === u).rank)]));
  return { season: season.season, weeks, boards, history, n: uids.length };
}

/* --------------------------------------------------------------- blurbs */
/**
 * One line per team, written by the weekly job into rankings.json. The site
 * never needs them: if the file is missing, unreachable or simply has nothing
 * for this week, the board renders exactly as it otherwise would.
 */
let BLURBS = null;
async function loadBlurbs(reload) {
  if (BLURBS && !reload) return BLURBS;
  let data = null;
  try { data = await jget("rankings.json"); } catch (e) { data = null; }
  const map = new Map();
  for (const w of (data && data.weeks) || []) {
    for (const t of w.teams || []) {
      if (!t || !t.manager || !t.blurb) continue;
      map.set(`${w.season}|${w.week}|${String(t.manager).toLowerCase()}`, String(t.blurb));
    }
  }
  BLURBS = { map, ok: !!data, weeks: ((data && data.weeks) || []).length };
  return BLURBS;
}
const blurbFor = (season, week, uid) =>
  BLURBS ? BLURBS.map.get(`${season}|${week}|${String(nameOf(uid)).toLowerCase()}`) || null : null;

/* ---------------------------------------------------------------- panel */
/** ↑3 / ↓2 / — . The arrow and the number both carry it; the colour is a bonus. */
function moveHTML(move) {
  // Week one has no board behind it, so it gets no mark at all rather than a
  // dash that could be read as "held its place".
  if (move == null) return `<span class="mv none"></span>`;
  if (move === 0) return `<span class="mv flat" title="held its place">—</span>`;
  const up = move > 0;
  return `<span class="mv ${up ? "up" : "down"}" title="${up ? "up" : "down"} ${Math.abs(move)} place${Math.abs(move) === 1 ? "" : "s"} on last week">${up ? "▲" : "▼"} ${Math.abs(move)}</span>`;
}

/** A team's rank week by week. Low is good, so the y axis is inverted. */
function rankSpark(ranks, upto, n) {
  const pts = ranks.slice(0, upto);
  if (pts.length < 2) return "";
  const W = 118, H = 26, pad = 3;
  const x = i => pad + (i * (W - pad * 2)) / Math.max(1, pts.length - 1);
  const y = r => pad + ((r - 1) * (H - pad * 2)) / Math.max(1, n - 1);
  const d = pts.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r).toFixed(1)}`).join("");
  const last = pts[pts.length - 1], first = pts[0];
  const stroke = last < first ? "var(--good)" : last > first ? "var(--crit)" : "var(--muted)";
  // Without a reference the line says nothing about where a team actually sits,
  // so the playoff cut is drawn behind it: above the dashes is a place in the six.
  const cut = y(6.5).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="ranked ${first} in week 1, ${last} now; the dashed line is the playoff cut">
    <line x1="0" y1="${cut}" x2="${W}" y2="${cut}" stroke="var(--mid)" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.4" fill="${stroke}"/></svg>`;
}

/**
 * The board before a ball is kicked, ranked off the draft.
 *
 * There is no all-play, no form and no record yet, so this is not the same
 * rating and does not pretend to be: it is the Odds tab's post-draft model —
 * roster value against the pre-draft market, plus what the manager has scored
 * before — sorted, with the season projection beside it.
 */
function projectedBoard(model, sim) {
  if (!model || !model.ok || !model.postDraft || !sim) return null;
  const n = sim.sims;
  const rows = model.teams.map((t, i) => ({
    uid: t.uid, mean: t.mean, edge: t.edge,
    fromDraft: W_ROSTER * t.rosterEdge, fromRecord: W_HIST_POST * t.rawEdge,
    rosterValue: t.rosterValue,
    wins: sim.wins[i] / n, playoff: sim.playoff[i] / n, title: sim.title[i] / n,
  })).sort((a, b) => b.mean - a.mean);
  rows.forEach((r, i) => { r.rank = i + 1; });
  return { season: model.season, rows, sims: n };
}

function panelPower(model, sim) {
  const p = el("div", "panel"); p.dataset.panel = "power";
  p.appendChild(sechead("Power rankings",
    "Not the standings. Every week each team is measured against the whole league rather than the one opponent it drew, and the board is rebuilt from scratch — so the arrows are real movement, not a hot take."));

  const proj = projectedBoard(model, sim);
  const all = allPowerRankings();
  if (!all.size && !proj) {
    p.appendChild(el("div", "empty",
      "<b>No weeks to rank yet</b>The board is built out of results, and there aren't any. It starts the week the season does."));
    return p;
  }
  window.__POWER = all; window.__PROJ = proj;

  const PROJKEY = "__proj";
  const picks = el("div", "pickrow");
  const seasonSel = el("select"), weekSel = el("select");
  if (proj) { const o = el("option", null, `${proj.season} preseason`); o.value = PROJKEY; seasonSel.appendChild(o); }
  for (const yr of [...all.keys()]) { const o = el("option", null, `${yr} season`); o.value = yr; seasonSel.appendChild(o); }
  picks.appendChild(seasonSel); picks.appendChild(weekSel);
  p.appendChild(picks);
  const host = el("div"); p.appendChild(host);

  function fillWeeks() {
    if (seasonSel.value === PROJKEY) {
      weekSel.innerHTML = "";
      const o = el("option", null, "Projected, off the draft"); o.value = "proj";
      weekSel.appendChild(o); weekSel.disabled = true;
      return;
    }
    weekSel.disabled = false;
    const R = all.get(seasonSel.value);
    weekSel.innerHTML = "";
    for (const w of R.weeks) { const o = el("option", null, `Week ${w}`); o.value = String(w); weekSel.appendChild(o); }
    // Default to the newest board there is — the one people came to read.
    weekSel.value = String(R.weeks[R.weeks.length - 1]);
  }

  function drawProjection() {
    host.innerHTML = "";
    const mode = el("div", "mode");
    mode.innerHTML = `<span class="pill post">Projected · post-draft</span>
      <span class="what">Nobody has played a game, so there is no all-play, no form and no record to
        rank on. This is the draft board instead: every roster valued against the pre-draft market and
        run through the same model the Odds tab prices from. It is a starting position, not a result.</span>`;
    host.appendChild(mode);

    const rows = el("div", "rows");
    for (const r of proj.rows) {
      const row = el("div", "pwrow");
      row.innerHTML = `
        <span class="pr">${r.rank}</span>
        <span class="mv none"></span>
        ${avatarHTML(r.uid, "sm")}
        <span class="id">
          <span class="n">${esc(nameOf(r.uid))}</span>
          <span class="s">projects to ${f1(r.mean)} points a week · ${f1(r.wins)} wins</span>
        </span>
        <span class="sp"></span>
        <span class="stats">
          <span class="chip"><span class="cv">${f1(r.rosterValue)}</span><span class="cl">Roster</span></span>
          <span class="chip"><span class="cv">${r.fromDraft >= 0 ? "+" : ""}${f1(r.fromDraft)}</span><span class="cl">From draft</span></span>
          <span class="chip"><span class="cv">${r.fromRecord >= 0 ? "+" : ""}${f1(r.fromRecord)}</span><span class="cl">From record</span></span>
          <span class="chip"><span class="cv">${pct(r.playoff)}</span><span class="cl">Playoffs</span></span>
        </span>`;
      bindTip(row, `<b>${esc(nameOf(r.uid))}</b><br>
        projects ${f1(r.mean)} pts a week · ${f1(r.wins)} wins<br>
        makes the playoffs ${pct(r.playoff)} · wins it ${pct(r.title)}`);
      rows.appendChild(row);
    }
    host.appendChild(rows);

    const m = el("div", "method");
    m.innerHTML = `<h3>Why this board is different</h3>
      <p>The weekly boards rank on what teams have done. This one has nothing to go on, so it ranks on
         what they drafted: each roster's best ${model.rosterCap || 15} picks priced against the
         pre-draft market, weighted ${W_ROSTER}, plus the manager's own scoring record, weighted
         ${W_HIST_POST}. Both multipliers were fitted on DFFL's own drafts and results — the Odds tab
         shows that working in full.</p>
      <p>Projected wins and playoff odds come from ${proj.sims.toLocaleString()} simulated seasons on
         the real DFFL format. About half of a draft-day edge survives into actual scoring; the rest is
         injuries, waivers and luck, none of which have happened yet.</p>`;
    host.appendChild(m);
  }

  function draw() {
    if (seasonSel.value === PROJKEY) return drawProjection();
    const R = all.get(seasonSel.value);
    const wk = Number(weekSel.value);
    const idx = R.weeks.indexOf(wk);
    const board = R.boards[idx];
    host.innerHTML = "";
    if (!board) { host.appendChild(el("div", "empty", "<b>No board for that week</b>")); return; }

    const rows = el("div", "rows");
    let blurbed = 0;
    for (const r of board.rows) {
      const blurb = blurbFor(R.season, wk, r.uid);
      if (blurb) blurbed++;
      const row = el("div", "pwrow");
      row.innerHTML = `
        <span class="pr">${r.rank}</span>
        ${moveHTML(r.move)}
        ${avatarHTML(r.uid, "sm")}
        <span class="id">
          <span class="n">${esc(nameOf(r.uid))}</span>
          <span class="s">${blurb ? esc(blurb) : `${r.w}–${r.l}${r.t ? `–${r.t}` : ""} · ${f1(r.pf)} points for`}</span>
        </span>
        <span class="sp">${rankSpark(R.history.get(r.uid), idx + 1, R.n)}</span>
        <span class="stats">
          <span class="chip"><span class="cv">${r.w}–${r.l}${r.t ? `–${r.t}` : ""}</span><span class="cl">Record</span></span>
          <span class="chip"><span class="cv">${pct(r.apPct)}</span><span class="cl">All-play</span></span>
          <span class="chip"><span class="cv">${pct(r.formPct)}</span><span class="cl">Form</span></span>
          <span class="chip"><span class="cv">${f2(r.score)}</span><span class="cl">Rating</span></span>
        </span>`;
      bindTip(row, `<b>${esc(nameOf(r.uid))}</b><br>
        all-play ${pct(r.apPct)} · form ${pct(r.formPct)}<br>
        ${f1(r.pf)} points for · ${pct(r.pfNorm)} of the league's range<br>
        rating ${f2(r.score)}${r.move != null ? `<br>${r.move === 0 ? "held" : r.move > 0 ? `up ${r.move}` : `down ${-r.move}`} on week ${wk - 1}` : ""}`);
      rows.appendChild(row);
    }
    host.appendChild(rows);

    const w = POWER_W;
    const m = el("div", "method");
    m.innerHTML = `<h3>What the rating is made of</h3>
      <dl>
        <dt>All-play win %</dt><dd>${(w.allPlay * 100).toFixed(0)}%</dd>
        <dt>Form, last ${FORM_WEEKS} weeks</dt><dd>${(w.form * 100).toFixed(0)}%</dd>
        <dt>Points for</dt><dd>${(w.points * 100).toFixed(0)}%</dd>
        <dt>Actual record</dt><dd>${(w.record * 100).toFixed(0)}%</dd>
      </dl>
      <p><b>All-play</b> compares a team with all eleven others every week instead of the one it was
         scheduled against, which is why it carries the most: it is the closest thing here to a measure
         of how well somebody actually played. <b>Form</b> is the same arithmetic over the last
         ${FORM_WEEKS} weeks only. <b>Points for</b> is scaled across the league that week, top scorer 1
         and bottom 0. <b>Record</b> counts least — it decides the season, but a 7-3 team can be worse
         than a 5-5 one and often is.</p>
      <p>Each week's board is built from that week and everything before it, and nothing after, so an
         arrow is a real change of position rather than a change of opinion. Week 1 has nothing behind
         it and shows no arrows at all. The line beside each team is its rank, week by week, from the
         first week of the season to this one; the dashes across it are the playoff cut, sixth of
         twelve.</p>`;
    host.appendChild(m);

    // The note is about this week's board, not about whether the file exists: a
    // file that is present but has nothing for week 9 looks the same to a reader.
    if (!blurbed) {
      host.appendChild(el("div", "method",
        `<p>The one-line write-ups come from the weekly job that also posts the recaps — it appends them
          to <code>rankings.json</code> after each week finalizes. There is nothing there for this week,
          so each team shows its record and points instead.</p>`));
    }
  }

  seasonSel.onchange = () => { fillWeeks(); draw(); };
  weekSel.onchange = draw;
  // Open on the newest board that exists. Today that is the 2026 projection,
  // because 2026 has been drafted but not played; the week the season starts it
  // becomes 2026 week 1, and the projection stays one pick away.
  const live = DB.seasons[0] && DB.seasons[0].season;
  if (all.has(live)) seasonSel.value = live;
  else if (proj) seasonSel.value = PROJKEY;
  else if (all.size) seasonSel.value = [...all.keys()][0];
  fillWeeks(); draw();
  return p;
}

/* ================================================ RACE ============== */
/*
 * Live playoff odds for the season being played right now.
 *
 * Everything already on the board is taken as fact — the wins are the wins —
 * and only the games that have not been played yet are simulated. The schedule
 * for those is not invented either: Sleeper publishes the pairings for future
 * weeks with the scores still at zero, so the real remaining schedule is what
 * gets run. Who a team still has to play is most of the story in a 14-week
 * season, and a random schedule would throw that away.
 */

const RACE_SIMS = 20000;
/*
 * Leverage re-runs the whole season twice for every game on the slate — six
 * matchups is twelve more seasons of simulation — so it runs at a much lower
 * count than the main board. Ranking which game moves the picture most only
 * needs the swings accurate to about a point, and 1,000 seasons gives that.
 */
const LEVERAGE_SIMS = 1000;

/** Pair a week's matchup rows whether or not the week has been played. */
function pairSchedule(entries) {
  const by = new Map();
  for (const e of entries || []) {
    if (e.matchup_id == null) continue;
    if (!by.has(e.matchup_id)) by.set(e.matchup_id, []);
    by.get(e.matchup_id).push(e);
  }
  const out = [];
  for (const arr of by.values()) if (arr.length === 2) out.push([arr[0].roster_id, arr[1].roster_id]);
  return out;
}

const gameKey = (week, a, b) => `${week}|${Math.min(a, b)}-${Math.max(a, b)}`;

/**
 * Split the current season into what has happened and what is left, fetching
 * the pairings for the weeks still to come.
 */
async function raceData() {
  const season = DB.seasons[0];
  const R = { season, ready: false, why: null, decided: [], upcoming: [] };
  if (!season) { R.why = "no-league"; return R; }
  const lastReg = (season.pws || 15) - 1;
  const half = Math.floor((season.rosters || []).length / 2);
  R.lastReg = lastReg; R.half = half;
  if (!half || !season.divCount || [...season.divOf.values()].length < season.rosters.length) {
    R.why = "no-divisions"; return R;
  }

  R.decided = season.games.filter(g => !g.playoff && g.week <= lastReg);
  if (!R.decided.length) { R.why = "not-started"; return R; }

  const per = new Map();
  for (const g of R.decided) per.set(g.week, (per.get(g.week) || 0) + 1);
  const need = [];
  for (let w = 1; w <= lastReg; w++) if ((per.get(w) || 0) < half) need.push(w);

  const rows = await pool(need, 6, async w =>
    ({ w, pairs: pairSchedule(await getWeek(season.leagueId, w).catch(() => [])) }));
  const done = new Set(R.decided.map(g => gameKey(g.week, g.a.rid, g.b.rid)));
  for (const { w, pairs } of rows) for (const [a, b] of pairs) {
    if (!done.has(gameKey(w, a, b))) R.upcoming.push({ week: w, a, b });
  }
  R.upcoming.sort((x, y) => x.week - y.week || x.a - y.a);
  R.playedWeeks = per;
  R.nextWeek = R.upcoming.length ? R.upcoming[0].week : null;
  R.ready = R.upcoming.length > 0;
  if (!R.ready) R.why = "regular-season-over";
  return R;
}

/**
 * Rebuild the race as it stood partway through a season that has since
 * finished: everything up to `week` taken as fact, everything after it treated
 * as still to play. This is how the verification harness exercises the engine —
 * a completed season is the only place where the model can be run against a
 * result that is already known.
 */
function raceAsOf(season, week) {
  const lastReg = (season.pws || 15) - 1;
  const reg = season.games.filter(g => !g.playoff && g.week <= lastReg);
  const upcoming = reg.filter(g => g.week > week).map(g => ({ week: g.week, a: g.a.rid, b: g.b.rid }));
  return {
    season, lastReg, ready: upcoming.length > 0, why: null,
    decided: reg.filter(g => g.week <= week),
    upcoming, nextWeek: week + 1,
    half: Math.floor((season.rosters || []).length / 2),
  };
}

/**
 * Monte-Carlo the rest of the season.
 *
 * `force` pins one game's result — used by the leverage pass. Both scores are
 * still drawn normally and simply swapped if the wrong side came out on top, so
 * forcing a win does not quietly hand anybody an unrealistic points-for total.
 */
function raceOdds(R, dist, sims = RACE_SIMS, force = null) {
  const season = R.season;
  if (!R.ready) return null;
  const rids = season.rosters.map(r => r.roster_id);
  const N = rids.length;
  const idx = new Map(rids.map((r, i) => [r, i]));
  const divOf = i => season.divOf.get(rids[i]);

  // A manager with no scoring history on record runs at the league's own
  // average rather than being left out of the race.
  const all = [...dist.values()].filter(d => d.n > 0);
  const lgMean = all.reduce((a, x) => a + x.mean, 0) / Math.max(1, all.length);
  const lgSd = all.reduce((a, x) => a + x.sd, 0) / Math.max(1, all.length);
  const D = rids.map(r => {
    const d = dist.get(season.uidOf.get(r));
    return d && d.n > 0 ? d : { mean: lgMean, sd: lgSd, n: 0 };
  });

  const W0 = new Array(N).fill(0), L0 = new Array(N).fill(0), T0 = new Array(N).fill(0), PF0 = new Array(N).fill(0);
  for (const g of R.decided) {
    const a = idx.get(g.a.rid), b = idx.get(g.b.rid);
    if (a == null || b == null) continue;
    PF0[a] += g.a.pts; PF0[b] += g.b.pts;
    if (g.a.pts > g.b.pts) { W0[a]++; L0[b]++; }
    else if (g.b.pts > g.a.pts) { W0[b]++; L0[a]++; }
    else { T0[a]++; T0[b]++; }
  }
  const up = R.upcoming
    .map(g => [idx.get(g.a), idx.get(g.b), g.week])
    .filter(([a, b]) => a != null && b != null);

  const fWin = force ? idx.get(force.win) : null;
  const fLose = force ? idx.get(force.lose) : null;
  const playoff = new Array(N).fill(0), divWin = new Array(N).fill(0),
    bye = new Array(N).fill(0), winSum = new Array(N).fill(0);
  const ids = rids.map((_, i) => i);
  const half = T0.map(t => t * 0.5);

  for (let k = 0; k < sims; k++) {
    const W = W0.map((w, i) => w + half[i]), PF = PF0.slice();
    for (const [a, b, wk] of up) {
      let sa = gauss(D[a].mean, D[a].sd), sb = gauss(D[b].mean, D[b].sd);
      if (force && wk === force.week && ((a === fWin && b === fLose) || (a === fLose && b === fWin))) {
        const aWins = a === fWin;
        if ((aWins && sb > sa) || (!aWins && sa > sb)) { const t = sa; sa = sb; sb = t; }
      }
      PF[a] += sa; PF[b] += sb;
      if (sa > sb) W[a]++; else W[b]++;
    }
    for (let i = 0; i < N; i++) winSum[i] += W[i];
    const rank = ids.slice().sort((x, y) => W[y] - W[x] || PF[y] - PF[x]);
    const { champs, seeds } = seedField(rank, divOf, season.playoffTeams || 6);
    for (const i of champs) divWin[i]++;
    for (const i of seeds) playoff[i]++;
    if (seeds.length > 1) { bye[seeds[0]]++; bye[seeds[1]]++; }
  }

  const rows = ids.map(i => ({
    rid: rids[i], uid: season.uidOf.get(rids[i]), div: divOf(i),
    w: W0[i], l: L0[i], t: T0[i], pf: PF0[i],
    playoff: playoff[i] / sims, divWin: divWin[i] / sims, bye: bye[i] / sims,
    projWins: winSum[i] / sims,
  }));
  return { sims, rows, byRid: new Map(rows.map(r => [r.rid, r])) };
}

/**
 * How much each game on the next slate actually matters: run the week twice,
 * once with each side forced to win, and measure how far the playoff picture
 * moves between those two worlds — across all twelve teams, not just the two
 * playing, because a result reorders everybody chasing the same places.
 */
function leverageBoard(R, dist, week, sims = LEVERAGE_SIMS) {
  if (!R.ready || week == null) return [];
  const games = R.upcoming.filter(g => g.week === week);
  return games.map(g => {
    const ifA = raceOdds(R, dist, sims, { week, win: g.a, lose: g.b });
    const ifB = raceOdds(R, dist, sims, { week, win: g.b, lose: g.a });
    // `moves` is signed from the point of view of the first team winning; the
    // two teams playing each get the version that means "what winning is worth
    // to me", which is the only reading that isn't misleading on a scoreboard.
    let total = 0;
    const moves = [];
    for (const row of ifA.rows) {
      const other = ifB.byRid.get(row.rid);
      const d = row.playoff - other.playoff;
      total += Math.abs(d);
      moves.push({ rid: row.rid, uid: row.uid, swing: d });
    }
    const swingOf = rid => {
      const m = moves.find(x => x.rid === rid);
      return m ? m.swing : 0;
    };
    return {
      week, a: g.a, b: g.b, sims,
      aUid: R.season.uidOf.get(g.a), bUid: R.season.uidOf.get(g.b),
      aSwing: swingOf(g.a), bSwing: -swingOf(g.b),
      total,
      others: moves.filter(m => m.rid !== g.a && m.rid !== g.b && Math.abs(m.swing) > 0.005)
        .sort((x, y) => Math.abs(y.swing) - Math.abs(x.swing)),
    };
  }).sort((x, y) => y.total - x.total);
}

const pctf = v => v <= 0 ? "0%" : v >= 1 ? "100%" : v < 0.005 ? "<1%" : v > 0.995 ? ">99%" : `${(v * 100).toFixed(0)}%`;
const ppf = v => `${v >= 0 ? "+" : "−"}${(Math.abs(v) * 100).toFixed(1)}%`;

function raceEmpty(R) {

      thousands of times over, and right now every game is remaining — so there is nothing
      here that the preseason board on the Odds tab doesn't already say better.

}

    host.appendChild(tableCard(

      { label: "Worth to the second", num: 1, title: "Playoff probability the second-named team gains by winning it" },

      LEV.map(g => `<tr>
        <td>${esc(nameOf(g.aUid))} v ${esc(nameOf(g.bUid))}</td>

        <td class="num ${g.bSwing >= 0 ? "pos-t" : "neg-t"}">${esc(ppf(g.bSwing))}</td>
        <td class="num"><b>${f1(g.total * 100)}</b></td></tr>`)));

  }

    <p>Every result so far is taken as fact. The remaining schedule is the real one — Sleeper

       ${O.sims.toLocaleString()} times, drawing both teams' scores from how they have actually scored,
       week to week, across ${DB.seasons.length} seasons. The standings that come out of each run are
       seeded by DFFL's own rule and the six playoff places counted.</p>
    <p><b>Clinched</b> and <b>eliminated</b> mean a team made or missed the playoffs in every one of the
       ${O.sims.toLocaleString()} runs. That is not quite the same as mathematically certain, and it is
       not claimed to be.</p>
    <p>Leverage is the honest version of "must-win". A game is run twice, once with each side forced to
       win, and the gap between those two futures is what the game is worth. Both scores are still drawn
       normally and swapped if the wrong side won, so forcing a result doesn't inflate anybody's
       points-for along with it.</p>`;
  host.appendChild(m);
}

let RACE_STARTED = false;
async function ensureRace() {
  if (RACE_STARTED) return;
  RACE_STARTED = true;
  const host = $("#raceHost");
  if (!host) return;
  try {
    const R = await raceData();
    window.__RACEDATA = R;
    if (!R.ready) {
      host.innerHTML = "";
      host.appendChild(raceEmpty(R));
      document.body.dataset.raceReady = "empty";
      return;
    }
    const dist = scoringDist();
    const O = raceOdds(R, dist);
    const LEV = leverageBoard(R, dist, R.nextWeek);
    window.__RACE = O; window.__LEV = LEV;
    renderRace(host, R, O, LEV);
    document.body.dataset.raceReady = "1";
  } catch (e) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty", `<b>Couldn't work out the race</b>${esc(e.message)}`));
    document.body.dataset.raceReady = "error";
    console.error(e);
  }
}

/* ============================================== TRADES ============== */
/*
 * Everything on this tab is judged on one rule: a trade is worth what the
 * players did AFTER it, never what they did all season. Counting a full season
 * would credit a manager with points scored by a player he did not yet own,
 * which is how every "who won the trade" argument goes wrong.
 *
 * The transaction history is large — five seasons, eighteen legs each, plus a
 * 5MB player-name file — and most visitors never open this tab, so none of it
 * is fetched until they do.
 */

/* Margins are in points-per-season, so the bands are wide. Roughly: a starting
 * running back is worth ~150 points over a full season, a bye-week filler ~20. */
const TRADE_EVEN = 25;        // inside this, nobody won
const TRADE_CLEAR = 90;
const TRADE_LOPSIDED = 200;
const FAAB_MIN = 5;           // a $1 flier that busts is not an "overpay"

let TXCACHE = null;
async function loadTransactions() {
  if (TXCACHE) return TXCACHE;
  if (MOCK) return (TXCACHE = []);
  const jobs = [];
  for (const s of DB.seasons) for (let wk = 1; wk <= 18; wk++) jobs.push({ s, wk });
  const got = await pool(jobs, 8, async ({ s, wk }) => {
    const list = await jget(`${API}/league/${s.leagueId}/transactions/${wk}`).catch(() => []);
    return (list || []).map(t => ({ ...t, season: s.season }));
  });
  // Failed waiver claims are noise: they never happened.
  TXCACHE = got.flat().filter(t => t && t.status === "complete");
  return TXCACHE;
}

/* ------------------------------------------------------------- names */
/*
 * Transactions carry player_ids and nothing else. Draft metadata already in
 * hand covers most traded players; the rest need Sleeper's full player file,
 * which is ~5MB and is therefore fetched once, lazily, and only for the ids
 * actually missing.
 */
let PLAYER_NAMES = null;
function draftNameMap() {
  const m = new Map();
  for (const s of DB.seasons) for (const p of s.picks || []) {
    const md = p.metadata || {};
    const nm = `${md.first_name || ""} ${md.last_name || ""}`.trim();
    if (p.player_id && nm) m.set(String(p.player_id), { name: nm, pos: md.position || "", team: md.team || "" });
  }
  return m;
}
async function loadPlayerNames(need) {
  if (PLAYER_NAMES) return PLAYER_NAMES;
  const m = draftNameMap();
  const missing = [...need].map(String).filter(p => !m.has(p));
  if (missing.length && !MOCK) {
    try {
      const all = await jget(`${API}/players/nfl`);
      for (const pid of missing) {
        const p = all[pid];
        if (!p) continue;
        const nm = (p.full_name || `${p.first_name || ""} ${p.last_name || ""}`).trim();
        m.set(pid, { name: nm || pid, pos: p.position || "", team: p.team || "" });
      }
    } catch (e) { /* a missing name is a player_id on screen, not a broken page */ }
  }
  PLAYER_NAMES = m;
  return m;
}
const pname = pid => (PLAYER_NAMES && PLAYER_NAMES.get(String(pid))) || { name: String(pid), pos: "", team: "" };

/* ------------------------------------------------------------ scoring */

/**
 * What a player produced in `season`'s regular season from `from` onward.
 * Weeks before the trade are never counted, and the playoffs are left out —
 * they are a different competition and only six teams are in them.
 */
function ptsFrom(season, pid, from) {
  if (!season || !season.playerWeek) return 0;
  const last = (season.pws || 15) - 1;
  let tot = 0;
  for (let w = Math.max(1, from); w <= last; w++) {
    const wm = season.playerWeek.get(w);
    if (!wm) continue;
    const v = wm.get(String(pid));
    if (v != null && isFinite(v)) tot += v;
  }
  return tot;
}

const fmtPick = d => `${d.season} ${ord(Number(d.round))}`;

/*
 * Turning a traded pick into the player it became.
 *
 * On a transaction, a pick's roster_id is the roster whose slot it originally
 * was. On the draft board, roster_id is whoever ended up making the selection.
 * Those two differ precisely when a pick has been traded — which is every pick
 * on this page — so the board cannot be matched on roster_id at all. What
 * survives a trade is the draft column, and the draft's own slot_to_roster_id
 * maps a column back to the roster that owns it. Round plus column is the
 * selection, whoever it was traded to.
 */
let PICKIDX = null;
async function loadDraftSlots() {
  if (PICKIDX) return PICKIDX;
  const idx = new Map();
  if (!MOCK) await Promise.all(DB.seasons.map(async season => {
    if (!season.draftId || !(season.picks || []).length) return;
    const d = await jget(`${API}/draft/${season.draftId}`).catch(() => null);
    if (!d || !d.slot_to_roster_id) return;
    idx.set(season.season, {
      ridToSlot: new Map(Object.entries(d.slot_to_roster_id).map(([slot, rid]) => [Number(rid), Number(slot)])),
      bySlotRound: new Map(season.picks.map(x => [`${x.draft_slot}|${x.round}`, x])),
    });
  }));
  PICKIDX = idx;
  return idx;
}

/** A traded pick, resolved to the player taken with it and what he scored. */
function resolvePick(d, tradeSeason) {
  const year = String(d.season);
  const out = { year, round: Number(d.round), label: fmtPick(d), name: null, pos: "", pts: 0, priced: false, why: null };
  const target = DB.seasons.find(x => x.season === year);
  const idx = PICKIDX && PICKIDX.get(year);
  if (!target || !idx) { out.why = `the ${year} draft isn't on record`; return out; }
  // Roster ids are not stable from one season to the next, so travel by manager.
  const uid = tradeSeason && tradeSeason.uidOf.get(Number(d.roster_id));
  let rid = null;
  if (uid) for (const [r, u] of target.uidOf) if (u === uid) rid = r;
  if (rid == null) rid = Number(d.roster_id);
  const slot = idx.ridToSlot.get(rid);
  const pick = slot != null ? idx.bySlotRound.get(`${slot}|${Number(d.round)}`) : null;
  if (!pick) { out.why = "that slot isn't on the draft board"; return out; }
  const md = pick.metadata || {};
  out.name = `${md.first_name || ""} ${md.last_name || ""}`.trim() || pname(pick.player_id).name;
  out.pos = md.position || "";
  out.no = pick.pick_no;
  // A keeper slot did not draft anybody — the manager kept a player he already
  // had. Crediting the pick with that player's season would price a trade for
  // something it never delivered.
  if (pick.is_keeper) { out.keeper = true; out.why = "used as a keeper slot, so it drafted nobody"; return out; }
  if (!seasonPlayed(target)) { out.why = `the ${year} season hasn't been played`; return out; }
  out.pts = target.playerPts.get(pick.player_id) || 0;
  out.priced = true;
  return out;
}

/**
 * Has this season actually been played? Sleeper hands back matchup rows for a
 * season the moment it exists, every score zero, so "we have week data" is not
 * the same question as "anybody has scored". Without this, an August trade in a
 * season nobody has played grades out as a nil-all draw.
 */
function seasonPlayed(season) {
  if (!season) return false;
  if (season._played == null) {
    season._played = !!(season.playerWeek && [...season.playerWeek.values()]
      .some(wm => [...wm.values()].some(v => v > 0)));
  }
  return season._played;
}

/**
 * Grade one trade. Every roster involved gets what it received and what it
 * gave up, both counted from the trade's week forward; its net is the
 * difference. Multi-team trades work the same way — the nets still sum to zero
 * and the gains still sum to everything that moved.
 */
function gradeTrade(tx, season) {
  if (!season) return null;
  const week = Number(tx.leg) || 1;
  const lastReg = (season.pws || 15) - 1;
  const adds = tx.adds || {}, drops = tx.drops || {};
  const pids = Object.keys(adds);
  const picks = tx.draft_picks || [];
  // Whoever sent or received a pick is a party to the trade too, so that the
  // two halves of every pick land on somebody's books and the nets still cancel.
  const rids = [...new Set([...(tx.roster_ids || []), ...Object.values(adds),
    ...picks.map(d => d.owner_id), ...picks.map(d => d.previous_owner_id)])].filter(r => r != null);
  const noDrops = !Object.keys(drops).length;
  const played = seasonPlayed(season);
  // Players are only priceable if there was regular season left to play them in.
  const playersLive = played && week <= lastReg;

  const val = p => { const n = pname(p); return { pid: p, name: n.name, pos: n.pos, pts: playersLive ? ptsFrom(season, p, week) : 0, priced: playersLive }; };
  const resolve = list => list.map(d => resolvePick(d, season));
  const sides = rids.map(rid => {
    const got = pids.filter(p => adds[p] === rid).map(val);
    // A few old trades came back without a drops map. In a two-team trade the
    // sender is unambiguous — it is whatever the other side received.
    const sent = (noDrops && rids.length === 2
      ? pids.filter(p => adds[p] !== rid)
      : pids.filter(p => drops[p] === rid)).map(val);
    const picksIn = resolve(picks.filter(d => d.owner_id === rid));
    const picksOut = resolve(picks.filter(d => d.previous_owner_id === rid));
    const sum = xs => xs.filter(x => x.priced).reduce((a, x) => a + x.pts, 0);
    const playerNet = sum(got) - sum(sent), pickNet = sum(picksIn) - sum(picksOut);
    const gain = sum(got) + sum(picksIn), loss = sum(sent) + sum(picksOut);
    return {
      rid, uid: season.uidOf.get(rid) || null, got, sent, picksIn, picksOut,
      playerNet, pickNet, gain, loss, net: gain - loss,
    };
  });

  // Everything that moved but could not be given a number, and why.
  const unpriced = [];
  if (pids.length && !playersLive) unpriced.push({
    label: `${pids.length} player${pids.length === 1 ? "" : "s"}`,
    why: !played ? `the ${season.season} season hasn't been played` : "the trade came after the regular season ended",
  });
  for (const r of resolve(picks)) if (!r.priced) unpriced.push({ label: r.label, why: r.why });
  const pricedPicks = resolve(picks).filter(r => r.priced).length;
  const graded = (playersLive && pids.length > 0) || pricedPicks > 0;
  const reason = graded ? null
    : unpriced.length ? unpriced[0].why
    : "there is nothing in it to score";

  const moved = sides.reduce((a, x) => a + x.gain, 0);
  const ranked = sides.slice().sort((a, b) => b.net - a.net);
  const winner = graded && ranked.length > 1 && ranked[0].net > 0 ? ranked[0] : null;
  const margin = winner ? winner.net : 0;

  return {
    id: tx.transaction_id, season: season.season, week, date: Number(tx.created) || 0,
    sides, ranked, moved, winner, margin, graded, reason, adds, drops, unpriced, pricedPicks,
    partial: !season.complete, nPicks: picks.length, nTeams: rids.length, nPlayers: pids.length,
  };
}

/**
 * Sleeper keeps a trade that was executed and then put straight back — a veto,
 * a misclick, a change of heart. Both halves come back marked complete, and
 * graded naively the pair reads as the two biggest fleecings in league history,
 * in opposite directions. A trade whose exact inverse runs between the same
 * managers inside a day is a wash, so neither half is graded.
 */
function markReversals(trades) {
  const DAY = 24 * 60 * 60 * 1000;
  const key = t => `${t.season}|${Object.keys(t.adds).sort().join(",")}`;
  const groups = new Map();
  for (const t of trades) {
    if (!t.nPlayers) continue;
    const k = key(t);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  let n = 0;
  for (const g of groups.values()) {
    if (g.length < 2) continue;
    g.sort((a, b) => a.date - b.date);
    for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
      const a = g[i], b = g[j];
      if (a.reversed || b.reversed || Math.abs(b.date - a.date) > DAY) continue;
      const pids = Object.keys(a.adds);
      const inverse = pids.every(p => b.adds[p] != null && b.adds[p] !== a.adds[p] && b.adds[p] === a.drops[p]);
      if (!inverse) continue;
      for (const t of [a, b]) {
        t.reversed = true; t.graded = false; t.winner = null; t.margin = 0;
        t.reason = "put straight back — the same players returned inside a day";
      }
      n += 2;
    }
  }
  return n;
}

function verdictOf(t) {
  if (!t.graded) return { cls: "none", label: "Not graded" };
  if (!t.winner || t.margin < TRADE_EVEN) return { cls: "even", label: "Nobody won it" };
  const m = t.margin;
  const label = m >= TRADE_LOPSIDED ? "Fleecing" : m >= TRADE_CLEAR ? "Lopsided" : "Won it";
  return { cls: m >= TRADE_LOPSIDED ? "fleeced" : m >= TRADE_CLEAR ? "lop" : "win", label };
}

function tradeLedger(txs) {
  const seasonOf = new Map(DB.seasons.map(s => [s.season, s]));
  const trades = txs.filter(t => t.type === "trade")
    .map(t => gradeTrade(t, seasonOf.get(t.season)))
    .filter(Boolean)
    .sort((a, b) => (b.date - a.date) || (Number(b.season) - Number(a.season)) || (b.week - a.week));
  const reversed = markReversals(trades);

  const byMgr = new Map();
  for (const t of trades) {
    if (!t.graded) continue;
    for (const sd of t.sides) {
      if (!sd.uid) continue;
      if (!byMgr.has(sd.uid)) byMgr.set(sd.uid,
        { uid: sd.uid, n: 0, net: 0, playerNet: 0, pickNet: 0, gained: 0, lost: 0, won: 0, lostN: 0, best: null, worst: null });
      const m = byMgr.get(sd.uid);
      m.n++; m.net += sd.net; m.gained += sd.gain; m.lost += sd.loss;
      m.playerNet += sd.playerNet; m.pickNet += sd.pickNet;
      if (sd.net > TRADE_EVEN) m.won++; else if (sd.net < -TRADE_EVEN) m.lostN++;
      if (!m.best || sd.net > m.best.net) m.best = { ...sd, t };
      if (!m.worst || sd.net < m.worst.net) m.worst = { ...sd, t };
    }
  }
  const graded = trades.filter(t => t.graded);
  // Every priced pick that changed hands. A pick can be traded on more than
  // once — each trade genuinely conveyed it, and the ledger debits and credits
  // every holder in turn, which nets an intermediate owner back to zero. But
  // only one manager ever made the selection, so the pick is listed once, under
  // whoever held it last. `trades` runs newest first, so that is the first hit.
  const pickHauls = [];
  const seenPick = new Map();
  for (const t of graded) for (const sd of t.sides) for (const r of sd.picksIn) {
    if (!r.priced) continue;
    const key = `${r.year}|${r.no}`;
    const prev = seenPick.get(key);
    if (prev) { prev.times++; continue; }
    const row = { ...r, uid: sd.uid, from: t.season, week: t.week, times: 1 };
    seenPick.set(key, row); pickHauls.push(row);
  }
  pickHauls.sort((a, b) => b.pts - a.pts);
  return {
    trades, graded, reversed, pickHauls,
    pickedPriced: graded.reduce((a, t) => a + t.pricedPicks, 0),
    picksMoved: trades.reduce((a, t) => a + t.nPicks, 0),
    byMgr: [...byMgr.values()].sort((a, b) => b.net - a.net),
    fleecing: graded.filter(t => t.winner).sort((a, b) => b.margin - a.margin)[0] || null,
    moved: graded.reduce((a, t) => a + t.moved, 0),
    seasons: [...new Set(trades.map(t => t.season))].sort((a, b) => Number(b) - Number(a)),
  };
}

/* ------------------------------------------------------------ waivers */
/*
 * A claim is credited with what the player scored from the week he was claimed
 * onward — the same rule the trades use. Nothing here knows whether a manager
 * actually started him, or kept him.
 */
function waiverReport(txs) {
  const seasonOf = new Map(DB.seasons.map(s => [s.season, s]));
  const claims = [], spend = new Map();
  for (const t of txs) {
    if (t.type !== "waiver" && t.type !== "free_agent") continue;
    const season = seasonOf.get(t.season);
    if (!season) continue;
    const adds = t.adds || {};
    const pids = Object.keys(adds);
    if (!pids.length) continue;
    const wk = Number(t.leg) || 1;
    const bid = Number(t.settings && t.settings.waiver_bid) || 0;
    const rid = adds[pids[0]];
    const uid = season.uidOf.get(rid);
    if (!uid) continue;

    if (bid > 0) {
      const sp = spend.get(uid) || { uid, spent: 0, claims: 0 };
      sp.spent += bid; sp.claims++; spend.set(uid, sp);
    }
    // One bid buys the whole claim, so a multi-player claim is one row.
    const players = pids.map(p => { const n = pname(p); return { pid: p, name: n.name, pos: n.pos, pts: ptsFrom(season, p, wk) }; });
    // A claim made in week 14 can only ever earn one week of points, so ranking
    // it on points-per-dollar against a week-3 claim is not a comparison. Only
    // claims with three regular-season weeks still to run get ranked; the money
    // still counts towards what a manager spent, because he really spent it.
    const lastReg = (season.pws || 15) - 1;
    const weeksLeft = Math.max(0, lastReg - wk + 1);
    claims.push({
      season: t.season, week: wk, uid, bid, players, weeksLeft,
      pts: players.reduce((a, x) => a + x.pts, 0),
      type: t.type, played: seasonPlayed(season),
      judged: seasonPlayed(season) && weeksLeft >= 3,
    });
  }
  const scored = claims.filter(c => c.judged);
  const paid = scored.filter(c => c.bid >= FAAB_MIN);
  const perPoint = c => c.pts > 0 ? c.bid / c.pts : Infinity;
  return {
    claims, spend: [...spend.values()].sort((a, b) => b.spent - a.spent),
    totalSpent: [...spend.values()].reduce((a, x) => a + x.spent, 0),
    // Claims that returned something, ranked by what each point cost. A claim
    // that returned nothing divides by zero and belongs in dead money instead.
    overpays: paid.filter(c => c.pts > 0).sort((a, b) => (perPoint(b) - perPoint(a)) || (b.bid - a.bid)).slice(0, 10),
    bestFree: scored.filter(c => c.bid === 0).sort((a, b) => b.pts - a.pts).slice(0, 10),
    bestBuys: paid.slice().sort((a, b) => (perPoint(a) - perPoint(b)) || (b.pts - a.pts)).slice(0, 10),
    // Money that bought literally nothing. Ranked by size of bid rather than by
    // cost per point, because every one of these divides by zero. A claim needs
    // at least one regular-season week to run, or the zero is just the calendar.
    deadMoney: claims.filter(c => c.played && c.weeksLeft >= 1 && c.bid > 0 && c.pts <= 0)
      .sort((a, b) => b.bid - a.bid).slice(0, 10),
    judged: scored.length, lateSkipped: claims.filter(c => c.played && !c.judged).length,
    perPoint,
  };
}

/* -------------------------------------------------------------- panel */
const plabel = x => `${esc(x.name)}${x.pos ? ` <span class="pos">${esc(x.pos)}</span>` : ""}`;
/** Everything a side received, players and picks, in plain words. */
const gotNames = sd => [...sd.got.map(x => x.name),
  ...sd.picksIn.map(r => r.name ? `${r.label} → ${r.name}` : r.label)].join(", ") || "nothing";
const sgnf = v => `${v >= 0 ? "+" : "−"}${f1(Math.abs(v))}`;

function tradeCard(t) {
  const v = verdictOf(t);
  const box = el("article", "trade");
  const when = `${t.season} · ${t.week === 1 ? "preseason / week 1" : "week " + t.week}`;
  // Inside the even band nobody is called a winner, so neither the margin nor
  // the winner's highlight is shown — a 23-point edge over fourteen weeks is
  // noise, and printing it next to "nobody won it" would argue with itself.
  const decided = t.graded && !!t.winner && v.cls !== "even";
  box.innerHTML = `<header class="thead">
      <span class="twhen">${esc(when)}${t.nTeams > 2 ? ` · ${t.nTeams}-team` : ""}</span>
      <span class="verd ${v.cls}">${esc(v.label)}${decided ? ` ${esc(sgnf(t.margin))}` : ""}</span>
    </header>`;

  const sides = el("div", "tsides");
  for (const sd of t.sides) {
    const d = el("div", "tside" + (decided && sd.rid === t.winner.rid ? " won" : ""));
    const line = (label, pts, priced, sub) => `<li class="tline">
      <span class="pn">${label}${sub ? `<br><i class="sub">${esc(sub)}</i>` : ""}</span>
      <span class="pp">${priced ? f1(pts) : "—"}</span></li>`;
    const lines = sd.got.map(x => line(plabel(x), x.pts, t.graded && x.priced))
      .concat(sd.picksIn.map(r => line(
        `${esc(r.label)}${r.name ? ` → ${esc(r.name)}${r.pos ? ` <span class="pos">${esc(r.pos)}</span>` : ""}` : ""}`,
        r.pts, t.graded && r.priced, r.priced ? null : r.why))).join("");
    d.innerHTML = `<div class="who">${avatarHTML(sd.uid, "sm")}
        <span class="n">${esc(sd.uid ? nameOf(sd.uid) : "roster " + sd.rid)}</span>
        ${t.graded ? `<b class="net ${sd.net >= 0 ? "pos-t" : "neg-t"}">${esc(sgnf(sd.net))}</b>` : ""}</div>
      ${lines ? `<ul class="tlist">${lines}</ul>` : `<div class="tpicks">gave everything, got nothing back</div>`}`;
    sides.appendChild(d);
  }
  box.appendChild(sides);

  const notes = [];
  if (!t.graded) notes.push(`Not graded — ${t.reason}.`);
  else notes.push(`${f1(t.moved)} points changed hands${t.pricedPicks ? `, counting ${t.pricedPicks} pick${t.pricedPicks === 1 ? "" : "s"} at what ${t.pricedPicks === 1 ? "it" : "they"} drafted` : ""}${t.partial ? ", and the season is still running" : ""}.`);
  if (t.graded && t.unpriced.length)
    notes.push(`Not priced: ${t.unpriced.map(u => `${u.label} (${u.why})`).join(", ")}.`);
  box.appendChild(el("div", "tnote", notes.map(esc).join(" ")));
  return box;
}

function renderTrades(host, L, W) {
  host.innerHTML = "";

  if (!L.trades.length) {
    host.appendChild(el("div", "empty",
      "<b>No trades on record</b>Nobody in this league has ever made one. The moment somebody does, it appears here."));
    return;
  }

  /* ---- the hero: the worst beating anyone has taken ---- */
  if (L.fleecing) {
    const t = L.fleecing, w = t.winner;
    const loser = t.ranked[t.ranked.length - 1];
    const got = gotNames(w);
    const gave = [...w.sent.map(x => x.name),
      ...w.picksOut.map(r => r.name ? `${r.label} → ${r.name}` : r.label)].join(", ") || "nothing";
    const f = el("div", "fleece");
    f.innerHTML = `<div class="k">Biggest fleecing in league history</div>
      <div class="v">${esc(sgnf(t.margin))}</div>
      <div class="w">${esc(nameOf(w.uid))} took ${esc(loser.uid ? nameOf(loser.uid) : "the other side")} — ${esc(t.season)}, ${t.week === 1 ? "preseason" : "week " + t.week}</div>
      <div class="c">Got ${esc(got)} (${f1(w.gain)} pts from there on) for ${esc(gave)} (${f1(w.loss)}).</div>`;
    host.appendChild(f);
  }

  const tiles = el("div", "tiles");
  const ungraded = L.trades.length - L.graded.length;
  tiles.innerHTML = [
    { l: "Trades all-time", v: String(L.trades.length), n: `across ${L.seasons.length} season${L.seasons.length === 1 ? "" : "s"}` },
    { l: "Graded", v: String(L.graded.length), n: ungraded ? `${ungraded} can't be scored fairly` : "every one of them" },
    { l: "Points traded", v: f1(L.moved), n: `players after each deal, picks at what they drafted` },
    { l: "Biggest margin", v: L.fleecing ? sgnf(L.fleecing.margin) : "—", n: L.fleecing ? `${nameOf(L.fleecing.winner.uid)}, ${L.fleecing.season}` : "nothing graded yet" },
  ].map(t => `<div class="tile"><div class="l">${esc(t.l)}</div><div class="v">${esc(t.v)}</div><div class="n">${esc(t.n)}</div></div>`).join("");
  host.appendChild(tiles);

  /* ---- the ledger ---- */
  host.appendChild(sechead("All-time trade ledger",
    "Points gained minus points given up, added across every trade a manager has ever made. Only the weeks after each deal count."));
  if (!L.byMgr.length) {
    host.appendChild(el("div", "empty", "<b>Nothing to add up yet</b>No trade in league history can be scored."));
  } else {
    host.appendChild(tableCard(
      [{ label: "Manager" }, { label: "Trades", num: 1 }, { label: "Net", num: 1, title: "Points gained minus points given up, players and picks together" },
      { label: "From players", num: 1 }, { label: "From picks", num: 1, title: "Picks are worth what the player drafted with them scored" },
      { label: "W–L", num: 1, title: "Trades won and lost by more than 25 points" },
      { label: "Best" }, { label: "Worst" }],
      L.byMgr.map(m => `<tr>
        <td><span class="nmcell">${avatarHTML(m.uid, "sm")}${esc(nameOf(m.uid))}</span></td>
        <td class="num">${m.n}</td>
        <td class="num ${m.net >= 0 ? "pos-t" : "neg-t"}"><b>${esc(sgnf(m.net))}</b></td>
        <td class="num ${m.playerNet >= 0 ? "pos-t" : "neg-t"}">${esc(sgnf(m.playerNet))}</td>
        <td class="num ${m.pickNet >= 0 ? "pos-t" : "neg-t"}">${esc(sgnf(m.pickNet))}</td>
        <td class="num">${m.won}–${m.lostN}</td>
        <td>${m.best ? `<span class="pos-t">${esc(sgnf(m.best.net))}</span> ${esc(gotNames(m.best))} <span class="pos">${esc(m.best.t.season)}</span>` : "—"}</td>
        <td>${m.worst ? `<span class="neg-t">${esc(sgnf(m.worst.net))}</span> ${esc(gotNames(m.worst))} <span class="pos">${esc(m.worst.t.season)}</span>` : "—"}</td>
      </tr>`)));
  }

  /* ---- what the picks turned into ---- */
  if (L.pickHauls.length) {
    host.appendChild(sechead("What the traded picks became",
      `A pick is worth the player actually taken with it. ${L.pickedPriced} of the ${L.picksMoved} picks that have changed hands
       follow through to a selection in a season that has been played. Listed under whoever held the pick last — a ×
       marks one that was traded on more than once.`));
    const best = L.pickHauls.slice(0, 12);
    host.appendChild(tableCard(
      [{ label: "Pick" }, { label: "Became" }, { label: "At", num: 1, title: "Where the pick actually landed in that draft" },
      { label: "Ended up with" }, { label: "Traded in", num: 1 }, { label: "Points", num: 1 }],
      best.map(r => `<tr>
        <td>${esc(r.label)}${r.times > 1 ? ` <span class="pos">×${r.times}</span>` : ""}</td>
        <td>${esc(r.name)}${r.pos ? ` <span class="pos">${esc(r.pos)}</span>` : ""}</td>
        <td class="num">${r.no}</td>
        <td>${esc(nameOf(r.uid))}</td>
        <td class="num">${esc(r.from)}</td>
        <td class="num"><b>${f1(r.pts)}</b></td></tr>`)));
  }

  /* ---- waivers ---- */
  host.appendChild(sechead("Waivers and FAAB",
    "Every claim is credited with what the player scored from the week he was claimed onward. Same rule as the trades, and just as blind to whether anyone actually started him."));

  if (!W.claims.length) {
    host.appendChild(el("div", "empty", "<b>No waiver activity on record</b>"));
  } else {
    const worst = W.overpays[0], free = W.bestFree[0], buy = W.bestBuys[0], dead = W.deadMoney[0];
    const money = v => "$" + Math.round(v);
    const perPt = v => v >= 1 ? `$${Math.round(v)}` : `$${f2(v)}`;
    const recs = el("div", "recs");
    recs.innerHTML = [
      dead && {
        c: "down", l: "Most money for nothing", v: money(dead.bid),
        w: dead.players.map(x => x.name).join(", "),
        x: `${nameOf(dead.uid)} won him in ${dead.season} week ${dead.week} with ${dead.weeksLeft} week${dead.weeksLeft === 1 ? "" : "s"} left, and he scored ${f1(dead.pts)}`,
      },
      worst && worst.pts > 0 && {
        c: "down", l: "Biggest FAAB overpay", v: `${perPt(W.perPoint(worst))}/pt`,
        w: worst.players.map(x => x.name).join(", "),
        x: `${nameOf(worst.uid)} paid ${money(worst.bid)} in ${worst.season} week ${worst.week} for ${f1(worst.pts)} points`,
      },
      free && {
        c: "up", l: "Best free pickup", v: f1(free.pts),
        w: free.players.map(x => x.name).join(", "),
        x: `${nameOf(free.uid)} claimed him for nothing, ${free.season} week ${free.week}`,
      },
      buy && {
        c: "up", l: "Best money spent", v: `${perPt(W.perPoint(buy))}/pt`,
        w: buy.players.map(x => x.name).join(", "),
        x: `${nameOf(buy.uid)} paid ${money(buy.bid)} for ${f1(buy.pts)} points, ${buy.season} week ${buy.week}`,
      },
      { c: "up", l: "FAAB spent, all-time", v: money(W.totalSpent), w: "across the league", x: `${W.spend.length} managers have bid on somebody` },
    ].filter(Boolean).map(x =>
      `<div class="rec ${x.c}"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div>
       <div class="w">${esc(x.w)}</div><div class="c">${esc(x.x)}</div></div>`).join("");
    host.appendChild(recs);

    const claimRow = c => `<tr>
      <td>${c.players.map(plabel).join(", ")}</td>
      <td>${esc(nameOf(c.uid))}</td>
      <td class="num">${esc(c.season)}</td>
      <td class="num">${c.week}</td>
      <td class="num">$${c.bid}</td>
      <td class="num">${c.weeksLeft}</td>
      <td class="num">${f1(c.pts)}</td>
      <td class="num">${c.pts > 0 ? "$" + f2(W.perPoint(c)) : "—"}</td></tr>`;
    const claimHead = [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 },
    { label: "Bid", num: 1 }, { label: "Weeks left", num: 1, title: "Regular-season weeks the player still had to run" },
    { label: "Points after", num: 1 }, { label: "$ / point", num: 1 }];

    host.appendChild(sechead("Worst money in league history",
      `Claims of $${FAAB_MIN} or more with at least three regular-season weeks still to run, ranked by what each point ended up costing. The ones that returned nothing at all are below.`));
    host.appendChild(tableCard(claimHead, W.overpays.map(claimRow)));

    if (W.deadMoney.length) {
      host.appendChild(sechead("Dead money",
        "Winning bids that returned nothing at all. Every one of these had regular-season football left to play."));
      host.appendChild(tableCard(
        [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 },
        { label: "Bid", num: 1 }, { label: "Weeks left", num: 1 }, { label: "Points after", num: 1 }],
        W.deadMoney.map(c => `<tr>
          <td>${c.players.map(plabel).join(", ")}</td>
          <td>${esc(nameOf(c.uid))}</td>
          <td class="num">${esc(c.season)}</td>
          <td class="num">${c.week}</td>
          <td class="num"><b>$${c.bid}</b></td>
          <td class="num">${c.weeksLeft}</td>
          <td class="num">${f1(c.pts)}</td></tr>`)));
    }

    host.appendChild(sechead("Best free pickups", "Claimed for nothing, and what they went on to score from that week to the end of the regular season."));
    host.appendChild(tableCard(
      [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 }, { label: "Points after", num: 1 }],
      W.bestFree.map(c => `<tr>
        <td>${c.players.map(plabel).join(", ")}</td>
        <td>${esc(nameOf(c.uid))}</td>
        <td class="num">${esc(c.season)}</td>
        <td class="num">${c.week}</td>
        <td class="num"><b>${f1(c.pts)}</b></td></tr>`)));

    if (W.spend.length) {
      host.appendChild(sechead("FAAB spent, by manager", "Every winning bid a manager has ever made, added up."));
      host.appendChild(barCard(
        W.spend.map(x => ({ label: nameOf(x.uid), v: x.spent, claims: x.claims })),
        v => "$" + Math.round(v),
        it => `<b>${esc(it.label)}</b><br>$${Math.round(it.v)} across ${it.claims} winning bids`));
    }
  }

  /* ---- every trade, newest first ---- */
  // A hundred and fifty cards is a wall, and everything above is the point of
  // the page, so the log goes last and opens short.
  const PAGE = 20;
  host.appendChild(sechead("Every trade in league history",
    "Newest first. Each player is followed by what he scored from that week to the end of that regular season, and each pick by the player it became — the only points either side can claim."));
  const filt = el("div", "tfilter");
  const sel = el("select");
  const opt = (v, t) => { const o = el("option", null, t); o.value = v; sel.appendChild(o); };
  opt("all", `All seasons (${L.trades.length})`);
  for (const yr of L.seasons) opt(yr, `${yr} (${L.trades.filter(t => t.season === yr).length})`);
  filt.appendChild(sel);
  host.appendChild(filt);
  const list = el("div");
  host.appendChild(list);

  let shown = PAGE;
  function drawList() {
    list.innerHTML = "";
    const all = sel.value === "all" ? L.trades : L.trades.filter(t => t.season === sel.value);
    if (!all.length) {
      list.appendChild(el("div", "empty",
        `<b>No trades in ${esc(sel.value)}</b>Nobody made a deal that season. It happens.`));
      return;
    }
    for (const t of all.slice(0, shown)) list.appendChild(tradeCard(t));
    if (all.length > shown) {
      const more = el("button", "back more", `Show all ${all.length} trades`);
      more.onclick = () => { shown = all.length; drawList(); };
      list.appendChild(more);
    }
  }
  sel.onchange = () => { shown = PAGE; drawList(); };
  drawList();

  host.appendChild(glossary([
    { t: "Points after", d: "What a player scored from the week of the deal to the end of that regular season. Points he scored earlier belong to whoever owned him then, so they are never counted." },
    { t: "Net", d: "Points received minus points given up. The two sides of a trade are exact mirrors, so a league-wide net of zero is the arithmetic working, not a coincidence." },
    { t: "Not graded", d: "A trade of picks only, or one made after the regular season, or one in a season that hasn't been played. Rather than invent a number, the board says so." },
    { t: "$ / point", d: "A winning FAAB bid divided by what the player scored afterwards. The cheapest way to compare a $40 claim to a $3 one." },
  ]));

  const m = el("div", "method");
  m.innerHTML = `<h3>What this can and cannot see</h3>
    <p>Points are a player's total production under DFFL scoring, starters and bench alike — the same
       number the draft board uses. Nothing here knows whether a manager actually started the player he
       traded for, or whether he dropped him a week later.</p>
    <p>A player only scores here while somebody rosters him. Drop a traded player and the weeks he spends
       unclaimed are invisible to Sleeper's box scores and therefore to this page — which flatters the
       manager who dumped him.</p>
    <p>A draft pick is worth the player actually taken with it, over that player's whole regular season.
       Resolving one is not a matter of looking up a roster: on the draft board a pick is filed under
       whoever <i>made</i> the selection, which is the new owner, so a traded pick cannot be found that way
       at all. What survives a trade is the draft column, and the draft's own slot map leads from the
       original owner back to it. ${L.pickedPriced} of the ${L.picksMoved} picks that have changed hands
       resolve to a selection in a season that has actually been played.</p>
    <p>Two kinds of pick are deliberately left unpriced. One used as a keeper slot drafted nobody — the
       manager kept a player he already had — and one for a season nobody has played has not delivered
       anything yet. Both are named on the trade rather than quietly counted as zero.</p>
    <p>Because a pick usually lands in the season after the trade, a graded trade can span two years: the
       players are scored over the weeks left in the season the deal was made, the picks over the whole
       season they were used in. That is what each side actually received, but it is not one currency, so
       the ledger keeps players and picks in separate columns.</p>
    <p>${L.trades.length - L.graded.length} of ${L.trades.length} trades still cannot be graded at
       all${L.reversed ? `, ${L.reversed} of them because the same players went straight back inside a day —
       a trade undone is not a trade won` : ""}.</p>
    <p>Playoff scoring is excluded on both sides. Six of twelve teams make the playoffs, so counting those
       weeks would reward a trade for the team it was made by rather than the players in it. For the same
       reason a waiver claim needs three regular-season weeks still to run before it is ranked on value:
       ${W.lateSkipped} claims were made too late to judge that way, and are counted in the money spent
       but nowhere else.</p>`;
  host.appendChild(m);
}

let TRADES_STARTED = false;
async function ensureTrades() {
  if (TRADES_STARTED) return;
  TRADES_STARTED = true;
  const host = $("#tradesHost");
  if (!host) return;
  try {
    const txs = await loadTransactions();
    const need = new Set();
    for (const t of txs) {
      for (const k of Object.keys(t.adds || {})) need.add(k);
      for (const k of Object.keys(t.drops || {})) need.add(k);
    }
    await loadPlayerNames(need);
    await loadDraftSlots();
    const L = tradeLedger(txs), W = waiverReport(txs);
    window.__TRADES = L; window.__WAIVERS = W; window.__TX = txs;
    renderTrades(host, L, W);
    document.body.dataset.tradesReady = "1";
  } catch (e) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty",
      `<b>Couldn't load the transaction history</b>${esc(e.message)}<br>Sleeper may be rate-limiting — reload in a minute.`));
    document.body.dataset.tradesReady = "error";
    console.error(e);
  }
}

function panelTrades() {
  const p = el("div", "panel"); p.dataset.panel = "trades";
  p.appendChild(sechead("The trade block",
    "Every trade DFFL has ever made, graded on what the players did afterwards — never on what they did all season. Waivers and FAAB get the same treatment."));
  const host = el("div"); host.id = "tradesHost";
  host.appendChild(el("div", "empty",
    `<b>Reading the transaction history…</b>Five seasons of trades, waiver claims and free-agent adds,
     plus the player-name file Sleeper keeps separately. It is a few megabytes, so it is only ever
     fetched when somebody opens this tab — which you just did.`));
  p.appendChild(host);
  return p;
}

/* ---------------------------------------------------------------- boot */
async function boot() {
  try {
    if (MOCK) await mockInit();
    try { DB.state = MOCK ? null : await jget(`${API}/state/nfl`); } catch (e) { DB.state = null; }

    const chain = await loadChain();
    if (!chain.length) throw new Error("Could not load the league from Sleeper.");
    total = chain.length * 22;
    $("#lgName").textContent = chain[0].name || "League";

    for (const lg of chain) await loadSeason(lg);
    DB.seasons.sort((a, b) => Number(b.season) - Number(a.season));

    const AT = allTime(), RB = recordBook(), H2H = h2hMap(), DIST = scoringDist();
    const ODDS = await oddsModel(), SIM = simulateSeason(ODDS);
    window.__AT = AT; window.__RB = RB; window.__H2H = H2H; window.__DIST = DIST;
    window.__ODDS = ODDS; window.__SIM = SIM;

    const oldest = DB.seasons[DB.seasons.length - 1], newest = DB.seasons[0];
    $("#eyebrow").textContent = `${oldest.season}–${newest.season} · ${chain[0].total_rosters} teams`;
    $("#lgSub").textContent = `${DB.games.length} games on record, and every one of them still counts against you.`;

    const app = $("#app");
    app.appendChild(panelHome(AT, RB, ODDS, SIM));
    app.appendChild(panelScoreboard());
    app.appendChild(panelManagers(AT));
    app.appendChild(panelRecords(RB));
    app.appendChild(panelMatchups(AT));
    await loadBlurbs();
    app.appendChild(panelPower(ODDS, SIM));
    app.appendChild(panelOdds(ODDS, SIM));
    app.appendChild(panelRace());
    app.appendChild(panelDraft());
    app.appendChild(panelTrades());
    app.appendChild(await panelRecaps());

    buildTabs();
    $("#loader").hidden = true;
    app.hidden = false;
    const want = location.hash.replace("#", "");
    show(TABS.some(t => t.id === want) ? want : "home");
    $("#footNote").textContent = DB.state ? ` Currently NFL ${DB.state.season}, week ${DB.state.week}.` : "";
    window.__DFFL = {
      DB, AT, RB, DIST, draftAnalysis, winProb, titleOdds, scoringDist,
      ODDS, SIM, oddsModel, simulateSeason, winTotals, buildSchedule, roundRobin,
      americanOdds, impliedProb, roundOdds, addVig, priceMarket, marketHold,
      ODDS_HOLD, ODDS_SIMS, panelOdds, loadADP, adpValue, adpKey, rosterValue,
      ADP_CURVE, W_ROSTER, W_HIST_POST, SHOCK_PRE, SHOCK_POST,
      powerRankings, weeklyScores, loadBlurbs, blurbFor, panelPower, moveHTML, rankSpark, projectedBoard,
      weekMovers, panelRecaps, allPowerRankings, keepersOf, playerModal, openPlayer, posClass,
      articleCard, articleBlock,
      POWER_W, FORM_WEEKS,
      ensureRace, raceData, raceAsOf, raceOdds, leverageBoard, seedField, pairSchedule,
      renderRace, raceEmpty,
      RACE_SIMS, LEVERAGE_SIMS,
      ensureTrades, loadTransactions, loadPlayerNames, loadDraftSlots, tradeLedger, waiverReport,
      gradeTrade, ptsFrom, verdictOf, resolvePick, seasonPlayed, markReversals,
      TRADE_EVEN, TRADE_CLEAR, TRADE_LOPSIDED, FAAB_MIN,
    };
    document.body.dataset.ready = "1";
  } catch (e) {
    const l = $("#loader");
    l.innerHTML = "";
    l.appendChild(el("div", "err", `<b>Couldn't load the league.</b><br>${esc(e.message)}<br>
      <span style="color:#d9b7b7;font-size:13px">If this keeps happening Sleeper may be rate-limiting — wait a minute and refresh.</span>`));
    document.body.dataset.ready = "error";
    console.error(e);
  }
}
