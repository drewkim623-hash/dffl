/* ================================ PREDICTIONS & DRAFT ================ */

function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const a1 = .254829592, a2 = -.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = .3275911;
  const t = 1 / (1 + p * x);
  return s * (1 - ((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t * Math.exp(-x * x));
}
const normCdf = z => 0.5 * (1 + erf(z / Math.SQRT2));
function gauss(m, s) {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/** Each manager's weekly scoring distribution (regular season, all years). */
function scoringDist() {
  const acc = new Map();
  for (const g of regGames()) for (const s of [g.a, g.b]) {
    if (!acc.has(s.uid)) acc.set(s.uid, []);
    acc.get(s.uid).push(s.pts);
  }
  const out = new Map();
  for (const [uid, a] of acc) {
    const n = a.length, mean = a.reduce((x, y) => x + y, 0) / n;
    const sd = Math.sqrt(a.reduce((x, y) => x + (y - mean) ** 2, 0) / Math.max(1, n - 1));
    out.set(uid, { mean, sd, n });
  }
  return out;
}

/** P(a outscores b), from the difference of two normals. */
function winProb(a, b, D) {
  const A = D.get(a), B = D.get(b);
  if (!A || !B || !A.n || !B.n) return null;
  const s = Math.sqrt(A.sd * A.sd + B.sd * B.sd);
  if (!s) return 0.5;
  return normCdf((A.mean - B.mean) / s);
}

/** Monte-Carlo a full season. Entertainment only — see the caveat in the UI. */
function titleOdds(D, sims = 3000) {
  const uids = [...D.keys()].filter(u => D.get(u).n >= 10);
  if (uids.length < 4) return null;
  const titles = new Map(uids.map(u => [u, 0])), made = new Map(uids.map(u => [u, 0]));
  const WEEKS = 14, PT = Math.min(6, uids.length - (uids.length % 2));
  const roll = u => gauss(D.get(u).mean, D.get(u).sd);
  for (let s = 0; s < sims; s++) {
    const w = new Map(uids.map(u => [u, 0])), pf = new Map(uids.map(u => [u, 0]));
    for (let k = 0; k < WEEKS; k++) {
      const order = uids.slice();
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = order[i]; order[i] = order[j]; order[j] = t;
      }
      const sc = new Map(order.map(u => [u, roll(u)]));
      for (const u of order) pf.set(u, pf.get(u) + sc.get(u));
      for (let i = 0; i + 1 < order.length; i += 2) {
        const a = order[i], b = order[i + 1];
        if (sc.get(a) > sc.get(b)) w.set(a, w.get(a) + 1); else w.set(b, w.get(b) + 1);
      }
    }
    const seeds = uids.slice().sort((a, b) => w.get(b) - w.get(a) || pf.get(b) - pf.get(a)).slice(0, PT);
    for (const u of seeds) made.set(u, made.get(u) + 1);
    let field = seeds.slice();
    if (field.length === 6) {                       // top two get byes
      const g1 = roll(field[2]) > roll(field[5]) ? field[2] : field[5];
      const g2 = roll(field[3]) > roll(field[4]) ? field[3] : field[4];
      field = [field[0], g2, field[1], g1];         // 1 vs lowest survivor
    }
    while (field.length > 1) {
      const next = [];
      for (let i = 0; i + 1 < field.length; i += 2) {
        next.push(roll(field[i]) > roll(field[i + 1]) ? field[i] : field[i + 1]);
      }
      field = next;
    }
    if (field[0]) titles.set(field[0], titles.get(field[0]) + 1);
  }
  return uids.map(u => ({ uid: u, title: titles.get(u) / sims, playoff: made.get(u) / sims }))
    .sort((a, b) => b.title - a.title);
}

/* ================================ ODDS BOARD ======================== */
/*
 * Everything below prices a market the way a book would, off a Monte Carlo of
 * the real DFFL format. Two rules govern it:
 *   1. No constant is invented. The carry-over between seasons, the size of a
 *      roster-year swing and the week-to-week noise are all estimated from the
 *      league's own history, so the model's confidence tracks the evidence.
 *   2. If the format doesn't match what the simulation knows how to run, the
 *      board prices nothing at all rather than posting a number it can't stand
 *      behind.
 */

const ODDS_SIMS = 20000;
const ODDS_SEED = 20260817;   // fixed: the board must post the same price every reload
const ODDS_HOLD = 0.06;       // the vig we add, 6%

/*
 * Fitted constants. Every one of these was estimated by regression on DFFL's
 * own drafts and results, 2022-2025 — none are chosen by hand.
 *
 *   ADP_CURVE   what a player taken at a given ADP actually delivered to a
 *               starting lineup, in points per week.  R2 = .33 over 558 picks.
 *   W_ROSTER    how much of a team's draft-day roster edge shows up in its
 *               scoring.  slope .541 (se .166, t = 3.3) — real, and about half.
 *   W_HIST_*    how much of a manager's past scoring carries forward. Pre-draft
 *               that's all we have (.684, from variance components). Once the
 *               roster is known its weight roughly halves, to .355 — the roster
 *               already contains most of what history was standing in for.
 *   SHOCK_*     what's left over: how far a season lands from the projection,
 *               after taking out the ordinary week-to-week sampling noise.
 *               Knowing the roster cuts it from 6.9 to 4.8 points a week.
 */
// floor is derived, not typed in, so it is exactly the curve's own value at the
// deepest pick anyone drafts — a rounded copy would disagree in the 4th decimal.
const ADP_CURVE = { a: 22.7313, b: -3.6731, deepest: 220 };
ADP_CURVE.floor = ADP_CURVE.a + ADP_CURVE.b * Math.log(ADP_CURVE.deepest);
const W_ROSTER = 0.541;
const W_HIST_PRE_MAX = 0.684;   // upper bound; shrunk per manager by seasons played
const W_HIST_POST = 0.355;
const SHOCK_PRE = 6.90;
const SHOCK_POST = 4.84;

/** Points per week a pick at this ADP has historically put in a lineup. */
function adpValue(adp) {
  if (!(adp > 0)) return ADP_CURVE.floor;
  const x = Math.max(1, Math.min(ADP_CURVE.deepest, adp));
  return Math.max(ADP_CURVE.floor, ADP_CURVE.a + ADP_CURVE.b * Math.log(x));
}

/** Match Sleeper's player names to the ADP board. Sleeper calls kickers K. */
const adpKey = (name, pos) =>
  String(name || "").toLowerCase().replace(/[^a-z]/g, "").replace(/(jr|sr|ii|iii|iv)$/, "")
  + "|" + (pos === "K" ? "PK" : pos);

/**
 * The pre-draft market, frozen. Loaded from a file rather than fetched live:
 * the board that matters is the one that existed on draft day, and it should
 * never move afterwards.
 */
async function loadADP() {
  try {
    const d = await jget("adp-2026.json");
    if (!d || !Array.isArray(d.players) || !d.players.length) return null;
    const byName = new Map();
    for (const [name, pos, adp] of d.players) byName.set(adpKey(name, pos), adp);
    return { byName, meta: d, n: d.players.length };
  } catch (e) { return null; }
}

/**
 * Sum a manager's drafted roster into one points-per-week number.
 *
 * Only each manager's best `cap` picks count, one per round of the draft.
 * DFFL trades picks, so rosters come out of the draft at different sizes, and
 * an uncapped sum pays a manager for owning roster slots rather than for
 * owning better players: every extra pick adds at least the board's floor, and
 * an 18th player never starts. Capping at the round count prices the same
 * number of players for everyone, so the number means the same thing on every
 * row of the board.
 */
function rosterValue(picks, adp, cap = 0) {
  const vals = new Map();
  let matched = 0, total = 0;
  for (const p of picks || []) {
    const uid = p.picked_by;
    if (!uid) continue;
    total++;
    const md = p.metadata || {};
    const hit = adp.byName.get(adpKey(`${md.first_name || ""} ${md.last_name || ""}`, md.position));
    if (hit != null) matched++;
    // Undrafted-in-the-market picks (team defenses, deep fliers) get the floor.
    // Every roster carries a couple, so this barely moves the ordering.
    if (!vals.has(uid)) vals.set(uid, []);
    vals.get(uid).push(adpValue(hit != null ? hit : ADP_CURVE.deepest));
  }
  const out = new Map();
  let counted = 0, dropped = 0;
  for (const [uid, vs] of vals) {
    vs.sort((a, b) => b - a);
    const keep = cap > 0 ? vs.slice(0, cap) : vs;
    dropped += vs.length - keep.length;
    counted += keep.length;
    out.set(uid, keep.reduce((a, b) => a + b, 0));
  }
  return { byUid: out, matched, total, counted, dropped, cap };
}

/** Deterministic PRNG (mulberry32). */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const gaussFrom = rand => (m, s) => {
  let u = 0, v = 0;
  while (!u) u = rand();
  while (!v) v = rand();
  return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};

/* ---------------------------------------------------- odds arithmetic */

/** American price for a probability. p=.60 → -150, p=.25 → +300. */
function americanOdds(p) {
  if (!(p > 0 && p < 1)) return null;
  return p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p;
}
/** The probability a price implies. Exactly inverts americanOdds. */
function impliedProb(o) {
  if (o == null || !isFinite(o) || o === 0) return null;
  return o < 0 ? -o / (100 - o) : 100 / (o + 100);
}
/** Books post round numbers: nearest 5 below 200, nearest 10 from 200 up. */
function roundOdds(o) {
  if (o == null || !isFinite(o)) return null;
  const step = Math.abs(o) < 200 ? 5 : 10;
  const r = Math.round(Math.abs(o) / step) * step;
  return o < 0 ? -r : r;
}
const fmtOdds = o => o == null ? "—" : (o > 0 ? "+" : "") + Math.round(o);

/** Scale a market so its probabilities sum to 1+hold. This is the vig. */
function addVig(ps, hold = ODDS_HOLD) {
  const s = ps.reduce((a, b) => a + b, 0);
  if (!(s > 0)) return ps.map(() => 0);
  return ps.map(p => Math.min(0.995, p * (1 + hold) / s));
}
/** True probabilities in, posted prices out — with the truth kept alongside. */
function priceMarket(rows, hold = ODDS_HOLD) {
  const v = addVig(rows.map(r => r.p), hold);
  return rows.map((r, i) => {
    const raw = americanOdds(v[i]);
    const price = roundOdds(raw);
    return { ...r, vigP: v[i], raw, price, postedP: impliedProb(price) };
  });
}
/** What the book actually holds once prices are rounded to real increments. */
const marketHold = priced => priced.reduce((a, r) => a + (r.postedP || 0), 0) - 1;

/* ------------------------------------------------------------ schedule */

/** Circle method: every pair exactly once, in n-1 rounds. */
function roundRobin(ids) {
  const a = ids.slice(), n = a.length;
  if (n < 2 || n % 2) return null;
  const out = [];
  for (let r = 0; r < n - 1; r++) {
    const wk = [];
    for (let i = 0; i < n / 2; i++) wk.push([a[i], a[n - 1 - i]]);
    out.push(wk);
    a.splice(1, 0, a.pop());
  }
  return out;
}

/**
 * Sleeper's schedule shape, checked against every DFFL season 2022-2025: one
 * full round robin, then the spare weeks are intra-division rematches. With 12
 * teams that's 11 + 3, and the 3 spare weeks pair off each 4-team division.
 */
function buildSchedule(teams, weeks) {
  const ids = teams.map((_, i) => i);
  const rr = roundRobin(ids);
  if (!rr) return null;
  const spare = weeks - rr.length;
  if (spare < 0) return null;
  if (spare === 0) return rr;

  const groups = new Map();
  for (const i of ids) {
    const d = teams[i].div;
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(i);
  }
  const sizes = [...groups.values()].map(g => g.length);
  if (new Set(sizes).size !== 1 || sizes[0] % 2 || spare !== sizes[0] - 1) return null;
  const per = [...groups.values()].map(g => roundRobin(g));
  if (per.some(x => !x)) return null;
  const extra = [];
  for (let r = 0; r < spare; r++) extra.push(per.flatMap(rounds => rounds[r]));
  return [...rr, ...extra];
}

/* --------------------------------------------------------------- model */

/**
 * Split what we've seen into the part that is the manager and the part that is
 * just the roster he happened to have that year, then keep only the first.
 * Returns null whenever the league isn't in a shape this can honestly price.
 */
async function oddsModel() {
  const cur = DB.seasons[0];
  if (!cur || !cur.rosters || !cur.divCount) return null;

  const bySeason = new Map();
  for (const g of regGames()) {
    if (!bySeason.has(g.season)) bySeason.set(g.season, new Map());
    const m = bySeason.get(g.season);
    for (const s of [g.a, g.b]) {
      if (!m.has(s.uid)) m.set(s.uid, []);
      m.get(s.uid).push(s.pts);
    }
  }
  const seasons = [...bySeason.keys()].sort();
  if (seasons.length < 2) return null;

  const sum = a => a.reduce((x, y) => x + y, 0);
  const avg = a => sum(a) / a.length;

  // Scoring inflates and deflates year to year — judge everyone against the
  // league average of their own season, never across seasons raw.
  const lgMean = new Map();
  for (const s of seasons) lgMean.set(s, avg([...bySeason.get(s).values()].flat()));

  // Week-to-week noise is what's left once a manager's own season mean is out.
  let rss = 0, rdf = 0;
  for (const s of seasons) for (const a of bySeason.get(s).values()) {
    if (a.length < 2) continue;
    const m = avg(a);
    rss += sum(a.map(x => (x - m) ** 2));
    rdf += a.length - 1;
  }
  if (!rdf) return null;
  const weekSd = Math.sqrt(rss / rdf);

  // Every manager's season means, relative to that year's league average.
  const hist = new Map();
  for (const s of seasons) for (const [uid, a] of bySeason.get(s)) {
    if (a.length < 8) continue;
    if (!hist.has(uid)) hist.set(uid, []);
    hist.get(uid).push({ season: s, m: avg(a) - lgMean.get(s) });
  }
  const multi = [...hist.values()].filter(v => v.length >= 2);
  if (multi.length < 3) return null;

  // One-way random effects. seasonVar is how much a manager bounces around his
  // own level from year to year; skillVar is how far apart the managers really
  // are once that bouncing is accounted for.
  let wss = 0, wdf = 0;
  for (const v of multi) {
    const m = avg(v.map(x => x.m));
    wss += sum(v.map(x => (x.m - m) ** 2));
    wdf += v.length - 1;
  }
  const seasonVar = wss / wdf;
  const mgrMeans = [...hist.values()].map(v => avg(v.map(x => x.m)));
  const grand = avg(mgrMeans);
  const nBar = avg([...hist.values()].map(v => v.length));
  const betweenObs = sum(mgrMeans.map(x => (x - grand) ** 2)) / Math.max(1, mgrMeans.length - 1);
  const skillVar = Math.max(0, betweenObs - seasonVar / nBar);
  const carry = (skillVar + seasonVar) > 0 ? skillVar / (skillVar + seasonVar) : 0;
  const base = lgMean.get(seasons[seasons.length - 1]);

  // ---- Has the draft happened yet? That decides which model runs. ----
  const adp = await loadADP();
  const live = (cur.draftDone && adp) ? rosterValue(cur.picks, adp, cur.draftRounds) : null;
  const postDraft = !!live && live.byUid.size === cur.rosters.length;
  const rvMean = postDraft ? avg([...live.byUid.values()]) : 0;

  const teams = [];
  for (const r of cur.rosters) {
    const uid = cur.uidOf.get(r.roster_id);
    const div = cur.divOf.get(r.roster_id);
    if (!uid || div == null) return null;         // incomplete divisions → price nothing
    const h = hist.get(uid) || [];
    const S = h.length;
    const rawEdge = S ? avg(h.map(x => x.m)) : 0;
    // Shrink toward the league average by how much of this really is the man.
    const k = (S && skillVar > 0) ? skillVar / (skillVar + seasonVar / S) : 0;

    const rv = postDraft ? (live.byUid.get(uid) ?? rvMean) : null;
    const rosterEdge = postDraft ? rv - rvMean : 0;
    // Before the draft the manager is all we have. After it, the roster carries
    // most of the signal and history's weight roughly halves.
    const edge = postDraft
      ? W_ROSTER * rosterEdge + W_HIST_POST * rawEdge
      : k * rawEdge;

    teams.push({
      uid, rid: r.roster_id, div, seasons: S,
      rawEdge, shrink: postDraft ? W_HIST_POST : k,
      rosterValue: rv, rosterEdge,
      edge, mean: base + edge,
    });
  }
  teams.sort((a, b) => a.div - b.div || b.edge - a.edge);

  const weeks = (cur.pws || 15) - 1;
  const playoffTeams = cur.playoffTeams || 6;
  const sched = buildSchedule(teams, weeks);

  // The consolation bracket below is the one Sleeper actually builds for a
  // 12-team, 6-playoff-team league. Anything else and we don't post a board.
  const ok = !!sched && teams.length === 12 && playoffTeams === 6 && cur.divCount === 3;

  return {
    ok, postDraft, teams, sched, weeks, playoffTeams, weekSd,
    // Knowing the roster shrinks how far a season can land from the projection.
    seasonSd: postDraft ? SHOCK_POST : SHOCK_PRE,
    skillSd: Math.sqrt(skillVar), carry, base,
    seasons, divNames: cur.divNames, season: cur.season, status: cur.status,
    nMgrSeasons: [...hist.values()].reduce((a, v) => a + v.length, 0),
    draftStatus: cur.draftStatus, draftDone: !!cur.draftDone,
    adpMeta: adp ? adp.meta : null, adpMissing: !adp,
    matchRate: live ? live.matched / Math.max(1, live.total) : null,
    picksPriced: live ? live.total : 0,
    rosterCap: live ? live.cap : 0, picksDropped: live ? live.dropped : 0,
  };
}

/* ----------------------------------------------------------- simulator */

/**
 * 14-week regular season on the real schedule, then the real brackets.
 * Seeding: the three division winners take seeds 1-3, then the best three left
 * over — confirmed against 2025, where the 10-4 division winner was seeded
 * above a 10-4 team with 220 more points.
 */
function simulateSeason(model, sims = ODDS_SIMS) {
  if (!model || !model.ok) return null;
  const { teams, sched, weekSd, seasonSd, playoffTeams } = model;
  const N = teams.length, ids = teams.map((_, i) => i);
  const rand = rng(ODDS_SEED), gau = gaussFrom(rand);
  const zeros = () => new Array(N).fill(0);
  const C = {
    sims, title: zeros(), playoff: zeros(), divWin: zeros(), divLast: zeros(),
    last: zeros(), bye: zeros(), wins: zeros(),
    winDist: teams.map(() => new Array(sched.length + 1).fill(0)),
  };
  const divs = [...new Set(teams.map(t => t.div))].sort((a, b) => a - b);
  const pos = new Array(N);

  for (let s = 0; s < sims; s++) {
    // The 2026 roster nobody has drafted yet: one draw per manager per season.
    const lvl = teams.map(t => gau(t.mean, seasonSd));
    const W = zeros(), PF = zeros();
    for (const wk of sched) {
      const sc = lvl.map(m => gau(m, weekSd));
      for (let i = 0; i < N; i++) PF[i] += sc[i];
      for (const [a, b] of wk) { if (sc[a] > sc[b]) W[a]++; else W[b]++; }
    }
    for (let i = 0; i < N; i++) { C.wins[i] += W[i]; C.winDist[i][W[i]]++; }

    const rank = ids.slice().sort((a, b) => W[b] - W[a] || PF[b] - PF[a]);
    for (let i = 0; i < N; i++) pos[rank[i]] = i;

    const champs = divs.map(d => rank.find(i => teams[i].div === d)).sort((a, b) => pos[a] - pos[b]);
    for (const i of champs) C.divWin[i]++;
    for (const d of divs) {
      const m = rank.filter(i => teams[i].div === d);
      C.divLast[m[m.length - 1]]++;
    }
    const rest = rank.filter(i => !champs.includes(i));
    const wilds = playoffTeams - champs.length;
    const seeds = [...champs, ...rest.slice(0, wilds)];
    for (const i of seeds) C.playoff[i]++;
    C.bye[seeds[0]]++; C.bye[seeds[1]]++;

    const roll = i => gau(lvl[i], weekSd);
    const duel = (a, b) => roll(a) > roll(b) ? [a, b] : [b, a];
    const sp = new Map(seeds.map((x, i) => [x, i]));

    // Winners bracket, weeks 15-17. Seeds 1-2 sit out the first round.
    const [w1] = duel(seeds[2], seeds[5]);
    const [w2] = duel(seeds[3], seeds[4]);
    const low = sp.get(w1) > sp.get(w2) ? w1 : w2;
    const high = low === w1 ? w2 : w1;
    const [f1] = duel(seeds[0], low);
    const [f2] = duel(seeds[1], high);
    const [champ] = duel(f1, f2);
    C.title[champ]++;

    // Consolation. Seeds 7-12 by record; round one is 8v9 and 7v10, and the
    // two teams that LOSE it play off for last. Seeds 11 and 12 aren't in it —
    // which is why the worst record in the league cannot finish bottom.
    const L = rest.slice(wilds);
    const [, la] = duel(L[1], L[2]);
    const [, lb] = duel(L[0], L[3]);
    const [, dead] = duel(la, lb);
    C.last[dead]++;
  }
  return C;
}

/** The win total each manager's season is closest to a coin flip around. */
function winTotals(model, sim) {
  return model.teams.map((t, i) => {
    const dist = sim.winDist[i];
    let best = null;
    for (let k = 1; k <= model.sched.length; k++) {
      let over = 0;
      for (let j = k; j < dist.length; j++) over += dist[j];
      const p = over / sim.sims;
      const d = Math.abs(p - 0.5);
      if (!best || d < best.d) best = { line: k - 0.5, pOver: p, pUnder: 1 - p, d };
    }
    return { i, uid: t.uid, avg: sim.wins[i] / sim.sims, ...best };
  });
}

/**
 * Draft value. A pick's worth = where it was taken minus where the player
 * actually finished in production. Positive = taken later than he performed.
 */
function draftAnalysis(picks, playerPts, uidOf) {
  const rows = (picks || []).filter(p => p && p.pick_no).map(p => {
    const md = p.metadata || {};
    return {
      pick: p.pick_no, round: p.round, keeper: !!p.is_keeper,
      uid: p.picked_by || (uidOf && uidOf.get(p.roster_id)) || null,
      pid: p.player_id,
      name: ((md.first_name || "") + " " + (md.last_name || "")).trim() || "Unknown player",
      pos: md.position || "", team: md.team || "",
      pts: (playerPts && playerPts.get(p.player_id)) || 0,
    };
  });
  if (!rows.length) return null;
  rows.slice().sort((a, b) => b.pts - a.pts).forEach((r, i) => { r.prodRank = i + 1; });
  for (const r of rows) r.value = r.pick - r.prodRank;
  const byMgr = new Map();
  for (const r of rows) {
    if (!r.uid) continue;
    if (!byMgr.has(r.uid)) byMgr.set(r.uid, { uid: r.uid, n: 0, pts: 0, value: 0, best: null, worst: null });
    const m = byMgr.get(r.uid);
    m.n++; m.pts += r.pts; m.value += r.value;
    if (!m.best || r.value > m.best.value) m.best = r;
    if (!m.worst || r.value < m.worst.value) m.worst = r;
  }
  return {
    rows,
    steals: rows.slice().sort((a, b) => b.value - a.value).slice(0, 10),
    busts: rows.slice().sort((a, b) => a.value - b.value).slice(0, 10),
    byMgr: [...byMgr.values()].sort((a, b) => b.pts - a.pts),
  };
}

/** The signature: a posted price, and under it the number a book never shows. */
function priceTile(r, label) {
  return `<span class="price${r.price > 0 ? " plus" : ""}">
    ${label ? `<span class="k">${esc(label)}</span>` : ""}
    <span class="o">${esc(fmtOdds(r.price))}</span>
    <span class="tp">${(r.p * 100).toFixed(1)}%</span></span>`;
}

function oddsBoard(title, sub, priced, noteFn) {
  const b = el("div", "board");
  b.innerHTML = `<div class="bhead">
    <span class="bt">${esc(title)}${sub ? `<span class="bs">${esc(sub)}</span>` : ""}</span>
    <span class="hold">Hold ${(marketHold(priced) * 100).toFixed(1)}%</span></div>`;
  priced.forEach((r, i) => {
    const btn = el("button", "orow");
    btn.innerHTML = `<span class="rk">${i + 1}</span>${avatarHTML(r.uid, "sm avcell")}
      <span class="who"><span class="n">${esc(nameOf(r.uid))}</span>
      <span class="s">${esc(noteFn ? noteFn(r) : teamOf(r.uid))}</span></span>${priceTile(r)}`;
    btn.onclick = () => openProfile(r.uid);
    b.appendChild(btn);
  });
  return b;
}

function panelOdds(model, sim) {
  const p = el("div", "panel"); p.dataset.panel = "odds";

  const post = !!(model && model.postDraft);

  p.appendChild(sechead(`DFFL ${model ? model.season : ""} odds board`,
    post
      ? "Futures priced off the rosters that actually got drafted, simulated on the real DFFL format and posted the way a book would post them."
      : "Futures on the season nobody has drafted yet, priced by a simulation of the real DFFL format and posted the way a book would post them."));

  if (model) {
    const mode = el("div", "mode");
    mode.innerHTML = post
      ? `<span class="pill post">Repriced · post-draft</span>
         <span class="what">The draft is in. Every roster has been valued against the pre-draft
           market and the whole board has moved — these are no longer prices about the managers,
           they are prices about the teams.</span>`
      : `<span class="pill pre">Opening line · pre-draft</span>
         <span class="what">${model.draftStatus === "drafting"
            ? "The draft is under way. Half-built rosters price badly, so the board holds this line and re-prices in one move the moment the draft finishes."
            : "The draft hasn't run. The board re-prices itself automatically once it does — reload the page after the draft and every number here will have moved."}</span>`;
    p.appendChild(mode);
  }

  const notice = el("div", "notice");
  notice.innerHTML = `<div class="nt">House notice</div>
    <p><b>These are not real betting lines.</b> No sportsbook offers markets on a
       twelve-man friend league, nothing here is accepting a wager, and every price
       was invented by a model running in your browser.</p>
    ${post ? `
    <p><b>These prices know your rosters, not the season.</b> Every drafted player is
       valued at what a pick at his draft position has historically delivered to a DFFL
       lineup. That is a real signal — about half of a team's draft-day edge shows up in
       its scoring — but it cannot see injuries, waiver pickups, trades, or a rookie
       breaking out.</p>
    <p>Roughly a third of what decides a fantasy season is now on the board. The rest
       hasn't happened.</p>` : `
    <p><b>The board ignores the keepers and the draft order.</b> Both are already public
       on Sleeper, and a ninth-round keeper is a real edge — but a partial roster prices
       worse than none at all, so the model waits for the full draft rather than guessing
       from three players.</p>
    <p><b>It is pre-draft.</b> DFFL re-drafts every season and carries only three keepers
       forward, so most of what decides the year still hasn't happened.</p>
    <p>Read this as a prior on the managers, not a projection of the season.</p>`}`;
  p.appendChild(notice);

  if (!model || !model.ok || !sim) {
    p.appendChild(el("div", "empty",
      `<b>No board today</b>The simulation only prices the format it has been checked
       against — twelve teams, three divisions, six playoff teams, a fourteen-week
       season. This league doesn't currently match it, so rather than post numbers
       that don't mean anything, it posts nothing.`));
    return p;
  }

  const T = model.teams, n = sim.sims;
  const nm = i => nameOf(T[i].uid);
  const idxByDiv = d => T.map((t, i) => i).filter(i => T[i].div === d);
  const divs = [...model.divNames.keys()].sort((a, b) => a - b);

  /* ---- championship ---- */
  p.appendChild(sechead("Championship",
    "Every price carries a 6% hold, the way a real book's does. The small figure under each price is the model's own probability, with the vig taken back out — the number a sportsbook keeps to itself."));
  const title = priceMarket(T.map((t, i) => ({ uid: t.uid, i, p: sim.title[i] / n }))
    .sort((a, b) => b.p - a.p));
  p.appendChild(oddsBoard("To win the DFFL championship", `${model.season} season · ${n.toLocaleString()} simulations`,
    title, r => `Makes the playoffs ${(sim.playoff[r.i] / n * 100).toFixed(0)}% · projects ${f1(sim.wins[r.i] / n)} wins`));

  /* ---- what the draft did (only once there is a draft) ---- */
  if (post) {
    p.appendChild(sechead("What the draft did",
      `Every pick is worth what that draft slot has historically returned to a DFFL starting
       lineup${model.rosterCap ? `, and each manager is scored on his best ${model.rosterCap} of them —
       one per round, so a manager who traded for extra picks is not paid for the extra roster
       slots` : ", summed across the roster"}. The last three columns split each projection into the part that came from the draft and the part that came from the manager's own record.`));
    const byDraft = model.teams.slice().sort((a, b) => b.rosterEdge - a.rosterEdge);
    p.appendChild(tableCard(
      [{ label: "Manager" }, { label: "Roster", num: 1, title: model.rosterCap ? `Points per week this roster projects to deliver, best ${model.rosterCap} picks` : "Points per week this roster projects to deliver" },
      { label: "vs field", num: 1, title: "How far that sits from the average DFFL draft" },
      { label: "From draft", num: 1 }, { label: "From record", num: 1 }, { label: "Projected week", num: 1 }],
      byDraft.map(t => {
        const fromDraft = W_ROSTER * t.rosterEdge, fromRec = W_HIST_POST * t.rawEdge;
        const sgn = (v, d = 1) => `${v >= 0 ? "+" : ""}${d === 1 ? f1(v) : f2(v)}`;
        return `<tr>
          <td><span class="nmcell">${avatarHTML(t.uid, "sm")}${esc(nameOf(t.uid))}</span></td>
          <td class="num">${f1(t.rosterValue)}</td>
          <td class="num ${t.rosterEdge >= 0 ? "pos-t" : "neg-t"}"><b>${sgn(t.rosterEdge)}</b></td>
          <td class="num ${fromDraft >= 0 ? "pos-t" : "neg-t"}">${sgn(fromDraft)}</td>
          <td class="num ${fromRec >= 0 ? "pos-t" : "neg-t"}">${sgn(fromRec)}</td>
          <td class="num"><b>${f1(t.mean)}</b></td></tr>`;
      })));
    if ((model.matchRate != null && model.matchRate < 0.98) || model.picksDropped > 0) {
      const m = el("div", "method");

        ${model.picksPriced} picks matched a player on the pre-draft market;
        the rest — team defenses and deep fliers nobody was drafting — were
        valued at the board's floor. Every roster carries a couple, so this
        moves the ordering very little.</p>` : ""}
        ${model.picksDropped > 0 ? `<p>${model.picksDropped}
        ${model.picksDropped === 1 ? "pick was" : "picks were"} traded into rosters beyond
        ${model.rosterCap} players and ${model.picksDropped === 1 ? "does" : "do"} not count.
        A ${model.rosterCap + 1}th player never enters a lineup, so paying for him would price
        roster size rather than roster quality — each manager is valued on his best
        ${model.rosterCap}.</p>` : ""}`;
      p.appendChild(m);
    }
  }

  /* ---- make / miss the playoffs ---- */
  p.appendChild(sechead("To make the playoffs",
    "Six of twelve get in: the three division winners take seeds 1-3, then the best three records left over. Priced both ways — every manager has a yes and a no."));
  const pb = el("div", "board");
  pb.innerHTML = `<div class="bhead"><span class="bt">Playoff qualification
    <span class="bs">yes / no · six of twelve qualify</span></span>
    <span class="hold">Hold ${(ODDS_HOLD * 100).toFixed(1)}%</span></div>`;
  T.map((t, i) => ({ uid: t.uid, i, p: sim.playoff[i] / n }))
    .sort((a, b) => b.p - a.p)
    .forEach((w, i) => {
      const [yes, no] = priceMarket([{ p: w.p }, { p: 1 - w.p }]);
      const btn = el("button", "orow two");
      btn.innerHTML = `<span class="rk">${i + 1}</span>${avatarHTML(w.uid, "sm avcell")}
        <span class="who"><span class="n">${esc(nameOf(w.uid))}</span>
        <span class="s">wins the division ${(sim.divWin[w.i] / n * 100).toFixed(0)}% · first-round bye ${(sim.bye[w.i] / n * 100).toFixed(0)}%</span></span>
        <span class="prices">${priceTile(yes, "Yes")}${priceTile(no, "No")}</span>`;
      btn.onclick = () => openProfile(w.uid);

  p.appendChild(pb);

  const dw = el("div", "bgrid");
  for (const d of divs) {
    const rows = priceMarket(idxByDiv(d).map(i => ({ uid: T[i].uid, i, p: sim.divWin[i] / n }))
      .sort((a, b) => b.p - a.p));
    dw.appendChild(oddsBoard(`${model.divNames.get(d)} — to win`, "division title",
      rows, r => `projects ${f1(sim.wins[r.i] / n)} wins`));
  }
  p.appendChild(dw);

  /* ---- division cellar ---- */
  p.appendChild(sechead("Division cellar",
    "To finish last in your own division, on regular-season record."));
  const dl = el("div", "bgrid");
  for (const d of divs) {
    const rows = priceMarket(idxByDiv(d).map(i => ({ uid: T[i].uid, i, p: sim.divLast[i] / n }))
      .sort((a, b) => b.p - a.p));
    dl.appendChild(oddsBoard(`${model.divNames.get(d)} — to finish last`, "within the division",
      rows, r => `projects ${f1(sim.wins[r.i] / n)} wins`));
  }
  p.appendChild(dl);

  /* ---- last overall ---- */
  p.appendChild(sechead("Last place overall",
    "Twelfth is settled in the consolation bracket, not the standings — and Sleeper builds that bracket so the two worst records in the league are never in it."));
  const last = priceMarket(T.map((t, i) => ({ uid: t.uid, i, p: sim.last[i] / n }))
    .sort((a, b) => b.p - a.p));
  p.appendChild(oddsBoard("To finish 12th", "loser of the consolation elimination game",
    last, r => `projects ${f1(sim.wins[r.i] / n)} wins`));
  const quirk = el("div", "method");
  quirk.innerHTML = `<h3>Why this board is so flat</h3>
    <p>Seeds 7 through 10 open the consolation bracket against each other. The two
       that lose meet again for twelfth. Seeds 11 and 12 — the two worst records in
       the league — skip that round entirely and cannot finish below tenth.</p>
    <p>It has happened both years DFFL ran divisions. In 2024 the 2-12 team finished
       tenth and a 7-7 team finished last; in 2025 the 3-11 team finished seventh.
       Being terrible is genuinely protective here, so nobody's price gets long.</p>`;
  p.appendChild(quirk);

  /* ---- win totals ---- */
  p.appendChild(sechead("Season win totals",
    `Fourteen games. Each line sits where the simulation is closest to a coin flip, always on the half-win so there's no push.`));
  const wt = el("div", "board");
  wt.innerHTML = `<div class="bhead"><span class="bt">Regular-season wins
    <span class="bs">over / under · ${model.weeks} games</span></span>
    <span class="hold">Hold ${(ODDS_HOLD * 100).toFixed(1)}%</span></div>`;
  const totals = winTotals(model, sim).sort((a, b) => b.avg - a.avg);
  totals.forEach((w, i) => {
    const [over, under] = priceMarket([{ p: w.pOver }, { p: w.pUnder }]);
    const btn = el("button", "orow two");
    btn.innerHTML = `<span class="rk">${i + 1}</span>${avatarHTML(w.uid, "sm avcell")}
      <span class="who"><span class="n">${esc(nameOf(w.uid))}</span>

      <span class="prices">${priceTile(over, `Over ${w.line.toFixed(1)}`)}${priceTile(under, `Under ${w.line.toFixed(1)}`)}</span>`;
    btn.onclick = () => openProfile(w.uid);
    wt.appendChild(btn);

  p.appendChild(wt);

  /* ---- methodology ---- */
  p.appendChild(sechead("How the board is priced"));
  const m = el("div", "method");
  const yrs = `${model.seasons[0]}–${model.seasons[model.seasons.length - 1]}`;
  m.innerHTML = `
    <h3>What the model is told</h3>
    <p>Every regular-season weekly score in DFFL history, ${yrs}. Each manager is
       measured against the league average of his own season, so a higher-scoring year
       doesn't flatter anyone.</p>
    ${post ? `
    <p>And, since the draft ran, every pick all twelve managers made — valued against
       the pre-draft market${model.adpMeta ? ` (${model.adpMeta.source}, ${model.adpMeta.teams}-team
       ${model.adpMeta.format}, ${model.adpMeta.drafts.toLocaleString()} drafts sampled
       ${model.adpMeta.sampled.replace("..", " to ")})` : ""}. Keepers need no special
       treatment here: a player kept in the ninth round is simply a player, priced at
       what he was worth on the open board.</p>
    ${model.rosterCap ? `<p>Each manager is scored on his best ${model.rosterCap} picks — one per
       round of the draft. Picks get traded in DFFL, so rosters leave the draft at different
       sizes, and counting all of them would pay a manager for owning roster slots rather
       than better players: a ${model.rosterCap + 1}th player never enters a lineup. Trading up
       still shows, because it shows in the players.</p>` : ""}
    <p>Still not told: injuries, waiver claims, trades, or who is going to break out.</p>` : `
    <p>Deliberately not told: the keepers or the draft order, both of which Sleeper
       already publishes. Three keepers is a fifth of a roster, and a fifth of a roster
       prices worse than none — so the board waits for the full draft, then re-prices in
       one move. Until then every price here is a statement about the manager, not about
       the team he is going to have.</p>`}
    <h3>How much of that is real</h3>
    <p>A manager's scoring is split into the part that follows him and the part that is
       just the roster he drew that year. Comparing managers to themselves across
       seasons gives both:</p>
    <dl>
      ${post ? `
      <dt>Draft-day roster edge → scoring</dt><dd>×${W_ROSTER.toFixed(2)}</dd>
      <dt>Manager's own record → scoring</dt><dd>×${W_HIST_POST.toFixed(2)}</dd>` : `
      <dt>Carries over year to year</dt><dd>r = ${model.carry.toFixed(2)}</dd>
      <dt>Manager, once roster luck is removed</dt><dd>±${f1(model.skillSd)} pts/wk</dd>`}
      <dt>Season still unknown</dt><dd>±${f1(model.seasonSd)} pts/wk</dd>
      <dt>Week to week</dt><dd>±${f1(model.weekSd)} pts</dd>
      <dt>Manager-seasons behind it</dt><dd>${model.nMgrSeasons}</dd>
    </dl>
    ${post ? `<p>Those two multipliers are a regression of what each manager actually
       scored on what his draft was worth and what his record said, fitted over 35
       manager-seasons. Draft value comes out at <code>×${W_ROSTER.toFixed(2)}</code>
       — real, and statistically clear — meaning about half of a team's draft-day edge
       survives into its scoring; the rest is given back to injuries, waivers and luck.
       The manager's own record still counts, but its weight roughly halves once the
       roster is known, because the roster already contains most of what a record was
       standing in for.</p>` : ""}
    ${post ? "" : `
    <p>That <code>r = ${model.carry.toFixed(2)}</code> is the whole story: roughly
       ${(model.carry * 100).toFixed(0)}% of a manager's scoring edge survives into the next
       year and the rest is redrawn with the roster. So each manager's history is pulled
       most of the way back toward the league average before anything is simulated, and
       every simulated season starts by drawing him a new roster. It is estimated off
       ${model.nMgrSeasons} manager-seasons — thin enough that the figure itself could
       comfortably be half or double what it says.</p>
    <p>Because DFFL has re-drafted with three keepers every year of its history, that
       <code>r</code> already has the annual roster reset baked into it. The model isn't
       ignoring the draft; it is admitting the draft is most of what happens.</p>`}
    <h3>What changes when you draft</h3>
    <p>The board runs two models and switches itself. Before the draft it prices the
       manager; after it, it prices the roster, and the uncertainty left in a season
       drops from <code>±6.9</code> to <code>±4.8</code> points a week. Nothing is
       switched by hand — the page reads the draft's status from Sleeper on every load,
       and flips only when the draft is complete and all ${model.weeks + 1 === 15
         ? (DB.seasons[0].draftSlots || 180) : 180} picks are in. A half-finished draft
       keeps the opening line.</p>
    <h3>The simulation</h3>
    <p>${n.toLocaleString()} seasons on the real format: ${model.weeks} weeks, a full
       round robin plus intra-division rematches, wins then points-for for seeding, the
       three division winners at seeds 1-3, byes for the top two, and weeks 15-17 for the
       bracket. The schedule shape and the seeding rule were both read off DFFL's own
       Sleeper history rather than assumed. It runs on a fixed seed, so the board posts
       the same price every time you load it.</p>
    <h3>The prices</h3>
    <p>Probabilities in a market are scaled to sum to ${(100 + ODDS_HOLD * 100).toFixed(0)}%
       before conversion, which is the vig — a real book holds about that. Then
       <code>p ≥ .5 → -100p/(1-p)</code>, <code>p &lt; .5 → 100(1-p)/p</code>, rounded to
       the nearest 5 below 200 and the nearest 10 above. The de-vigged probability is
       printed under every price.</p>`;
  p.appendChild(m);

  p.appendChild(glossary([
    { t: "American odds", d: "What you'd win on a 100 stake. +300 pays 300 on a 100 bet; -150 means you'd stake 150 to win 100. Negative is the favourite." },
    { t: "Hold (vig)", d: "The book's cut. Add up what every price implies and it comes to more than 100% — that gap is the hold. Here it's 6% by construction." },
    { t: "True probability", d: "The small figure under each price: the model's actual number, before the hold was added. A real sportsbook never shows you this." },
    { t: "Line", d: "On win totals, the number you bet over or under. Always a half-win so the bet can't tie." },
    { t: "Shrinkage", d: "Pulling a small sample toward the average because most of what looks like skill is noise. Four seasons of fantasy scoring is a small sample." },
  ]));
  return p;
}

/* ============================================== DRAFT =============== */

  if (!drafted.length) {

         season, so steals and busts can't be calculated. The picks themselves are below.`));
      host.appendChild(tableCard([{ label: "Pick", num: 1 }, { label: "Rd", num: 1 }, { label: "Player" }, { label: "Drafted by" }],

      A.byMgr[0] && { c: "up", l: "Best draft haul", v: f1(A.byMgr[0].pts), w: nameOf(A.byMgr[0].uid), x: `most total points from his ${A.byMgr[0].n} picks` },
      A.byMgr[A.byMgr.length - 1] && { c: "down", l: "Worst draft haul", v: f1(A.byMgr[A.byMgr.length - 1].pts), w: nameOf(A.byMgr[A.byMgr.length - 1].uid), x: "fewest total points drafted" },

  }
  sel.onchange = draw; draw();
  return p;
}

/* ============================================== TRADES ============== */
/*
 * Everything on this tab is judged on one rule: a trade is worth what the
 * players did AFTER it, never what they did all season. Counting a full season
 * would credit a manager with points scored by a player he did not yet own,
 * which is how every "who won the trade" argument goes wrong.
 *
 * The transaction history is large — five seasons, eighteen legs each, plus a
 * 5MB player-name file — and most visitors never open this tab, so none of it
 * is fetched until they do.
 */

/* Margins are in points-per-season, so the bands are wide. Roughly: a starting
 * running back is worth ~150 points over a full season, a bye-week filler ~20. */
const TRADE_EVEN = 25;        // inside this, nobody won
const TRADE_CLEAR = 90;
const TRADE_LOPSIDED = 200;
const FAAB_MIN = 5;           // a $1 flier that busts is not an "overpay"

let TXCACHE = null;
async function loadTransactions() {
  if (TXCACHE) return TXCACHE;
  if (MOCK) return (TXCACHE = []);
  const jobs = [];
  for (const s of DB.seasons) for (let wk = 1; wk <= 18; wk++) jobs.push({ s, wk });
  const got = await pool(jobs, 8, async ({ s, wk }) => {
    const list = await jget(`${API}/league/${s.leagueId}/transactions/${wk}`).catch(() => []);
    return (list || []).map(t => ({ ...t, season: s.season }));
  });
  // Failed waiver claims are noise: they never happened.
  TXCACHE = got.flat().filter(t => t && t.status === "complete");
  return TXCACHE;
}

/* ------------------------------------------------------------- names */
/*
 * Transactions carry player_ids and nothing else. Draft metadata already in
 * hand covers most traded players; the rest need Sleeper's full player file,
 * which is ~5MB and is therefore fetched once, lazily, and only for the ids
 * actually missing.
 */
let PLAYER_NAMES = null;
function draftNameMap() {
  const m = new Map();
  for (const s of DB.seasons) for (const p of s.picks || []) {
    const md = p.metadata || {};
    const nm = `${md.first_name || ""} ${md.last_name || ""}`.trim();
    if (p.player_id && nm) m.set(String(p.player_id), { name: nm, pos: md.position || "", team: md.team || "" });
  }
  return m;
}
async function loadPlayerNames(need) {
  if (PLAYER_NAMES) return PLAYER_NAMES;
  const m = draftNameMap();
  const missing = [...need].map(String).filter(p => !m.has(p));
  if (missing.length && !MOCK) {
    try {
      const all = await jget(`${API}/players/nfl`);
      for (const pid of missing) {
        const p = all[pid];
        if (!p) continue;
        const nm = (p.full_name || `${p.first_name || ""} ${p.last_name || ""}`).trim();
        m.set(pid, { name: nm || pid, pos: p.position || "", team: p.team || "" });
      }
    } catch (e) { /* a missing name is a player_id on screen, not a broken page */ }
  }
  PLAYER_NAMES = m;
  return m;
}
const pname = pid => (PLAYER_NAMES && PLAYER_NAMES.get(String(pid))) || { name: String(pid), pos: "", team: "" };

/* ------------------------------------------------------------ scoring */

/**
 * What a player produced in `season`'s regular season from `from` onward.
 * Weeks before the trade are never counted, and the playoffs are left out —
 * they are a different competition and only six teams are in them.
 */
function ptsFrom(season, pid, from) {
  if (!season || !season.playerWeek) return 0;
  const last = (season.pws || 15) - 1;
  let tot = 0;
  for (let w = Math.max(1, from); w <= last; w++) {
    const wm = season.playerWeek.get(w);
    if (!wm) continue;
    const v = wm.get(String(pid));
    if (v != null && isFinite(v)) tot += v;
  }
  return tot;
}

const fmtPick = d => `${d.season} ${ord(Number(d.round))}`;

/**
 * Has this season actually been played? Sleeper hands back matchup rows for a
 * season the moment it exists, every score zero, so "we have week data" is not
 * the same question as "anybody has scored". Without this, an August trade in a
 * season nobody has played grades out as a nil-all draw.
 */
function seasonPlayed(season) {
  if (!season) return false;
  if (season._played == null) {
    season._played = !!(season.playerWeek && [...season.playerWeek.values()]
      .some(wm => [...wm.values()].some(v => v > 0)));
  }
  return season._played;
}

/**
 * Grade one trade. Every roster involved gets what it received and what it
 * gave up, both counted from the trade's week forward; its net is the
 * difference. Multi-team trades work the same way — the nets still sum to zero
 * and the gains still sum to everything that moved.
 */
function gradeTrade(tx, season) {
  if (!season) return null;
  const week = Number(tx.leg) || 1;
  const lastReg = (season.pws || 15) - 1;
  const adds = tx.adds || {}, drops = tx.drops || {};
  const pids = Object.keys(adds);
  const picks = tx.draft_picks || [];
  const rids = [...new Set([...(tx.roster_ids || []), ...Object.values(adds)])].filter(r => r != null);
  const noDrops = !Object.keys(drops).length;

  const val = p => { const n = pname(p); return { pid: p, name: n.name, pos: n.pos, pts: ptsFrom(season, p, week) }; };
  const sides = rids.map(rid => {
    const got = pids.filter(p => adds[p] === rid).map(val);
    // A few old trades came back without a drops map. In a two-team trade the
    // sender is unambiguous — it is whatever the other side received.
    const sent = (noDrops && rids.length === 2
      ? pids.filter(p => adds[p] !== rid)
      : pids.filter(p => drops[p] === rid)).map(val);
    const gain = got.reduce((a, x) => a + x.pts, 0);
    const loss = sent.reduce((a, x) => a + x.pts, 0);
    return {
      rid, uid: season.uidOf.get(rid) || null, got, sent, gain, loss, net: gain - loss,
      picksIn: picks.filter(d => d.owner_id === rid),
      picksOut: picks.filter(d => d.previous_owner_id === rid),
    };
  });

  const played = seasonPlayed(season);
  const reason =
    !pids.length ? "picks only — there is nothing to score" :
    !played ? `the ${season.season} season hasn't been played` :
    week > lastReg ? "made after the regular season ended" : null;

  const moved = sides.reduce((a, x) => a + x.gain, 0);
  const ranked = sides.slice().sort((a, b) => b.net - a.net);
  const graded = !reason;
  const winner = graded && ranked.length > 1 && ranked[0].net > 0 ? ranked[0] : null;
  const margin = winner ? winner.net : 0;

  return {
    id: tx.transaction_id, season: season.season, week, date: Number(tx.created) || 0,
    sides, ranked, moved, winner, margin, graded, reason, adds, drops,
    partial: !season.complete, nPicks: picks.length, nTeams: rids.length, nPlayers: pids.length,
  };
}

/**
 * Sleeper keeps a trade that was executed and then put straight back — a veto,
 * a misclick, a change of heart. Both halves come back marked complete, and
 * graded naively the pair reads as the two biggest fleecings in league history,
 * in opposite directions. A trade whose exact inverse runs between the same
 * managers inside a day is a wash, so neither half is graded.
 */
function markReversals(trades) {
  const DAY = 24 * 60 * 60 * 1000;
  const key = t => `${t.season}|${Object.keys(t.adds).sort().join(",")}`;
  const groups = new Map();
  for (const t of trades) {
    if (!t.nPlayers) continue;
    const k = key(t);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  let n = 0;
  for (const g of groups.values()) {
    if (g.length < 2) continue;
    g.sort((a, b) => a.date - b.date);
    for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
      const a = g[i], b = g[j];
      if (a.reversed || b.reversed || Math.abs(b.date - a.date) > DAY) continue;
      const pids = Object.keys(a.adds);
      const inverse = pids.every(p => b.adds[p] != null && b.adds[p] !== a.adds[p] && b.adds[p] === a.drops[p]);
      if (!inverse) continue;
      for (const t of [a, b]) {
        t.reversed = true; t.graded = false; t.winner = null; t.margin = 0;
        t.reason = "put straight back — the same players returned inside a day";
      }
      n += 2;
    }
  }
  return n;
}

function verdictOf(t) {
  if (!t.graded) return { cls: "none", label: "Not graded" };
  if (!t.winner || t.margin < TRADE_EVEN) return { cls: "even", label: "Nobody won it" };
  const m = t.margin;
  const label = m >= TRADE_LOPSIDED ? "Fleecing" : m >= TRADE_CLEAR ? "Lopsided" : "Won it";
  return { cls: m >= TRADE_LOPSIDED ? "fleeced" : m >= TRADE_CLEAR ? "lop" : "win", label };
}

function tradeLedger(txs) {
  const seasonOf = new Map(DB.seasons.map(s => [s.season, s]));
  const trades = txs.filter(t => t.type === "trade")
    .map(t => gradeTrade(t, seasonOf.get(t.season)))
    .filter(Boolean)
    .sort((a, b) => (b.date - a.date) || (Number(b.season) - Number(a.season)) || (b.week - a.week));
  const reversed = markReversals(trades);

  const byMgr = new Map();
  for (const t of trades) {
    if (!t.graded) continue;
    for (const sd of t.sides) {
      if (!sd.uid) continue;
      if (!byMgr.has(sd.uid)) byMgr.set(sd.uid,
        { uid: sd.uid, n: 0, net: 0, gained: 0, lost: 0, won: 0, lostN: 0, best: null, worst: null });
      const m = byMgr.get(sd.uid);
      m.n++; m.net += sd.net; m.gained += sd.gain; m.lost += sd.loss;
      if (sd.net > TRADE_EVEN) m.won++; else if (sd.net < -TRADE_EVEN) m.lostN++;
      if (!m.best || sd.net > m.best.net) m.best = { ...sd, t };
      if (!m.worst || sd.net < m.worst.net) m.worst = { ...sd, t };
    }
  }
  const graded = trades.filter(t => t.graded);
  return {
    trades, graded, reversed,
    byMgr: [...byMgr.values()].sort((a, b) => b.net - a.net),
    fleecing: graded.filter(t => t.winner).sort((a, b) => b.margin - a.margin)[0] || null,
    moved: graded.reduce((a, t) => a + t.moved, 0),
    seasons: [...new Set(trades.map(t => t.season))].sort((a, b) => Number(b) - Number(a)),
  };
}

/* ------------------------------------------------------------ waivers */
/*
 * A claim is credited with what the player scored from the week he was claimed
 * onward — the same rule the trades use. Nothing here knows whether a manager
 * actually started him, or kept him.
 */
function waiverReport(txs) {
  const seasonOf = new Map(DB.seasons.map(s => [s.season, s]));
  const claims = [], spend = new Map();
  for (const t of txs) {
    if (t.type !== "waiver" && t.type !== "free_agent") continue;
    const season = seasonOf.get(t.season);
    if (!season) continue;
    const adds = t.adds || {};
    const pids = Object.keys(adds);
    if (!pids.length) continue;
    const wk = Number(t.leg) || 1;
    const bid = Number(t.settings && t.settings.waiver_bid) || 0;
    const rid = adds[pids[0]];
    const uid = season.uidOf.get(rid);
    if (!uid) continue;

    if (bid > 0) {
      const sp = spend.get(uid) || { uid, spent: 0, claims: 0 };
      sp.spent += bid; sp.claims++; spend.set(uid, sp);
    }
    // One bid buys the whole claim, so a multi-player claim is one row.
    const players = pids.map(p => { const n = pname(p); return { pid: p, name: n.name, pos: n.pos, pts: ptsFrom(season, p, wk) }; });
    // A claim made in week 14 can only ever earn one week of points, so ranking
    // it on points-per-dollar against a week-3 claim is not a comparison. Only
    // claims with three regular-season weeks still to run get ranked; the money
    // still counts towards what a manager spent, because he really spent it.
    const lastReg = (season.pws || 15) - 1;
    const weeksLeft = Math.max(0, lastReg - wk + 1);
    claims.push({
      season: t.season, week: wk, uid, bid, players, weeksLeft,
      pts: players.reduce((a, x) => a + x.pts, 0),
      type: t.type, played: seasonPlayed(season),
      judged: seasonPlayed(season) && weeksLeft >= 3,
    });
  }
  const scored = claims.filter(c => c.judged);
  const paid = scored.filter(c => c.bid >= FAAB_MIN);
  const perPoint = c => c.pts > 0 ? c.bid / c.pts : Infinity;
  return {
    claims, spend: [...spend.values()].sort((a, b) => b.spent - a.spent),
    totalSpent: [...spend.values()].reduce((a, x) => a + x.spent, 0),
    // Claims that returned something, ranked by what each point cost. A claim
    // that returned nothing divides by zero and belongs in dead money instead.
    overpays: paid.filter(c => c.pts > 0).sort((a, b) => (perPoint(b) - perPoint(a)) || (b.bid - a.bid)).slice(0, 10),
    bestFree: scored.filter(c => c.bid === 0).sort((a, b) => b.pts - a.pts).slice(0, 10),
    bestBuys: paid.slice().sort((a, b) => (perPoint(a) - perPoint(b)) || (b.pts - a.pts)).slice(0, 10),
    // Money that bought literally nothing. Ranked by size of bid rather than by
    // cost per point, because every one of these divides by zero. A claim needs
    // at least one regular-season week to run, or the zero is just the calendar.
    deadMoney: claims.filter(c => c.played && c.weeksLeft >= 1 && c.bid > 0 && c.pts <= 0)
      .sort((a, b) => b.bid - a.bid).slice(0, 10),
    judged: scored.length, lateSkipped: claims.filter(c => c.played && !c.judged).length,
    perPoint,
  };
}

/* -------------------------------------------------------------- panel */
const plabel = x => `${esc(x.name)}${x.pos ? ` <span class="pos">${esc(x.pos)}</span>` : ""}`;
const sgnf = v => `${v >= 0 ? "+" : "−"}${f1(Math.abs(v))}`;

function tradeCard(t) {
  const v = verdictOf(t);
  const box = el("article", "trade");
  const when = `${t.season} · ${t.week === 1 ? "preseason / week 1" : "week " + t.week}`;
  // Inside the even band nobody is called a winner, so neither the margin nor
  // the winner's highlight is shown — a 23-point edge over fourteen weeks is
  // noise, and printing it next to "nobody won it" would argue with itself.
  const decided = t.graded && !!t.winner && v.cls !== "even";
  box.innerHTML = `<header class="thead">
      <span class="twhen">${esc(when)}${t.nTeams > 2 ? ` · ${t.nTeams}-team` : ""}</span>
      <span class="verd ${v.cls}">${esc(v.label)}${decided ? ` ${esc(sgnf(t.margin))}` : ""}</span>
    </header>`;

  const sides = el("div", "tsides");
  for (const sd of t.sides) {
    const d = el("div", "tside" + (decided && sd.rid === t.winner.rid ? " won" : ""));
    const lines = sd.got.map(x =>
      `<li class="tline"><span class="pn">${plabel(x)}</span><span class="pp">${t.graded ? f1(x.pts) : "—"}</span></li>`).join("");
    d.innerHTML = `<div class="who">${avatarHTML(sd.uid, "sm")}
        <span class="n">${esc(sd.uid ? nameOf(sd.uid) : "roster " + sd.rid)}</span>
        ${t.graded ? `<b class="net ${sd.net >= 0 ? "pos-t" : "neg-t"}">${esc(sgnf(sd.net))}</b>` : ""}</div>
      ${lines ? `<ul class="tlist">${lines}</ul>` : `<div class="tpicks">no players</div>`}
      ${sd.picksIn.length ? `<div class="tpicks">picks in: ${sd.picksIn.map(fmtPick).map(esc).join(", ")}</div>` : ""}`;
    sides.appendChild(d);
  }
  box.appendChild(sides);

  const notes = [];
  if (!t.graded) notes.push(`Not graded — ${t.reason}.`);
  else notes.push(`${f1(t.moved)} points changed hands from ${t.week === 1 ? "week 1" : "week " + t.week} on${t.partial ? ", and the season is still running" : ""}.`);
  if (t.graded && t.nPicks) notes.push(`${t.nPicks} draft pick${t.nPicks === 1 ? "" : "s"} also moved and ${t.nPicks === 1 ? "is" : "are"} not priced here.`);
  box.appendChild(el("div", "tnote", notes.map(esc).join(" ")));
  return box;
}

function renderTrades(host, L, W) {
  host.innerHTML = "";

  if (!L.trades.length) {
    host.appendChild(el("div", "empty",
      "<b>No trades on record</b>Nobody in this league has ever made one. The moment somebody does, it appears here."));
    return;
  }

  /* ---- the hero: the worst beating anyone has taken ---- */
  if (L.fleecing) {
    const t = L.fleecing, w = t.winner;
    const loser = t.ranked[t.ranked.length - 1];
    const got = w.got.map(x => x.name).join(", ") || "nothing";
    const gave = w.sent.map(x => x.name).join(", ") || "nothing";
    const f = el("div", "fleece");
    f.innerHTML = `<div class="k">Biggest fleecing in league history</div>
      <div class="v">${esc(sgnf(t.margin))}</div>
      <div class="w">${esc(nameOf(w.uid))} took ${esc(loser.uid ? nameOf(loser.uid) : "the other side")} — ${esc(t.season)}, ${t.week === 1 ? "preseason" : "week " + t.week}</div>
      <div class="c">Got ${esc(got)} (${f1(w.gain)} pts from there on) for ${esc(gave)} (${f1(w.loss)}).</div>`;
    host.appendChild(f);
  }

  const tiles = el("div", "tiles");
  const ungraded = L.trades.length - L.graded.length;
  tiles.innerHTML = [
    { l: "Trades all-time", v: String(L.trades.length), n: `across ${L.seasons.length} season${L.seasons.length === 1 ? "" : "s"}` },
    { l: "Graded", v: String(L.graded.length), n: ungraded ? `${ungraded} can't be scored fairly` : "every one of them" },
    { l: "Points traded", v: f1(L.moved), n: "counted after each deal" },
    { l: "Biggest margin", v: L.fleecing ? sgnf(L.fleecing.margin) : "—", n: L.fleecing ? `${nameOf(L.fleecing.winner.uid)}, ${L.fleecing.season}` : "nothing graded yet" },
  ].map(t => `<div class="tile"><div class="l">${esc(t.l)}</div><div class="v">${esc(t.v)}</div><div class="n">${esc(t.n)}</div></div>`).join("");
  host.appendChild(tiles);

  /* ---- the ledger ---- */
  host.appendChild(sechead("All-time trade ledger",
    "Points gained minus points given up, added across every trade a manager has ever made. Only the weeks after each deal count."));
  if (!L.byMgr.length) {
    host.appendChild(el("div", "empty", "<b>Nothing to add up yet</b>No trade in league history can be scored."));
  } else {
    host.appendChild(tableCard(
      [{ label: "Manager" }, { label: "Trades", num: 1 }, { label: "Net", num: 1, title: "Points gained minus points given up" },
      { label: "Got", num: 1 }, { label: "Gave", num: 1 }, { label: "W–L", num: 1, title: "Trades won and lost by more than 25 points" },
      { label: "Best" }, { label: "Worst" }],
      L.byMgr.map(m => `<tr>
        <td><span class="nmcell">${avatarHTML(m.uid, "sm")}${esc(nameOf(m.uid))}</span></td>
        <td class="num">${m.n}</td>
        <td class="num ${m.net >= 0 ? "pos-t" : "neg-t"}"><b>${esc(sgnf(m.net))}</b></td>
        <td class="num">${f1(m.gained)}</td>
        <td class="num">${f1(m.lost)}</td>
        <td class="num">${m.won}–${m.lostN}</td>
        <td>${m.best ? `<span class="pos-t">${esc(sgnf(m.best.net))}</span> ${esc(m.best.got.map(x => x.name).join(", ") || "picks")} <span class="pos">${esc(m.best.t.season)}</span>` : "—"}</td>
        <td>${m.worst ? `<span class="neg-t">${esc(sgnf(m.worst.net))}</span> ${esc(m.worst.got.map(x => x.name).join(", ") || "picks")} <span class="pos">${esc(m.worst.t.season)}</span>` : "—"}</td>
      </tr>`)));
  }

  /* ---- every trade, newest first ---- */
  host.appendChild(sechead("Every trade in league history",
    "Newest first. Each player is followed by what he scored from that week to the end of that regular season — the only points either side can claim."));
  const filt = el("div", "tfilter");
  const sel = el("select");
  const opt = (v, t) => { const o = el("option", null, t); o.value = v; sel.appendChild(o); };
  opt("all", `All seasons (${L.trades.length})`);
  for (const yr of L.seasons) opt(yr, `${yr} (${L.trades.filter(t => t.season === yr).length})`);
  filt.appendChild(sel);
  host.appendChild(filt);
  const list = el("div");
  host.appendChild(list);

  function drawList() {
    list.innerHTML = "";
    const show = sel.value === "all" ? L.trades : L.trades.filter(t => t.season === sel.value);
    if (!show.length) {
      list.appendChild(el("div", "empty",
        `<b>No trades in ${esc(sel.value)}</b>Nobody made a deal that season. It happens.`));
      return;
    }
    for (const t of show) list.appendChild(tradeCard(t));
  }
  sel.onchange = drawList; drawList();

  /* ---- waivers ---- */
  host.appendChild(sechead("Waivers and FAAB",
    "Every claim is credited with what the player scored from the week he was claimed onward. Same rule as the trades, and just as blind to whether anyone actually started him."));

  if (!W.claims.length) {
    host.appendChild(el("div", "empty", "<b>No waiver activity on record</b>"));
  } else {
    const worst = W.overpays[0], free = W.bestFree[0], buy = W.bestBuys[0], dead = W.deadMoney[0];
    const money = v => "$" + Math.round(v);
    const perPt = v => v >= 1 ? `$${Math.round(v)}` : `$${f2(v)}`;
    const recs = el("div", "recs");
    recs.innerHTML = [
      dead && {
        c: "down", l: "Most money for nothing", v: money(dead.bid),
        w: dead.players.map(x => x.name).join(", "),
        x: `${nameOf(dead.uid)} won him in ${dead.season} week ${dead.week} with ${dead.weeksLeft} week${dead.weeksLeft === 1 ? "" : "s"} left, and he scored ${f1(dead.pts)}`,
      },
      worst && worst.pts > 0 && {
        c: "down", l: "Biggest FAAB overpay", v: `${perPt(W.perPoint(worst))}/pt`,
        w: worst.players.map(x => x.name).join(", "),
        x: `${nameOf(worst.uid)} paid ${money(worst.bid)} in ${worst.season} week ${worst.week} for ${f1(worst.pts)} points`,
      },
      free && {
        c: "up", l: "Best free pickup", v: f1(free.pts),
        w: free.players.map(x => x.name).join(", "),
        x: `${nameOf(free.uid)} claimed him for nothing, ${free.season} week ${free.week}`,
      },
      buy && {
        c: "up", l: "Best money spent", v: `${perPt(W.perPoint(buy))}/pt`,
        w: buy.players.map(x => x.name).join(", "),
        x: `${nameOf(buy.uid)} paid ${money(buy.bid)} for ${f1(buy.pts)} points, ${buy.season} week ${buy.week}`,
      },
      { c: "up", l: "FAAB spent, all-time", v: money(W.totalSpent), w: "across the league", x: `${W.spend.length} managers have bid on somebody` },
    ].filter(Boolean).map(x =>
      `<div class="rec ${x.c}"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div>
       <div class="w">${esc(x.w)}</div><div class="c">${esc(x.x)}</div></div>`).join("");
    host.appendChild(recs);

    const claimRow = c => `<tr>
      <td>${c.players.map(plabel).join(", ")}</td>
      <td>${esc(nameOf(c.uid))}</td>
      <td class="num">${esc(c.season)}</td>
      <td class="num">${c.week}</td>
      <td class="num">$${c.bid}</td>
      <td class="num">${c.weeksLeft}</td>
      <td class="num">${f1(c.pts)}</td>
      <td class="num">${c.pts > 0 ? "$" + f2(W.perPoint(c)) : "—"}</td></tr>`;
    const claimHead = [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 },
    { label: "Bid", num: 1 }, { label: "Weeks left", num: 1, title: "Regular-season weeks the player still had to run" },
    { label: "Points after", num: 1 }, { label: "$ / point", num: 1 }];

    host.appendChild(sechead("Worst money in league history",
      `Claims of $${FAAB_MIN} or more with at least three regular-season weeks still to run, ranked by what each point ended up costing. The ones that returned nothing at all are below.`));
    host.appendChild(tableCard(claimHead, W.overpays.map(claimRow)));

    if (W.deadMoney.length) {
      host.appendChild(sechead("Dead money",
        "Winning bids that returned nothing at all. Every one of these had regular-season football left to play."));
      host.appendChild(tableCard(
        [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 },
        { label: "Bid", num: 1 }, { label: "Weeks left", num: 1 }, { label: "Points after", num: 1 }],
        W.deadMoney.map(c => `<tr>
          <td>${c.players.map(plabel).join(", ")}</td>
          <td>${esc(nameOf(c.uid))}</td>
          <td class="num">${esc(c.season)}</td>
          <td class="num">${c.week}</td>
          <td class="num"><b>$${c.bid}</b></td>
          <td class="num">${c.weeksLeft}</td>
          <td class="num">${f1(c.pts)}</td></tr>`)));
    }

    host.appendChild(sechead("Best free pickups", "Claimed for nothing, and what they went on to score from that week to the end of the regular season."));
    host.appendChild(tableCard(
      [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 }, { label: "Points after", num: 1 }],
      W.bestFree.map(c => `<tr>
        <td>${c.players.map(plabel).join(", ")}</td>
        <td>${esc(nameOf(c.uid))}</td>
        <td class="num">${esc(c.season)}</td>
        <td class="num">${c.week}</td>
        <td class="num"><b>${f1(c.pts)}</b></td></tr>`)));

    if (W.spend.length) {
      host.appendChild(sechead("FAAB spent, by manager", "Every winning bid a manager has ever made, added up."));
      host.appendChild(barCard(
        W.spend.map(x => ({ label: nameOf(x.uid), v: x.spent, claims: x.claims })),
        v => "$" + Math.round(v),
        it => `<b>${esc(it.label)}</b><br>$${Math.round(it.v)} across ${it.claims} winning bids`));
    }
  }

  host.appendChild(glossary([
    { t: "Points after", d: "What a player scored from the week of the deal to the end of that regular season. Points he scored earlier belong to whoever owned him then, so they are never counted." },
    { t: "Net", d: "Points received minus points given up. The two sides of a trade are exact mirrors, so a league-wide net of zero is the arithmetic working, not a coincidence." },
    { t: "Not graded", d: "A trade of picks only, or one made after the regular season, or one in a season that hasn't been played. Rather than invent a number, the board says so." },
    { t: "$ / point", d: "A winning FAAB bid divided by what the player scored afterwards. The cheapest way to compare a $40 claim to a $3 one." },
  ]));

  const m = el("div", "method");
  m.innerHTML = `<h3>What this can and cannot see</h3>
    <p>Points are a player's total production under DFFL scoring, starters and bench alike — the same
       number the draft board uses. Nothing here knows whether a manager actually started the player he
       traded for, or whether he dropped him a week later.</p>
    <p>A player only scores here while somebody rosters him. Drop a traded player and the weeks he spends
       unclaimed are invisible to Sleeper's box scores and therefore to this page — which flatters the
       manager who dumped him.</p>
    <p>Draft picks are counted and shown but never priced. A pick's worth depends on where it lands, which
       is not known until the draft runs, so a trade that moved only picks is marked <b>not graded</b>
       rather than given a number that would be made up. ${L.trades.length - L.graded.length} of
       ${L.trades.length} trades fall in that bucket${L.reversed ? `, ${L.reversed} of them because the
       same players went straight back inside a day — a trade undone is not a trade won` : ""}.</p>
    <p>Playoff scoring is excluded on both sides. Six of twelve teams make the playoffs, so counting those
       weeks would reward a trade for the team it was made by rather than the players in it. For the same
       reason a waiver claim needs three regular-season weeks still to run before it is ranked on value:
       ${W.lateSkipped} claims were made too late to judge that way, and are counted in the money spent
       but nowhere else.</p>`;
  host.appendChild(m);
}

let TRADES_STARTED = false;
async function ensureTrades() {
  if (TRADES_STARTED) return;
  TRADES_STARTED = true;
  const host = $("#tradesHost");
  if (!host) return;
  try {
    const txs = await loadTransactions();
    const need = new Set();
    for (const t of txs) {
      for (const k of Object.keys(t.adds || {})) need.add(k);
      for (const k of Object.keys(t.drops || {})) need.add(k);
    }
    await loadPlayerNames(need);
    const L = tradeLedger(txs), W = waiverReport(txs);
    window.__TRADES = L; window.__WAIVERS = W; window.__TX = txs;
    renderTrades(host, L, W);
    document.body.dataset.tradesReady = "1";
  } catch (e) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty",
      `<b>Couldn't load the transaction history</b>${esc(e.message)}<br>Sleeper may be rate-limiting — reload in a minute.`));
    document.body.dataset.tradesReady = "error";
    console.error(e);
  }
}

function panelTrades() {
  const p = el("div", "panel"); p.dataset.panel = "trades";
  p.appendChild(sechead("The trade block",
    "Every trade DFFL has ever made, graded on what the players did afterwards — never on what they did all season. Waivers and FAAB get the same treatment."));
  const host = el("div"); host.id = "tradesHost";
  host.appendChild(el("div", "empty",
    `<b>Reading the transaction history…</b>Five seasons of trades, waiver claims and free-agent adds,
     plus the player-name file Sleeper keeps separately. It is a few megabytes, so it is only ever
     fetched when somebody opens this tab — which you just did.`));
  p.appendChild(host);
  return p;
}

/* ---------------------------------------------------------------- boot */
async function boot() {
  try {
    if (MOCK) await mockInit();
    try { DB.state = MOCK ? null : await jget(`${API}/state/nfl`); } catch (e) { DB.state = null; }

    const chain = await loadChain();
    if (!chain.length) throw new Error("Could not load the league from Sleeper.");
    total = chain.length * 22;
    $("#lgName").textContent = chain[0].name || "League";

    for (const lg of chain) await loadSeason(lg);
    DB.seasons.sort((a, b) => Number(b.season) - Number(a.season));

    const AT = allTime(), RB = recordBook(), H2H = h2hMap(), DIST = scoringDist();
    const ODDS = await oddsModel(), SIM = simulateSeason(ODDS);
    window.__AT = AT; window.__RB = RB; window.__H2H = H2H; window.__DIST = DIST;
    window.__ODDS = ODDS; window.__SIM = SIM;

    const oldest = DB.seasons[DB.seasons.length - 1], newest = DB.seasons[0];
    $("#eyebrow").textContent = `${oldest.season}–${newest.season} · ${chain[0].total_rosters} teams`;
    $("#lgSub").textContent = `${DB.games.length} games on record, and every one of them still counts against you.`;

    const app = $("#app");
    app.appendChild(panelHome(AT, RB, ODDS, SIM));
    app.appendChild(panelScoreboard());
    app.appendChild(panelManagers(AT));
    app.appendChild(panelRecords(RB));
    app.appendChild(panelMatchups(AT));
    app.appendChild(panelOdds(ODDS, SIM));
    app.appendChild(panelDraft());
    app.appendChild(panelTrades());
    app.appendChild(await panelRecaps());

    buildTabs();
    $("#loader").hidden = true;
    app.hidden = false;
    const want = location.hash.replace("#", "");
    show(TABS.some(t => t.id === want) ? want : "home");
    $("#footNote").textContent = DB.state ? ` Currently NFL ${DB.state.season}, week ${DB.state.week}.` : "";
    window.__DFFL = {
      DB, AT, RB, DIST, draftAnalysis, winProb, titleOdds, scoringDist,
      ODDS, SIM, oddsModel, simulateSeason, winTotals, buildSchedule, roundRobin,
      americanOdds, impliedProb, roundOdds, addVig, priceMarket, marketHold,
      ODDS_HOLD, ODDS_SIMS, panelOdds, loadADP, adpValue, adpKey, rosterValue,
      ADP_CURVE, W_ROSTER, W_HIST_POST, SHOCK_PRE, SHOCK_POST,
      ensureTrades, loadTransactions, loadPlayerNames, tradeLedger, waiverReport,
      gradeTrade, ptsFrom, verdictOf, TRADE_EVEN, TRADE_CLEAR, TRADE_LOPSIDED, FAAB_MIN,
    };
    document.body.dataset.ready = "1";
  } catch (e) {
    const l = $("#loader");
    l.innerHTML = "";
    l.appendChild(el("div", "err", `<b>Couldn't load the league.</b><br>${esc(e.message)}<br>
      <span style="color:#d9b7b7;font-size:13px">If this keeps happening Sleeper may be rate-limiting — wait a minute and refresh.</span>`));
    document.body.dataset.ready = "error";
    console.error(e);
  }
}
boot();
