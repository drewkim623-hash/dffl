    deadMoney: claims.filter(c => c.played && c.weeksLeft >= 1 && c.bid > 0 && c.pts <= 0)
      .sort((a, b) => b.bid - a.bid).slice(0, 10),
    judged: scored.length, lateSkipped: claims.filter(c => c.played && !c.judged).length,
    perPoint,
  };
}

/* -------------------------------------------------------------- panel */
const plabel = x => `${esc(x.name)}${x.pos ? ` <span class="pos">${esc(x.pos)}</span>` : ""}`;
/** Everything a side received, players and picks, in plain words. */
const gotNames = sd => [...sd.got.map(x => x.name),
  ...sd.picksIn.map(r => r.name ? `${r.label} → ${r.name}` : r.label)].join(", ") || "nothing";
const sgnf = v => `${v >= 0 ? "+" : "−"}${f1(Math.abs(v))}`;

function tradeCard(t) {
  const v = verdictOf(t);
  const box = el("article", "trade");
  const when = `${t.season} · ${t.week === 1 ? "preseason / week 1" : "week " + t.week}`;
  // Inside the even band nobody is called a winner, so neither the margin nor
  // the winner's highlight is shown — a 23-point edge over fourteen weeks is
  // noise, and printing it next to "nobody won it" would argue with itself.
  const decided = t.graded && !!t.winner && v.cls !== "even";
  box.innerHTML = `<header class="thead">
      <span class="twhen">${esc(when)}${t.nTeams > 2 ? ` · ${t.nTeams}-team` : ""}</span>
      <span class="verd ${v.cls}">${esc(v.label)}${decided ? ` ${esc(sgnf(t.margin))}` : ""}</span>
    </header>`;

  const sides = el("div", "tsides");
  for (const sd of t.sides) {
    const d = el("div", "tside" + (decided && sd.rid === t.winner.rid ? " won" : ""));
    const line = (label, pts, priced, sub) => `<li class="tline">
      <span class="pn">${label}${sub ? `<br><i class="sub">${esc(sub)}</i>` : ""}</span>
      <span class="pp">${priced ? f1(pts) : "—"}</span></li>`;
    const lines = sd.got.map(x => line(plabel(x), x.pts, t.graded && x.priced))
      .concat(sd.picksIn.map(r => line(
        `${esc(r.label)}${r.name ? ` → ${esc(r.name)}${r.pos ? ` <span class="pos">${esc(r.pos)}</span>` : ""}` : ""}`,
        r.pts, t.graded && r.priced, r.priced ? null : r.why))).join("");
    d.innerHTML = `<div class="who">${avatarHTML(sd.uid, "sm")}
        <span class="n">${esc(sd.uid ? nameOf(sd.uid) : "roster " + sd.rid)}</span>
        ${t.graded ? `<b class="net ${sd.net >= 0 ? "pos-t" : "neg-t"}">${esc(sgnf(sd.net))}</b>` : ""}</div>
      ${lines ? `<ul class="tlist">${lines}</ul>` : `<div class="tpicks">gave everything, got nothing back</div>`}`;
    sides.appendChild(d);
  }
  box.appendChild(sides);

  const notes = [];
  if (!t.graded) notes.push(`Not graded — ${t.reason}.`);
  else notes.push(`${f1(t.moved)} points changed hands${t.pricedPicks ? `, counting ${t.pricedPicks} pick${t.pricedPicks === 1 ? "" : "s"} at what ${t.pricedPicks === 1 ? "it" : "they"} drafted` : ""}${t.partial ? ", and the season is still running" : ""}.`);
  if (t.graded && t.unpriced.length)
    notes.push(`Not priced: ${t.unpriced.map(u => `${u.label} (${u.why})`).join(", ")}.`);
  box.appendChild(el("div", "tnote", notes.map(esc).join(" ")));
  return box;
}

function renderTrades(host, L, W) {
  host.innerHTML = "";

  if (!L.trades.length) {
    host.appendChild(el("div", "empty",
      "<b>No trades on record</b>Nobody in this league has ever made one. The moment somebody does, it appears here."));
    return;
  }

  /* ---- the hero: the worst beating anyone has taken ---- */
  if (L.fleecing) {
    const t = L.fleecing, w = t.winner;
    const loser = t.ranked[t.ranked.length - 1];
    const got = gotNames(w);
    const gave = [...w.sent.map(x => x.name),
      ...w.picksOut.map(r => r.name ? `${r.label} → ${r.name}` : r.label)].join(", ") || "nothing";
    const f = el("div", "fleece");
    f.innerHTML = `<div class="k">Biggest fleecing in league history</div>
      <div class="v">${esc(sgnf(t.margin))}</div>
      <div class="w">${esc(nameOf(w.uid))} took ${esc(loser.uid ? nameOf(loser.uid) : "the other side")} — ${esc(t.season)}, ${t.week === 1 ? "preseason" : "week " + t.week}</div>
      <div class="c">Got ${esc(got)} (${f1(w.gain)} pts from there on) for ${esc(gave)} (${f1(w.loss)}).</div>`;
    host.appendChild(f);
  }

  const tiles = el("div", "tiles");
  const ungraded = L.trades.length - L.graded.length;
  tiles.innerHTML = [
    { l: "Trades all-time", v: String(L.trades.length), n: `across ${L.seasons.length} season${L.seasons.length === 1 ? "" : "s"}` },
    { l: "Graded", v: String(L.graded.length), n: ungraded ? `${ungraded} can't be scored fairly` : "every one of them" },
    { l: "Points traded", v: f1(L.moved), n: `players after each deal, picks at what they drafted` },
    { l: "Biggest margin", v: L.fleecing ? sgnf(L.fleecing.margin) : "—", n: L.fleecing ? `${nameOf(L.fleecing.winner.uid)}, ${L.fleecing.season}` : "nothing graded yet" },
  ].map(t => `<div class="tile"><div class="l">${esc(t.l)}</div><div class="v">${esc(t.v)}</div><div class="n">${esc(t.n)}</div></div>`).join("");
  host.appendChild(tiles);

  /* ---- the ledger ---- */
  host.appendChild(sechead("All-time trade ledger",
    "Points gained minus points given up, added across every trade a manager has ever made. Only the weeks after each deal count."));
  if (!L.byMgr.length) {
    host.appendChild(el("div", "empty", "<b>Nothing to add up yet</b>No trade in league history can be scored."));
  } else {
    host.appendChild(tableCard(
      [{ label: "Manager" }, { label: "Trades", num: 1 }, { label: "Net", num: 1, title: "Points gained minus points given up, players and picks together" },
      { label: "From players", num: 1 }, { label: "From picks", num: 1, title: "Picks are worth what the player drafted with them scored" },
      { label: "W–L", num: 1, title: "Trades won and lost by more than 25 points" },
      { label: "Best" }, { label: "Worst" }],
      L.byMgr.map(m => `<tr>
        <td><span class="nmcell">${avatarHTML(m.uid, "sm")}${esc(nameOf(m.uid))}</span></td>
        <td class="num">${m.n}</td>
        <td class="num ${m.net >= 0 ? "pos-t" : "neg-t"}"><b>${esc(sgnf(m.net))}</b></td>
        <td class="num ${m.playerNet >= 0 ? "pos-t" : "neg-t"}">${esc(sgnf(m.playerNet))}</td>
        <td class="num ${m.pickNet >= 0 ? "pos-t" : "neg-t"}">${esc(sgnf(m.pickNet))}</td>
        <td class="num">${m.won}–${m.lostN}</td>
        <td>${m.best ? `<span class="pos-t">${esc(sgnf(m.best.net))}</span> ${esc(gotNames(m.best))} <span class="pos">${esc(m.best.t.season)}</span>` : "—"}</td>
        <td>${m.worst ? `<span class="neg-t">${esc(sgnf(m.worst.net))}</span> ${esc(gotNames(m.worst))} <span class="pos">${esc(m.worst.t.season)}</span>` : "—"}</td>
      </tr>`)));
  }

  /* ---- what the picks turned into ---- */
  if (L.pickHauls.length) {
    host.appendChild(sechead("What the traded picks became",
      `A pick is worth the player actually taken with it. ${L.pickedPriced} of the ${L.picksMoved} picks that have changed hands
       follow through to a selection in a season that has been played. Listed under whoever held the pick last — a ×
       marks one that was traded on more than once.`));
    const best = L.pickHauls.slice(0, 12);
    host.appendChild(tableCard(
      [{ label: "Pick" }, { label: "Became" }, { label: "At", num: 1, title: "Where the pick actually landed in that draft" },
      { label: "Ended up with" }, { label: "Traded in", num: 1 }, { label: "Points", num: 1 }],
      best.map(r => `<tr>
        <td>${esc(r.label)}${r.times > 1 ? ` <span class="pos">×${r.times}</span>` : ""}</td>
        <td>${esc(r.name)}${r.pos ? ` <span class="pos">${esc(r.pos)}</span>` : ""}</td>
        <td class="num">${r.no}</td>
        <td>${esc(nameOf(r.uid))}</td>
        <td class="num">${esc(r.from)}</td>
        <td class="num"><b>${f1(r.pts)}</b></td></tr>`)));
  }

  /* ---- waivers ---- */
  host.appendChild(sechead("Waivers and FAAB",
    "Every claim is credited with what the player scored from the week he was claimed onward. Same rule as the trades, and just as blind to whether anyone actually started him."));

  if (!W.claims.length) {
    host.appendChild(el("div", "empty", "<b>No waiver activity on record</b>"));
  } else {
    const worst = W.overpays[0], free = W.bestFree[0], buy = W.bestBuys[0], dead = W.deadMoney[0];
    const money = v => "$" + Math.round(v);
    const perPt = v => v >= 1 ? `$${Math.round(v)}` : `$${f2(v)}`;
    const recs = el("div", "recs");
    recs.innerHTML = [
      dead && {
        c: "down", l: "Most money for nothing", v: money(dead.bid),
        w: dead.players.map(x => x.name).join(", "),
        x: `${nameOf(dead.uid)} won him in ${dead.season} week ${dead.week} with ${dead.weeksLeft} week${dead.weeksLeft === 1 ? "" : "s"} left, and he scored ${f1(dead.pts)}`,
      },
      worst && worst.pts > 0 && {
        c: "down", l: "Biggest FAAB overpay", v: `${perPt(W.perPoint(worst))}/pt`,
        w: worst.players.map(x => x.name).join(", "),
        x: `${nameOf(worst.uid)} paid ${money(worst.bid)} in ${worst.season} week ${worst.week} for ${f1(worst.pts)} points`,
      },
      free && {
        c: "up", l: "Best free pickup", v: f1(free.pts),
        w: free.players.map(x => x.name).join(", "),
        x: `${nameOf(free.uid)} claimed him for nothing, ${free.season} week ${free.week}`,
      },
      buy && {
        c: "up", l: "Best money spent", v: `${perPt(W.perPoint(buy))}/pt`,
        w: buy.players.map(x => x.name).join(", "),
        x: `${nameOf(buy.uid)} paid ${money(buy.bid)} for ${f1(buy.pts)} points, ${buy.season} week ${buy.week}`,
      },
      { c: "up", l: "FAAB spent, all-time", v: money(W.totalSpent), w: "across the league", x: `${W.spend.length} managers have bid on somebody` },
    ].filter(Boolean).map(x =>
      `<div class="rec ${x.c}"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div>
       <div class="w">${esc(x.w)}</div><div class="c">${esc(x.x)}</div></div>`).join("");
    host.appendChild(recs);

    const claimRow = c => `<tr>
      <td>${c.players.map(plabel).join(", ")}</td>
      <td>${esc(nameOf(c.uid))}</td>
      <td class="num">${esc(c.season)}</td>
      <td class="num">${c.week}</td>
      <td class="num">$${c.bid}</td>
      <td class="num">${c.weeksLeft}</td>
      <td class="num">${f1(c.pts)}</td>
      <td class="num">${c.pts > 0 ? "$" + f2(W.perPoint(c)) : "—"}</td></tr>`;
    const claimHead = [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 },
    { label: "Bid", num: 1 }, { label: "Weeks left", num: 1, title: "Regular-season weeks the player still had to run" },
    { label: "Points after", num: 1 }, { label: "$ / point", num: 1 }];

    host.appendChild(sechead("Worst money in league history",
      `Claims of $${FAAB_MIN} or more with at least three regular-season weeks still to run, ranked by what each point ended up costing. The ones that returned nothing at all are below.`));
    host.appendChild(tableCard(claimHead, W.overpays.map(claimRow)));

    if (W.deadMoney.length) {
      host.appendChild(sechead("Dead money",
        "Winning bids that returned nothing at all. Every one of these had regular-season football left to play."));
      host.appendChild(tableCard(
        [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 },
        { label: "Bid", num: 1 }, { label: "Weeks left", num: 1 }, { label: "Points after", num: 1 }],
        W.deadMoney.map(c => `<tr>
          <td>${c.players.map(plabel).join(", ")}</td>
          <td>${esc(nameOf(c.uid))}</td>
          <td class="num">${esc(c.season)}</td>
          <td class="num">${c.week}</td>
          <td class="num"><b>$${c.bid}</b></td>
          <td class="num">${c.weeksLeft}</td>
          <td class="num">${f1(c.pts)}</td></tr>`)));
    }

    host.appendChild(sechead("Best free pickups", "Claimed for nothing, and what they went on to score from that week to the end of the regular season."));
    host.appendChild(tableCard(
      [{ label: "Player" }, { label: "Claimed by" }, { label: "Season", num: 1 }, { label: "Wk", num: 1 }, { label: "Points after", num: 1 }],
      W.bestFree.map(c => `<tr>
        <td>${c.players.map(plabel).join(", ")}</td>
        <td>${esc(nameOf(c.uid))}</td>
        <td class="num">${esc(c.season)}</td>
        <td class="num">${c.week}</td>
        <td class="num"><b>${f1(c.pts)}</b></td></tr>`)));

    if (W.spend.length) {
      host.appendChild(sechead("FAAB spent, by manager", "Every winning bid a manager has ever made, added up."));
      host.appendChild(barCard(
        W.spend.map(x => ({ label: nameOf(x.uid), v: x.spent, claims: x.claims })),
        v => "$" + Math.round(v),
        it => `<b>${esc(it.label)}</b><br>$${Math.round(it.v)} across ${it.claims} winning bids`));
    }
  }

  /* ---- every trade, newest first ---- */
  // A hundred and fifty cards is a wall, and everything above is the point of
  // the page, so the log goes last and opens short.
  const PAGE = 20;
  host.appendChild(sechead("Every trade in league history",
    "Newest first. Each player is followed by what he scored from that week to the end of that regular season, and each pick by the player it became — the only points either side can claim."));
  const filt = el("div", "tfilter");
  const sel = el("select");
  sel.setAttribute("aria-label", "Filter trades by season");
  const opt = (v, t) => { const o = el("option", null, t); o.value = v; sel.appendChild(o); };
  opt("all", `All seasons (${L.trades.length})`);
  for (const yr of L.seasons) opt(yr, `${yr} (${L.trades.filter(t => t.season === yr).length})`);
  filt.appendChild(sel);
  host.appendChild(filt);
  const list = el("div");
  host.appendChild(list);

  let shown = PAGE;
  function drawList() {
    list.innerHTML = "";
    const all = sel.value === "all" ? L.trades : L.trades.filter(t => t.season === sel.value);
    if (!all.length) {
      list.appendChild(el("div", "empty",
        `<b>No trades in ${esc(sel.value)}</b>Nobody made a deal that season. It happens.`));
      return;
    }
    for (const t of all.slice(0, shown)) list.appendChild(tradeCard(t));
    if (all.length > shown) {
      const more = el("button", "back more", `Show all ${all.length} trades`);
      more.onclick = () => { shown = all.length; drawList(); };
      list.appendChild(more);
    }
  }
  sel.onchange = () => { shown = PAGE; drawList(); };
  drawList();

  host.appendChild(glossary([
    { t: "Points after", d: "What a player scored from the week of the deal to the end of that regular season. Points he scored earlier belong to whoever owned him then, so they are never counted." },
    { t: "Net", d: "Points received minus points given up. The two sides of a trade are exact mirrors, so a league-wide net of zero is the arithmetic working, not a coincidence." },
    { t: "Not graded", d: "A trade of picks only, or one made after the regular season, or one in a season that hasn't been played. Rather than invent a number, the board says so." },
    { t: "$ / point", d: "A winning FAAB bid divided by what the player scored afterwards. The cheapest way to compare a $40 claim to a $3 one." },
  ]));

  const m = el("div", "method");
  m.innerHTML = `<h3>What this can and cannot see</h3>
    <p>Points are a player's total production under DFFL scoring, starters and bench alike — the same
       number the draft board uses. Nothing here knows whether a manager actually started the player he
       traded for, or whether he dropped him a week later.</p>
    <p>A player only scores here while somebody rosters him. Drop a traded player and the weeks he spends
       unclaimed are invisible to Sleeper's box scores and therefore to this page — which flatters the
       manager who dumped him.</p>
    <p>A draft pick is worth the player actually taken with it, over that player's whole regular season.
       Resolving one is not a matter of looking up a roster: on the draft board a pick is filed under
       whoever <i>made</i> the selection, which is the new owner, so a traded pick cannot be found that way
       at all. What survives a trade is the draft column, and the draft's own slot map leads from the
       original owner back to it. ${L.pickedPriced} of the ${L.picksMoved} picks that have changed hands
       resolve to a selection in a season that has actually been played.</p>
    <p>Two kinds of pick are deliberately left unpriced. One used as a keeper slot drafted nobody — the
       manager kept a player he already had — and one for a season nobody has played has not delivered
       anything yet. Both are named on the trade rather than quietly counted as zero.</p>
    <p>Because a pick usually lands in the season after the trade, a graded trade can span two years: the
       players are scored over the weeks left in the season the deal was made, the picks over the whole
       season they were used in. That is what each side actually received, but it is not one currency, so
       the ledger keeps players and picks in separate columns.</p>
    <p>${L.trades.length - L.graded.length} of ${L.trades.length} trades still cannot be graded at
       all${L.reversed ? `, ${L.reversed} of them because the same players went straight back inside a day —
       a trade undone is not a trade won` : ""}.</p>
    <p>Playoff scoring is excluded on both sides. Six of twelve teams make the playoffs, so counting those
       weeks would reward a trade for the team it was made by rather than the players in it. For the same
       reason a waiver claim needs three regular-season weeks still to run before it is ranked on value:
       ${W.lateSkipped} claims were made too late to judge that way, and are counted in the money spent
       but nowhere else.</p>`;
  host.appendChild(m);
}

let TRADES_STARTED = false;
async function ensureTrades() {
  if (TRADES_STARTED) return;
  TRADES_STARTED = true;
  const host = $("#tradesHost");
  if (!host) return;
  try {
    const txs = await loadTransactions();
    const need = new Set();
    for (const t of txs) {
      for (const k of Object.keys(t.adds || {})) need.add(k);
      for (const k of Object.keys(t.drops || {})) need.add(k);
    }
    await loadPlayerNames(need);
    await loadDraftSlots();
    const L = tradeLedger(txs), W = waiverReport(txs);
    window.__TRADES = L; window.__WAIVERS = W; window.__TX = txs;
    renderTrades(host, L, W);
    document.body.dataset.tradesReady = "1";
  } catch (e) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty",
      `<b>Couldn't load the transaction history</b>${esc(e.message)}<br>Sleeper may be rate-limiting — reload in a minute.`));
    document.body.dataset.tradesReady = "error";
    console.error(e);
  }
}

function panelTrades() {
  const p = el("div", "panel"); p.dataset.panel = "trades";
  p.appendChild(sechead("The trade block",
    "Every trade DFFL has ever made, graded on what the players did afterwards — never on what they did all season. Waivers and FAAB get the same treatment."));
  const host = el("div"); host.id = "tradesHost";
  host.appendChild(el("div", "empty",
    `<b>Reading the transaction history…</b>Five seasons of trades, waiver claims and free-agent adds,
     plus the player-name file Sleeper keeps separately. It is a few megabytes, so it is only ever
     fetched when somebody opens this tab — which you just did.`));
  p.appendChild(host);
  return p;
}

/* ---------------------------------------------------------------- boot */
async function boot() {
  try {
    if (MOCK) await mockInit();
    // Sleeper's state, data/latest.json and the league chain don't depend on
    // one another, so all three requests start together rather than one after
    // another. The league chain never reads DB.state; only loadSeason, below,
    // does, and it runs after the effective week has been applied.
    const stateP = MOCK ? Promise.resolve(null) : jget(`${API}/state/nfl`).catch(() => null);
    const latestP = MOCK ? Promise.resolve(null)
      : fetch("data/latest.json", { cache: "no-cache" })
        .then(r => (r.ok ? r.json() : null)).catch(() => null);
    const chainP = loadChain();
    chainP.catch(() => {}); // still thrown below; this only stops an early "unhandled" report
    DB.state = await stateP;
    // Everything below reads DB.state, so the effective week is applied once,
    // here. A missing or unreadable latest.json changes nothing.
    if (DB.state) {
      const latest = await latestP;
      DB.sleeperState = DB.state;
      DB.state = effectiveState(DB.state, latest);
    }

    const chain = await chainP;
    if (!chain.length) throw new Error("Could not load the league from Sleeper.");
    total = chain.length * 22;
    $("#lgName").textContent = chain[0].name || "League";

    for (const lg of chain) await loadSeason(lg);
    DB.seasons.sort((a, b) => Number(b.season) - Number(a.season));

    const AT = allTime(), RB = recordBook(), H2H = h2hMap(), DIST = scoringDist();
    const ODDS = await oddsModel(), SIM = simulateSeason(ODDS);
    window.__AT = AT; window.__RB = RB; window.__H2H = H2H; window.__DIST = DIST;
    window.__ODDS = ODDS; window.__SIM = SIM;

    const oldest = DB.seasons[DB.seasons.length - 1], newest = DB.seasons[0];
    $("#eyebrow").textContent = `${oldest.season}–${newest.season} · ${chain[0].total_rosters} teams`;
    $("#lgSub").textContent = `${DB.games.length} games on record, and every one of them still counts against you.`;

    const app = $("#app");
    app.appendChild(panelHome(AT, RB, ODDS, SIM));
    app.appendChild(panelScoreboard());
    app.appendChild(panelManagers(AT));
    app.appendChild(panelRecords(RB));
    app.appendChild(panelMatchups(AT));
    await loadBlurbs();
    app.appendChild(panelPower(ODDS, SIM));
    app.appendChild(panelOdds(ODDS, SIM));
    app.appendChild(panelRace());
    app.appendChild(panelDraft());
    app.appendChild(panelTrades());
    app.appendChild(await panelRecaps());

    buildTabs();
    // Deliberately not awaited: the front page paints, then fills itself in.
    ensureHomeWeek();
    $("#loader").hidden = true;
    app.hidden = false;
    // Two ways to name a piece. ?a=<slug> is what the email uses: Gmail proxies
    // every outbound link through google.com/url, and a bare fragment on the end
    // of that is what makes it stop and show a Redirect Notice instead of just
    // going there. A query survives the round trip cleanly. #article/<slug> is
    // what the site itself writes, so in-app links and anything already shared
    // keep working.
    const params = new URLSearchParams(location.search);
    const q = params.get("a"), tab = params.get("t");
    const want = q ? "article/" + q : (tab || location.hash.replace("#", ""));
    if (want.startsWith("article/")) {
      // A link out of the email names a piece. Show the index first so there is
      // something behind the back button, then open the piece over it.
      show("recaps");
      const slug = decodeURIComponent(want.slice("article/".length));
      // Stamp the article's own address back, so a reload of this link lands
      // on the piece rather than dropping the reader on the index.
      articleBySlug(slug).then(a => {
        if (a) openArticle(a);
        else show("recaps");
      });
    } else {
      show(TABS.some(t => t.id === want) ? want : "home");
    }
    $("#footNote").textContent = DB.state ? ` Currently NFL ${DB.state.season}, week ${DB.state.week}.` : "";
    window.__DFFL = {
      DB, AT, RB, DIST, draftAnalysis, winProb, titleOdds, scoringDist,
      ODDS, SIM, oddsModel, simulateSeason, winTotals, buildSchedule, roundRobin,
      americanOdds, impliedProb, roundOdds, addVig, priceMarket, priceBinary, marketHold,
      fmtOdds, futuresMarkets, liveNow: () => LIVE_NOW,
      ODDS_HOLD, ODDS_SIMS, panelOdds, loadADP, adpValue, adpKey, rosterValue,
      ADP_CURVE, W_ROSTER, W_HIST_POST, SHOCK_PRE, SHOCK_POST,
      powerRankings, weeklyScores, loadBlurbs, blurbFor, panelPower, moveHTML, rankSpark, projectedBoard,
      weekMovers, panelRecaps, allPowerRankings, keepersOf, keepersFor, loadStatedKeepers,
      preDraftOwners, playerModal, openPlayer, posClass,
      articleCard, articleBlock, articleTeaser, openArticle, articleBySlug, coverHTML, bracketHTML,
      coverSVG, coverKind, COVER_PALETTE,
      POWER_W, FORM_WEEKS,
      ensureRace, raceData, raceAsOf, raceOdds, leverageBoard, seedField, pairSchedule,
      weekIsFinal, allWeeks, effectiveState,
      loadInjuries, injPlayer, availability, livePosterior, weeksOf, liveState,
      injuryDetail, returnLabel,
      injuryPlan, injuryMult, injuryHurtMap, injuryLabel, injuryLabelText, injuryCharged, injuryFuturesNote,
      approxKickoff, lastNameOf, gameCardHTML,
      ensureLiveOdds, INJ_AVAIL, REPLACEMENT, INJ_FLOOR, INJ_KEY,
      liveOnce, recapsOnce, ensureHomeWeek, weekStrip, moversRow, boardMovers, injuryStrip,
      loadNflGames, gameRemaining, loadRostered, slotShares, lineupState, liveWinProb,
      liveWeekBoard, refreshLive, startLivePolling, liveSignature, onLive, emitLive, GAME_LEFT,
      boardAsOf, pricedWeeks,
      gameLine, gameLinesData, ensureGameLines, paintGameLines, oddsHistoryOnce, linePath, coverResult,
      fmtSpread, halfPt,
      renderRace, raceEmpty,
      RACE_SIMS, LEVERAGE_SIMS,
      ensureTrades, loadTransactions, loadPlayerNames, loadDraftSlots, tradeLedger, waiverReport,
      gradeTrade, ptsFrom, verdictOf, resolvePick, seasonPlayed, markReversals,
      TRADE_EVEN, TRADE_CLEAR, TRADE_LOPSIDED, FAAB_MIN,
    };
    document.body.dataset.ready = "1";
  } catch (e) {
    const l = $("#loader");
    l.innerHTML = "";
    l.appendChild(el("div", "err", `<b>Couldn't load the league.</b><br>${esc(e.message)}<br>
      <span style="color:#d9b7b7;font-size:13px">If this keeps happening Sleeper may be rate-limiting — wait a minute and refresh.</span>`));
    document.body.dataset.ready = "error";
    console.error(e);
  }
}
boot();
</script>
