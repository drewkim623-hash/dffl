<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DFFL — League Record Book</title>
<meta name="description" content="All-time records, champions, and weekly recaps for the DFFL fantasy football league.">
<meta name="theme-color" content="#0b0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"></noscript>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0f'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='16' font-weight='800' fill='%233987e5' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --plane:#0b0b0f; --surface:#17171c; --raised:#1f1f26; --hover:#262630;
    --ink:#ffffff; --ink-2:#c6c5cf; --muted:#8b8a95;
    --grid:#2a2a33; --ring:rgba(255,255,255,.09);
    --blue:#3987e5; --red:#e66767; --aqua:#199e70; --gold:#c98500; --violet:#9085e9;
    --good:#0ca30c; --crit:#d03b3b; --mid:#383840;
    --plus:#3ad07f; --hold:#c98500;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --r:14px; --rs:10px;
    --pad:max(16px,env(safe-area-inset-left));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* overflow-x on html goes to the viewport; on body it has to be clip, not hidden,
     or body becomes a scroll container and the sticky tab bar scrolls away with it. */
  html,body{margin:0;padding:0}
  html{overflow-x:hidden}
  body{overflow-x:clip}
  body{
    background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 var(--pad)}
  button{font:inherit;color:inherit}

  /* ============ hero ============ */
  header.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--grid);padding:26px 0 22px}
  header.hero::before{
    content:"";position:absolute;inset:-60% 40% 40% -20%;
    background:radial-gradient(circle at 30% 40%,rgba(57,135,229,.20),transparent 62%);pointer-events:none}
  header.hero::after{
    content:"";position:absolute;inset:-40% -20% 30% 45%;
    background:radial-gradient(circle at 70% 30%,rgba(144,133,233,.15),transparent 62%);pointer-events:none}
  .hero .wrap{position:relative}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1.name{
    font-size:clamp(38px,10vw,64px);margin:4px 0 2px;font-weight:600;letter-spacing:-.035em;line-height:.98;
    background:linear-gradient(96deg,#fff 20%,var(--blue) 70%,var(--violet) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--ink-2);font-size:15px;margin:0}

  /* ============ nav ============ */
  nav.tabs{position:sticky;top:0;z-index:40;background:rgba(11,11,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--grid)}
  .tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
  .tabrow::-webkit-scrollbar{display:none}
  nav.tabs .wrap{position:relative}
  nav.tabs .wrap::after{content:"";position:absolute;top:0;bottom:0;right:var(--pad);width:32px;pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--plane));opacity:0;transition:opacity .14s}
  nav.tabs .wrap.more::after{opacity:1}
  .tabrow button{
    background:transparent;border:1px solid transparent;border-radius:999px;color:var(--muted);
    font-weight:500;font-size:14.5px;padding:8px 15px;cursor:pointer;white-space:nowrap;transition:.14s}
  .tabrow button:hover{color:var(--ink-2);background:var(--raised)}
  .tabrow button[aria-selected="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}

  main{padding:22px 0 90px;min-height:60vh}
  .panel[hidden]{display:none}

  .sechead{margin:34px 0 12px}
  .sechead:first-child{margin-top:0}
  .sechead h2{font-size:23px;margin:0;letter-spacing:-.02em;font-weight:600}
  .sechead p{margin:5px 0 0;color:var(--muted);font-size:14px;max-width:70ch;line-height:1.55}

  /* ============ stat tiles ============ */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
  .tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:13px 15px}
  .tile .l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
  .tile .n{font-size:12.5px;color:var(--ink-2);margin-top:2px}

  /* ============ champ banner ============ */
  .champbar{
    display:flex;align-items:center;gap:15px;margin-top:18px;padding:16px 18px;
    background:linear-gradient(100deg,rgba(201,133,0,.16),rgba(201,133,0,.03) 60%,transparent);
    border:1px solid rgba(201,133,0,.35);border-radius:var(--r)}
  .champbar .ring{width:54px;height:54px;border-radius:50%;flex:none;border:2px solid var(--gold);
    display:grid;place-items:center;overflow:hidden;background:var(--raised);font-weight:600;color:var(--gold)}
  .champbar .ring img{width:100%;height:100%;object-fit:cover}
  .champbar .who{min-width:0}
  .champbar .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .champbar .nm{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .champbar .tm{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ============ manager grid ============ */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .mcard{
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:14px;
    text-align:left;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:9px;width:100%}
  .mcard:hover{background:var(--raised);border-color:rgba(57,135,229,.5);transform:translateY(-2px)}
  .mcard .top{display:flex;align-items:center;gap:10px;min-width:0}
  .mcard .nm{font-weight:600;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .mcard .tm{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .mcard .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .mcard .rec{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .mcard .pc{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mcard .go{font-size:12px;color:var(--blue);font-weight:500;margin-top:auto}

  .av{width:36px;height:36px;border-radius:50%;background:var(--raised);border:1px solid var(--ring);
      display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);flex:none;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .av.sm{width:28px;height:28px;font-size:11px}
  .av.lg{width:66px;height:66px;font-size:20px}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:999px;border:1px solid var(--ring);white-space:nowrap}
  .badge.gold{color:var(--gold);border-color:rgba(201,133,0,.45);background:rgba(201,133,0,.10)}
  .badge.blue{color:var(--blue);border-color:rgba(57,135,229,.45);background:rgba(57,135,229,.10)}
  .badge.red{color:var(--red);border-color:rgba(230,103,103,.45);background:rgba(230,103,103,.10)}

  /* ============ responsive row-cards ============ */
  .rows{display:flex;flex-direction:column;gap:7px}
  .rowc{
    display:grid;grid-template-columns:30px auto 1fr;align-items:center;gap:11px;
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);padding:11px 13px;
    cursor:pointer;transition:.13s;text-align:left;width:100%}
  .rowc:hover{background:var(--raised);border-color:rgba(57,135,229,.4)}
  .rowc .pos{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
  .rowc .id{min-width:0}
  .rowc .id .n{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rowc .id .s{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowc .stats{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
  .chip{background:var(--raised);border-radius:7px;padding:5px 9px;text-align:center;min-width:56px}
  .chip .cv{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;display:block}
  .chip .cl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-top:1px;display:block}
  .chip.pos-v .cv{color:var(--good)} .chip.neg-v .cv{color:var(--crit)}
  @media(max-width:620px){
    .rowc{grid-template-columns:26px auto 1fr;grid-template-areas:"pos av id" "stats stats stats";gap:8px 9px}
    .rowc .pos{grid-area:pos} .rowc .nmcell{grid-area:av} .rowc .id{grid-area:id}
    .rowc .stats{grid-area:stats;justify-content:flex-start;margin-top:2px}
    .chip{min-width:0;flex:1}
  }

  /* ============ bars ============ */
  .barbox{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .bars{display:grid;gap:8px}
  .bar{display:grid;grid-template-columns:minmax(88px,132px) 1fr 56px;align-items:center;gap:10px;font-size:13.5px}
  .bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .bar .track{display:block;height:17px;background:var(--raised);border-radius:0 5px 5px 0;overflow:hidden}
  .bar .fill{display:block;height:100%;min-width:3px;border-radius:0 5px 5px 0;background:var(--blue)}
  .bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .divbar{display:grid;grid-template-columns:minmax(88px,132px) 1fr 56px;align-items:center;gap:10px;font-size:13.5px}
  .divbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .divbar .track{display:block;height:17px;position:relative;background:var(--raised);border-radius:4px}
  .divbar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--mid);left:50%}
  .divbar .fill{position:absolute;top:0;bottom:0;border-radius:4px}
  .divbar .v{text-align:right;font-variant-numeric:tabular-nums}

  /* ============ trophies ============ */
  .trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .trophy{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
  .trophy::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),rgba(201,133,0,.2))}
  .trophy .yr{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .trophy .win{display:flex;align-items:center;gap:11px;margin:11px 0 3px}
  .trophy .win .nm{font-size:21px;font-weight:600;letter-spacing:-.02em}
  .trophy dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
  .trophy dt{color:var(--muted)} .trophy dd{margin:0;text-align:right;font-weight:600}
  .trophy dd.last{color:var(--red)}

  /* ============ record cards ============ */
  .recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:11px}
  .rec{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .rec .l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .rec .v{font-size:32px;font-weight:600;letter-spacing:-.03em;margin:6px 0 3px;font-variant-numeric:tabular-nums}
  .rec .w{font-size:14.5px;font-weight:500}
  .rec .c{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .rec.up .v{color:var(--blue)} .rec.down .v{color:var(--red)}

  /* ============ tables ============ */
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--raised)}
  td.num,th.num{font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
  th:first-child{background:var(--raised);z-index:2}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td,tbody tr:hover td:first-child{background:var(--hover)}
  .nmcell{display:flex;align-items:center;gap:8px}
  .pos-t{color:var(--good)} .neg-t{color:var(--crit)}

  /* ============ h2h ============ */
  .h2h td.cell{text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;padding:8px 6px;border:1px solid var(--plane)}
  .h2h td.self{background:var(--raised);color:var(--muted)}
  .h2h th.rot{font-size:11px;letter-spacing:0;text-transform:none;padding:9px 5px}
  .legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:11px;flex-wrap:wrap}
  .ramp{display:flex;height:11px;width:150px;border-radius:3px;overflow:hidden;border:1px solid var(--ring)}
  .ramp i{flex:1}

  /* ============ compare ============ */
  .compare{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .cpick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .cpick .vs{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em}
  .cout{margin-top:15px;padding-top:15px;border-top:1px solid var(--grid)}
  .cscore{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
  .cscore .big{font-size:42px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
  .cscore .dash{color:var(--muted);font-size:19px;font-weight:600}
  .cscore .lbl{font-size:12.5px;color:var(--muted);margin-top:5px}
  .cmeta{display:flex;gap:9px;justify-content:center;margin-top:14px;flex-wrap:wrap}

  /* ============ profile ============ */
  .back{background:var(--raised);border:1px solid var(--ring);border-radius:999px;padding:7px 15px;
    font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink-2);margin-bottom:16px;transition:.13s}
  .back:hover{background:var(--hover);color:var(--ink)}
  .phead{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:6px}
  .phead .nm{font-size:clamp(27px,7vw,38px);font-weight:600;letter-spacing:-.03em;line-height:1.05}
  .phead .tm{color:var(--ink-2);font-size:14.5px}
  .pbadges{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

  /* ============ recaps ============ */
  .recap{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:17px 18px;margin-bottom:11px}
  .recap h3{margin:0 0 5px;font-size:17.5px;letter-spacing:-.015em;font-weight:600}
  .recap .sc{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:10px;font-weight:600}
  .recap p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.65}
  .wkhead{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
  .wkhead h3{margin:0;font-size:20px;font-weight:600}
  .wkhead span{color:var(--muted);font-size:13px}

  /* ============ glossary ============ */
  details.gloss{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);margin-top:22px}
  details.gloss summary{padding:14px 16px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
  details.gloss summary::-webkit-details-marker{display:none}
  details.gloss summary::before{content:"? ";color:var(--blue);font-weight:600}
  details.gloss[open] summary{border-bottom:1px solid var(--grid)}
  .gitems{padding:12px 16px 16px;display:grid;gap:11px}
  .gitem b{display:block;font-size:13.5px;margin-bottom:2px}
  .gitem span{font-size:13.5px;color:var(--muted);line-height:1.55}

  /* ============ scoreboard ============ */
  .sbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:11px}
  .game{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden}
  .gside{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px;
    width:100%;background:transparent;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:.13s}
  .gside:hover{background:var(--hover)}
  .gside.win:hover{background:linear-gradient(90deg,rgba(57,135,229,.20),var(--hover))}
  .gside + .gside{border-top:1px solid var(--grid)}
  .gside.win{background:linear-gradient(90deg,rgba(57,135,229,.11),transparent)}
  .gside .gn{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gside .gt{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .gside .gp{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .gside.win .gp{color:var(--blue)}
  .gside.lose .gn,.gside.lose .gp{color:var(--ink-2)}
  .gfoot{padding:8px 14px;background:var(--raised);font-size:11.5px;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .gfoot a{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap}
  .gfoot a:hover{text-decoration:underline}
  /* A week still being played: ahead is not won, so it is never the win blue. */
  .gside.lead{background:linear-gradient(90deg,rgba(201,133,0,.12),transparent)}
  .gside.lead:hover{background:linear-gradient(90deg,rgba(201,133,0,.20),var(--hover))}
  .gside.lead .gp{color:var(--gold)}
  .livenote{background:rgba(201,133,0,.09);border:1px solid rgba(201,133,0,.32);
    border-radius:var(--rs);padding:11px 13px;margin:0 0 12px;font-size:12.5px;
    color:var(--ink-2);line-height:1.55}
  .livenote b{color:var(--gold)}
  .livedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);
    margin-right:6px;vertical-align:middle;animation:livepulse 1.6s ease-in-out infinite}
  @keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.livedot{animation:none}}
  /* ---- the live odds board ---- */
  .asofbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 10px}
  .asofbar .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .asofbar select{background:var(--surface);color:var(--ink);border:1px solid var(--ring);
    border-radius:var(--rs);padding:7px 10px;font:inherit;font-size:13px;font-weight:600}
  .asofbar .rewound{font-size:11.5px;color:var(--gold)}
  .livestrip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  /* Direct children only. Each tile holds a nested <span class="k"> label, and an
     unscoped descendant selector gave that label its own border and a 120px
     flex-basis too — which in a column container stretched it into an empty box
     with the value pushed out below it. */
  .livestrip > span{background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);
    padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1 1 120px}
  .livestrip .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .livestrip b{font-size:16px;font-variant-numeric:tabular-nums}
  .srcnote{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 12px;
    padding:9px 12px;background:var(--raised);border-radius:var(--rs);border:1px solid var(--ring)}
  .srcnote b{color:var(--ink-2)}
  .orow.live .was{display:block;font-size:11px;color:var(--muted);margin-top:2px;
    font-variant-numeric:tabular-nums}
  .mv{margin-left:6px;font-weight:600}
  .mv.up{color:var(--plus)} .mv.down{color:var(--red)} .mv.flat{color:var(--muted)}
  .irow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
    padding:11px 14px;border-top:1px solid var(--grid)}
  .irow.none{display:block;color:var(--muted);font-size:13px;line-height:1.55}
  .irow .plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .irow .ip{display:inline-flex;align-items:center;gap:5px;background:var(--raised);
    border:1px solid var(--ring);border-radius:999px;padding:2px 8px;font-size:11.5px}
  .irow .ip b{font-weight:600}
  .irow .ip i{font-style:normal;color:var(--muted);font-size:11px}
  .irow .ip em{font-style:normal;color:var(--ink-2);font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.03em;padding-left:6px;margin-left:1px;
    border-left:1px solid var(--grid)}
  .irow .ip[title]{cursor:help}
  .irow .st{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .st-questionable{color:var(--gold)} .st-doubtful{color:#e09a3c}
  .st-out,.st-ir,.st-pup,.st-sus,.st-na,.st-dnr,.st-cov{color:var(--red)}
  .irow .cost{text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
    color:var(--ink-2);display:flex;flex-direction:column;line-height:1.15}
  .irow .cost.bite{color:var(--red)}
  .irow .cost .k{font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted)}
  .notice.live p:first-of-type{margin-top:0}
  /* ---- the front page's week ---- */
  .wskel{padding:26px;text-align:center;color:var(--muted);font-size:13px;
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);margin-bottom:14px}
  .wstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;margin-bottom:6px}
  .wgame{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--ring);
    border-radius:var(--rs);padding:0;overflow:hidden;cursor:pointer;font:inherit;color:inherit}
  .wgame:hover{border-color:var(--grid);background:var(--hover)}
  .ws{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:8px 11px}
  .ws + .ws{border-top:1px solid var(--grid)}
  .ws.win{background:linear-gradient(90deg,rgba(57,135,229,.11),transparent)}
  .ws.lead{background:linear-gradient(90deg,rgba(201,133,0,.12),transparent)}
  .ws .wn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ws .wp{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
  .ws.win .wp{color:var(--blue)} .ws.lead .wp{color:var(--gold)}
  .ws.lose .wn,.ws.lose .wp{color:var(--ink-2)}
  .wf{display:block;padding:5px 11px;background:var(--raised);font-size:11px;color:var(--muted)}
  .movers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mcol{background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);overflow:hidden}
  .mh{padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);background:var(--raised)}
  .mcol.up .mh{color:var(--plus)} .mcol.down .mh{color:var(--red)}
  .mrow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;width:100%;
    padding:9px 12px;background:none;border:0;border-top:1px solid var(--grid);cursor:pointer;
    font:inherit;color:inherit;text-align:left}
  .mrow:hover{background:var(--hover)}
  .mrow .mn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .mrk{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mrow .mdl{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
  .mcol.up .mdl{color:var(--plus)} .mcol.down .mdl{color:var(--red)}
  .mnone{padding:11px 12px;color:var(--muted);font-size:12.5px}
  .bmovers{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:9px}
  .bmv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);
    padding:10px 12px;cursor:pointer;font:inherit;color:inherit;text-align:left}
  .bmv:hover{background:var(--hover)}
  .bmv .bn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bmv .bp{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;line-height:1.1;text-align:right}
  .bmv .bp .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .bmv .bd{grid-column:1/-1;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .bmv.up .bd{color:var(--plus)} .bmv.down .bd{color:var(--red)}
  .istrip{display:flex;flex-wrap:wrap;gap:8px}
  .ichip{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:6px 13px 6px 6px;
    cursor:pointer;font:inherit;color:inherit}
  .ichip:hover{background:var(--hover)}
  .ichip .in{font-weight:600;font-size:12.5px}
  .ichip .ipl{grid-column:2;font-size:11px;color:var(--muted)}
  .tlist.home{margin-bottom:4px}
  /* ---- live win probability ---- */
  .wchip{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
    padding:2px 6px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
  .wchip.ahead{background:rgba(58,208,127,.14);color:var(--plus)}
  .wchip.behind{background:rgba(230,103,103,.12);color:var(--red)}
  .wchip.done{background:var(--raised);color:var(--muted)}
  .gside{grid-template-columns:auto 1fr auto auto}
  .ws{grid-template-columns:auto 1fr auto auto}
  /* A timestamp, not a hold — the two must not share a class, because "every
     board states its hold" is a real check and a clock is not an answer to it. */
  .board.live .bhead .stamp{background:rgba(201,133,0,.14);color:var(--gold);
    border:1px solid rgba(201,133,0,.3);border-radius:999px;padding:3px 9px;
    font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
  .lrow{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--grid);
    border-top:1px solid var(--grid)}
  .lside{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;
    padding:10px 12px;background:var(--surface);row-gap:2px}
  .lside.up{background:linear-gradient(180deg,rgba(58,208,127,.07),var(--surface))}
  .lside .ln{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lside .lpts{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  .lside .wchip{grid-column:3}
  .lside .lleft{grid-column:1/-1;font-size:11px;color:var(--muted)}
  .lfoot{padding:9px 13px;background:var(--raised);font-size:11px;color:var(--muted);line-height:1.5}
  @media (max-width:520px){
    .lrow{grid-template-columns:1fr}
    .gside{grid-template-columns:auto 1fr auto}
    .gside .wchip{grid-column:2;justify-self:start}
    .ws{grid-template-columns:auto 1fr auto}
    .ws .wchip{display:none}
  }
  @media (max-width:520px){
    .movers{grid-template-columns:1fr}
    .bmovers{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .livestrip > span{flex:1 1 calc(50% - 8px)}
    .irow{grid-template-columns:auto 1fr;row-gap:6px}
    .irow .cost{grid-column:2;text-align:left;flex-direction:row;align-items:baseline;gap:6px}
  }
  .pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin-bottom:14px}

  /* ============ awards ============ */
  .awgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .awcard{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .awcard > .yr{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
  .aw{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 0}
  .aw + .aw{border-top:1px solid var(--grid)}
  .aw .t{font-size:13px;font-weight:600}
  .aw .d{font-size:11.5px;color:var(--muted);display:block;line-height:1.4}
  .aw .n{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .aw .ic{font-size:17px;width:22px;text-align:center}

  /* ============ odds board ============ */
  .notice{border:1px solid rgba(201,133,0,.42);background:rgba(201,133,0,.07);border-radius:var(--r);
    padding:14px 16px;margin-bottom:20px}
  .notice .nt{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--hold);font-weight:600;margin-bottom:7px}
  .notice p{margin:0 0 7px;font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:76ch}
  .notice p:last-child{margin-bottom:0}
  .notice b{color:var(--ink);font-weight:600}

  .board{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
    overflow:hidden;margin-bottom:11px}
  .bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 15px;background:var(--raised);border-bottom:1px solid var(--grid)}
  .bhead .bt{font-size:14.5px;font-weight:600;letter-spacing:-.01em;min-width:0}
  .bhead .bs{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-top:2px;line-height:1.4}
  .bhead .hold{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--hold);border:1px solid rgba(201,133,0,.4);background:rgba(201,133,0,.09);
    border-radius:6px;padding:4px 7px;white-space:nowrap;font-weight:600;flex:none}

  .orow{display:grid;grid-template-columns:20px auto minmax(0,1fr) auto;align-items:center;gap:10px;
    padding:9px 15px;width:100%;background:transparent;border:0;border-top:1px solid var(--grid);
    text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .13s}
  .board .orow:first-of-type{border-top:0}
  .orow:hover{background:var(--hover)}
  .orow:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .orow .rk{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
  .orow .who{min-width:0}
  .orow .who .n{font-weight:600;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .orow .who .s{font-size:11.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* the price tile — a posted number, and underneath it the number the book hides */
  .price{display:block;min-width:74px;border:1px solid var(--ring);background:var(--raised);
    border-radius:9px;padding:6px 9px;text-align:center;transition:border-color .13s,background .13s}
  .price .o{font-family:var(--mono);font-size:15.5px;font-weight:600;line-height:1.15;display:block;
    font-variant-numeric:tabular-nums}
  .price.plus .o{color:var(--plus)}
  .price .tp{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}
  .price .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    font-weight:600;display:block;margin-bottom:3px}
  .orow:hover .price{border-color:rgba(57,135,229,.55);background:var(--hover)}
  .prices{display:flex;gap:7px}
  @media(max-width:560px){
    .orow.two{grid-template-columns:20px auto minmax(0,1fr);grid-template-areas:"rk av who" "pr pr pr"}
    .orow.two .rk{grid-area:rk} .orow.two .avcell{grid-area:av} .orow.two .who{grid-area:who}
    .orow.two .prices{grid-area:pr;margin-top:3px}
    .orow.two .prices .price{flex:1;min-width:0}
  }
  @media(prefers-reduced-motion:reduce){.orow,.price{transition:none}}

  /* game lines — this week's matchups posted like a sportsbook's game board */
  .glnav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
  .glnav button{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;
    background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:6px 14px}
  .glnav button:hover{background:var(--hover);color:var(--ink)}
  .glnav button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
  .glgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:10px;padding:12px}
  .glcard{background:var(--raised);border:1px solid var(--ring);border-radius:var(--rs);padding:10px 12px;min-width:0}
  .glcard .glst{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);
    font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
  .glcard .glst .live{color:var(--gold)}
  .glrow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,74px));gap:6px;align-items:center;padding:3px 0}
  .glrow.glhd{padding:0;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .glrow.glhd span{text-align:center}
  .glwho{display:flex;align-items:center;gap:7px;min-width:0}
  .glwho .n{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .glwho .sc{margin-left:auto;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .glwho.won .n,.glwho.won .sc{color:var(--ink)} .glwho.lost .n,.glwho.lost .sc{color:var(--muted)}
  .glbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42px;min-width:0;
    border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:4px 2px;text-align:center}
  .glbtn .l{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .glbtn .o{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
  .glbtn .o.plus{color:var(--plus)}
  .glbtn .r{font-size:11px;color:var(--muted);font-weight:700}
  .glpath{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:7px;
    border-top:1px solid var(--grid);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .glpath b{color:var(--ink-2)}
  .glpath svg{flex:none;display:block}
  .glres{margin-top:6px;font-size:12px;color:var(--ink-2)}
  .inj-tag{font-size:11px;color:var(--muted);line-height:1.35;margin:-1px 0 3px;overflow-wrap:anywhere}
  .glres .cv{font-weight:800} .glres .cv.yes{color:var(--plus)} .glres .cv.no{color:var(--red)} .glres .cv.push{color:var(--muted)}
  .glbye{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 4px}
  details.gloss.glhow{margin:0 12px 12px}
  .glhow .gitems{padding:4px 16px 12px}
  .glhow p{font-size:12px;color:var(--ink-2);line-height:1.55;margin:6px 0}
  .glhow code{font-family:var(--mono);font-size:11px}
  @media(max-width:420px){
    .glgrid{padding:8px} .glcard{padding:9px 8px}
    .glrow{grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,62px));gap:4px}
    .glbtn .l{font-size:11px} .glbtn .o{font-size:11.5px}
    .glwho .av{display:none}
    /* the score drops under the name so the name gets the whole cell */
    .glwho{display:grid;grid-template-columns:minmax(0,1fr);gap:1px}
    .glwho .sc,.glwho.won .sc{margin-left:0;font-size:10.5px;color:var(--muted)}
  }

  .bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:11px}

  .mode{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin:0 0 16px}
  .mode .pill{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap;flex:none}
  .mode .pill.pre{color:var(--hold);border:1px solid rgba(201,133,0,.45);background:rgba(201,133,0,.10)}
  .mode .pill.post{color:var(--plus);border:1px solid rgba(58,208,127,.42);background:rgba(58,208,127,.10)}
  .mode .what{font-size:13.5px;color:var(--ink-2);line-height:1.55;min-width:0}

  .method{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px;margin-top:22px}
  .method h3{margin:0 0 4px;font-size:15px;font-weight:600}
  .method p{margin:0 0 11px;font-size:13.5px;color:var(--ink-2);line-height:1.6;max-width:78ch}
  .method p:last-child{margin-bottom:0}
  .method code{font-family:var(--mono);font-size:12.5px;background:var(--raised);border-radius:5px;padding:1px 5px;color:var(--ink)}
  .method dl{margin:0 0 13px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
  .method dt{color:var(--muted)} .method dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ============ futures markets — sportsbook-style browser; every rule is scoped under .fxm ============ */
  .fxm{margin:0 0 6px;min-width:0}
  .fxm [hidden]{display:none!important}
  .fxm-chips{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;margin:0 0 10px;padding:2px 1px 4px}
  .fxm-chips::-webkit-scrollbar{display:none}
  .fxm-chip{flex:none;font:inherit;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap;
    background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:7px 13px;scroll-snap-align:start;
    transition:background .13s,color .13s}
  .fxm-chip:hover{background:var(--hover);color:var(--ink)}
  .fxm-chip[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
  .fxm-chip:focus-visible,.fxm-seg button:focus-visible,.fxm-sel select:focus-visible,.fxm-links button:focus-visible,
  .fxm-prof:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .fxm-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px}
  .fxm-seg{display:inline-flex;border:1px solid var(--ring);border-radius:9px;overflow:hidden;flex:none}
  .fxm-seg button{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--surface);
    border:0;padding:7px 11px;cursor:pointer}
  .fxm-seg button+button{border-left:1px solid var(--ring)}
  .fxm-seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:inset 0 -2px 0 var(--blue)}
  .fxm-sel{display:inline-flex;align-items:center;gap:7px;min-width:0;font-size:10.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .fxm-sel select{font:inherit;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);
    background:var(--surface);border:1px solid var(--ring);border-radius:9px;padding:6px 8px;min-width:0;max-width:100%}
  .fxm-bar [disabled],.fxm-src [disabled]{opacity:.45;cursor:default}
  .fxm-src{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 0 10px}
  .fxm-srctxt{margin:0;flex:1 1 240px;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.5}
  .fxm-srctxt b{color:var(--ink-2);font-weight:700}
  .fxm-lineseg button[data-line="live"][aria-pressed="true"]{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
  .fxm-srctxt button{font:inherit;font-weight:700;color:var(--blue);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
  .fxm-blurb{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.55;max-width:78ch}
  .fxm .price{border-radius:8px;background:var(--surface);min-height:42px;display:flex;flex-direction:column;justify-content:center}
  .fxm .price .o{color:var(--blue)}
  .fxm .price.plus .o{color:var(--plus)}
  .fxm-th{display:flex;align-items:center;gap:10px;min-width:0}
  .fxm-tn{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .fxm-prof{flex:none;font:inherit;font-size:12px;font-weight:700;color:var(--blue);background:transparent;
    border:1px solid rgba(57,135,229,.45);border-radius:8px;padding:5px 9px;cursor:pointer}

  .fxm-trow .s{font-size:11.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .fxm-links{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:2px 0 0;font-size:12px;color:var(--muted)}
  .fxm-links button{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;
    background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:6px 12px}

  @media(max-width:560px){

    .fxm-sel select{flex:1;width:100%}

    .fxm-trow.two .prices .price{flex:1;min-width:0}
  }
  @media(prefers-reduced-motion:reduce){.fxm-chip{transition:none}}

  /* ============ draft board ============ */
  .pos-dot{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:19px;
    border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:0 5px;flex:none;
    background:var(--raised);color:var(--ink-2);border:1px solid var(--ring)}
  .pos-dot.qb{color:#b3a9ff;border-color:rgba(144,133,233,.45);background:rgba(144,133,233,.13)}
  .pos-dot.rb{color:#3fc79a;border-color:rgba(25,158,112,.45);background:rgba(25,158,112,.13)}
  .pos-dot.wr{color:#7fb4f2;border-color:rgba(57,135,229,.45);background:rgba(57,135,229,.13)}
  .pos-dot.te{color:#e0a63c;border-color:rgba(201,133,0,.45);background:rgba(201,133,0,.13)}
  .pos-dot.kk{color:var(--muted)}
  .pos-dot.def{color:#f09090;border-color:rgba(230,103,103,.45);background:rgba(230,103,103,.13)}

  .dboard{display:grid;gap:1px;background:var(--grid);padding:1px;min-width:max-content}
  .dboard .bh{background:var(--raised);padding:8px 7px;font-size:11px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-align:center}
  .dboard .bh.corner{background:var(--raised)}
  .dboard .brd{background:var(--raised);display:grid;place-items:center;font-size:11.5px;font-weight:600;
    color:var(--muted);font-variant-numeric:tabular-nums}
  .dboard .bc{background:var(--surface);border:0;border-left:3px solid var(--mid);padding:7px 8px;
    text-align:left;cursor:pointer;font:inherit;color:inherit;display:grid;gap:1px;transition:background .12s;
    min-width:0}
  .dboard .bc:hover{background:var(--hover)}
  .dboard .bc:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .dboard .bc.empty{background:var(--plane);border-left-color:transparent;cursor:default}
  .dboard .bc .no{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .dboard .bc .no .k{color:var(--gold);font-weight:600}
  .dboard .bc .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dboard .bc .mt{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dboard .bc .via,.viax{font-size:11px;color:var(--violet);font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;display:block;letter-spacing:.02em}
  .dboard .bc.traded{background:linear-gradient(180deg,rgba(144,133,233,.10),transparent 70%)}
  .viax{display:inline;border:1px solid rgba(144,133,233,.45);background:rgba(144,133,233,.10);
    border-radius:5px;padding:2px 7px;font-size:11px}
  .dboard .bc.qb{border-left-color:#9085e9} .dboard .bc.rb{border-left-color:#199e70}
  .dboard .bc.wr{border-left-color:#3987e5} .dboard .bc.te{border-left-color:#c98500}
  .dboard .bc.def{border-left-color:#e66767} .dboard .bc.kk{border-left-color:var(--mid)}

  .mgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
  .dcard{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden}
  .dh{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--raised);
    border-bottom:1px solid var(--grid)}
  .dh .n{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dh .tot{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;flex:none}
  .dpicks{display:grid}
  .dp{display:grid;grid-template-columns:20px 34px minmax(0,1fr) auto;align-items:center;gap:8px;
    padding:7px 12px;background:transparent;border:0;border-top:1px solid var(--grid);text-align:left;
    font:inherit;color:inherit;cursor:pointer;transition:background .12s}
  .dpicks .dp:first-child{border-top:0}
  .dp:hover{background:var(--hover)}
  .dp .rd{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .dp .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dp .nm .k{color:var(--gold);font-size:11px;font-weight:600}
  .dp .pts{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* ============ player card ============ */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);
    display:grid;place-items:center;padding:16px}
  .mbox{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);width:min(560px,100%);
    max-height:88vh;overflow:auto;padding:18px 20px 20px;position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .mx{position:absolute;top:10px;right:12px;background:transparent;border:0;color:var(--muted);
    font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
  .mx:hover{color:var(--ink);background:var(--raised)}
  .mhead{display:flex;align-items:center;gap:11px;padding-right:30px}
  .mhead .who{min-width:0}
  .mhead .n{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
  .mhead .s{font-size:12.5px;color:var(--muted);margin-top:2px}
  .mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:15px 0 4px}
  .ms{background:var(--raised);border-radius:9px;padding:9px 11px}
  .ms b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ms span{font-size:11px;color:var(--muted);line-height:1.3;display:block;margin-top:1px}
  .wkchart{display:flex;align-items:flex-end;gap:3px;height:104px;margin:14px 0 0}
  .wkchart .wk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    height:100%;gap:3px;min-width:0}
  .wkchart .bar{display:block;width:100%;background:var(--blue);border-radius:2px 2px 0 0}
  .wkchart .wk.post .bar{background:var(--mid)}
  .wkchart .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mnote{font-size:12.5px;color:var(--muted);line-height:1.55;margin:12px 0 0}
  .mempty{background:var(--raised);border-radius:9px;padding:18px;text-align:center;color:var(--muted);
    font-size:13.5px;margin-top:15px}

  /* ============ article index ============ */
  .tlist{display:grid;gap:12px;margin-bottom:8px}
  .teaser{display:grid;grid-template-columns:minmax(0,264px) minmax(0,1fr);gap:0;
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden;
    text-align:left;font:inherit;color:inherit;cursor:pointer;transition:.14s;width:100%;padding:0}
  .teaser:hover{border-color:rgba(57,135,229,.55);transform:translateY(-2px)}
  .teaser.op:hover{border-color:rgba(230,103,103,.55)}
  .teaser:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .teaser .tbody{padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:5px}
  .teaser h3{margin:2px 0 0;font-size:clamp(19px,2.4vw,25px);line-height:1.12;letter-spacing:-.025em;
    font-weight:600;text-wrap:balance}
  .tdek{margin:3px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2);max-width:58ch}
  .teaser .aby{margin-top:auto;padding-top:9px}
  .teaser .more{color:var(--blue);font-weight:600}
  .teaser.op .more{color:var(--red)}
  @media(max-width:620px){
    .teaser{grid-template-columns:1fr}
    .teaser h3{font-size:20px}
  }

  /* ============ cover plate ============ */
  /* The art is an SVG drawn by coverSVG(); the ratio is fixed so nothing moves as
     headshots load or fail. --fw/--fo/--fp (headshot width, overlap, right inset, as
     a share of the width) must match COVER_GEOM in the script. */
  .cover{position:relative;overflow:hidden;width:100%;aspect-ratio:8/5;background:var(--raised);
    --fw:17%;--fo:4%;--fp:4.5%}
  .cover svg{display:block;width:100%;height:100%}
  .cover .faces{position:absolute;top:0;left:0;width:100%;aspect-ratio:8/5;
    display:flex;align-items:center;justify-content:flex-end}
  .cover .faces img{width:var(--fw);aspect-ratio:1;height:auto;border-radius:50%;object-fit:cover;
    object-position:top center;border:2px solid rgba(255,255,255,.22);margin-left:calc(-1 * var(--fo));
    background:var(--raised);box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .cover .faces img:last-child{margin-right:var(--fp)}
  /* Four on a card go two by two. Grid items resolve % margins against their own cell,
     so the cluster is sized in cqw (a share of the cover's width), same numbers as above. */
  .cover:has(.faces.two){container-type:inline-size}
  .cover .faces.two{display:grid;grid-template-columns:auto auto;justify-content:end;align-content:center;
    padding-right:4.5cqw}
  .cover .faces.two img{width:17cqw;margin:0}
  .cover .faces.two img:nth-child(even){margin-left:-4cqw}
  .cover .faces.two img:nth-child(n+3){margin-top:-4cqw}
  .cover.big{aspect-ratio:16/7;border-radius:var(--rs);margin-bottom:20px;--fw:13%;--fo:3%;--fp:4%}
  .cover.big .faces{aspect-ratio:16/7}
  /* The desktop hero (COVER_GEOM.wide): wider and shorter, so the headline isn't pushed off the first screen. */
  .cover.big.wide{aspect-ratio:1000/290;--fw:14.5%;--fo:3%;--fp:3.5%}
  .cover.big.wide .faces{aspect-ratio:1000/290}
  /* Beside a taller text column the art stays at the top and its own base colour runs on below. */
  .teaser > .cover{align-self:stretch}
  .teaser > .cover svg{height:auto}

  /* ============ bracket ============ */
  .bracket{margin:24px 0}
  .bracket .brt{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .bracket .brs{font-size:12.5px;color:var(--muted);margin:3px 0 12px;line-height:1.45}
  .brcols{display:flex;gap:10px;min-width:max-content;padding-bottom:4px}
  .bracket .brd{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:168px}
  .brh{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;
    margin-bottom:2px}
  .brm{background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);overflow:hidden;
    position:relative}
  .brm.placed{border-color:rgba(201,133,0,.42)}
  .bpl{position:absolute;top:0;right:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:rgba(201,133,0,.16);color:var(--gold);font-weight:600;padding:2px 6px;border-radius:0 0 0 6px}
  .bside{padding:8px 10px;font-size:13px;color:var(--muted);border-top:1px solid var(--grid)}
  .brm .bside:first-of-type{border-top:0}
  .bside.won{color:var(--ink);font-weight:600;background:linear-gradient(90deg,rgba(57,135,229,.13),transparent)}
  .bside .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

  /* ============ long-form articles ============ */
  .artl{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
    padding:26px 26px 28px;margin-bottom:16px;overflow:hidden}
  .artl.op{border-left:3px solid var(--red)}
  .artl.op .ahead .ae,.artl.op .astat .n{color:var(--red)}
  .artl.op .astat{border-top-color:var(--red)}
  .oflag{display:inline-block;align-self:flex-start;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:600;color:var(--red);border:1px solid rgba(230,103,103,.5);background:rgba(230,103,103,.10);
    border-radius:999px;padding:3px 10px;margin-bottom:10px}
  .ahdr{border-bottom:1px solid var(--grid);padding-bottom:16px;margin-bottom:20px}
  .ak{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--red);font-weight:600}
  .artl h2{font-size:clamp(29px,5.4vw,44px);line-height:1.03;letter-spacing:-.035em;font-weight:600;
    margin:10px 0 0;text-wrap:balance}
  .adek{font-size:17px;line-height:1.5;color:var(--ink-2);margin:11px 0 0;max-width:60ch;text-wrap:pretty}
  .aby{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  .aby b{color:var(--ink-2);font-weight:600}
  .abd > .apara,.abd > .ahead,.abd > .astat,.abd > .anote{max-width:66ch}
  .apara{font-size:16.5px;line-height:1.7;color:var(--ink-2);margin:0 0 17px;text-wrap:pretty}
  .apara b{color:var(--ink);font-weight:600}
  .apara.lead{font-size:18px;color:var(--ink)}
  .ahead{margin:30px 0 12px}
  .ahead .ae{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--blue);font-weight:600}
  .ahead h3{margin:5px 0 0;font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
  .astat{display:flex;gap:15px;align-items:baseline;border-top:2px solid var(--ink);
    border-bottom:1px solid var(--grid);padding:15px 0 16px;margin:22px 0}
  .astat .n{font-size:44px;font-weight:600;letter-spacing:-.04em;color:var(--blue);
    font-variant-numeric:tabular-nums;line-height:.9;flex:none}
  .astat .t{font-size:14.5px;line-height:1.5;color:var(--ink-2)}
  .anote{font-size:13px;line-height:1.6;color:var(--muted);border-top:1px solid var(--grid);
    padding-top:14px;margin:24px 0 0}

  .abars{margin:24px 0;max-width:none}
  .abars .at{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .abars .as{font-size:12.5px;color:var(--muted);margin:3px 0 14px;line-height:1.45}
  .abody{display:grid;gap:6px}
  .abar{display:grid;grid-template-columns:minmax(84px,124px) 1fr 46px;align-items:center;gap:10px}
  .abar .who{font-size:13px;font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;line-height:1.2}
  .abar .who i{display:block;font-style:normal;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  .abar .track{position:relative;height:20px;background:var(--raised);border-radius:3px}
  .abar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--mid);left:50%}
  .abar .fill{position:absolute;top:3px;bottom:3px;border-radius:2px;background:var(--blue)}
  .abar.g2 .fill{background:var(--aqua)} .abar.g3 .fill{background:var(--gold)}
  .abar .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
    text-align:right;color:var(--ink-2)}

  .acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin:22px 0}
  .acard{background:var(--raised);border:1px solid var(--ring);border-radius:var(--rs);padding:14px 15px}
  .acard.lead{border-color:rgba(57,135,229,.5)}
  .acard .ct{font-size:12px;letter-spacing:.11em;text-transform:uppercase;font-weight:600}
  .acard .cb{font-family:var(--mono);font-size:23px;font-variant-numeric:tabular-nums;margin:5px 0 2px;
    letter-spacing:-.02em}
  .acard .cs{font-size:11.5px;color:var(--muted);line-height:1.4;margin-bottom:10px}
  .acard .cr{display:grid;gap:4px}
  .acard .cr span{display:flex;align-items:baseline;gap:8px;font-size:13px}
  .acard .cr i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acard .cr b{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:400;
    color:var(--muted);font-variant-numeric:tabular-nums}

  .apicks{margin:20px 0;border-top:2px solid var(--ink)}
  .apick{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;
    padding:10px 0;border-bottom:1px solid var(--grid)}
  .apick .sl{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .apick .nm{font-size:14.5px;line-height:1.3}
  .apick .nm i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
  .apick .dl{font-family:var(--mono);font-size:13px;color:var(--plus);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  @media(max-width:560px){
    .artl{padding:20px 17px 22px}
    .astat{flex-direction:column;gap:7px}
    .astat .n{font-size:38px}
    .abar{grid-template-columns:minmax(70px,92px) 1fr 42px;gap:8px}
  }

  /* ============ recap notebook ============ */
  .lede{background:var(--surface);border:1px solid var(--ring);border-left:3px solid var(--blue);
    border-radius:var(--rs);padding:14px 16px;margin-bottom:12px}
  .lede p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink-2)}
  .movers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px}
  .mgrp{background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);padding:11px 13px}
  .mgrp .ml{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin-bottom:8px}
  .mvr{display:flex;align-items:center;gap:9px;padding:4px 0}
  .mvr .who{min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .mvr .who b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mvr .who i{font-size:11.5px;color:var(--muted);font-style:normal}
  .mvr .mv{margin-left:auto;flex:none}
  .around{display:grid;gap:9px}
  .atl{display:grid;grid-template-columns:26px 1fr;gap:11px;background:var(--surface);
    border:1px solid var(--ring);border-radius:var(--rs);padding:13px 15px}
  .atl .ic{font-size:14px;color:var(--blue);font-weight:600;text-align:center;line-height:1.5}
  .atl .kl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .atl h4{margin:2px 0 4px;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
  .atl p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}

  /* ============ power rankings ============ */
  .pwrow{
    display:grid;grid-template-columns:30px 52px auto minmax(0,1fr) auto auto;align-items:center;gap:11px;
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);padding:11px 13px}
  .pwrow .pr{font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center;
    letter-spacing:-.02em}
  .mv{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;
    display:inline-block}
  .mv.up{color:var(--good)} .mv.down{color:var(--crit)}
  .mv.flat,.mv.none{color:var(--muted)}
  .pwrow .id{min-width:0}
  .pwrow .id .n{font-weight:600;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pwrow .id .s{font-size:12.5px;color:var(--muted);display:block;line-height:1.45}
  .pwrow .sp{display:flex;align-items:center;flex:none}
  .spark{display:block}
  .pwrow .stats{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
  @media(max-width:820px){
