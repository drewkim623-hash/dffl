<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">Fantasy Football</div>
    <h1 class="name" id="lgName">DFFL</h1>
    <p class="tagline" id="lgSub">Loading every season from Sleeper…</p>
  </div>
</header>

<nav class="tabs"><div class="wrap"><div class="tabrow" id="tabs" role="tablist"></div></div></nav>

<main class="wrap">
  <div id="loader">
    Pulling every season from Sleeper…
    <div class="prog"><i id="progBar"></i></div>
    <div id="progTxt" style="font-size:12.5px;margin-top:9px"></div>
  </div>
  <div id="app" hidden></div>
</main>

<footer><div class="wrap">
  Live from the public Sleeper API — this page reads the league straight from Sleeper every time it
  loads, so it can never be out of date.<span id="footNote"></span>
</div></footer>

<div class="tip" id="tip"></div>

<script>
/* =========================================================================
   DFFL League Record Book — pure client-side, reads the public Sleeper API.
   ========================================================================= */

const CURRENT_LEAGUE_ID = "1318040218183417856";
const API = "https://api.sleeper.app/v1";
const MOCK = new URLSearchParams(location.search).has("mock");

/* ---------------------------------------------------------------- utils */
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const f2 = n => (Math.round(n * 100) / 100).toFixed(2);
const pct = n => (n * 100).toFixed(1) + "%";
const ord = n => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

async function jget(url) {
  // This site's own JSON changes under it — the recaps, the rankings, the
  // keeper list, the ADP snapshot — and GitHub Pages serves them with a
  // ten-minute max-age. Fetched normally, a reader keeps seeing the old
  // article for ten minutes after it is replaced, which is exactly long
  // enough to look broken. "no-cache" still uses the cache, it just checks
  // with the server first, so an unchanged file costs a 304 and nothing else.
  // Sleeper's own endpoints are left alone: they are cross-origin, they change
  // on their own schedule, and the browser handles them sensibly.
  const ours = !/^https?:/i.test(url);
  const r = await fetch(url, ours ? { cache: "no-cache" } : undefined);
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}
async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

/* ------------------------------------------------------------ mock mode */
let MOCKDATA = null;
async function mockInit() { MOCKDATA = await jget("fixtures/2025.json"); }

/* ------------------------------------------------------------ data load */
let done = 0, total = 1;
function tick(msg) {
  done++;
  const bar = $("#progBar"); if (bar) bar.style.width = Math.min(100, (done / total) * 100) + "%";
  const txt = $("#progTxt"); if (txt && msg) txt.textContent = msg;
}
async function getLeague(id) {
  if (MOCK) return { ...MOCKDATA.league, previous_league_id: null };
  return jget(`${API}/league/${id}`);
}
async function getSide(id, path) {
  if (MOCK) return MOCKDATA[path] ?? [];
  return jget(`${API}/league/${id}/${path}`);
}
async function getWeek(id, wk) {
  if (MOCK) return MOCKDATA.matchups[String(wk)] ?? [];
  return jget(`${API}/league/${id}/matchups/${wk}`);
}

async function loadChain() {
  const chain = [];
  let id = CURRENT_LEAGUE_ID;
  const seen = new Set();
  while (id && !seen.has(id) && chain.length < 30) {
    seen.add(id);
    const lg = await getLeague(id);
    if (!lg || !lg.league_id) break;
    chain.push(lg);
    id = lg.previous_league_id;
  }
  return chain;
}

/** Pair a week's raw entries into head-to-head games via matchup_id. */
function pairWeek(entries) {
  const by = new Map();
  for (const e of entries || []) {
    if (e.matchup_id == null) continue;
    if (!by.has(e.matchup_id)) by.set(e.matchup_id, []);
    by.get(e.matchup_id).push(e);
  }
  const games = [];
  for (const arr of by.values()) {
    if (arr.length !== 2) continue;
    const [a, b] = arr;
    const pa = Number(a.points), pb = Number(b.points);
    if (!isFinite(pa) || !isFinite(pb)) continue;
    if (pa === 0 && pb === 0) continue;
    games.push([{ rid: a.roster_id, pts: pa }, { rid: b.roster_id, pts: pb }]);
  }
  return games;
}

/**
 * Sleeper brackets → { place: roster_id }.
 * winners_bracket p=k decides places k and k+1.
 * losers_bracket  p=k decides places (playoffTeams+k) and (playoffTeams+k+1).
 */
/**
 * Turn the two brackets into a finishing order.
 *
 * The winners bracket is what it looks like. The consolation bracket is not:
 * DFFL runs it as a toilet bowl, where you advance by LOSING, and the team
 * Sleeper marks as the winner of each tie is the one who lost the game and
 * fell another rung towards last. Checked against the scoreline rather than
 * assumed — in all four completed seasons the winners bracket agrees with the
 * scores on every tie and the consolation bracket disagrees on every tie.
 *
 * That also inverts the ladder: Sleeper numbers the consolation final p:1, but
 * in a toilet bowl the final is the game for LAST, so p:1 is the bottom rung
 * and the highest p is the game for the best place outside the playoffs.
 */
function placementsOf(wb, lb, playoffTeams, games) {
  const p = {};
  for (const g of wb || []) if (g.p && g.w != null && g.l != null) { p[g.p] = g.w; p[g.p + 1] = g.l; }

  const played = (games || []).filter(g => g.playoff);
  const scoreWinner = (a, b) => {
    const tie = played.filter(g =>
      (g.a.rid === a && g.b.rid === b) || (g.a.rid === b && g.b.rid === a));
    if (!tie.length) return null;
    const g = tie[tie.length - 1];
    if (g.a.pts === g.b.pts) return null;
    return g.a.pts > g.b.pts ? g.a.rid : g.b.rid;
  };
  let checked = 0, contrary = 0;
  for (const g of lb || []) {
    if (!g.t1 || !g.t2 || g.w == null) continue;
    const w = scoreWinner(g.t1, g.t2);
    if (w == null) continue;
    checked++;
    if (w !== g.w) contrary++;
  }
  const toiletBowl = checked > 0 && contrary > checked / 2;
  const maxP = Math.max(0, ...(lb || []).map(g => Number(g.p) || 0));

  for (const g of lb || []) {
    if (!g.p || g.w == null || g.l == null) continue;
    if (toiletBowl) {
      const base = playoffTeams + (maxP + 1 - g.p);
      p[base] = g.l;        // won the game, escaped the rung
      p[base + 1] = g.w;    // lost it, and Sleeper calls that advancing
    } else {
      p[playoffTeams + g.p] = g.w;
      p[playoffTeams + g.p + 1] = g.l;
    }
  }
  return p;
}

/**
 * `games` is finished football and nothing else. A week the NFL is still
 * playing lands in `live` instead, so every record, standing, streak, power
 * ranking and simulation on this site is computed from results that cannot
 * change. Only the scoreboard reads `live`, and it labels it as in progress.
 */
const DB = { seasons: [], games: [], live: [], mgr: new Map(), state: null };

function mgrOf(uid, seedName) {
  if (!DB.mgr.has(uid)) DB.mgr.set(uid, { uid, name: seedName || "Unknown", team: "", avatar: null });
  const m = DB.mgr.get(uid);
  if (seedName && !m.locked) m.name = seedName;
  return m;
}

/**
 * Has the NFL finished playing this week?
 *
 * Sleeper only advances `state.week` once the last game of a week is over, which
 * makes it the one honest "every starter has played" signal on offer. The box
 * score cannot answer it: a starter sitting on zero at four o'clock is either a
 * player who has not kicked off yet or a player who caught nothing all
 * afternoon, and the matchup rows do not say which.
 *
 * Anything outside the season being played right now is final by definition.
 *
 * DB.state is the *effective* state (see effectiveState below): once the
 * GitHub Action has marked the week Sleeper still calls current as final in
 * data/latest.json, the week counts as over here too, instead of waiting hours
 * for Sleeper to flip. The email snapshot reads this page, so they agree.
 */
function weekIsFinal(lg, wk) {
  if (lg.status === "complete") return true;
  const st = DB.state;
  if (!st || String(st.season) !== String(lg.season)) return true;
  const cur = Number(st.week);
  if (!isFinite(cur)) return true;
  return wk < cur;
}

/**
 * The effective current week. Sleeper advances state.week hours after Monday
 * night's last game; build-week.mjs marks the week final in data/latest.json as
 * soon as every NFL game is complete and every matchup scored. If latest.json
 * says the week Sleeper still calls current is final, act as though Sleeper had
 * already advanced. A copy of effective-week.mjs — test-effective-week.mjs
 * checks the two stay identical.
 */
/* effective-week:begin */
function effectiveState(state, latest) {
  if (!state || !latest || latest.final !== true) return state;
  const sw = Number(state.week), lw = Number(latest.week);
  if (!Number.isInteger(sw) || sw < 1 || lw !== sw) return state;
  if (String(latest.season) !== String(state.season)) return state;
  const bump = v => (Number(v) === sw ? sw + 1 : v);
  return Object.assign({}, state, {
    week: sw + 1, leg: bump(state.leg), display_week: bump(state.display_week),
    sleeper_week: sw, advanced_by: "latest.json",
  });
}
/* effective-week:end */

async function loadSeason(lg) {
  const id = lg.league_id;
  const pws = Number(lg.settings && lg.settings.playoff_week_start) || 15;
  const ptm = Number(lg.settings && lg.settings.playoff_teams) || 6;
  const started = lg.status !== "pre_draft" && lg.status !== "drafting";

  const [users, rosters, wb, lb, drafts] = await Promise.all([
    getSide(id, "users").catch(() => []),
    getSide(id, "rosters").catch(() => []),
    started ? getSide(id, "winners_bracket").catch(() => []) : Promise.resolve([]),
    started ? getSide(id, "losers_bracket").catch(() => []) : Promise.resolve([]),
    // Always: the current season's draft exists (with keepers already in it)
    // before the season starts, and the odds board re-prices the moment it ends.
    getSide(id, "drafts").catch(() => []),
  ]);
  tick(`${lg.season} season`);

  const uidOf = new Map(rosters.map(r => [r.roster_id, r.owner_id]));
  const userById = new Map(users.map(u => [u.user_id, u]));

  for (const r of rosters) {
    const u = userById.get(r.owner_id);
    if (!u) continue;
    const m = mgrOf(r.owner_id, u.display_name);
    if (!m.avatar && u.avatar) m.avatar = u.avatar;
    const tn = u.metadata && u.metadata.team_name;
    if (tn && !m.team) m.team = tn;
    m.locked = true;
  }

  let lastWeek = pws + 2;
  if (started && lg.status !== "complete") {
    const cur = DB.state && String(DB.state.season) === String(lg.season) ? Number(DB.state.week) : lastWeek;
    lastWeek = Math.max(0, Math.min(lastWeek, cur));
  }
  const weeks = started ? Array.from({ length: lastWeek }, (_, i) => i + 1) : [];

  const raw = await pool(weeks, 6, async wk => {
    const d = await getWeek(id, wk).catch(() => []);
    tick(`${lg.season} · week ${wk}`);
    return { wk, d };
  });

  // A week is not a result until it has been played out. Mid-Sunday the
  // matchups already carry real, partial scores — a team up by thirty at four
  // o'clock with three starters still to kick off has won nothing — so a week
  // the NFL is still playing is held aside as live and kept out of DB.games
  // entirely. Everything downstream reads DB.games, which is why the fix is one
  // decision here rather than a caveat in thirty places.
  const seasonGames = [], liveGames = [];
  let liveWeek = null;
  for (const { wk, d } of raw) {
    const final = weekIsFinal(lg, wk);
    for (const [a, b] of pairWeek(d)) {
      const g = {
        season: lg.season, week: wk, playoff: wk >= pws, live: !final,
        a: { rid: a.rid, uid: uidOf.get(a.rid), pts: a.pts },
        b: { rid: b.rid, uid: uidOf.get(b.rid), pts: b.pts },
      };
      if (!g.a.uid || !g.b.uid) continue;
      if (final) { seasonGames.push(g); DB.games.push(g); }
      else { liveGames.push(g); DB.live.push(g); liveWeek = wk; }
    }
  }

  // Per-player production under THIS league's scoring. Two shapes of the same
  // numbers: playerPts is the regular-season total, which is what a draft pick
  // is judged on; playerWeek keeps them week by week, which is what a trade has
  // to be judged on — a trade can only be credited with points scored after it.
  const playerPts = new Map();
  const playerWeek = new Map();
  for (const { wk, d } of raw) {
    for (const e of d || []) {
      const pp = e.players_points;
      if (!pp) continue;
      let wm = playerWeek.get(wk);
      if (!wm) playerWeek.set(wk, wm = new Map());
      for (const pid of Object.keys(pp)) {
        const v = Number(pp[pid]);
        if (!isFinite(v)) continue;
        wm.set(pid, v);
        if (wk < pws) playerPts.set(pid, (playerPts.get(pid) || 0) + v);
      }
    }
  }

  // What each lineup slot actually scores, from finished regular-season weeks
  // only. starters[] is ordered by the league's roster_positions, so index 0 is
  // the quarterback and index 8 the kicker — which is what lets a half-played
  // week be priced as something other than "half the points are in".
  const slotPts = [];
  for (const { wk, d } of raw) {
    if (wk >= pws || !weekIsFinal(lg, wk)) continue;
    for (const e of d || []) {
      const pp = e.players_points || {};
      (e.starters || []).forEach((pid, i) => {
        if (!pid || pid === "0") return;
        const v = Number(pp[pid]);
        if (!isFinite(v)) return;
        if (!slotPts[i]) slotPts[i] = { sum: 0, n: 0 };
        slotPts[i].sum += v;
        slotPts[i].n++;
      });
    }
  }

  // Draft picks for this season (names ride along in pick.metadata).
  let picks = [];
  const draft = (drafts && drafts[0]) || null;
  const draftId = (draft && draft.draft_id) || null;
  if (draftId && !MOCK) picks = await jget(`${API}/draft/${draftId}/picks`).catch(() => []);
  if (picks.length) tick(`${lg.season} draft`);

  // A draft is only "done" when Sleeper says complete AND the board is full.
  // Mid-draft the roster is half-built, so the odds stay on the pre-draft model.
  const draftRounds = Number(draft && draft.settings && draft.settings.rounds) || 0;
  const draftSlots = draftRounds * (Number(draft && draft.settings && draft.settings.teams) || rosters.length || 0);
  const draftDone = !!draft && draft.status === "complete" && draftSlots > 0 && picks.length >= draftSlots;

  // Divisions live in two places: the names hang off league.metadata.division_N,
  // the membership off each roster's settings.division.
  const meta = lg.metadata || {};
  const divCount = Number(lg.settings && lg.settings.divisions) || 0;
  const divNames = new Map();
  for (let d = 1; d <= divCount; d++) divNames.set(d, meta[`division_${d}`] || `Division ${d}`);
  const divOf = new Map();
  for (const r of rosters) {
    const d = r.settings && r.settings.division;
    if (d != null) divOf.set(r.roster_id, Number(d));
  }

  DB.seasons.push({
    leagueId: id, season: lg.season, name: lg.name, status: lg.status,
    pws, playoffTeams: ptm, rosters, users, uidOf, userById,
    places: placementsOf(wb, lb, ptm, seasonGames), wb, lb, games: seasonGames,
    live: liveGames, liveWeek, slotPts,
    finalWeeks: new Set(seasonGames.filter(g => !g.playoff).map(g => g.week)),
    complete: lg.status === "complete",
    picks, playerPts, playerWeek, draftId,
    maxKeepers: Number(lg.settings && lg.settings.max_keepers) || 0,
    draftStatus: (draft && draft.status) || null, draftRounds, draftSlots, draftDone,
    meta, divCount, divNames, divOf,
  });
}

/* -------------------------------------------------------- derived stats */
function regGames() { return DB.games.filter(g => !g.playoff); }

function allTime() {
  const rows = new Map();
  const get = uid => {
    if (!rows.has(uid)) rows.set(uid, {
      uid, w: 0, l: 0, t: 0, pf: 0, pa: 0, g: 0, seasons: new Set(),
      apW: 0, apL: 0, titles: 0, playoffs: 0, podium: 0, best: 99, lasts: 0,
    });
    return rows.get(uid);
  };
  for (const g of regGames()) {
    const A = get(g.a.uid), B = get(g.b.uid);
    A.seasons.add(g.season); B.seasons.add(g.season);
    A.g++; B.g++;
    A.pf += g.a.pts; A.pa += g.b.pts;
    B.pf += g.b.pts; B.pa += g.a.pts;
    if (g.a.pts > g.b.pts) { A.w++; B.l++; }
    else if (g.b.pts > g.a.pts) { B.w++; A.l++; }
    else { A.t++; B.t++; }
  }
  const byWeek = new Map();
  for (const g of regGames()) {
    const k = g.season + "|" + g.week;
    if (!byWeek.has(k)) byWeek.set(k, []);
    byWeek.get(k).push({ uid: g.a.uid, pts: g.a.pts }, { uid: g.b.uid, pts: g.b.pts });
  }
  for (const arr of byWeek.values()) {
    for (const x of arr) {
      const r = get(x.uid);
      for (const y of arr) {
        if (y === x) continue;
        if (x.pts > y.pts) r.apW++; else if (x.pts < y.pts) r.apL++;
      }
    }
  }
  for (const s of DB.seasons) {
    if (!s.complete) continue;
    const keys = Object.keys(s.places).map(Number);
    if (!keys.length) continue;
    const lastPlace = Math.max(...keys);
    for (const [place, rid] of Object.entries(s.places)) {
      const uid = s.uidOf.get(Number(rid));
      if (!uid || !rows.has(uid)) continue;
      const r = rows.get(uid), p = Number(place);
      r.best = Math.min(r.best, p);
      if (p === 1) r.titles++;
      if (p <= 3) r.podium++;
      if (p <= s.playoffTeams) r.playoffs++;
      if (p === lastPlace) r.lasts++;
    }
  }
  return [...rows.values()].map(r => {
    const dec = r.w + r.l + r.t, apT = r.apW + r.apL;
    const expW = apT ? (r.apW / apT) * r.g : 0;
    return {
      ...r,
      winPct: dec ? (r.w + r.t / 2) / dec : 0,
      ppg: r.g ? r.pf / r.g : 0, papg: r.g ? r.pa / r.g : 0,
      apPct: apT ? r.apW / apT : 0,
      expW, luck: r.w - expW, nSeasons: r.seasons.size,
    };
  }).sort((a, b) => b.winPct - a.winPct || b.pf - a.pf);
}

function h2hMap() {
  const m = new Map();
  const key = (x, y) => x + "|" + y;
  const cell = (x, y) => {
    if (!m.has(key(x, y))) m.set(key(x, y), { w: 0, l: 0, t: 0, pf: 0, pa: 0 });
    return m.get(key(x, y));
  };
  for (const g of DB.games) {
    const A = cell(g.a.uid, g.b.uid), B = cell(g.b.uid, g.a.uid);
    if (g.a.pts > g.b.pts) { A.w++; B.l++; }
    else if (g.b.pts > g.a.pts) { B.w++; A.l++; }
    else { A.t++; B.t++; }
    A.pf += g.a.pts; A.pa += g.b.pts;
    B.pf += g.b.pts; B.pa += g.a.pts;
  }
  return m;
}

function recordBook() {
  const sides = [];
  for (const g of DB.games) {
    const aw = g.a.pts > g.b.pts, bw = g.b.pts > g.a.pts;
    sides.push({ ...g.a, opp: g.b, season: g.season, week: g.week, playoff: g.playoff, won: aw, tie: !aw && !bw });
    sides.push({ ...g.b, opp: g.a, season: g.season, week: g.week, playoff: g.playoff, won: bw, tie: !aw && !bw });
  }
  const byGame = DB.games.map(g => ({ g, margin: Math.abs(g.a.pts - g.b.pts), total: g.a.pts + g.b.pts }));
  const best = (arr, sel, dir = -1) => arr.length ? arr.slice().sort((x, y) => dir * (sel(x) - sel(y)))[0] : null;

  const order = new Map(DB.seasons.slice().sort((a, b) => Number(a.season) - Number(b.season)).map((s, i) => [s.season, i]));
  const logs = new Map();
  for (const g of regGames()) {
    for (const [me, op] of [[g.a, g.b], [g.b, g.a]]) {
      if (!logs.has(me.uid)) logs.set(me.uid, []);
      logs.get(me.uid).push({ k: order.get(g.season) * 100 + g.week, won: me.pts > op.pts, season: g.season, week: g.week });
    }
  }
  const streaks = { win: { n: 0 }, loss: { n: 0 } }, perMgr = new Map();
  for (const [uid, log] of logs) {
    log.sort((a, b) => a.k - b.k);
    let cw = 0, cl = 0, bw = 0, bl = 0;
    for (const e of log) {
      cw = e.won ? cw + 1 : 0; cl = e.won ? 0 : cl + 1;
      bw = Math.max(bw, cw); bl = Math.max(bl, cl);
      if (cw > streaks.win.n) streaks.win = { n: cw, uid, end: e };
      if (cl > streaks.loss.n) streaks.loss = { n: cl, uid, end: e };
    }
    perMgr.set(uid, { bestWin: bw, worstLoss: bl });
  }

  const seasonPF = [];
  for (const s of DB.seasons) {
    const tot = new Map();
    for (const g of s.games) {
      if (g.playoff) continue;
      tot.set(g.a.uid, (tot.get(g.a.uid) || 0) + g.a.pts);
      tot.set(g.b.uid, (tot.get(g.b.uid) || 0) + g.b.pts);
    }
    for (const [uid, pf] of tot) seasonPF.push({ uid, pf, season: s.season });
  }

  return {
    high: best(sides, s => s.pts), low: best(sides, s => s.pts, 1),
    blowout: best(byGame, x => x.margin),
    nailbiter: best(byGame.filter(x => x.margin > 0), x => x.margin, 1),
    shootout: best(byGame, x => x.total), snoozer: best(byGame, x => x.total, 1),
    unlucky: best(sides.filter(s => !s.won && !s.tie), s => s.pts),
    lucky: best(sides.filter(s => s.won), s => s.pts, 1),
    streakW: streaks.win, streakL: streaks.loss, perMgr,
    seasonHi: best(seasonPF, s => s.pf), seasonLo: best(seasonPF, s => s.pf, 1),
    sides,
  };
}

/* ------------------------------------------------------------- helpers */
const nameOf = uid => (DB.mgr.get(uid) || {}).name || "—";
const teamOf = uid => (DB.mgr.get(uid) || {}).team || "";
const initials = n => String(n || "?").replace(/[^a-zA-Z0-9]/g, "").slice(0, 2).toUpperCase();
function avatarHTML(uid, cls = "") {
  const m = DB.mgr.get(uid);
  const inner = m && m.avatar
    ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(m.avatar)}" alt="" loading="lazy">`
    : esc(initials(m && m.name));
  return `<span class="av ${cls}">${inner}</span>`;
}
const tipEl = $("#tip");
function bindTip(node, html) {
  const move = e => {
    const r = tipEl.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
    tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  };
  node.addEventListener("mouseenter", e => { tipEl.innerHTML = html; tipEl.style.opacity = "1"; move(e); });
  node.addEventListener("mousemove", move);
  node.addEventListener("mouseleave", () => { tipEl.style.opacity = "0"; });
}
/** Diverging blue↔red about a neutral gray midpoint (the documented pair). */
function divergeColor(v, max) {
  if (!isFinite(v) || !max) return "var(--mid)";
  const t = Math.max(-1, Math.min(1, v / max)), a = Math.abs(t);
  if (a < 0.06) return "var(--mid)";
  const hue = t > 0 ? "57,135,229" : "230,103,103";
  return `rgba(${hue},${(0.20 + 0.75 * a).toFixed(3)})`;
}
function sechead(title, sub, action) {
  const h = el("div", "sechead", `<h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}`);
  if (action) {
    const b = el("button", "seeall", esc(action.label || "See all"));
    b.type = "button";
    if (action.name) b.setAttribute("aria-label", "See all: " + action.name);
    b.onclick = () => {
      show(action.tab);
      const panel = $(`[data-panel="${action.tab}"]`);
      const target = (panel && panel.querySelector(".sechead h2")) || panel;
      if (target) { target.setAttribute("tabindex", "-1"); target.focus({ preventScroll: true }); }
      const tb = $(`#tabs [data-tab="${action.tab}"]`);
      if (tb) tb.scrollIntoView({ block: "nearest", inline: "nearest" });
      tabHint();
    };
    h.insertBefore(b, h.querySelector("p"));
  }
  return h;
}
function tableCard(headers, rows) {
  const c = el("div", "card"), s = el("div", "scroll"), t = el("table");
  t.innerHTML = `<thead><tr>${headers.map(h =>
    `<th class="${h.num ? "num" : ""}"${h.title ? ` title="${esc(h.title)}"` : ""}>${esc(h.label)}</th>`).join("")}</tr></thead>`;
  const tb = el("tbody"); tb.innerHTML = rows.join("");
  // Text cells get an inner wrapper so that on phones a long one can wrap at a capped
  // width instead of running under the pinned first column (see .cw in the CSS).
  for (const td of tb.querySelectorAll("td:not(.num)")) {
    const w = document.createElement("span"); w.className = "cw";
    while (td.firstChild) w.appendChild(td.firstChild);
    td.appendChild(w);
  }
  t.appendChild(tb); s.appendChild(t); c.appendChild(s);
  return c;
}
function barCard(items, valFmt, tipFn) {
  const max = Math.max(...items.map(i => i.v), 1e-9);
  const box = el("div", "barbox"), inner = el("div", "bars");
  items.forEach(it => {
    const row = el("div", "bar");
    row.innerHTML = `<span class="nm">${esc(it.label)}</span>
      <span class="track"><span class="fill" style="width:${(it.v / max * 100).toFixed(1)}%"></span></span>
      <span class="v">${esc(valFmt(it.v))}</span>`;
    if (tipFn) bindTip(row, tipFn(it));
    inner.appendChild(row);
  });
  box.appendChild(inner);
  return box;
}
function glossary(items) {
  const d = el("details", "gloss");
  d.innerHTML = `<summary>What do these numbers mean?</summary>
    <div class="gitems">${items.map(i => `<div class="gitem"><b>${esc(i.t)}</b><span>${esc(i.d)}</span></div>`).join("")}</div>`;
  return d;
}

  { id: "odds", label: "Odds" },
  { id: "race", label: "Race" },
  { id: "draft", label: "Draft" },
  { id: "trades", label: "Trades" },
  // The id stays "recaps" so links people have already shared keep working.
  { id: "recaps", label: "News & Articles" },
];
function buildTabs() {
  const bar = $("#tabs"); bar.innerHTML = "";
  TABS.forEach(t => {
    const b = el("button", null, t.label);
    b.setAttribute("role", "tab"); b.dataset.tab = t.id;
    b.onclick = () => show(t.id);
    bar.appendChild(b);
  });
  tabHint();
  document.fonts && document.fonts.ready.then(tabHint);
  if (!bar.dataset.hint) {
    bar.dataset.hint = "1";
    bar.addEventListener("scroll", tabHint, { passive: true });
    window.addEventListener("resize", tabHint, { passive: true });
  }
}
/** Fades the right edge of the tab row while there are more tabs off to the right. */
function tabHint() {
  const bar = $("#tabs");
  bar.parentElement.classList.toggle("more", bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 2);
}
function show(id) {
  const prof = $('[data-panel="profile"]');
  if (prof) prof.remove();
  const art = $('[data-panel="article"]');
  if (art) art.remove();
  // The trade block reads five seasons of transactions and a 5MB name file.
  // Nobody pays for that until they ask to see it.
  if (id === "trades") ensureTrades();
  // Same deal for the race: it reads the rest of the schedule and runs tens of
  // thousands of seasons, so it waits until somebody asks for it.
  if (id === "race") ensureRace();
  if (id === "odds") { ensureLiveOdds(); ensureGameLines(); }
  const dp = $('[data-panel="draft"]');
  if (id === "draft" && dp && dp._draw && !dp.dataset.drawn) { dp.dataset.drawn = "1"; dp._draw(); }
  for (const b of $("#tabs").children) b.setAttribute("aria-selected", String(b.dataset.tab === id));
  for (const p of $("#app").children) p.hidden = p.dataset.panel !== id;
  history.replaceState(null, "", "#" + id);
  scrollTo(0, 0);
}

/**
 * recaps.json is read by the News tab and by the home page's desk block. Fetch
 * it once; a failure is cached as null so a missing file costs one request.
 */
let RECAPS_P = null;
function recapsOnce() { return RECAPS_P || (RECAPS_P = jget("recaps.json").catch(() => null)); }

/**
 * The live board, the injury feed and the remaining schedule, assembled once and
 * shared by everything that wants them. The Odds tab and the home page both
 * read this, so the site never runs the same twenty thousand seasons twice or
 * pulls Sleeper's player file more than once a page.
 */
let LIVE_P = null, LIVE_FULL = false;
function liveOnce(opts) {
  const full = !!(opts && opts.full);
  if (LIVE_P && (LIVE_FULL || !full)) return LIVE_P;
  LIVE_FULL = LIVE_FULL || full;
  return (LIVE_P = (async () => {
    const model = window.__ODDS, sim = window.__SIM;
    const season = DB.seasons[0];
    const R = await raceDataOnce();
    const inj = await loadInjuries({ full: LIVE_FULL });
    const avail = availability(season, inj);
    // One injury plan for the futures, the game lines and the live win chances.
    const plan = injuryPlan(season, inj, model);
    const posterior = (model && model.ok) ? livePosterior(model, season) : null;
    const board = posterior ? await liveWeekBoard(season, posterior, model.weekSd, plan) : null;
    const live = (model && model.ok && sim) ? liveState(model, season, R, avail, board, null, plan) : null;
    const lsim = live ? simulateSeason(model, ODDS_SIMS, live) : null;
    window.__INJ = inj; window.__AVAIL = avail; window.__LIVE = live;
    window.__LSIM = lsim; window.__BOARD = board; window.__PLAN = plan;
    return { R, inj, avail, plan, live, lsim, model, sim, season, board };
  })());
}

/** This week's six matchups, live or final, each one a way into the scoreboard. */
function weekStrip(w) {
  const g = el("div", "wstrip");
  const scores = w.games.flatMap(x => [x.a.pts, x.b.pts]);
  const best = Math.max(...scores);
  w.games.slice().sort((x, y) => (y.a.pts + y.b.pts) - (x.a.pts + x.b.pts)).forEach(game => {
    const card = el("button", "wgame");
    const side = s => {
      const ahead = s.pts > (s === game.a ? game.b : game.a).pts;
      const cls = w.live ? (ahead ? "lead" : "") : (ahead ? "win" : "lose");
      const lg = w.live ? liveGameFor(DB.seasons[0], w.week, game.a.rid, game.b.rid) : null;
      const pr = lg ? (lg.a.rid === s.rid ? lg.pA : lg.pB) : null;
      return `<span class="ws ${cls}">${avatarHTML(s.uid, "xs")}
        <span class="wn">${esc(nameOf(s.uid))}</span>
        ${pr != null ? winChip(pr, lg.settled) : ""}
        <span class="wp">${f2(s.pts)}</span></span>`;
    };
    const margin = Math.abs(game.a.pts - game.b.pts);
    card.innerHTML = side(game.a) + side(game.b) + `<span class="wdash" aria-hidden="true">–</span>` +
      `<span class="wf">${w.live
        ? `<span class="livedot"></span>live · by ${f1(margin)}`
        : `${game.a.pts === best || game.b.pts === best ? "top score · " : ""}by ${f1(margin)}`}</span>`;
    card.onclick = () => show("scores");
    g.appendChild(card);
  });
  return g;
}

/** Climbing and falling on the power board, this week against last. */
function moversRow(season) {
  const PR = allPowerRankings().get(season.season);
  if (!PR || PR.boards.length < 2) return null;
  const last = PR.boards[PR.boards.length - 1];
  const moved = last.rows.filter(r => r.move != null && r.move !== 0)
    .sort((a, b) => Math.abs(b.move) - Math.abs(a.move));
  if (!moved.length) return null;
  const up = moved.filter(r => r.move > 0).slice(0, 3);
  const down = moved.filter(r => r.move < 0).slice(0, 3);
  const box = el("div", "movers");
  const col = (title, rows, kind) => {
    const c = el("div", `mcol ${kind}`);
    c.innerHTML = `<div class="mh">${esc(title)}</div>`;
    if (!rows.length) { c.appendChild(el("div", "mnone", "Nobody")); return c; }
    for (const r of rows) {
      const b = el("button", "mrow");
      b.innerHTML = `${avatarHTML(r.uid, "xs")}
        <span class="mn">${esc(nameOf(r.uid))}</span>
        <span class="mrk">#${r.rank}</span>
        <span class="mdl">${r.move > 0 ? "▲" : "▼"}${Math.abs(r.move)}</span>`;
      b.onclick = () => openProfile(r.uid);
      c.appendChild(b);
    }
    return c;
  };
  box.appendChild(col(`Climbing · week ${last.week}`, up, "up"));
  box.appendChild(col(`Falling · week ${last.week}`, down, "down"));
  return box;
}

/** Whose season has repriced hardest since the draft. */
function boardMovers(model, sim, lsim) {
  const n = lsim.sims, o = sim.sims;
  const rows = model.teams.map((t, i) => ({
    uid: t.uid,
    now: lsim.playoff[i] / n,
    was: sim.playoff[i] / o,
    d: lsim.playoff[i] / n - sim.playoff[i] / o,
  })).filter(r => Math.abs(r.d) >= 0.02).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 6);
  if (!rows.length) return null;
  const box = el("div", "bmovers");
  for (const r of rows) {
    const b = el("button", `bmv ${r.d > 0 ? "up" : "down"}`);
    b.innerHTML = `${avatarHTML(r.uid, "xs")}
      <span class="bn">${esc(nameOf(r.uid))}</span>
      <span class="bp">${(r.now * 100).toFixed(0)}%<span class="k">playoffs</span></span>
      <span class="bd">${r.d > 0 ? "▲" : "▼"} ${Math.abs(r.d * 100).toFixed(0)}pt</span>`;
    b.onclick = () => openProfile(r.uid);
    box.appendChild(b);
  }
  return box;
}

/** Who is hurt, in one line per team, for people who only read the front page. */
function injuryStrip(model, avail) {
  const rows = model.teams.map(t => ({ t, a: avail.get(t.rid) }))
    .filter(x => x.a && x.a.hurt.length)
    .sort((a, b) => a.a.mult - b.a.mult).slice(0, 6);
  if (!rows.length) return null;
  const box = el("div", "istrip");
  for (const { t, a } of rows) {
    const b = el("button", "ichip");
    const names = a.hurt.slice(0, 2).map(h => {
      const p = h.rec || injPlayer(h.pid);
      return `<span class="st-${esc(String(h.status).toLowerCase())}">${esc(p ? p.n : h.pid)}</span>`;
    }).join(", ");
    const more = a.hurt.length > 2 ? ` +${a.hurt.length - 2}` : "";
    b.innerHTML = `${avatarHTML(t.uid, "xs")}<span class="in">${esc(nameOf(t.uid))}</span>
      <span class="ipl">${names}${esc(more)}</span>`;
    b.onclick = () => openProfile(t.uid);
    box.appendChild(b);
  }
  return box;
}

/**
 * The front page's own week: what is being played, who is climbing, whose
 * season has repriced, who is hurt, and what the desk has filed. Everything in
 * it changes on its own every week, which is the point — the rest of the home
 * page is history and history does not move.
 */
async function ensureHomeWeek() {
  const host = $("#homeWeek");
  if (!host) return;
  try {
    const weeks = allWeeks();
    const w = weeks[0];
    const season = DB.seasons[0];
    host.innerHTML = "";

    // Price the week in flight before drawing it, so the strip carries live win
    // probabilities on first paint rather than flashing in a second later.
    if (w && w.live) { try { await liveOnce(); } catch (e) { /* draw it plain */ } }

    if (w && String(w.season) === String(season.season)) {
      host.appendChild(sechead(`Week ${w.week}${w.live ? "" : " · final"}`,
        w.live
          ? "Being played right now. Scores are live; nothing counts as a win until every starter has played."
          : "The last week in the book. Tap any game for the full scoreboard.",
        { tab: "scores", name: "Scoreboard" }));
      host.appendChild(weekStrip(w));
    }

    const mv = moversRow(season);
    if (mv) {
      host.appendChild(sechead("Climbing and falling",
        "Movement on the power board week over week — measured against the whole league, not the one opponent you drew."));
      host.appendChild(mv);
    }

    // Everything above is free: it is built from data the page already holds.
    // Everything below is not, and the front page refuses to pay for it. The
    // live board costs the rest of the schedule and twenty thousand seasons; the
    // injury feed costs a 5MB download unless something cheap already has it.
    // So the home page shows each only when it can be had for nothing, and the
    // Odds tab — which somebody opened on purpose — is what pays.
    const model = window.__ODDS, sim = window.__SIM;
    const lsim = window.__LSIM, live = window.__LIVE;
    if (model && model.ok && sim && lsim && live) {
      const bm = boardMovers(model, sim, lsim);
      if (bm) {
        host.appendChild(sechead("Whose season has changed",
          `How far each team's playoff price has moved since the draft, off ${live.decided} finished games and the real schedule still to come. The Odds tab shows the whole board.`, { tab: "odds", name: "Odds" }));
        host.appendChild(bm);
      }
    }
    const inj = await loadInjuries();
    if (model && model.ok && inj.map.size) {
      const is = injuryStrip(model, availability(DB.seasons[0], inj));
      if (is) {
        host.appendChild(sechead("Out this week",
          "Straight from Sleeper's injury feed, and priced into the board on the Odds tab."));
        host.appendChild(is);
      }
    }

    const data = await recapsOnce();
    const arts = ((data && data.articles) || []).slice()
      .sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))).slice(0, 2);
    if (arts.length) {
      host.appendChild(sechead("From the desk",
        "The latest long reads. Tap to read in full.", { tab: "recaps", name: "News" }));
      const list = el("div", "tlist home");
      for (const a of arts) list.appendChild(articleTeaser(a));
      host.appendChild(list);
    }
    startLivePolling();
    document.body.dataset.homeWeek = "1";
  } catch (e) {
    document.body.dataset.homeWeek = "error";
    console.error(e);
  }
}

function panelHome(AT, RB, model, sim) {
  const p = el("div", "panel"); p.dataset.panel = "home";

  // The front page leads with the season being played, not with a trophy
  // everybody already knows about. Filled in just after first paint.

  const completed = DB.seasons.filter(s => s.complete && Object.keys(s.places).length);
  const cs = completed[0];

  if (champ) {
    const m = DB.mgr.get(champ);
    const bar = el("div", "champbar");
    bar.innerHTML = `<span class="ring">${m && m.avatar
      ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(m.avatar)}" alt="">` : esc(initials(m && m.name))}</span>

    p.appendChild(bar);
  }

  const top = AT[0];
  const tiles = [
    { l: "Seasons played", v: completed.length, n: DB.seasons.length ? `${DB.seasons[DB.seasons.length - 1].season}–${DB.seasons[0].season}` : "" },
    { l: "Games on record", v: DB.games.length, n: "regular season + playoffs" },
    { l: "Best win rate", v: top ? pct(top.winPct) : "—", n: top ? `${nameOf(top.uid)} · ${top.w}-${top.l}` : "" },
    { l: "Highest score ever", v: RB.high ? f2(RB.high.pts) : "—", n: RB.high ? `${nameOf(RB.high.uid)} · ${RB.high.season} week ${RB.high.week}` : "" },
  ];
  const tw = el("div", "tiles");
  tw.innerHTML = tiles.map(t =>
    `<div class="tile"><div class="l">${esc(t.l)}</div><div class="v">${esc(String(t.v))}</div><div class="n">${esc(t.n)}</div></div>`).join("");
  p.appendChild(tw);

  p.appendChild(sechead("Find yourself",
    "Tap anyone to see their whole career — every season, their best and worst weeks, and exactly who they own."));
  p.appendChild(managerGrid(AT));

  p.appendChild(sechead("Who's actually the best?",
    "This ranks everyone by how their weekly score would have done against all 11 other teams that same week — not just the one guy they happened to be scheduled against. It takes luck out of it."));
  p.appendChild(barCard(
    AT.slice().sort((a, b) => b.apPct - a.apPct).map((r, i) => ({ label: `${i + 1}. ${nameOf(r.uid)}`, v: r.apPct, r })),
    v => pct(v),
    it => `<b>${esc(nameOf(it.r.uid))}</b><br>Beat ${it.r.apW} of ${it.r.apW + it.r.apL} teams week-for-week<br>Actual record ${it.r.w}-${it.r.l}`
  ));

  p.appendChild(sechead("Who's been luckiest?",
    "How many more — or fewer — wins each manager has than their scoring earned them. Positive means the schedule has been kind: they keep catching people on their bad weeks."));
  const luck = AT.slice().sort((a, b) => b.luck - a.luck);
  const max = Math.max(...luck.map(r => Math.abs(r.luck)), 0.5);
  const box = el("div", "barbox"), inner = el("div", "bars");
  for (const r of luck) {
    const w = Math.abs(r.luck) / max * 50;
    const style = r.luck >= 0
      ? `left:50%;width:${w.toFixed(1)}%;background:var(--blue)`
      : `right:50%;width:${w.toFixed(1)}%;background:var(--red)`;
    const row = el("div", "divbar");
    row.innerHTML = `<span class="nm">${esc(nameOf(r.uid))}</span>
      <span class="track"><span class="zero"></span><span class="fill" style="${style}"></span></span>
      <span class="v ${r.luck >= 0 ? "pos-t" : "neg-t"}">${r.luck >= 0 ? "+" : ""}${f1(r.luck)}</span>`;
    bindTip(row, `<b>${esc(nameOf(r.uid))}</b><br>Actual ${r.w}-${r.l}<br>Earned about ${f1(r.expW)} wins<br>${r.luck >= 0 ? "Up" : "Down"} ${f1(Math.abs(r.luck))} on luck`);
    inner.appendChild(row);
  }
  box.appendChild(inner); p.appendChild(box);

  /* ---- pre-season outlook: the same model the Odds tab prices from ---- */
  if (model && model.ok && sim) {
    const n = sim.sims;
    const rows = model.teams
      .map((t, i) => ({ uid: t.uid, title: sim.title[i] / n, playoff: sim.playoff[i] / n, wins: sim.wins[i] / n }))
      .sort((a, b) => b.title - a.title);
    p.appendChild(sechead("The opening line",
      `Twenty thousand simulated ${model.season} seasons on the real format — fourteen weeks, three divisions, six playoff spots. ${model.postDraft
        ? "Now that the draft has run, every roster is valued against the pre-draft market, and about half of a team's draft-day edge is carried into its projection."
        : "It is pre-draft, so this knows only how these managers have scored before, and roughly a third of even that is discarded as roster luck. It re-prices itself once you draft."} This is the line as it opened, before a ball was snapped — it does not move. The Odds tab carries the live board beside it and shows its working.`));
    p.appendChild(tableCard(
      [{ label: "Manager" }, { label: "Title odds", num: 1 }, { label: "Makes playoffs", num: 1 }, { label: "Projected wins", num: 1 }],
      rows.map(r => `<tr>
        <td><span class="nmcell">${avatarHTML(r.uid, "sm")}${esc(nameOf(r.uid))}</span></td>
        <td class="num"><b>${(r.title * 100).toFixed(1)}%</b></td>
        <td class="num">${(r.playoff * 100).toFixed(0)}%</td>
        <td class="num">${f1(r.wins)}</td></tr>`)));
  }

  p.appendChild(glossary([
    { t: "Win rate", d: "Regular-season wins divided by games played. Playoffs are counted separately, so these tie out exactly to Sleeper's own standings." },
    { t: "Title odds", d: "From simulating the season twenty thousand times off each manager's scoring history. Entertainment only — it cannot see rosters, trades, injuries, or the draft. The Odds tab explains exactly how little it knows." },
    { t: "Points / points allowed", d: "Total fantasy points your lineup scored, and the total your opponents put up against you." },
    { t: "Beat-everyone rate", d: "If you had played all 11 other teams every single week, what share would you have beaten? The fairest measure of how good someone actually is." },
    { t: "Luck", d: "Actual wins minus the wins your scoring earned. +2 means you've won two more games than your points deserved." },
  ]));
  return p;
}

/* ---------------------------------------------- manager grid + profile */
function managerGrid(AT) {

let LAST_TAB = "home";
function openProfile(uid) {
  const cur = [...$("#app").children].find(c => !c.hidden);
  if (cur && cur.dataset.panel !== "profile") LAST_TAB = cur.dataset.panel;
  const old = $('[data-panel="profile"]');
  if (old) old.remove();
  const p = buildProfile(uid);
  $("#app").appendChild(p);
  for (const c of $("#app").children) c.hidden = c !== p;
  for (const b of $("#tabs").children) b.setAttribute("aria-selected", "false");
  scrollTo(0, 0);
}

function buildProfile(uid) {
  const p = el("div", "panel"); p.dataset.panel = "profile";
  const AT = window.__AT, RB = window.__RB, M = window.__H2H;
  const r = AT.find(x => x.uid === uid);

  const back = el("button", "back", "← Back");
  back.onclick = () => show(LAST_TAB);
  p.appendChild(back);

  const head = el("div", "phead");
  head.innerHTML = `${avatarHTML(uid, "lg")}
    <span><div class="nm">${esc(nameOf(uid))}</div>
    ${teamOf(uid) ? `<div class="tm">${esc(teamOf(uid))}</div>` : ""}</span>`;
  p.appendChild(head);

  const bits = [];
  if (r.titles) bits.push(`<span class="badge gold">${r.titles}× champion</span>`);
  if (r.podium) bits.push(`<span class="badge blue">${r.podium}× top 3</span>`);
  if (r.playoffs) bits.push(`<span class="badge blue">${r.playoffs}× playoffs</span>`);
  if (r.lasts) bits.push(`<span class="badge red">${r.lasts}× last place</span>`);
  if (bits.length) { const b = el("div", "pbadges"); b.innerHTML = bits.join(""); p.appendChild(b); }

  const t = el("div", "tiles");
  t.innerHTML = [
    { l: "Career record", v: `${r.w}-${r.l}${r.t ? "-" + r.t : ""}`, n: `${pct(r.winPct)} · ${r.nSeasons} season${r.nSeasons === 1 ? "" : "s"}` },
    { l: "Points per game", v: f1(r.ppg), n: `${f1(r.papg)} allowed per game` },
    { l: "Best finish", v: r.best < 99 ? ord(r.best) : "—", n: r.titles ? "won it all" : "so far" },
    { l: "Luck", v: `${r.luck >= 0 ? "+" : ""}${f1(r.luck)}`, n: r.luck >= 0 ? "wins above what he earned" : "wins below what he earned" },
  ].map(x => `<div class="tile"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div><div class="n">${esc(x.n)}</div></div>`).join("");
  p.appendChild(t);

  const mine = RB.sides.filter(s => s.uid === uid);
  const hi = mine.slice().sort((a, b) => b.pts - a.pts)[0];
  const lo = mine.slice().sort((a, b) => a.pts - b.pts)[0];
  const st = RB.perMgr.get(uid) || {};
  p.appendChild(sechead("Career highs and lows"));
  const rc = el("div", "recs");
  rc.innerHTML = [
    hi && { c: "up", l: "Best week ever", v: f2(hi.pts), w: `vs ${nameOf(hi.opp.uid)}`, x: `${hi.season} · week ${hi.week}${hi.playoff ? " (playoffs)" : ""} · ${hi.pts > hi.opp.pts ? "won" : "still lost"}` },
    lo && { c: "down", l: "Worst week ever", v: f2(lo.pts), w: `vs ${nameOf(lo.opp.uid)}`, x: `${lo.season} · week ${lo.week}${lo.playoff ? " (playoffs)" : ""} · ${lo.pts > lo.opp.pts ? "somehow won" : "lost"}` },
    st.bestWin && { c: "up", l: "Longest win streak", v: st.bestWin + "W", w: "in a row", x: "regular season, all years" },
    st.worstLoss && { c: "down", l: "Longest losing streak", v: st.worstLoss + "L", w: "in a row", x: "regular season, all years" },
  ].filter(Boolean).map(x =>
    `<div class="rec ${x.c}"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div>
     <div class="w">${esc(x.w)}</div><div class="c">${esc(x.x)}</div></div>`).join("");
  p.appendChild(rc);

  p.appendChild(sechead("Season by season"));
  const rows = [];
  for (const s of DB.seasons) {
    let w = 0, l = 0, tt = 0, pf = 0, pa = 0;
    for (const g of s.games) {
      if (g.playoff) continue;
      for (const [me, op] of [[g.a, g.b], [g.b, g.a]]) {
        if (me.uid !== uid) continue;
        if (me.pts > op.pts) w++; else if (me.pts < op.pts) l++; else tt++;
        pf += me.pts; pa += op.pts;
      }
    }
    if (!(w + l + tt)) continue;
    let place = null;
    for (const [pl, rid] of Object.entries(s.places)) if (s.uidOf.get(Number(rid)) === uid) place = Number(pl);
    rows.push(`<tr>
      <td>${esc(s.season)}${place === 1 ? ' <span class="badge gold">CHAMP</span>' : ""}</td>
      <td class="num">${place ? ord(place) : "—"}</td>
      <td class="num">${w}-${l}${tt ? "-" + tt : ""}</td>
      <td class="num">${f2(pf)}</td><td class="num">${f2(pa)}</td>
      <td class="num">${f1(pf / (w + l + tt))}</td></tr>`);
  }
  p.appendChild(tableCard([{ label: "Season" }, { label: "Finish", num: 1 }, { label: "Record", num: 1 },
  { label: "Points", num: 1 }, { label: "Allowed", num: 1 }, { label: "Per game", num: 1 }], rows));

  const vs = [];
  for (const other of AT) {
    if (other.uid === uid) continue;
    const c = M.get(uid + "|" + other.uid);
    if (!c) continue;
    const n = c.w + c.l + c.t;
    if (!n) continue;
    vs.push({ uid: other.uid, ...c, n, edge: (c.w - c.l) / n });
  }
  if (vs.length) {
    p.appendChild(sechead("Who he owns, and who owns him", "All-time head-to-head, playoffs included."));
    const rr = vs.slice().sort((a, b) => b.edge - a.edge || b.n - a.n).map(v => `<tr>
      <td><span class="nmcell">${avatarHTML(v.uid, "sm")}${esc(nameOf(v.uid))}</span></td>
      <td class="num ${v.w > v.l ? "pos-t" : v.l > v.w ? "neg-t" : ""}"><b>${v.w}-${v.l}${v.t ? "-" + v.t : ""}</b></td>
      <td class="num">${f1(v.pf / v.n)}</td><td class="num">${f1(v.pa / v.n)}</td></tr>`);
    p.appendChild(tableCard([{ label: "Opponent" }, { label: "Record vs", num: 1 },
    { label: "His avg", num: 1 }, { label: "Their avg", num: 1 }], rr));
  }
  return p;
}

/* =========================================== MANAGERS =============== */
function panelManagers(AT) {
  const p = el("div", "panel"); p.dataset.panel = "managers";
  p.appendChild(sechead("Every manager", "Tap anyone for their full career. Sort the list however you like."));

  const sel = el("select");
  sel.setAttribute("aria-label", "Sort managers by");
  [["win", "Best win rate"], ["ppg", "Most points per game"], ["titles", "Most championships"],

    .forEach(([v, t]) => { const o = el("option", null, t); o.value = v; sel.appendChild(o); });
  const wrap = el("div"); wrap.style.cssText = "margin:0 0 14px;max-width:260px";
  wrap.appendChild(sel); p.appendChild(wrap);

            s === "unluck" ? a.luck - b.luck :
              s === "az" ? nameOf(a.uid).toLowerCase().localeCompare(nameOf(b.uid).toLowerCase()) :
                b.winPct - a.winPct);
    host.innerHTML = "";

          ${r.titles ? `<span class="badge gold">${r.titles}×</span>` : ""}</span>
          <span class="s">${esc(teamOf(r.uid) || `${r.nSeasons} season${r.nSeasons === 1 ? "" : "s"}`)}</span></span>
        <span class="stats">

          <span class="chip ${r.luck >= 0 ? "pos-v" : "neg-v"}"><span class="cv">${r.luck >= 0 ? "+" : ""}${f1(r.luck)}</span><span class="cl">Luck</span></span>

    { t: "Win rate", d: "Wins divided by games played." },
    { t: "Pts/gm", d: "Average fantasy points scored per week." },
    { t: "Luck", d: "Wins above or below what their scoring earned. Positive means the schedule has been friendly." },
  ]));
  return p;
}

    RB.streakW && RB.streakW.uid && { c: "up", l: "Longest win streak", v: RB.streakW.n + "W", w: nameOf(RB.streakW.uid), x: `ended ${RB.streakW.end.season} week ${RB.streakW.end.week}` },

  const rg = el("div", "recs");

        line("💤", "Sleepwalker", "Fewest total points scored", a.sleepwalker, f1(a.sleepwalker && a.sleepwalker.total)),
        line("📏", "Mr. Consistent", "Same score every week", a.consistent, "±" + f1(a.consistent && a.consistent.sd)),
        line("🎢", "Boom or Bust", "Wildest week-to-week swings", a.boom, "±" + f1(a.boom && a.boom.sd)),

        line("🍀", "Daylight Robbery", "Wins despite scoring below the league's middle that week", a.thief, (a.thief && a.thief.stolen) + " times"),
        line("📄", "Paper Champion", "Best regular-season record, no title", a.paper, a.paper ? `${a.paper.w}-${a.paper.l}` : ""),

      .sort((a, b) => b.hi - a.hi || a.lo - b.lo)
      .map(x => `<tr>

/* ============================================ MATCHUPS ============== */
function panelMatchups(AT) {
  const p = el("div", "panel"); p.dataset.panel = "matchups";
  const M = window.__H2H;
  const uids = AT.map(r => r.uid);

  p.appendChild(sechead("Settle it", "Pick any two managers and see the all-time series between them."));
  const cmp = el("div", "compare");
  const pick = el("div", "cpick");
  const s1 = el("select"), s2 = el("select");
  s1.setAttribute("aria-label", "First manager"); s2.setAttribute("aria-label", "Second manager");
  uids.forEach(u => {
    const a = el("option", null, nameOf(u)); a.value = u; s1.appendChild(a);
    const b = el("option", null, nameOf(u)); b.value = u; s2.appendChild(b);
  });
  s2.selectedIndex = Math.min(1, uids.length - 1);
  pick.appendChild(s1); pick.appendChild(el("span", "vs", "VS")); pick.appendChild(s2);
  cmp.appendChild(pick);
  const out = el("div", "cout"); cmp.appendChild(out);

  function drawCmp() {
    const a = s1.value, b = s2.value;
    out.innerHTML = "";
    if (a === b) { out.appendChild(el("div", "empty", "<b>Pick two different managers</b>")); return; }
    const c = M.get(a + "|" + b);
    const n = c ? c.w + c.l + c.t : 0;
    if (!n) { out.appendChild(el("div", "empty", `<b>They've never played</b>${esc(nameOf(a))} and ${esc(nameOf(b))} have never met.`)); return; }
    const sc = el("div", "cscore");
    sc.innerHTML = `<div><div class="big" style="color:${c.w >= c.l ? "var(--blue)" : "var(--ink-2)"}">${c.w}</div>
        <div class="lbl">${esc(nameOf(a))}</div></div>
      <div class="dash">—</div>
      <div><div class="big" style="color:${c.l > c.w ? "var(--blue)" : "var(--ink-2)"}">${c.l}</div>
        <div class="lbl">${esc(nameOf(b))}</div></div>`;
    out.appendChild(sc);
    const avgA = c.pf / n, avgB = c.pa / n;
    const meta = el("div", "cmeta");
    meta.innerHTML = `<span class="badge">${n} meeting${n === 1 ? "" : "s"}</span>
      <span class="badge">${f1(avgA)} — ${f1(avgB)} avg score</span>
      <span class="badge ${avgA >= avgB ? "blue" : "red"}">${avgA >= avgB ? "+" : ""}${f1(avgA - avgB)} avg margin</span>
      ${c.t ? `<span class="badge">${c.t} tie${c.t === 1 ? "" : "s"}</span>` : ""}`;
    out.appendChild(meta);

    const wp = winProb(a, b, window.__DIST);
    if (wp != null) {
      const proj = el("div");
      proj.style.cssText = "margin-top:15px;padding-top:14px;border-top:1px solid var(--grid);text-align:center";
      const fav = wp >= 0.5 ? a : b, favP = Math.max(wp, 1 - wp);
      proj.innerHTML = `<div style="font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600">
          If they played this week</div>
        <div style="font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:5px">
          ${esc(nameOf(fav))} <span style="color:var(--blue)">${pct(favP)}</span></div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5">
          Based only on how much each has scored per week and how much that bounces around.
          It knows nothing about their actual rosters.</div>`;
      out.appendChild(proj);
    }
  }
  s1.onchange = drawCmp; s2.onchange = drawCmp; drawCmp();
  p.appendChild(cmp);

  p.appendChild(sechead("The whole grid",
    "Read across: each row's manager against every other. Blue means that row is winning the series, red means losing. Swipe sideways on a phone."));
  const c = el("div", "card"), sc = el("div", "scroll"), t = el("table", "h2h");
  t.innerHTML = `<thead><tr><th>Manager</th>${uids.map(u =>
    `<th class="rot num" title="${esc(nameOf(u))}">${esc(nameOf(u).slice(0, 7))}</th>`).join("")}<th class="num">Total</th></tr></thead>`;
  const tb = el("tbody");
  for (const a of uids) {
    let tw = 0, tl = 0;
    const cells = uids.map(b => {
      if (a === b) return `<td class="cell self">—</td>`;
      const r = M.get(a + "|" + b);
      const n = r ? r.w + r.l + r.t : 0;
      if (!n) return `<td class="cell" style="color:var(--muted)">·</td>`;
      tw += r.w; tl += r.l;
      return `<td class="cell" data-a="${esc(a)}" data-b="${esc(b)}" style="background:${divergeColor((r.w - r.l) / n, 1)}">${r.w}-${r.l}${r.t ? "-" + r.t : ""}</td>`;
    }).join("");
    const tr = el("tr");
    tr.innerHTML = `<td><span class="nmcell">${avatarHTML(a, "sm")}${esc(nameOf(a))}</span></td>${cells}<td class="num"><b>${tw}-${tl}</b></td>`;
    tb.appendChild(tr);
  }
  t.appendChild(tb); sc.appendChild(t); c.appendChild(sc); p.appendChild(c);
  for (const td of t.querySelectorAll("td.cell[data-a]")) {
    const r = M.get(td.dataset.a + "|" + td.dataset.b);
    const n = r.w + r.l + r.t, avg = (r.pf - r.pa) / n;
    bindTip(td, `<b>${esc(nameOf(td.dataset.a))}</b> vs <b>${esc(nameOf(td.dataset.b))}</b><br>
      ${r.w}-${r.l}${r.t ? "-" + r.t : ""} in ${n} meeting${n === 1 ? "" : "s"}<br>
      Avg margin ${avg >= 0 ? "+" : ""}${f1(avg)}`);
  }
  const leg = el("div", "legend");
  leg.innerHTML = `<span>Row is losing</span>
    <span class="ramp"><i style="background:rgba(230,103,103,.95)"></i><i style="background:rgba(230,103,103,.5)"></i>
    <i style="background:var(--mid)"></i><i style="background:rgba(57,135,229,.5)"></i><i style="background:rgba(57,135,229,.95)"></i></span>
    <span>Row is winning</span>`;
  p.appendChild(leg);

  const seen = new Set(), pairs = [];
  for (const [k, r] of M) {
    const [a, b] = k.split("|");
    if (seen.has(b + "|" + a)) continue;
    seen.add(k);
    const n = r.w + r.l + r.t;
    if (n < 3) continue;
    pairs.push({ a, b, ...r, n, edge: Math.abs(r.w - r.l) / n });
  }
  if (pairs.length) {
    const rrow = r => `<tr><td>${esc(nameOf(r.a))} vs ${esc(nameOf(r.b))}</td>
      <td class="num">${r.w}-${r.l}${r.t ? "-" + r.t : ""}</td><td class="num">${r.n}</td>
      <td class="num">${f1(r.pf / r.n)} — ${f1(r.pa / r.n)}</td></tr>`;
    const rhead = [{ label: "Matchup" }, { label: "Series", num: 1 }, { label: "Games", num: 1 }, { label: "Avg score", num: 1 }];
    p.appendChild(sechead("Real rivalries", "Dead-even series with at least three meetings."));
    p.appendChild(tableCard(rhead, pairs.slice().sort((x, y) => x.edge - y.edge || y.n - x.n).slice(0, 6).map(rrow)));
    p.appendChild(sechead("Somebody owns somebody", "The most lopsided series in league history."));
    p.appendChild(tableCard(rhead, pairs.slice().sort((x, y) => y.edge - x.edge || y.n - x.n).slice(0, 6).map(rrow)));
  }

  /* ---- what-if schedule swap ---- */
  const WI = whatIfSchedules();
  const actual = new Map(AT.map(r => [r.uid, r.w]));
  p.appendChild(sechead("What if you'd had his schedule?",
    "Every manager's real weekly scores replayed against somebody else's opponents. Read across: the row's manager, playing the column's schedule. Blue means they'd have won more than they actually did."));
  const wc = el("div", "card"), wsc = el("div", "scroll"), wt = el("table", "h2h wi");
  wt.innerHTML = `<thead><tr><th>Manager</th>${uids.map(u =>
    `<th class="rot num" title="${esc(nameOf(u))}'s schedule">${esc(nameOf(u).slice(0, 7))}</th>`).join("")}</tr></thead>`;
  const wtb = el("tbody");
  let bestSwing = null;
  for (const a of uids) {
    const act = actual.get(a) || 0;
    const cells = uids.map(b => {
      const r = WI.get(a + "|" + b);

/**
 * Who moved on the power board that week, computed here rather than written by
 * the weekly job. The job writes about what happened; the ranking is the site's
 * own arithmetic, so the two can never contradict each other on a number.
 */
function weekMovers(season, week, k = 3) {
  const R = allPowerRankings().get(String(season)) || null;
  if (!R) return null;
  const i = R.weeks.indexOf(Number(week));
  if (i < 1) return null;                       // week one has nothing behind it
  const rows = R.boards[i].rows.filter(r => r.move != null);
  if (!rows.length) return null;
  const up = rows.filter(r => r.move > 0).sort((a, b) => b.move - a.move).slice(0, k);
  const down = rows.filter(r => r.move < 0).sort((a, b) => a.move - b.move).slice(0, k);
  if (!up.length && !down.length) return null;
  return { up, down };
}
