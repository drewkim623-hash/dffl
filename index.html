    ? { layout: "versus", a: n1, aPts: v1, b: n2, bPts: v2 } : { layout: "title" };
  if (c.trade && c.trade.a && c.trade.b) return { layout: "trade", ...c.trade };
  if (c.matchup && c.matchup.a && c.matchup.b) return versus(c.matchup.a, c.matchup.aPts, c.matchup.b, c.matchup.bPts);
  if (kind === "recap" || kind === "preview") {
    for (const b of blocks.filter(b => b.type === "p")) {
      const m = String(b.text || "").match(/<b>\s*([^<,]+?)\s+(\d+(?:\.\d+)?),\s*([^<,]+?)\s+(\d+(?:\.\d+)?)\.?\s*<\/b>/);
      if (m) return { ...versus(m[1], m[2], m[3], m[4]), result: true };
    }
  }
  if (kind === "odds" || kind === "analysis") {
    const cards = blocks.find(b => b.type === "cards" && (b.items || []).length === 2);
    if (cards) {
      const [x, y] = cards.items.map(i => i || {});
      return versus(x.title, x.big, y.title, y.big);
    }
  }
  const stat = blocks.find(b => b.type === "stat");
  if (stat && plainText(stat.n) && plainText(stat.n).length <= 8) return { layout: "stat", n: stat.n };
  return { layout: "title" };
}

/** The cover art as an inline SVG string: a pure function of the article, cached per article and size. */
function coverSVG(a, big) {
  const v = coverVariant(big), key = (a.slug || `${a.headline}|${a.date}`) + "|" + v;
  if (COVER_CACHE.has(key)) return COVER_CACHE.get(key);
  const G = COVER_GEOM[v], { W, H, pad } = G, small = v === "card", T = COVER_TYPE;
  const c = a.cover || {}, kind = coverKind(a), P = COVER_PALETTE[kind];
  const rnd = coverSeed(`${a.slug || a.headline}|${a.season}|${a.date}`);
  const WHITE = COVER_VARS.ink, INK2 = COVER_VARS["ink-2"];

  // Headshots take the right-hand side (more than a row's worth go two by two);
  // the text column stops short of them.
  const nf = Math.min(coverPlayers(a).length, G.faces), cols = nf > G.perRow ? Math.ceil(nf / 2) : nf;
  const facesW = nf ? W * (cols * G.fw - (cols - 1) * G.fo) : 0;
  const tw = nf ? W - pad - facesW - W * G.fp - pad * .75 : W - 2 * pad;

  // Ground: the gradient, a scrim behind the words, and the base colour at the foot.
  const ang = Math.round(115 + rnd() * 50);
  const bg = `${COVER_SCRIM},linear-gradient(180deg,rgba(0,0,0,0) 62%,${P.to}),linear-gradient(${ang}deg,${P.from},${P.to})`;

  // Field: yard lines (straight or raked), hash marks, an end zone. Drawn to twice
  // the height so that beside a taller teaser the field runs on below the art
  // (the svg overflows; .cover clips it).
  const step = W / 8, ph = rnd() * step, rake = [0, .16, -.16][Math.floor(rnd() * 3)], H2 = H * 2;
  let lines = "", hashes = "";
  for (let x = ph - 3 * step; x < W + 3 * step; x += step) {
    lines += `M${cr(x)} 0L${cr(x + rake * H2)} ${H2}`;
    for (let k = 1; k < 5; k++) for (const hy of [.3, .66, 1.3, 1.66]) {
      const hx = x + k * step / 5 + rake * H * hy;
      if (hx > 0 && hx < W) hashes += `M${cr(hx)} ${cr(H * hy)}v${cr(H * .045)}`;
    }
  }
  const ez = step * (.55 + rnd() * .3);
  const field = `<path d="${lines}" stroke="${WHITE}" stroke-opacity=".1" stroke-width="${small ? 1 : 1.6}"/>` +
    `<path d="${hashes}" stroke="${WHITE}" stroke-opacity=".12" stroke-width="${small ? 1 : 1.6}"/>` +
    `<rect x="${cr(W - ez)}" y="0" width="${cr(ez)}" height="${H2}" fill="${P.accent2}" fill-opacity=".1"/>`;

  // Label and wordmark. A card sits beside its own kicker, so its label is just the
  // week and the kind; the hero says the caption, or the kicker, in full.
  const kick = plainText(a.kicker), wk = a.week != null ? a.week : (kick.match(/\bweek (\d+)\b/i) || [])[1];
  const labelRaw = (small ? [wk != null ? `week ${wk}` : "", kind].filter(Boolean).join(" · ")
    : plainText(c.caption) || kick || [a.season, wk != null ? `week ${wk}` : ""].filter(Boolean).join(" · ") || kind)
    .toUpperCase();
  const yL = pad + G.label * .75, ruleY = yL + G.label * .6, ceil = ruleY + pad * .6;
  const wmW = coverWidth("DFFL", G.label, T.mark), labelW = W - 3 * pad - wmW;
  const L = coverSize(labelRaw, [1, .92, .84, .76].map(k => cr(G.label * k)), labelW, 1, T.label);
  const label = coverText(pad, yL, L.lines[0], L.fs, INK2, T.label, labelW, ` class="cv-label"`) +
    `<path d="M${pad} ${cr(ruleY)}h${cr(G.label * 2.2)}" stroke="${P.accent}" stroke-width="${small ? 2 : 3}"/>` +
    coverText(W - pad, yL, "DFFL", G.label, INK2, T.mark, W - 2 * pad, ` class="cv-mark" text-anchor="end"`);

  // Subject. put() also keeps track of how high the words reach, for the emblem.
  const S = coverSubject(a, kind), yB = H - pad - 2;
  const head = plainText(a.headline).toUpperCase();
  let main = "", layout = S.layout, top = yB, statBox = null;
  const put = (x, y, s, fs, ...rest) => { top = Math.min(top, y - fs * .76); return coverText(x, y, s, fs, ...rest); };
  if (layout === "versus") {
    const rows = [[S.a, S.aPts], [S.b, S.bPts]].map(([n, p]) => [plainText(n), plainText(p)]);
    let fs, numW, numMax, nameW, names;
    for (fs of G.row) {
      numW = Math.max(...rows.map(r => coverWidth(r[1], fs, T.row)));
      numMax = Math.min(numW, tw * .45 * COVER_SAFE) / COVER_SAFE;
      nameW = tw - numMax * COVER_SAFE - fs * .6;
      names = rows.map(r => coverFit(r[0], fs, nameW, T.row));
      if (numW <= tw * .45 * COVER_SAFE &&
        names.every((n, i) => n === rows[i][0] && coverFits(n, fs, nameW, T.row))) break;
    }
    const lead = coverLead(a, rows.map(r => r[0]), rows.map(r => coverVal(r[1])), S.result);
    const y2 = H - pad - fs * .22, y1 = y2 - fs * 1.4, ry = (y1 + fs * .22 + y2 - fs * .74) / 2;
    main = rows.map((r, i) => {
      const fill = lead === -1 || lead === i ? WHITE : INK2, y = i ? y2 : y1;
      return put(pad, y, names[i], fs, fill, T.row, nameW, ` class="cv-name"`) +
        put(pad + tw, y, r[1], fs, fill, T.row, numMax, ` class="cv-num" text-anchor="end"`);
    }).join("") + `<path d="M${pad} ${cr(ry)}H${cr(pad + tw)}" stroke="${P.accent}" stroke-opacity=".8" stroke-width="${small ? 1.5 : 2}"/>`;
  } else if (layout === "trade") {
    const gets = [S.aGets, S.bGets].map(g => (Array.isArray(g) ? g : []).slice(0, 2).map(plainText));
    const np = Math.max(1, ...gets.map(g => g.length)), sides = [S.a, S.b].map(plainText);
    let fs, colW, teams;
    for (fs of G.row) {
      colW = (tw - fs * 1.5) / 2;
      teams = sides.map(t => coverFit(t, fs, colW, T.row));
      if (teams.every((t, i) => t === sides[i] && coverFits(t, fs, colW, T.row))) break;
    }
    const pl = G.who * 1.35, yT = yB - np * pl - G.who * .2;
    const cx = pad + colW + fs * .75, cy = yT - fs * .36, aw = fs * .5, ah = fs * .13;
    main = [0, 1].map(i => {
      const x = pad + i * (colW + fs * 1.5);
      return put(x, yT, teams[i], fs, WHITE, T.row, colW, ` class="cv-team"`) + gets[i].map((p, j) => {
        const Q = coverSize(p, [1, .9, .8].map(k => cr(G.who * k)), colW, 1, T.who);
        return put(x, yT + pl * (j + 1), Q.lines[0], Q.fs, INK2, T.who, colW, ` class="cv-who"`);
      }).join("");
    }).join("") +
      `<path d="M${cr(cx - aw)} ${cr(cy - ah)}H${cr(cx + aw)}m${cr(-ah * 1.4)} ${cr(-ah * 1.4)}l${cr(ah * 1.4)} ${cr(ah * 1.4)}l${cr(-ah * 1.4)} ${cr(ah * 1.4)}` +
      `M${cr(cx + aw)} ${cr(cy + ah)}H${cr(cx - aw)}m${cr(ah * 1.4)} ${cr(-ah * 1.4)}l${cr(-ah * 1.4)} ${cr(ah * 1.4)}l${cr(ah * 1.4)} ${cr(ah * 1.4)}"` +
      ` fill="none" stroke="${P.accent}" stroke-width="${cr(fs * .09)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (layout === "stat") {
    // The headline gets up to three lines, as small as it takes to read in full, so long
    // as the smallest figure still fits above it; then the figure is as big as the rest allows.
    const n = plainText(S.n), minN = G.stat[G.stat.length - 1];
    const subTop = r => yB - (r.lines.length - 1) * r.fs * 1.08 - r.fs * .74;
    const subRoom = r => subTop(r) - minN * .98 >= ceil, Sub2 = coverSize(head, G.sub, tw, 2, T.sub, subRoom);
    const Sub = Sub2.cut || !subRoom(Sub2) ? coverSize(head, G.sub, tw, 3, T.sub, subRoom) : Sub2;
    const sl = Sub.fs * 1.08, ys = yB - (Sub.lines.length - 1) * sl;
    const yN = fs => subTop(Sub) - fs * .22;   // clear of the sub line, even under a "/" or a "$"
    const N = coverSize(n, G.stat, tw, 1, T.stat, r => yN(r.fs) - r.fs * .76 >= ceil);
    statBox = { right: pad + Math.min(coverWidth(N.lines[0], N.fs, T.stat), tw * COVER_SAFE), bottom: subTop(Sub) };
    main = put(pad, yN(N.fs), N.lines[0], N.fs, WHITE, T.stat, tw, ` class="cv-stat"`) +
      Sub.lines.map((l, i) => put(pad, ys + i * sl, l, Sub.fs, INK2, T.sub, tw, ` class="cv-sub"`)).join("");
  } else if (head) {
    // Up to three lines, as small as it takes to read in full before anything is cut.
    const Hd = coverSize(head, G.title, tw, 3, T.head, r => r.fs * .76 + (r.lines.length - 1) * r.fs * 1.02 <= yB - ceil);
    const lh = Hd.fs * 1.02, y0 = yB - (Hd.lines.length - 1) * lh;
    main = Hd.lines.map((l, i) => put(pad, y0 + i * lh, l, Hd.fs, WHITE, T.head, tw, ` class="cv-title"`)).join("");
  }

  // Emblem: faint. Under the headshots when there are any; otherwise up on the right,
  // in the clear band between the label row and the words, or, on a stat cover, beside
  // the figure (clear of its measured width) and above the lines under it. Left out
  // when neither has room, so it never sits under the text.
  const emblemAt = (ex, ey, R) => `<path d="${COVER_EMBLEMS[kind]}" transform="translate(${cr(ex - R)} ${cr(ey - R)}) scale(${cr(R / 50 * 100) / 100})"` +
    ` fill="none" stroke="${P.accent}" stroke-opacity=".24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
  let emblem = "";
  if (nf) emblem = emblemAt(W - W * G.fp - facesW / 2, H / 2, H * .3);
  else {
    const lo = ruleY + pad * .5, hi = top - pad * .5, R = Math.min(H * .3, (hi - lo) / 2);
    if (R >= H * .08) emblem = emblemAt(W - pad - R, (lo + hi) / 2, R);
    else if (statBox) {
      const sHi = statBox.bottom - pad * .5, sR = Math.min(H * .3, (sHi - lo) / 2, (W - pad - statBox.right - pad) / 2);
      if (sR >= H * .08) emblem = emblemAt(W - pad - sR, (lo + sHi) / 2, sR);
    }
  }

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet" overflow="visible"` +
    ` aria-hidden="true" focusable="false" data-kind="${kind}" data-layout="${layout}" data-variant="${v}"` +
    ` font-family="${COVER_FONT}" style="background:${bg}">` +
    `${field}${emblem}${label}${main}</svg>`;
  COVER_CACHE.set(key, svg);
  return svg;
}
coverSVG.cache = COVER_CACHE;

function coverHTML(a, big) {
  const v = coverVariant(big), kind = coverKind(a), G = COVER_GEOM[v];
  const ids = coverPlayers(a).slice(0, G.faces);
  const faces = ids.map(id =>
    `<img src="https://sleepercdn.com/content/nfl/players/${esc(String(id))}.jpg" alt=""
      loading="lazy" onerror="this.remove()">`).join("");
  return `<div class="cover k-${kind}${v !== "card" ? " big" : ""}${v === "wide" ? " wide" : ""}" style="background:${COVER_SCRIM},${COVER_PALETTE[kind].to}">${coverSVG(a, v)}${
    faces ? `<div class="faces${ids.length > G.perRow ? " two" : ""}">${faces}</div>` : ""}</div>`;
}
// Crossing the desktop breakpoint redraws an open article's hero at the other shape.
if (typeof matchMedia === "function") matchMedia(COVER_WIDE_MQ).addEventListener("change", () => {
  for (const old of document.querySelectorAll(".cover.big")) {
    if (!old._art) continue;
    const box = document.createElement("div");
    box.innerHTML = coverHTML(old._art, true);
    box.firstElementChild._art = old._art;
    old.replaceWith(box.firstElementChild);
  }
});

/** A postseason bracket, exactly as it was played. */
function bracketHTML(b) {
  const rounds = [...new Set((b.matches || []).map(m => m.round))].sort((x, y) => x - y);
  const cols = rounds.map(r => {
    const ms = (b.matches || []).filter(m => m.round === r);
    return `<div class="brd"><div class="brh">${esc(b.roundNames && b.roundNames[r - 1] || `Round ${r}`)}</div>
      ${ms.map(m => {
        const side = (nm, won) => `<div class="bside${won ? " won" : ""}">
          <span class="n">${esc(nm || "—")}</span></div>`;
        return `<div class="brm${m.place ? " placed" : ""}">
          ${m.place ? `<div class="bpl">${esc(m.place)}</div>` : ""}
          ${side(m.a, m.winner === m.a)}${side(m.b, m.winner === m.b)}</div>`;
      }).join("")}</div>`;
  }).join("");
  return `<div class="bracket"><div class="brt">${esc(b.title || "")}</div>
    ${b.sub ? `<div class="brs">${esc(b.sub)}</div>` : ""}
    <div class="scroll"><div class="brcols">${cols}</div></div></div>`;
}

function articleBlock(b) {
  switch (b && b.type) {
    case "p":
      return `<p class="${b.lead ? "apara lead" : "apara"}">${artText(b.text)}</p>`;
    case "h":
      return `<div class="ahead">${b.eyebrow ? `<div class="ae">${esc(b.eyebrow)}</div>` : ""}
        <h3>${esc(b.text || "")}</h3></div>`;
    case "stat":
      return `<div class="astat"><span class="n">${esc(b.n || "")}</span>
        <span class="t">${artText(b.text)}</span></div>`;
    case "note":
      return `<p class="anote">${artText(b.text)}</p>`;
    case "bracket":
      return bracketHTML(b);
    case "bars": {
      // Diverging about zero, scaled to the biggest swing either way.
      const rows = b.rows || [];
      const max = Math.max(1e-9, ...rows.map(r => Math.abs(Number(r.value) || 0)));
      const body = rows.map(r => {
        const v = Number(r.value) || 0, w = Math.abs(v) / max * 50;
        const left = v >= 0 ? 50 : 50 - w;
        return `<div class="abar g${Number(r.group) || 1}">
          <span class="who">${esc(r.label || "")}${r.sub ? `<i>${esc(r.sub)}</i>` : ""}</span>
          <span class="track"><span class="zero"></span>
            <span class="fill" style="left:${left.toFixed(1)}%;width:${w.toFixed(1)}%"></span></span>
          <span class="v">${v >= 0 ? "+" : "−"}${f1(Math.abs(v))}</span></div>`;
      }).join("");
      return `<div class="abars"><div class="at">${esc(b.title || "")}</div>
        ${b.sub ? `<div class="as">${esc(b.sub)}</div>` : ""}<div class="abody">${body}</div></div>`;
    }
    case "cards":
      return `<div class="acards">${(b.items || []).map(c => `
        <div class="acard${c.lead ? " lead" : ""}">
          <div class="ct">${esc(c.title || "")}</div>
          <div class="cb">${esc(c.big || "")}</div>
          <div class="cs">${esc(c.sub || "")}</div>
          <div class="cr">${(c.rows || []).map(r =>
            `<span><i>${esc(r.label || "")}</i><b>${esc(r.value || "")}</b></span>`).join("")}</div>
        </div>`).join("")}</div>`;
    case "picks":
      return `<div class="apicks">${(b.items || []).map(x => `
        <div class="apick"><span class="sl">${esc(x.slot || "")}</span>
          <span class="nm">${esc(x.name || "")}${x.sub ? `<i>${esc(x.sub)}</i>` : ""}</span>
          <span class="dl">${esc(x.delta || "")}</span></div>`).join("")}</div>`;
    default:
      return "";
  }
}

/** The index entry: cover, headline, standfirst. The whole thing is the link. */
function articleTeaser(a) {
  const card = el("button", `teaser${a.kind === "opinion" ? " op" : ""}`);
  const when = a.date ? new Date(a.date + "T12:00:00Z").toLocaleDateString(undefined,
    { day: "numeric", month: "long", year: "numeric" }) : "";
  card.innerHTML = `${coverHTML(a, false)}
    <div class="tbody">
      ${a.kind === "opinion" ? `<div class="oflag">Column</div>` : ""}
      ${a.kicker ? `<div class="ak">${esc(a.kicker)}</div>` : ""}
      <h3>${esc(a.headline || "")}</h3>
      ${a.dek ? `<p class="tdek">${esc(a.dek)}</p>` : ""}
      <div class="aby">${a.byline ? `<b>${esc(a.byline)}</b>` : ""}${when ? `<span>${esc(when)}</span>` : ""}
        <span class="more">Read →</span></div>
    </div>`;
  card.onclick = () => openArticle(a);
  return card;
}

let LAST_TAB_ART = "recaps";
/**
 * Open a piece, and give it an address.
 *
 * The weekly email links straight at an article, so an article has to be
 * something a URL can point at. #article/<slug> is that address: it survives a
 * reload, it can be pasted into the league chat, and the back button leaves it.
 */
function openArticle(a, keepHash) {
  const cur = [...$("#app").children].find(c => !c.hidden);
  if (cur && cur.dataset.panel !== "article") LAST_TAB_ART = cur.dataset.panel;
  const old = $('[data-panel="article"]');
  if (old) old.remove();
  const p = el("div", "panel"); p.dataset.panel = "article";
  const back = el("button", "back", "← All articles");
  back.onclick = () => show(LAST_TAB_ART);   // show() rewrites the hash to the tab
  p.appendChild(back);
  p.appendChild(articleCard(a, true));
  $("#app").appendChild(p);
  for (const c of $("#app").children) c.hidden = c !== p;
  for (const b of $("#tabs").children) b.setAttribute("aria-selected", "false");
  if (!keepHash && a.slug) history.replaceState(null, "", "#article/" + encodeURIComponent(a.slug));
  scrollTo(0, 0);
}

/** Find a published piece by its slug, for a link that names one. */
async function articleBySlug(slug) {
  try {
    const j = await jget("recaps.json");
    return ((j && j.articles) || []).find(a => a.slug === slug) || null;
  } catch (e) { return null; }
}

function articleCard(a, full) {
  const box = el("article", `artl${a.kind === "opinion" ? " op" : ""}`);
  const when = a.date ? new Date(a.date + "T12:00:00Z").toLocaleDateString(undefined,
    { day: "numeric", month: "long", year: "numeric" }) : "";
  box.innerHTML = `${full ? coverHTML(a, true) : ""}
    <header class="ahdr">
      ${a.kind === "opinion" ? `<div class="oflag">Column</div>` : ""}
      ${a.kicker ? `<div class="ak">${esc(a.kicker)}</div>` : ""}
      <h2>${esc(a.headline || "")}</h2>
      ${a.dek ? `<p class="adek">${esc(a.dek)}</p>` : ""}
      <div class="aby">${a.byline ? `<b>${esc(a.byline)}</b>` : ""}
        ${when ? `<span>${esc(when)}</span>` : ""}
        ${a.standfirst ? `<span>${esc(a.standfirst)}</span>` : ""}</div>
    </header>
    <div class="abd">${(a.blocks || []).map(articleBlock).join("")}</div>`;
  const hero = box.querySelector(".cover.big");
  if (hero) hero._art = a;   // for the redraw when the window crosses COVER_WIDE_MQ
  return box;
}

async function panelRecaps() {
  const p = el("div", "panel"); p.dataset.panel = "recaps";
  p.appendChild(sechead("News & articles",
    "The long reads, and a write-up of every week — matchups, trades, waiver money, who is climbing and who is falling out of it."));
  let data = null;
  try { data = await jget("recaps.json"); } catch (e) { data = null; }

  const articles = ((data && data.articles) || []).slice()
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  if (articles.length) {
    const list = el("div", "tlist");
    for (const a of articles) list.appendChild(articleTeaser(a));
    p.appendChild(list);
  }

  const weeks = ((data && data.weeks) || []).slice()
    .sort((a, b) => (Number(b.season) - Number(a.season)) || (b.week - a.week));
  if (articles.length && weeks.length) p.appendChild(sechead("Week by week"));
  if (!weeks.length) {
    if (articles.length) return p;
    p.appendChild(el("div", "empty",
      "<b>Nothing to read yet</b>The write-ups start the week the season kicks off — every game, plus the trades, the waiver moves and the power-board swings around them."));
    return p;
  }
  for (const w of weeks) {
    const h = el("div", "wkhead");
    h.innerHTML = `<h3>Week ${esc(String(w.week))}</h3><span>${esc(String(w.season))} season${w.note ? " · " + esc(w.note) : ""}</span>`;
    p.appendChild(h);

    // The lede: one paragraph on the week as a whole, when the job wrote one.
    if (w.lede) p.appendChild(el("div", "lede", `<p>${esc(w.lede)}</p>`));

    // Risers and sliders, straight off this site's own power rankings.
    const mv = weekMovers(w.season, w.week);
    if (mv) {
      const strip = el("div", "movers");
      const one = r => `<span class="mvr">${avatarHTML(r.uid, "sm")}
        <span class="who"><b>${esc(nameOf(r.uid))}</b><i>to ${ord(r.rank)}</i></span>
        ${moveHTML(r.move)}</span>`;
      strip.innerHTML =
        `${mv.up.length ? `<div class="mgrp"><div class="ml">Climbing</div>${mv.up.map(one).join("")}</div>` : ""}
         ${mv.down.length ? `<div class="mgrp"><div class="ml">Falling</div>${mv.down.map(one).join("")}</div>` : ""}`;
      p.appendChild(strip);
    }

    if ((w.games || []).length) p.appendChild(sechead("The games"));
    for (const g of w.games || []) {
      p.appendChild(el("div", "recap",
        `<h3>${esc(g.headline || "")}</h3>
         <div class="sc">${esc(g.winner)} ${esc(String(g.winner_points))} — ${esc(String(g.loser_points))} ${esc(g.loser)}</div>
         <p>${esc(g.body || "")}</p>`));
    }

    // Everything that happened between the games.
    const around = w.around || [];
    if (around.length) {
      p.appendChild(sechead("Around the league"));
      const box = el("div", "around");
      box.innerHTML = around.map(a => {
        const k = KINDS[a.kind] || KINDS.note;
        return `<div class="atl">
          <span class="ic" aria-hidden="true">${esc(k.icon)}</span>
          <div class="tx">
            <div class="kl">${esc(k.label)}</div>
            <h4>${esc(a.headline || "")}</h4>
            <p>${esc(a.body || "")}</p>
          </div></div>`;
      }).join("");
      p.appendChild(box);
    }
  }
  return p;
}

/**
 * Every week with scores on it, newest first: [{season, week, live, games:[...]}].
 * This is the one place that looks at DB.live — the scoreboard is allowed to
 * show a week in progress because it reports scores, not results.
 */
function allWeeks() {
  const m = new Map();
  for (const g of [...DB.games, ...DB.live]) {
    const k = g.season + "|" + g.week;
    if (!m.has(k)) m.set(k, { season: g.season, week: g.week, playoff: g.playoff, live: !!g.live, games: [] });
    m.get(k).games.push(g);
  }
  return [...m.values()].sort((a, b) => Number(b.season) - Number(a.season) || b.week - a.week);
}

/** Weeks each manager was the league's top / bottom scorer. */
function weeklyCrowns() {
  const hi = new Map(), lo = new Map(), byWeek = new Map();
  for (const g of regGames()) {
    const k = g.season + "|" + g.week;
    if (!byWeek.has(k)) byWeek.set(k, []);
    byWeek.get(k).push({ uid: g.a.uid, pts: g.a.pts }, { uid: g.b.uid, pts: g.b.pts });
  }
  for (const arr of byWeek.values()) {
    const top = arr.reduce((a, b) => (b.pts > a.pts ? b : a));
    const bot = arr.reduce((a, b) => (b.pts < a.pts ? b : a));
    hi.set(top.uid, (hi.get(top.uid) || 0) + 1);
    lo.set(bot.uid, (lo.get(bot.uid) || 0) + 1);
  }
  return { hi, lo, weeks: byWeek.size };
}

/** Per-season superlatives, computed from regular-season scoring. */
function seasonAwards(s) {
  const scores = new Map();
  for (const g of s.games) {
    if (g.playoff) continue;
    for (const [me, op] of [[g.a, g.b], [g.b, g.a]]) {
      if (!scores.has(me.uid)) scores.set(me.uid, []);
      scores.get(me.uid).push({ pts: me.pts, opp: op.pts, week: g.week });
    }
  }
  if (!scores.size) return null;

  const byWeek = new Map();
  for (const arr of scores.values()) for (const x of arr) {
    if (!byWeek.has(x.week)) byWeek.set(x.week, []);
    byWeek.get(x.week).push(x.pts);
  }
  const median = a => { const q = a.slice().sort((x, y) => x - y), m = q.length >> 1; return q.length % 2 ? q[m] : (q[m - 1] + q[m]) / 2; };
  const med = new Map([...byWeek].map(([w, a]) => [w, median(a)]));

  const stat = [];
  for (const [uid, arr] of scores) {
    const pts = arr.map(x => x.pts), n = pts.length;
    const mean = pts.reduce((a, b) => a + b, 0) / n;
    const sd = Math.sqrt(pts.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
    stat.push({
      uid, n, mean, sd, total: pts.reduce((a, b) => a + b, 0),
      w: arr.filter(x => x.pts > x.opp).length,
      l: arr.filter(x => x.pts < x.opp).length,
      hardLuck: arr.filter(x => x.pts < x.opp && x.pts > med.get(x.week)).length,
      stolen: arr.filter(x => x.pts > x.opp && x.pts < med.get(x.week)).length,
    });
  }
  const champ = s.places && s.places[1] ? s.uidOf.get(s.places[1]) : null;
  const pick = (arr, sel, dir = -1) => (arr.length ? arr.slice().sort((a, b) => dir * (sel(a) - sel(b)))[0] : null);
  const byRec = stat.slice().sort((a, b) => (b.w - b.l) - (a.w - a.l) || b.total - a.total);
  const paper = champ ? byRec.find(x => x.uid !== champ) : null;
  const eligible = stat.filter(x => x.n >= 6);

  return {
    machine: pick(stat, x => x.total),
    sleepwalker: pick(stat, x => x.total, 1),
    consistent: pick(eligible, x => x.sd, 1),
    boom: pick(eligible, x => x.sd),
    hardLuck: pick(stat.filter(x => x.hardLuck > 0), x => x.hardLuck),
    thief: pick(stat.filter(x => x.stolen > 0), x => x.stolen),
    paper: paper && byRec[0] && byRec[0].uid !== champ ? byRec[0] : null,
    champ,
  };
}

/**
 * What-if: give manager A manager B's schedule and replay every week.
 * If B played A that week, A plays B instead. Returns "me|schedule" → record.
 */
function whatIfSchedules() {
  const seasons = [];
  for (const s of DB.seasons) {
    const weeks = new Map();
    for (const g of s.games) {
      if (g.playoff) continue;
      if (!weeks.has(g.week)) weeks.set(g.week, { opp: new Map(), pts: new Map() });
      const w = weeks.get(g.week);
      w.opp.set(g.a.uid, g.b.uid); w.opp.set(g.b.uid, g.a.uid);
      w.pts.set(g.a.uid, g.a.pts); w.pts.set(g.b.uid, g.b.pts);
    }
    if (weeks.size) seasons.push(weeks);
  }
  const res = new Map();
  const uids = [...DB.mgr.keys()];
  for (const me of uids) for (const sch of uids) {
    let w = 0, l = 0, t = 0;
    for (const weeks of seasons) for (const wk of weeks.values()) {
      if (!wk.pts.has(me) || !wk.pts.has(sch)) continue;
      let opp = wk.opp.get(sch);
      if (opp === me) opp = sch;                 // they played me — so now I play them
      if (opp === me || !wk.pts.has(opp)) continue;
      const a = wk.pts.get(me), b = wk.pts.get(opp);
      if (a > b) w++; else if (b > a) l++; else t++;
    }
    res.set(me + "|" + sch, { w, l, t });
  }
  return res;
}

       ranking or playoff number anywhere on this site moves — until every starter has played.`));
    const grid = el("div", "sbgrid");
    w.games.slice().sort((x, y) => (y.a.pts + y.b.pts) - (x.a.pts + x.b.pts)).forEach(g => {
      const card = el("div", "game");

        const ahead = s.pts > (s === g.a ? g.b : g.a).pts;
        const tags = [];
        if (!w.live && s.pts === best) tags.push("top score");
        if (!w.live && s.pts === worst) tags.push("low score");
        const cls = w.live ? (ahead ? "lead" : "") : (ahead ? "win" : "lose");
        const lg = w.live ? liveGameFor(season, w.week, g.a.rid, g.b.rid) : null;
        const p = lg ? (lg.a.rid === s.rid ? lg.pA : lg.pB) : null;
        return `<button class="gside ${cls}" data-uid="${esc(s.uid)}">
          ${avatarHTML(s.uid, "sm")}
          <span style="min-width:0"><span class="gn">${esc(nameOf(s.uid))}</span>
            <span class="gt">${esc(tags.join(" · ") || teamOf(s.uid) || "")}</span></span>
          ${p != null ? winChip(p, lg.settled) : ""}
          <span class="gp">${f2(s.pts)}</span></button>`;
      };
      const margin = Math.abs(g.a.pts - g.b.pts);
      card.innerHTML = side(g.a) + side(g.b) +
        `<div class="gfoot">
           <span>${w.live
             ? `<span class="livedot"></span>In progress · leading by ${f2(margin)}`
             : `${margin < 5 ? "Nail-biter" : margin > 40 ? "Blowout" : "Final"} · won by ${f2(margin)}`}</span>
           ${sleeperURL ? `<a href="${esc(sleeperURL)}" target="_blank" rel="noopener"

         </div>`;

/* ================================ PREDICTIONS & DRAFT ================ */

function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const a1 = .254829592, a2 = -.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = .3275911;
  const t = 1 / (1 + p * x);
  return s * (1 - ((((a5 * t + a4) * t + a3) * t + a2) * t + a1) * t * Math.exp(-x * x));
}
const normCdf = z => 0.5 * (1 + erf(z / Math.SQRT2));
function gauss(m, s) {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/** Each manager's weekly scoring distribution (regular season, all years). */
function scoringDist() {
  const acc = new Map();
  for (const g of regGames()) for (const s of [g.a, g.b]) {
    if (!acc.has(s.uid)) acc.set(s.uid, []);
    acc.get(s.uid).push(s.pts);
  }
  const out = new Map();
  for (const [uid, a] of acc) {
    const n = a.length, mean = a.reduce((x, y) => x + y, 0) / n;
    const sd = Math.sqrt(a.reduce((x, y) => x + (y - mean) ** 2, 0) / Math.max(1, n - 1));
    out.set(uid, { mean, sd, n });
  }
  return out;
}

/** P(a outscores b), from the difference of two normals. */
function winProb(a, b, D) {
  const A = D.get(a), B = D.get(b);
  if (!A || !B || !A.n || !B.n) return null;
  const s = Math.sqrt(A.sd * A.sd + B.sd * B.sd);
  if (!s) return 0.5;
  return normCdf((A.mean - B.mean) / s);
}

/** Monte-Carlo a full season. Entertainment only — see the caveat in the UI. */
function titleOdds(D, sims = 3000) {
  const uids = [...D.keys()].filter(u => D.get(u).n >= 10);
  if (uids.length < 4) return null;
  const titles = new Map(uids.map(u => [u, 0])), made = new Map(uids.map(u => [u, 0]));
  const WEEKS = 14, PT = Math.min(6, uids.length - (uids.length % 2));
  const roll = u => gauss(D.get(u).mean, D.get(u).sd);
  for (let s = 0; s < sims; s++) {
    const w = new Map(uids.map(u => [u, 0])), pf = new Map(uids.map(u => [u, 0]));
    for (let k = 0; k < WEEKS; k++) {
      const order = uids.slice();
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = order[i]; order[i] = order[j]; order[j] = t;
      }
      const sc = new Map(order.map(u => [u, roll(u)]));
      for (const u of order) pf.set(u, pf.get(u) + sc.get(u));
      for (let i = 0; i + 1 < order.length; i += 2) {
        const a = order[i], b = order[i + 1];
        if (sc.get(a) > sc.get(b)) w.set(a, w.get(a) + 1); else w.set(b, w.get(b) + 1);
      }
    }
    const seeds = uids.slice().sort((a, b) => w.get(b) - w.get(a) || pf.get(b) - pf.get(a)).slice(0, PT);
    for (const u of seeds) made.set(u, made.get(u) + 1);
    let field = seeds.slice();
    if (field.length === 6) {                       // top two get byes
      const g1 = roll(field[2]) > roll(field[5]) ? field[2] : field[5];
      const g2 = roll(field[3]) > roll(field[4]) ? field[3] : field[4];
      field = [field[0], g2, field[1], g1];         // 1 vs lowest survivor
    }
    while (field.length > 1) {
      const next = [];
      for (let i = 0; i + 1 < field.length; i += 2) {
        next.push(roll(field[i]) > roll(field[i + 1]) ? field[i] : field[i + 1]);
      }
      field = next;
    }
    if (field[0]) titles.set(field[0], titles.get(field[0]) + 1);
  }
  return uids.map(u => ({ uid: u, title: titles.get(u) / sims, playoff: made.get(u) / sims }))
    .sort((a, b) => b.title - a.title);
}

/* ================================ ODDS BOARD ======================== */
/*
 * Everything below prices a market the way a book would, off a Monte Carlo of
 * the real DFFL format. Two rules govern it:
 *   1. No constant is invented. The carry-over between seasons, the size of a
 *      roster-year swing and the week-to-week noise are all estimated from the
 *      league's own history, so the model's confidence tracks the evidence.
 *   2. If the format doesn't match what the simulation knows how to run, the
 *      board prices nothing at all rather than posting a number it can't stand
 *      behind.
 */

const ODDS_SIMS = 20000;
const ODDS_SEED = 20260817;   // fixed: the board must post the same price every reload
const ODDS_HOLD = 0.06;       // the vig we add, 6%

/*
 * Fitted constants. Every one of these was estimated by regression on DFFL's
 * own drafts and results, 2022-2025 — none are chosen by hand.
 *
 *   ADP_CURVE   what a player taken at a given ADP actually delivered to a
 *               starting lineup, in points per week.  R2 = .33 over 558 picks.
 *   W_ROSTER    how much of a team's draft-day roster edge shows up in its
 *               scoring.  slope .541 (se .166, t = 3.3) — real, and about half.
 *   W_HIST_*    how much of a manager's past scoring carries forward. Pre-draft
 *               that's all we have (.684, from variance components). Once the
 *               roster is known its weight roughly halves, to .355 — the roster
 *               already contains most of what history was standing in for.
 *   SHOCK_*     what's left over: how far a season lands from the projection,
 *               after taking out the ordinary week-to-week sampling noise.
 *               Knowing the roster cuts it from 6.9 to 4.8 points a week.
 */
// floor is derived, not typed in, so it is exactly the curve's own value at the
// deepest pick anyone drafts — a rounded copy would disagree in the 4th decimal.
const ADP_CURVE = { a: 22.7313, b: -3.6731, deepest: 220 };
ADP_CURVE.floor = ADP_CURVE.a + ADP_CURVE.b * Math.log(ADP_CURVE.deepest);
const W_ROSTER = 0.541;
const W_HIST_PRE_MAX = 0.684;   // upper bound; shrunk per manager by seasons played
const W_HIST_POST = 0.355;
const SHOCK_PRE = 6.90;
const SHOCK_POST = 4.84;

/** Points per week a pick at this ADP has historically put in a lineup. */
function adpValue(adp) {
  if (!(adp > 0)) return ADP_CURVE.floor;
  const x = Math.max(1, Math.min(ADP_CURVE.deepest, adp));
  return Math.max(ADP_CURVE.floor, ADP_CURVE.a + ADP_CURVE.b * Math.log(x));
}

/** Match Sleeper's player names to the ADP board. Sleeper calls kickers K. */
const adpKey = (name, pos) =>
  String(name || "").toLowerCase().replace(/[^a-z]/g, "").replace(/(jr|sr|ii|iii|iv)$/, "")
  + "|" + (pos === "K" ? "PK" : pos);

/**
 * The pre-draft market, frozen. Loaded from a file rather than fetched live:
 * the board that matters is the one that existed on draft day, and it should
 * never move afterwards.
 */
async function loadADP() {
  try {
    const d = await jget("adp-2026.json");
    if (!d || !Array.isArray(d.players) || !d.players.length) return null;
    const byName = new Map();
    for (const [name, pos, adp] of d.players) byName.set(adpKey(name, pos), adp);
    return { byName, meta: d, n: d.players.length };
  } catch (e) { return null; }
}

/**
 * Sum a manager's drafted roster into one points-per-week number.
 *
 * Only each manager's best `cap` picks count, one per round of the draft.
 * DFFL trades picks, so rosters come out of the draft at different sizes, and
 * an uncapped sum pays a manager for owning roster slots rather than for
 * owning better players: every extra pick adds at least the board's floor, and
 * an 18th player never starts. Capping at the round count prices the same
 * number of players for everyone, so the number means the same thing on every
 * row of the board.
 */
function rosterValue(picks, adp, cap = 0) {
  const vals = new Map();
  let matched = 0, total = 0;
  for (const p of picks || []) {
    const uid = p.picked_by;
    if (!uid) continue;
    total++;
    const md = p.metadata || {};
    const hit = adp.byName.get(adpKey(`${md.first_name || ""} ${md.last_name || ""}`, md.position));
    if (hit != null) matched++;
    // Undrafted-in-the-market picks (team defenses, deep fliers) get the floor.
    // Every roster carries a couple, so this barely moves the ordering.
    if (!vals.has(uid)) vals.set(uid, []);
    vals.get(uid).push(adpValue(hit != null ? hit : ADP_CURVE.deepest));
  }
  const out = new Map();
  let counted = 0, dropped = 0;
  for (const [uid, vs] of vals) {
    vs.sort((a, b) => b - a);
    const keep = cap > 0 ? vs.slice(0, cap) : vs;
    dropped += vs.length - keep.length;
    counted += keep.length;
    out.set(uid, keep.reduce((a, b) => a + b, 0));
  }
  return { byUid: out, matched, total, counted, dropped, cap };
}

/** Deterministic PRNG (mulberry32). */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const gaussFrom = rand => (m, s) => {
  let u = 0, v = 0;
  while (!u) u = rand();
  while (!v) v = rand();
  return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};

/* ---------------------------------------------------- odds arithmetic */

/** American price for a probability. p=.60 → -150, p=.25 → +300. */
function americanOdds(p) {
  if (!(p > 0 && p < 1)) return null;
  return p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p;
}
/** The probability a price implies. Exactly inverts americanOdds. */
function impliedProb(o) {
  if (o == null || !isFinite(o) || o === 0) return null;
  return o < 0 ? -o / (100 - o) : 100 / (o + 100);
}
/** Books post round numbers: nearest 5 below 200, nearest 10 from 200 up. */
function roundOdds(o) {
  if (o == null || !isFinite(o)) return null;
  const step = Math.abs(o) < 200 ? 5 : 10;
  const r = Math.round(Math.abs(o) / step) * step;
  return o < 0 ? -r : r;
}
const fmtOdds = o => o == null ? "—" : (o > 0 ? "+" : "") + Math.round(o);

/** Scale a market so its probabilities sum to 1+hold. This is the vig. */
function addVig(ps, hold = ODDS_HOLD) {
  const s = ps.reduce((a, b) => a + b, 0);
  if (!(s > 0)) return ps.map(() => 0);
  return ps.map(p => Math.min(0.995, p * (1 + hold) / s));
}
/** True probabilities in, posted prices out — with the truth kept alongside. */
function priceMarket(rows, hold = ODDS_HOLD) {
  const v = addVig(rows.map(r => r.p), hold);
  return rows.map((r, i) => {
    const raw = americanOdds(v[i]);
    const price = roundOdds(raw);
    return { ...r, vigP: v[i], raw, price, postedP: impliedProb(price) };
  });
}
/**
 * A market where every runner is its own yes/no bet, not one of N competing for
 * a single win.
 *
 * "To make the playoffs" is six of twelve, so the field sums to 6.00, not 1.00.
 * Running that through priceMarket normalises it to one winner and prices a 93%
 * certainty at +510 — a longshot price on a near-lock. Each runner is instead
 * priced as its own two-way book: yes and no, splitting the same 6% hold.
 */
function priceBinary(rows, hold = ODDS_HOLD) {
  return rows.map(r => {
    const p = Math.max(0, Math.min(1, r.p));
    const [yes, no] = addVig([p, 1 - p], hold);
    const price = roundOdds(americanOdds(yes));
    const noPrice = roundOdds(americanOdds(no));
    return {
      ...r, vigP: yes, raw: americanOdds(yes), price,
      postedP: impliedProb(price),
      noPrice, noPostedP: impliedProb(noPrice),
    };
  });
}

/**
 * What the book actually holds once prices are rounded to real increments.
 * A yes/no market holds on each runner separately, so it is the average of the
 * two-way overrounds rather than the sum of the field.
 */
const marketHold = priced => {
  if (priced.length && priced[0] && priced[0].noPostedP != null) {
    return priced.reduce((a, r) => a + ((r.postedP || 0) + (r.noPostedP || 0) - 1), 0) / priced.length;
  }
  return priced.reduce((a, r) => a + (r.postedP || 0), 0) - 1;
};

/* ------------------------------------------------------------ schedule */

/** Circle method: every pair exactly once, in n-1 rounds. */
function roundRobin(ids) {
  const a = ids.slice(), n = a.length;
  if (n < 2 || n % 2) return null;
  const out = [];
  for (let r = 0; r < n - 1; r++) {
    const wk = [];
    for (let i = 0; i < n / 2; i++) wk.push([a[i], a[n - 1 - i]]);
    out.push(wk);
    a.splice(1, 0, a.pop());
  }
  return out;
}

/**
 * Sleeper's schedule shape, checked against every DFFL season 2022-2025: one
 * full round robin, then the spare weeks are intra-division rematches. With 12
 * teams that's 11 + 3, and the 3 spare weeks pair off each 4-team division.
 */
function buildSchedule(teams, weeks) {
  const ids = teams.map((_, i) => i);
  const rr = roundRobin(ids);
  if (!rr) return null;
  const spare = weeks - rr.length;
  if (spare < 0) return null;
  if (spare === 0) return rr;

  const groups = new Map();
  for (const i of ids) {
    const d = teams[i].div;
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(i);
  }
  const sizes = [...groups.values()].map(g => g.length);
  if (new Set(sizes).size !== 1 || sizes[0] % 2 || spare !== sizes[0] - 1) return null;
  const per = [...groups.values()].map(g => roundRobin(g));
  if (per.some(x => !x)) return null;
  const extra = [];
  for (let r = 0; r < spare; r++) extra.push(per.flatMap(rounds => rounds[r]));
  return [...rr, ...extra];
}

/* --------------------------------------------------------------- model */

/**
 * Split what we've seen into the part that is the manager and the part that is
 * just the roster he happened to have that year, then keep only the first.
 * Returns null whenever the league isn't in a shape this can honestly price.
 */
async function oddsModel() {
  const cur = DB.seasons[0];
  if (!cur || !cur.rosters || !cur.divCount) return null;

  const bySeason = new Map();
  for (const g of regGames()) {
    if (!bySeason.has(g.season)) bySeason.set(g.season, new Map());
    const m = bySeason.get(g.season);
    for (const s of [g.a, g.b]) {
      if (!m.has(s.uid)) m.set(s.uid, []);
      m.get(s.uid).push(s.pts);
    }
  }
  const seasons = [...bySeason.keys()].sort();
  if (seasons.length < 2) return null;

  const sum = a => a.reduce((x, y) => x + y, 0);
  const avg = a => sum(a) / a.length;

  // Scoring inflates and deflates year to year — judge everyone against the
  // league average of their own season, never across seasons raw.
  const lgMean = new Map();
  for (const s of seasons) lgMean.set(s, avg([...bySeason.get(s).values()].flat()));

  // Week-to-week noise is what's left once a manager's own season mean is out.
  let rss = 0, rdf = 0;
  for (const s of seasons) for (const a of bySeason.get(s).values()) {
    if (a.length < 2) continue;
    const m = avg(a);
    rss += sum(a.map(x => (x - m) ** 2));
    rdf += a.length - 1;
  }
  if (!rdf) return null;
  const weekSd = Math.sqrt(rss / rdf);

  // Every manager's season means, relative to that year's league average.
  const hist = new Map();
  for (const s of seasons) for (const [uid, a] of bySeason.get(s)) {
    if (a.length < 8) continue;
    if (!hist.has(uid)) hist.set(uid, []);
    hist.get(uid).push({ season: s, m: avg(a) - lgMean.get(s) });
  }
  const multi = [...hist.values()].filter(v => v.length >= 2);
  if (multi.length < 3) return null;

  // One-way random effects. seasonVar is how much a manager bounces around his
  // own level from year to year; skillVar is how far apart the managers really
  // are once that bouncing is accounted for.
  let wss = 0, wdf = 0;
  for (const v of multi) {
    const m = avg(v.map(x => x.m));
    wss += sum(v.map(x => (x.m - m) ** 2));
    wdf += v.length - 1;
  }
  const seasonVar = wss / wdf;
  const mgrMeans = [...hist.values()].map(v => avg(v.map(x => x.m)));
  const grand = avg(mgrMeans);
  const nBar = avg([...hist.values()].map(v => v.length));
  const betweenObs = sum(mgrMeans.map(x => (x - grand) ** 2)) / Math.max(1, mgrMeans.length - 1);
  const skillVar = Math.max(0, betweenObs - seasonVar / nBar);
  const carry = (skillVar + seasonVar) > 0 ? skillVar / (skillVar + seasonVar) : 0;
  const base = lgMean.get(seasons[seasons.length - 1]);

  // ---- Has the draft happened yet? That decides which model runs. ----
  const adp = await loadADP();
  const live = (cur.draftDone && adp) ? rosterValue(cur.picks, adp, cur.draftRounds) : null;
  const postDraft = !!live && live.byUid.size === cur.rosters.length;
  const rvMean = postDraft ? avg([...live.byUid.values()]) : 0;

  const teams = [];
  for (const r of cur.rosters) {
    const uid = cur.uidOf.get(r.roster_id);
    const div = cur.divOf.get(r.roster_id);
    if (!uid || div == null) return null;         // incomplete divisions → price nothing
    const h = hist.get(uid) || [];
    const S = h.length;
    const rawEdge = S ? avg(h.map(x => x.m)) : 0;
    // Shrink toward the league average by how much of this really is the man.
    const k = (S && skillVar > 0) ? skillVar / (skillVar + seasonVar / S) : 0;

    const rv = postDraft ? (live.byUid.get(uid) ?? rvMean) : null;
    const rosterEdge = postDraft ? rv - rvMean : 0;
    // Before the draft the manager is all we have. After it, the roster carries
    // most of the signal and history's weight roughly halves.
    const edge = postDraft
      ? W_ROSTER * rosterEdge + W_HIST_POST * rawEdge
      : k * rawEdge;

    teams.push({
      uid, rid: r.roster_id, div, seasons: S,
      rawEdge, shrink: postDraft ? W_HIST_POST : k,
      rosterValue: rv, rosterEdge,
      edge, mean: base + edge,
    });
  }
  teams.sort((a, b) => a.div - b.div || b.edge - a.edge);

  const weeks = (cur.pws || 15) - 1;
  const playoffTeams = cur.playoffTeams || 6;
  const sched = buildSchedule(teams, weeks);

  // The consolation bracket below is the one Sleeper actually builds for a
  // 12-team, 6-playoff-team league. Anything else and we don't post a board.
  const ok = !!sched && teams.length === 12 && playoffTeams === 6 && cur.divCount === 3;

  return {
    ok, postDraft, teams, sched, weeks, playoffTeams, weekSd,
    // Knowing the roster shrinks how far a season can land from the projection.
    seasonSd: postDraft ? SHOCK_POST : SHOCK_PRE,
    skillSd: Math.sqrt(skillVar), carry, base,
    seasons, divNames: cur.divNames, season: cur.season, status: cur.status,
    nMgrSeasons: [...hist.values()].reduce((a, v) => a + v.length, 0),
    draftStatus: cur.draftStatus, draftDone: !!cur.draftDone,
    adpMeta: adp ? adp.meta : null, adpMissing: !adp,
    matchRate: live ? live.matched / Math.max(1, live.total) : null,
    picksPriced: live ? live.total : 0,
    rosterCap: live ? live.cap : 0, picksDropped: live ? live.dropped : 0,
  };
}

/* ----------------------------------------------------------- simulator */

/**
 * 14-week regular season on the real schedule, then the real brackets.
 * Seeding: the three division winners take seeds 1-3, then the best three left
 * over — confirmed against 2025, where the 10-4 division winner was seeded
 * above a 10-4 team with 220 more points.
 */
/**
 * DFFL's seeding rule, in one place so the preseason board and the live race
 * cannot drift apart: the three division winners take seeds 1-3 in record
 * order, then the best of everyone else fills the remaining places, and byes
 * go to seeds 1 and 2. Read off DFFL's own history — in 2025 a 10-4 division
 * winner was seeded above a 10-4 team with 220 more points.
 *
 * `rank` is every team already ordered best to worst; `divOfIdx` returns a
 * team's division.
 */
function seedField(rank, divOfIdx, playoffTeams) {
  const pos = new Map(rank.map((i, k) => [i, k]));
  const divs = [...new Set(rank.map(divOfIdx))].sort((a, b) => a - b);
  const champs = divs.map(d => rank.find(i => divOfIdx(i) === d))
    .filter(i => i != null).sort((a, b) => pos.get(a) - pos.get(b));
  const rest = rank.filter(i => !champs.includes(i));
  const wilds = Math.max(0, playoffTeams - champs.length);
  return { champs, rest, wilds, pos, seeds: [...champs, ...rest.slice(0, wilds)] };
}

/**
 * Run the season out and count what happens.
 *
 * With no `live` state this is the preseason board: every team starts 0-0 and
 * plays a generated schedule, one scoring level drawn per manager per season.
 *
 * With `live` state it is the same machine started partway through — the real
 * wins and points already banked, the real fixtures still to come, each team's
 * level drawn from its posterior rather than its projection, and each injury
 * taken off the weeks the injury plan charges it to. Both paths share every line below the
 * regular season, which is the point: the preseason board and the live board
 * cannot seed, bracket or price a toilet bowl differently from one another.
 */
function simulateSeason(model, sims = ODDS_SIMS, live = null) {
  if (!model || !model.ok) return null;
  const { weekSd, seasonSd, playoffTeams } = model;
  const teams = live ? live.teams : model.teams;
  // Both paths walk [{week, pairs}] so an injury can be charged to the weeks it covers.
  const slate = live ? live.weeks
    : model.sched.map((pairs, i) => ({ week: i + 1, pairs }));
  const maxWins = model.weeks || model.sched.length;
  const N = teams.length, ids = teams.map((_, i) => i);
  const rand = rng(ODDS_SEED), gau = gaussFrom(rand);
  const zeros = () => new Array(N).fill(0);
  const C = {
    sims, live: !!live, title: zeros(), playoff: zeros(), divWin: zeros(), divLast: zeros(),
    last: zeros(), bye: zeros(), wins: zeros(),
    winDist: teams.map(() => new Array(maxWins + 1).fill(0)),
  };
  const divs = [...new Set(teams.map(t => t.div))].sort((a, b) => a - b);
  const pos = new Array(N);

  for (let s = 0; s < sims; s++) {
    // Preseason: the roster nobody has drafted yet, one draw per manager per
    // season. Live: the same draw, but around the posterior and much tighter,
    // because half the uncertainty has already been resolved by being played.
    const lvl = teams.map(t => gau(t.mean, live ? t.levelSd : seasonSd));
    const W = live ? live.W0.slice() : zeros();
    const PF = live ? live.PF0.slice() : zeros();
    // The week in flight, drawn from where the lineups actually stand: a side
    // with nothing left to play has no spread and simply banks its score.
    for (const g of (live && live.pending) || []) {
      const sa = gau(g.eA, g.sdA), sb = gau(g.eB, g.sdB);
      PF[g.a] += sa; PF[g.b] += sb;
      if (sa > sb) W[g.a]++; else W[g.b]++;
    }
    for (const wk of slate) {
      // The injury plan's per-week cuts when there is one; otherwise (a rewound
      // board, an older caller) the single next-week haircut.
      const hit = !live ? null
        : live.multByWeek instanceof Map ? (live.multByWeek.get(wk.week) || null)
        : wk.week === live.adjWeek ? live.mult : null;
      const sc = lvl.map((m, i) => gau(hit ? m * hit[i] : m, weekSd));
      for (let i = 0; i < N; i++) PF[i] += sc[i];
      for (const [a, b] of wk.pairs) { if (sc[a] > sc[b]) W[a]++; else W[b]++; }
    }
    for (let i = 0; i < N; i++) {
      C.wins[i] += W[i];
      // A tie banks half a win, so round before bucketing the distribution.
      const b = Math.min(maxWins, Math.max(0, Math.round(W[i])));
      C.winDist[i][b]++;
    }

    const rank = ids.slice().sort((a, b) => W[b] - W[a] || PF[b] - PF[a]);
    for (let i = 0; i < N; i++) pos[rank[i]] = i;

    const { champs, rest, wilds, seeds } = seedField(rank, i => teams[i].div, playoffTeams);
    for (const i of champs) C.divWin[i]++;
    for (const d of divs) {
      const m = rank.filter(i => teams[i].div === d);
      C.divLast[m[m.length - 1]]++;
    }
    for (const i of seeds) C.playoff[i]++;
    C.bye[seeds[0]]++; C.bye[seeds[1]]++;

    // Playoff rounds are weeks pws, pws+1, pws+2; an injury plan that runs into
    // them (a return date past the regular season, or season-ending) cuts them too.
    const PW = live && live.pws ? live.pws : maxWins + 1;
    const pcut = (i, r) => {
      const m = live && live.multByWeek instanceof Map ? live.multByWeek.get(PW + r) : null;
      return m ? m[i] : 1;
    };
    const roll = (i, r) => gau(lvl[i] * pcut(i, r), weekSd);
    const duel = (a, b, r = 0) => roll(a, r) > roll(b, r) ? [a, b] : [b, a];
    const sp = new Map(seeds.map((x, i) => [x, i]));

    // Winners bracket, weeks 15-17. Seeds 1-2 sit out the first round.
    const [w1] = duel(seeds[2], seeds[5]);
    const [w2] = duel(seeds[3], seeds[4]);
    const low = sp.get(w1) > sp.get(w2) ? w1 : w2;
    const high = low === w1 ? w2 : w1;
    const [f1] = duel(seeds[0], low, 1);
    const [f2] = duel(seeds[1], high, 1);
    const [champ] = duel(f1, f2, 2);
    C.title[champ]++;

    // The toilet bowl, as DFFL actually runs it. Seeds 7-12 by record. The four
    // best of them play round one — 7v10 and 8v9 — and the two that LOSE carry
    // on. The two worst records sit out that round and enter next, already one
    // game from the bottom. Losing again puts you in the final, and losing the
    // final is last place. You fall by losing, all the way down.
    const L = rest.slice(wilds);
    const [, a1] = duel(L[1], L[2]);        // 8 v 9, loser falls
    const [, a2] = duel(L[0], L[3]);        // 7 v 10, loser falls
    const [, b1] = duel(L[5], a1, 1);       // worst seed meets one of them
    const [, b2] = duel(L[4], a2, 1);       // second worst meets the other
    const [, dead] = duel(b1, b2, 2);       // and the loser of that is twelfth
    C.last[dead]++;
  }
  return C;
}

/** The win total each manager's season is closest to a coin flip around. */
function winTotals(model, sim) {
  return model.teams.map((t, i) => {
    const dist = sim.winDist[i];
    let best = null;
    for (let k = 1; k <= model.sched.length; k++) {
      let over = 0;
      for (let j = k; j < dist.length; j++) over += dist[j];
      const p = over / sim.sims;
      const d = Math.abs(p - 0.5);
      if (!best || d < best.d) best = { line: k - 0.5, pOver: p, pUnder: 1 - p, d };
    }
    return { i, uid: t.uid, avg: sim.wins[i] / sim.sims, ...best };
  });
}

/* ================================ INJURIES AND LIVE REPRICING ========= */

/**
 * Sleeper publishes every player's injury status on one endpoint. The file is
 * about 5MB, which is far too much to pull on every page load — but the part
 * that matters, the players actually carrying a status, is about 13KB. So it is
 * fetched once, reduced to {player_id: status}, and kept in localStorage for six
 * hours. Absence from that map means healthy, which is true by construction.
 *
 * Sleeper asks that this endpoint be called at most once a day per user; six
 * hours is a compromise that keeps a Sunday-morning downgrade from going stale
 * while still costing one download a day for anyone reading the site normally.
 */
// v3 added the outlook fields (bp, sev, ret, note). Bumping the key rather than
// merging means a reader with a warm v2 cache sees the detail today instead of
// in six hours.
const INJ_KEY = "dffl.injuries.v3";
const INJ_TTL = 6 * 60 * 60 * 1000;

/**
 * How much of a week a player on each status is expected to give you.
 *
 * The zeroes are the designations that mean "not playing" — ruled out, on
 * injured reserve, physically-unable-to-perform, suspended, not active, did not
 * report, covid. Doubtful and Questionable are the only genuine coin flips, and
 * the numbers on them are the conventional reading of those tags rather than
 * anything DFFL-specific: doubtful players mostly sit, questionable players
 * mostly play and are mostly fine.
 */
const INJ_AVAIL = {
  Out: 0, IR: 0, PUP: 0, Sus: 0, NA: 0, DNR: 0, COV: 0,
  Doubtful: 0.25, Questionable: 0.75,
};

/**
 * What you get back when a starter is replaced.
 *
 * A hurt starter does not cost you his whole output: the manager benches him and
 * plays somebody, and that somebody scores. In a 15-man roster with five bench
 * spots the replacement is meaningfully worse than the man he replaces but a
 * long way from nothing, so a starter ruled out costs about 45% of his share of
 * the lineup rather than 100% of it. This is also why the haircut is honest
 * about lineups nobody has fixed yet: if a manager leaves an IR player in his
 * starters on Sunday morning, the model assumes he will swap him before kickoff
 * and charges him the replacement gap, not a zero.
 */
const REPLACEMENT = 0.55;

/** The most any one week's injuries may take off a team, as a sanity rail. */
const INJ_FLOOR = 0.80;

let INJURIES = null;

/**
 * The injury feed, cheapest source first.
 *
 * Sleeper's player file is five megabytes and the front page must not pull it:
 * booting this site costs a handful of small JSON reads and that is a guarantee
 * worth keeping, particularly on a phone. So there are three cheap sources
 * before the expensive one — memory, this browser's six-hour cache, and a small
 * injuries.json committed alongside the site — and the 5MB download happens only
 * when something explicitly asks for it with {full: true}. The Odds tab does,
 * because opening it is already a deliberate act; the home page does not, and
 * simply shows nothing until one of the cheap sources has an answer.
 */
async function loadInjuries(opt) {
  const o = opt === true ? { force: true, full: true } : (opt || {});
  if (INJURIES && !o.force) return INJURIES;
  if (MOCK) return (INJURIES = { map: new Map(), at: null, source: "mock" });
  try {
    const raw = localStorage.getItem(INJ_KEY);
    if (raw && !o.force) {
      const c = JSON.parse(raw);
      if (c && c.at && (Date.now() - c.at) < INJ_TTL && c.map) {
        return (INJURIES = { map: new Map(Object.entries(c.map)), at: c.at, source: "cache" });
      }
    }
  } catch (e) { /* private window, cleared storage, quota — carry on */ }
  // Written weekly by the scheduled job. A few kilobytes, and it means a reader
  // who has never opened the Odds tab still sees who is hurt.
  try {
    const f = await jget("injuries.json");
    if (f && f.map && f.at && (Date.now() - f.at) < 7 * 24 * 60 * 60 * 1000) {
      try { localStorage.setItem(INJ_KEY, JSON.stringify({ at: f.at, map: f.map })); } catch (e) {}
      return (INJURIES = { map: new Map(Object.entries(f.map)), at: f.at, source: "file" });
    }
  } catch (e) { /* not published yet — that is fine */ }
  if (!o.full) {
    // Nothing cheap had it, and nobody asked to pay for the big one.
    return { map: new Map(), at: null, source: "deferred" };
  }
  try {
    const all = await jget(`${API}/players/nfl`);
    // Keep the name and position alongside the status: the injury report has to
    // print "Zay Flowers", and the player file is the only place the site ever
    // sees a name for somebody who arrived on waivers rather than in the draft.
    const slim = {};
    for (const id of Object.keys(all || {})) {
      const p = all[id];
      const s = p && p.injury_status;
      if (!s) continue;
      slim[id] = {
        s: String(s),
        n: p.full_name || [p.first_name, p.last_name].filter(Boolean).join(" ") || id,
        p: p.position || "",
        t: p.team || "FA",
      };
    }
    const at = Date.now();
    try { localStorage.setItem(INJ_KEY, JSON.stringify({ at, map: slim })); } catch (e) { /* fine */ }
    return (INJURIES = { map: new Map(Object.entries(slim)), at, source: "sleeper", n: Object.keys(slim).length });
  } catch (e) {
    // No injury data is a worse model, not a broken one: every team runs healthy.
    return (INJURIES = { map: new Map(), at: null, source: "unavailable", error: e.message });
  }
}

/** The name, position and club the injury feed carries for a player. */
function injPlayer(pid, inj) {
  const r = (inj || INJURIES || { map: new Map() }).map.get(String(pid));
  return r || null;
}

/**
 * What each roster's injuries cost it next week.
 *
 * A starter's weight is his share of the lineup's scoring so far this season,
 * which is the only per-player signal the site has that is measured under this
 * league's own scoring. Early in the year there is not enough of it to mean
 * anything, so until a team has 50 points of starter production on record every
 * starter is weighted the same.
 */
function availability(season, inj) {
  const out = new Map();
  if (!season || !season.rosters) return out;
  // Weight by finished football only. season.playerPts runs to the live week,
  // and a half-played Sunday ranks a Thursday-night receiver above a starter who
  // has not kicked off — which would hand the injury model a lineup ordered by
  // kickoff time rather than by ability.
  const done = season.finalWeeks || new Set();
  const pts = new Map();
  for (const wk of done) {
    const wm = (season.playerWeek || new Map()).get(wk);
    if (!wm) continue;
    for (const [pid, v] of wm) pts.set(pid, (pts.get(pid) || 0) + (Number(v) || 0));
  }
  for (const r of season.rosters) {
    const rows = (r.starters || []).filter(p => p && p !== "0").map(pid => ({
      pid,
      rec: (inj && inj.map.get(pid)) || null,
      status: ((inj && inj.map.get(pid)) || {}).s || null,
      pts: Number(pts.get(pid)) || 0,
    }));
    const tot = rows.reduce((a, x) => a + x.pts, 0);
    // One finished week is thin but real; nothing at all is not. Until there is
    // something to weigh, every starter counts the same.
    const byPoints = done.size >= 1 && tot >= 50 && rows.length > 0;
    let loss = 0;
    for (const x of rows) {
      x.share = byPoints ? x.pts / tot : (rows.length ? 1 / rows.length : 0);
      x.avail = x.status == null ? 1 : (INJ_AVAIL[x.status] ?? 1);
      x.loss = x.share * (1 - x.avail) * (1 - REPLACEMENT);
      loss += x.loss;
    }
    out.set(r.roster_id, {
      rid: r.roster_id,
      mult: Math.max(INJ_FLOOR, 1 - loss),
      raw: 1 - loss,
      basis: byPoints ? "points" : "even", weighedOver: done.size,
      starters: rows.length,
      hurt: rows.filter(x => x.avail < 1).sort((a, b) => b.loss - a.loss),
    });
  }
  return out;
}

/** An ESPN return date as a local midnight, built from parts like returnLabel. */
function injRetDate(iso) {
  const [y, m, d] = String(iso || "").split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

/**
 * Roughly when week `week` kicks off, taking the Sunday main slate as the week.
 * The first unfinished week W0 is the coming Sunday (today, if today is
 * Sunday) — unless W0 is already in flight, in which case its Sunday may be
 * behind us: Monday and Tuesday of a live week belong to the Sunday just gone.
 * Seven days later per week after W0. Thursday and Monday games are ignored,
 * which is close enough to decide whether a return date lands before a week.
 */
function approxKickoff(week, W0, now = new Date(), inFlight = false) {
  const d = new Date(now.getTime());
  d.setHours(13, 0, 0, 0);
  const day = d.getDay();
  const toSunday = inFlight && day >= 1 && day <= 2 ? -day : (7 - day) % 7;
  d.setDate(d.getDate() + toSunday + 7 * (week - W0));
  return d;
}

/**
 * Every injury, charged to the weeks it actually costs.
 *
 * Built on availability(): the same starters, shares and per-player loss. What
 * it adds is how long each one lasts and how much of it the projection already
 * knows about.
 *
 * weeks — from W0, the first week not yet finished (the week in flight, if any).
 *   A starter who has already scored in the week in flight was fit at its
 *   kickoff — typically he was hurt in that game — so his charge starts the
 *   week after. A doubtful or questionable tag, or any status without an ESPN
 *   return date, is charged to that one starting week only. With a date, he is
 *   charged for every week that kicks off before it; a date more than 110 days
 *   out (returnLabel's "rest of season") or after the championship week charges
 *   every week left. Weeks run through the three playoff weeks, so a
 *   season-ending injury also cuts the bracket.
 *
 * scale — so the cut is not counted twice. A team's level is the precision-
 *   weighted blend of its draft prior and its finished weeks, and the weeks he
 *   has already missed are in that blend without him. With onset = the first
 *   finished week after the last one in which he scored (week 1 if he never
 *   has), missed = finished weeks >= onset, n = the team's finished games:
 *
 *     scale = 1 - (missed / weekSd²) / (1 / seasonSd² + n / weekSd²)
 *
 *   i.e. the share of the projection built on weeks when he was still playing,
 *   the draft prior counting as "with him". missed = 0 gives scale 1. This is
 *   exact first-order because livePosterior is a plain precision blend of the
 *   prior and every finished regular-season week, equally weighted — no
 *   recency weighting.
 *
 * opts.now overrides the clock, for tests.
 */
function injuryPlan(season, inj, model, opts = {}) {
  const now = opts.now instanceof Date ? opts.now : new Date();
  const avail = availability(season, inj);
  const lastReg = ((season && season.pws) || 15) - 1;
  const done = [...((season && season.finalWeeks) || [])]
    .filter(w => w <= lastReg).sort((a, b) => a - b);
  const W0 = season && season.liveWeek ? season.liveWeek
    : (done.length ? done[done.length - 1] + 1 : 1);
  const post = model && model.ok ? livePosterior(model, season) : null;
  const byRid = new Map((post || []).map(t => [t.rid, t]));
  const wk2 = model && model.weekSd > 0 ? model.weekSd * model.weekSd : null;
  const pp = model && model.seasonSd > 0 ? 1 / (model.seasonSd * model.seasonSd) : null;
  const pw = (season && season.playerWeek) || new Map();
  const ptsIn = (w, pid) => {
    const wm = pw.get(w);
    if (!wm) return 0;
    return Number(wm.has(pid) ? wm.get(pid) : wm.get(String(pid))) || 0;
  };
  const inFlight = !!(season && season.liveWeek && season.liveWeek === W0);
  // The bracket is part of the season: three playoff weeks from playoff_week_start.
  const lastWeek = lastReg + 3;
  const kick = w => approxKickoff(w, W0, now, inFlight);
  const teams = new Map();
  for (const [rid, a] of avail) {
    const t = byRid.get(rid);
    const n = t ? t.n : 0;
    const hurt = a.hurt.map(x => {
      const soft = x.status === "Doubtful" || x.status === "Questionable";
      const ret = soft ? null : injRetDate(x.rec && x.rec.ret);
      const start = inFlight && ptsIn(W0, x.pid) !== 0 ? W0 + 1 : W0;
      let weeks = start <= lastWeek ? [start] : [], seasonEnding = false;
      if (ret && start <= lastWeek) {
        seasonEnding = (ret - now) / 86400000 > 110 || ret > kick(lastWeek);
        weeks = [];
        for (let w = start; w <= lastWeek; w++) {
          if (seasonEnding || w === start || kick(w) < ret) weeks.push(w);
        }
      }
      let last = 0;
      for (const w of done) if (ptsIn(w, x.pid) !== 0) last = w;
      const after = done.filter(w => w > last);
      const onset = !last ? 1 : (after.length ? after[0] : last + 1);
      const missed = Math.min(n, done.filter(w => w >= onset).length);
      const scale = missed > 0 && wk2 && pp != null
        ? Math.max(0, 1 - (missed / wk2) / (pp + n / wk2)) : 1;
      return { ...x, start, weeks, seasonEnding, ret: ret ? x.rec.ret : null, onset, missed, scale };
    });
    teams.set(rid, { rid, n, basis: a.basis, starters: a.starters, hurt });
  }
  return { W0, lastReg, lastWeek, now, teams, avail };
}

/** The hurt starters charged to a team in a week, less anyone excluded. */
function injuryCharged(plan, rid, week, excludePids) {
  const t = plan && plan.teams && plan.teams.get(rid);
  if (!t) return [];
  const ex = excludePids ? new Set([...excludePids].map(String)) : null;
  return t.hurt.filter(h => h.weeks.includes(week)
    && !(ex && ex.has(String(h.pid))) && h.loss * h.scale > 0);
}

/**
 * The in-game form of the same cut, for lineupState: pid -> loss × scale for
 * each hurt starter charged that week. Null when there is none.
 */
function injuryHurtMap(plan, rid, week) {
  const hs = injuryCharged(plan, rid, week);
  if (!hs.length) return null;
  return new Map(hs.map(h => [String(h.pid), h.loss * h.scale]));
}

/** What a team's injuries leave of its expected score in a given week. */
function injuryMult(plan, rid, week, excludePids) {
  const loss = injuryCharged(plan, rid, week, excludePids)
    .reduce((a, h) => a + h.loss * h.scale, 0);
  return Math.max(INJ_FLOOR, 1 - loss);
}

/** "De'Von Achane" -> "Achane", "Kenneth Walker III" -> "Walker". */
function lastNameOf(full) {
  const parts = String(full || "").trim().split(/\s+/).filter(Boolean);
  while (parts.length > 1 && /^(jr\.?|sr\.?|ii|iii|iv)$/i.test(parts[parts.length - 1])) parts.pop();
  return parts.length ? parts[parts.length - 1] : "";
}

/** Out covers every designation that means not playing. */
function injuryWord(status) {
  return status === "Doubtful" ? "doubtful" : status === "Questionable" ? "questionable" : "out";
}

/**
 * "Injuries: −9% (Achane, Hall out)", from a cut and the people behind it.
 * Null under half a percent, which is not worth a line.
 */
function injuryLabelText(cut, people) {
  if (!(cut >= 0.005)) return null;
  const by = new Map();
  for (const p of people || []) {
    const w = injuryWord(p.status);
    if (!by.has(w)) by.set(w, []);
    by.get(w).push(p.name);
  }
  const detail = ["out", "doubtful", "questionable"].filter(w => by.has(w))
    .map(w => `${by.get(w).join(", ")} ${w}`).join(", ");
  const p = cut * 100;
  const pct = `−${p < 1 ? p.toFixed(1) : Math.round(p)}%`;
  return {
    cut, pct, detail, names: (people || []).map(x => x.name),
    text: `Injuries: ${pct}${detail ? ` (${detail})` : ""}`,
  };
}

function injuryName(h) {
  return lastNameOf((h.rec && h.rec.n) || (injPlayer(h.pid) || {}).n || String(h.pid));
}

/** A team's injury cut in a week, labelled; null when there is none worth saying. */
function injuryLabel(plan, rid, week, excludePids) {
  const hs = injuryCharged(plan, rid, week, excludePids);
  if (!hs.length) return null;
  return injuryLabelText(1 - injuryMult(plan, rid, week, excludePids),
    hs.map(h => ({ name: injuryName(h), status: h.status })));
}

/** " · Injuries: −9% next week (Achane, Hall out)" for a futures row, or "". */
function injuryFuturesNote(plan, rid, week) {
  const lab = injuryLabel(plan, rid, week);
  if (!lab) return "";
  const hs = injuryCharged(plan, rid, week);
  const n = Math.max(...hs.map(h => h.weeks.filter(w => w >= week).length));
  const span = hs.some(h => h.seasonEnding) ? "rest of season" : n > 1 ? `for ${n} weeks` : "next week";
  return ` · Injuries: ${lab.pct} ${span}${lab.detail ? ` (${lab.detail})` : ""}`;
}

/**
 * The preseason projection, updated by what has actually been scored.
 *
 * Straight conjugate-normal arithmetic: the draft-day projection is the prior,
 * each finished week is one observation of it through week-to-week noise, and
 * the posterior is the precision-weighted blend. Nothing about it is tuned — the
 * two spreads it weighs are the same seasonSd and weekSd the preseason board
 * already publishes.
 *
 * The practical consequence is that the board moves slowly and for the right
 * reason. One 140-point week is drowned by the noise it was drawn from; a team
 * scoring 140 every week for six weeks genuinely reprices. That is the correct
 * behaviour for a fantasy league and it is what stops the odds lurching every
 * Sunday.
 */
function livePosterior(model, season, throughWeek = null) {
  if (!model || !model.ok || !season) return null;
  const wk = model.weekSd, pri = model.seasonSd;
  if (!(wk > 0) || !(pri > 0)) return null;
  const byRid = new Map();
  for (const g of (season.games || [])) {
    if (g.playoff) continue;
    // throughWeek rewinds the board: only what had been scored by the end of
    // that week counts toward a team's level, so the page can show what the
    // model believed then rather than what it believes now.
    if (throughWeek != null && g.week > throughWeek) continue;
    for (const s of [g.a, g.b]) {
      if (!byRid.has(s.rid)) byRid.set(s.rid, []);
      byRid.get(s.rid).push(s.pts);
    }
  }
  const pp = 1 / (pri * pri);
  return model.teams.map(t => {
    const obs = byRid.get(t.rid) || [];
    const n = obs.length;
    const op = n / (wk * wk);
    const om = n ? obs.reduce((a, b) => a + b, 0) / n : 0;
    const mean = n ? (pp * t.mean + op * om) / (pp + op) : t.mean;
    return {
      ...t, n, priorMean: t.mean, obsMean: n ? om : null, mean,
      levelSd: Math.sqrt(1 / (pp + op)), moved: mean - t.mean,
    };
  });
}

/**
 * Group the race's flat list of remaining fixtures into weeks, so the simulator
 * can walk the rest of the season a week at a time — which is what lets an
 * injury apply to the week it belongs to and no further.
 */
function weeksOf(upcoming, idx) {
  const by = new Map();
  for (const g of upcoming || []) {
    const a = idx.get(g.a), b = idx.get(g.b);
    if (a == null || b == null) continue;
    if (!by.has(g.week)) by.set(g.week, []);
    by.get(g.week).push([a, b]);
  }
  return [...by.entries()].sort((x, y) => x[0] - y[0]).map(([week, pairs]) => ({ week, pairs }));
}

/**
 * Everything the live board needs, assembled: posterior scoring levels, the
 * actual standings, the real remaining schedule, and next week's injuries.
 *
 * Returns null before the season has produced anything to update on, which is
 * the signal to keep posting the preseason board.
 */
function liveState(model, season, R, avail, board, throughWeek = null, plan = null) {
  if (!model || !model.ok || !R) return null;
  const teams = livePosterior(model, season, throughWeek);
  if (!teams) return null;
  const idx = new Map(teams.map((t, i) => [t.rid, i]));
  const N = teams.length;
  const W0 = new Array(N).fill(0), PF0 = new Array(N).fill(0);
  let played = 0;
  for (const g of R.decided) {
    const a = idx.get(g.a.rid), b = idx.get(g.b.rid);
    if (a == null || b == null) continue;
    played++;
    PF0[a] += g.a.pts; PF0[b] += g.b.pts;
    if (g.a.pts > g.b.pts) W0[a]++;
    else if (g.b.pts > g.a.pts) W0[b]++;
    else { W0[a] += 0.5; W0[b] += 0.5; }
  }
  // The week being played is not "upcoming" — its scores are half in. Pull it
  // out of the schedule and carry it as pending, priced off where the lineups
  // actually stand, so the board moves on Sunday afternoon instead of Tuesday.
  const liveWk = board && board.ok && board.games.length ? board.week : null;
  const pending = [];
  if (liveWk != null) {
    for (const g of board.games) {
      const a = idx.get(g.a.rid), b = idx.get(g.b.rid);
      if (a == null || b == null) continue;
      pending.push({ a, b, eA: g.A.expected, eB: g.B.expected, sdA: g.A.sd, sdB: g.B.sd, pA: g.pA });
    }
  }
  const weeks = weeksOf((R.upcoming || []).filter(g => g.week !== liveWk), idx);
  // Nothing banked and nothing in flight means there is nothing to reprice from.
  if (!played && !pending.length) return null;
  if (!weeks.length && !pending.length) return null;
  // The single next-week haircut, kept for callers without an injury plan.
  const mult = teams.map(t => {
    const a = avail && avail.get(t.rid);
    return a ? a.mult : 1;
  });
  // With an injury plan, each remaining week carries its own cut: through an
  // ESPN return date, or to the end for a season-ending one. Weeks nobody is
  // charged for are left out and simulated healthy.
  let multByWeek = null;
  if (plan) {
    multByWeek = new Map();
    for (const wk of weeks) {
      const m = teams.map(t => injuryMult(plan, t.rid, wk.week));
      if (m.some(x => x < 1)) multByWeek.set(wk.week, m);
    }
    // The bracket weeks too, which simulateSeason plays from lvl.
    for (let w = (season.pws || 15); w <= (season.pws || 15) + 2; w++) {
      const m = teams.map(t => injuryMult(plan, t.rid, w));
      if (m.some(x => x < 1)) multByWeek.set(w, m);
    }
  }
  return {
    teams, idx, W0, PF0, weeks, mult, multByWeek, plan, pending, liveWeek: liveWk, throughWeek,
    pws: season.pws || 15,
    // Injuries bite on the next week nobody has started. A week already in
    // flight is priced off who has actually played, not off a status.
    adjWeek: weeks.length ? weeks[0].week : null,
    played, decided: R.decided.length,
    remaining: (R.upcoming || []).filter(g => g.week !== liveWk).length,
    at: Date.now(),
  };
}


/**
 * Draft value. A pick's worth = where it was taken minus where the player
 * actually finished in production. Positive = taken later than he performed.
 */
function draftAnalysis(picks, playerPts, uidOf) {
  const rows = (picks || []).filter(p => p && p.pick_no).map(p => {
    const md = p.metadata || {};
    return {
      pick: p.pick_no, round: p.round, keeper: !!p.is_keeper,
      uid: p.picked_by || (uidOf && uidOf.get(p.roster_id)) || null,
      pid: p.player_id,
      name: ((md.first_name || "") + " " + (md.last_name || "")).trim() || "Unknown player",
      pos: md.position || "", team: md.team || "",
      pts: (playerPts && playerPts.get(p.player_id)) || 0,
    };
  });
  if (!rows.length) return null;
  rows.slice().sort((a, b) => b.pts - a.pts).forEach((r, i) => { r.prodRank = i + 1; });
  for (const r of rows) r.value = r.pick - r.prodRank;
  const byMgr = new Map();
  for (const r of rows) {
    if (!r.uid) continue;
    if (!byMgr.has(r.uid)) byMgr.set(r.uid, { uid: r.uid, n: 0, pts: 0, value: 0, best: null, worst: null });
    const m = byMgr.get(r.uid);
    m.n++; m.pts += r.pts; m.value += r.value;
    if (!m.best || r.value > m.best.value) m.best = r;
    if (!m.worst || r.value < m.worst.value) m.worst = r;
  }
  return {
    rows,
    steals: rows.slice().sort((a, b) => b.value - a.value).slice(0, 10),
    busts: rows.slice().sort((a, b) => a.value - b.value).slice(0, 10),
    byMgr: [...byMgr.values()].sort((a, b) => b.pts - a.pts),
  };
}

/** The signature: a posted price, and under it the number a book never shows. */
function priceTile(r, label) {

function oddsBoard(title, sub, priced, noteFn) {
