/* ============================ THE WEEK BEING PLAYED, PRICED ============ */

/**
 * A result waits for the whistle. A probability does not.
 *
 * Nothing in this section is allowed to hand anybody a win, move a power
 * ranking or touch a record — those still come only from weeks the NFL has
 * finished. What it does is price the week while it is happening, the way a
 * live win probability does: a team on 118 with its quarterback still to play
 * is in better shape than a team on 118 with nobody left, and the board should
 * say so rather than waiting until Tuesday to notice.
 *
 * That needs one thing Sleeper's matchup rows do not carry — whether a given
 * starter's NFL game has been played. Sleeper's own schedule does, so the club
 * each starter plays for (from rosters.json) is matched against the state of
 * that club's game this week.
 */
/**
 * Where each NFL game stands this week: not started, being played, or over.
 *
 * ESPN publishes a richer feed with a clock on it, but it sends no
 * Access-Control-Allow-Origin to a browser and so is unusable from a page like
 * this one. Sleeper's own schedule is 27KB, carries the same three states, is
 * CORS-clean, and spells the clubs exactly the way the rest of this site already
 * does — no alias table, no second provider, no proxy.
 *
 * The cost of that choice is honest and worth stating: there is no game clock,
 * so a game in progress is counted as half played rather than measured. A
 * matchup hanging on a fourth-quarter drive will be priced as though that game
 * were at half time. Everything else — kicked off or not, finished or not — is
 * exact.
 */
const SLEEPER_SCHEDULE = "https://api.sleeper.app/schedule/nfl/regular";

/** How much of a game is still to come, by the only three states on offer. */
const GAME_LEFT = { pre_game: 1, in_game: 0.5, complete: 0 };
function gameRemaining(status) {
  const v = GAME_LEFT[status];
  return v == null ? 0 : v;
}

/** How long a live board stays warm before it is worth asking again. */
const GAMES_TTL = 45 * 1000;

let NFLGAMES = null, NFLGAMES_AT = 0;
async function loadNflGames(force) {
  if (MOCK) return { byTeam: new Map(), ok: false, source: "mock", at: null };
  if (NFLGAMES && !force && (Date.now() - NFLGAMES_AT) < GAMES_TTL) return NFLGAMES;
  const st = DB.state;
  const season = st ? String(st.season) : (DB.seasons[0] || {}).season;
  const week = st ? Number(st.week) : null;
  if (!season || !week) {
    return (NFLGAMES = { byTeam: new Map(), ok: false, source: "no-state", at: null });
  }
  try {
    const all = await jget(`${SLEEPER_SCHEDULE}/${season}`);
    const byTeam = new Map();
    let pre = 0, live = 0, post = 0;
    for (const g of (all || [])) {
      if (Number(g.week) !== week) continue;
      const rem = gameRemaining(g.status);
      if (g.status === "pre_game") pre++;
      else if (g.status === "complete") post++;
      else live++;
      for (const t of [g.home, g.away]) {
        if (t) byTeam.set(t, { rem, state: g.status, opp: t === g.home ? g.away : g.home });
      }
    }
    NFLGAMES_AT = Date.now();
    return (NFLGAMES = {
      byTeam, ok: byTeam.size > 0, source: "sleeper", at: NFLGAMES_AT,
      pre, live, post, week, season,
    });
  } catch (e) {
    // Without this the site cannot tell a starter who has played from one who
    // has not. It says so and prices nothing rather than guessing.
    return (NFLGAMES = { byTeam: new Map(), ok: false, source: "unavailable", at: null, error: e.message });
  }
}

/** Every rostered player's club and position, committed as a few kilobytes. */
let ROSTERED = null;
async function loadRostered() {
  if (ROSTERED) return ROSTERED;
  try {
    const j = await jget("rosters.json");
    if (j && j.map) {
      return (ROSTERED = {
        map: new Map(Object.entries(j.map)), slots: j.slots || [], at: j.at, source: "file",
      });
    }
  } catch (e) { /* not published yet */ }
  return (ROSTERED = { map: new Map(), slots: [], at: null, source: "unavailable" });
}

/**
 * What each lineup slot is worth, measured on this league's own finished weeks.
 *
 * A quarterback is not a kicker, so "half the lineup still to play" is not half
 * the points still to come. These are the real shares DFFL's starters have
 * produced by slot — QB, RB, RB, WR, WR, TE, FLEX, FLEX, K, DEF — normalised to
 * sum to one.
 */
let SLOTSHARE = null;
function slotShares() {
  if (SLOTSHARE) return SLOTSHARE;
  const sum = [], n = [];
  for (const s of DB.seasons) {
    for (const [i, acc] of (s.slotPts || []).entries()) {
      if (!acc || !acc.n) continue;
      sum[i] = (sum[i] || 0) + acc.sum;
      n[i] = (n[i] || 0) + acc.n;
    }
  }
  const avg = sum.map((v, i) => (n[i] ? v / n[i] : 0));
  const tot = avg.reduce((a, b) => a + b, 0);
  // No history to read yet — treat every slot alike rather than inventing weights.
  if (!tot || !avg.length) return (SLOTSHARE = null);
  return (SLOTSHARE = avg.map(v => v / tot));
}

/**
 * Price one lineup mid-week: what it has scored, what is still to come, and how
 * uncertain the rest of it is.
 *
 * The expectation is the team's own posterior weekly mean scaled by the share of
 * its lineup still to play; the spread is week-to-week noise scaled by the root
 * of that same share, so a lineup with nothing left has no uncertainty and a
 * lineup with everything left has all of it.
 *
 * `hurt` (optional) maps pid -> that starter's cut from the injury plan, in
 * team terms: loss × scale, where loss = share × (1 − avail) × (1 − REPLACEMENT).
 * So a ruled-out starter brings 55% of his share, the bench man's, and a
 * doubtful or questionable one keeps his INJ_AVAIL weight. While his game has
 * not started, that cut comes off the expected score as mu × cut. Using the
 * plan's own number — shares, shrink and all — is what makes the line at
 * kickoff, with the whole lineup still to play, exactly the pregame line
 * (mu × injuryMult). The expectation never drops below INJ_FLOOR of the healthy
 * remainder, and the spread stays on the real share left, since the replacement
 * is still playing.
 */
function lineupState(starters, points, mu, weekSd, rostered, games, shares, hurt = null) {
  const rows = (starters || []).filter(p => p && p !== "0");
  let left = 0, cut = 0, unknown = 0;
  const detail = [], hurtLeft = [];
  rows.forEach((pid, i) => {
    const rec = rostered.map.get(String(pid));
    const club = rec && rec.t ? rec.t : null;
    const g = club ? games.byTeam.get(club) : null;
    // No club, or a club not playing this week: a bye or a free agent, and
    // either way nothing more is coming from him.
    const rem = g ? g.rem : 0;
    if (!g && club) unknown++;
    const w = shares && shares[i] != null ? shares[i] : (1 / rows.length);
    left += w * rem;
    const c = hurt ? hurt.get(String(pid)) : undefined;
    const benched = c != null && c > 0 && rem >= 0.999;
    if (benched) { cut += c; hurtLeft.push(String(pid)); }
    detail.push({ pid, name: rec ? rec.n : String(pid), pos: rec ? rec.p : "",
      club, rem, weight: w, state: g ? g.state : "none" });
  });
  const frac = Math.max(0, Math.min(1, left));
  const effFrac = Math.max(0, frac - cut);
  const healthy = points + mu * frac;
  const expected = hurtLeft.length
    ? Math.max(points + mu * effFrac, points + mu * frac * INJ_FLOOR) : healthy;
  return {
    scored: points,
    frac, effFrac, hurtLeft,
    injCut: healthy > 0 ? 1 - expected / healthy : 0,
    expected,
    sd: weekSd * Math.sqrt(frac),
    toPlay: detail.filter(d => d.rem >= 0.999).length,
    inPlay: detail.filter(d => d.rem > 0.001 && d.rem < 0.999).length,
    done: detail.filter(d => d.rem <= 0.001).length,
    unknown, detail,
  };
}

/** P(a beats b), given where both stand and what each has left. */
function liveWinProb(A, B) {
  const s = Math.sqrt(A.sd * A.sd + B.sd * B.sd);
  if (!(s > 0.001)) return A.expected > B.expected ? 1 : (A.expected < B.expected ? 0 : 0.5);
  return normCdf((A.expected - B.expected) / s);
}

/**
 * The week being played, priced matchup by matchup.
 *
 * Returns null when there is no live week, which is the normal state from
 * Tuesday to Thursday and all through the off-season.
 */
async function liveWeekBoard(season, teams, weekSd, plan) {
  const wk = season.liveWeek;
  if (!wk || !(season.live || []).length) return null;
  const [rostered, games] = await Promise.all([loadRostered(), loadNflGames()]);
  if (!games.ok || !rostered.map.size) {
    return { week: wk, ok: false, why: !games.ok ? "no-espn" : "no-rosters", games: [], at: Date.now() };
  }
  // A caller that did not bring the injury plan gets one built from the cheap feed.
  if (plan === undefined) {
    try { plan = injuryPlan(season, await loadInjuries(), window.__ODDS); } catch (e) { plan = null; }
  }
  const hurtOf = rid => injuryHurtMap(plan, rid, wk);
  // The in-game cut, naming only the hurt starters whose game is still to come.
  const labelOf = (rid, S) => {
    const t = plan && plan.teams.get(rid);
    if (!t || !S.hurtLeft.length) return null;
    const people = S.hurtLeft.map(pid => t.hurt.find(h => String(h.pid) === pid)).filter(Boolean)
      .map(h => ({ name: injuryName(h), status: h.status }));
    return injuryLabelText(S.injCut, people);
  };
  const shares = slotShares();
  const byRid = new Map(teams.map(t => [t.rid, t]));
  const starters = new Map((season.rosters || []).map(r => [r.roster_id, r.starters || []]));
  const rows = [];
  for (const g of season.live) {
    const ta = byRid.get(g.a.rid), tb = byRid.get(g.b.rid);
    if (!ta || !tb) continue;
    const A = lineupState(starters.get(g.a.rid), g.a.pts, ta.mean, weekSd, rostered, games, shares, hurtOf(g.a.rid));
    const B = lineupState(starters.get(g.b.rid), g.b.pts, tb.mean, weekSd, rostered, games, shares, hurtOf(g.b.rid));
    A.inj = labelOf(g.a.rid, A);
    B.inj = labelOf(g.b.rid, B);
    const p = liveWinProb(A, B);
    rows.push({
      week: wk, a: g.a, b: g.b, A, B, pA: p, pB: 1 - p,
      settled: A.frac < 0.001 && B.frac < 0.001,
    });
  }
  rows.sort((x, y) => Math.abs(0.5 - x.pA) - Math.abs(0.5 - y.pA));
  return {
    week: wk, ok: true, games: rows, at: Date.now(),
    nfl: { pre: games.pre, live: games.live, post: games.post, at: games.at },
    settled: rows.every(r => r.settled),
    shares: !!shares,
  };
}

/* ---------------------------------------------- the live board, rendered */

/**
 * raceData() fetches the pairings for every week still to come, and both the
 * Race tab and the live odds board need them. Fetch them once.
 */
let RACEDATA_P = null;
function raceDataOnce() { return RACEDATA_P || (RACEDATA_P = raceData()); }

/** A price movement chip: where the line opened, and how far it has come. */
function moveChip(now, was, unit = "pt") {
  if (was == null) return "";
  const d = now - was;
  if (Math.abs(d) < 0.005) return `<span class="mv flat">unchanged</span>`;
  const cls = d > 0 ? "up" : "down";
  return `<span class="mv ${cls}">${d > 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1)}${unit}</span>`;
}

/**
 * The same board as the preseason one, with two extra things: what the line was
 * before a ball was kicked, and how far it has moved since.
 *
 * openBy maps uid to {p, price} — the opening probability, for the movement
 * chip, and the opening posted price, already vigged against the whole opening
 * field by the caller. It must not be a bare probability: a price cannot be
 * derived from one runner in isolation.
 */
function liveBoard(title, sub, priced, openBy, noteFn) {
  const b = el("div", "board");
  b.dataset.board = "live";
  b.innerHTML = `<div class="bhead">
    <span class="bt">${esc(title)}${sub ? `<span class="bs">${esc(sub)}</span>` : ""}</span>
    <span class="hold">Hold ${(marketHold(priced) * 100).toFixed(1)}%</span></div>`;
  priced.forEach((r, i) => {
    const was = openBy.get(r.uid);
    const btn = el("button", "orow live");
    btn.innerHTML = `<span class="rk">${i + 1}</span>${avatarHTML(r.uid, "sm avcell")}
      <span class="who"><span class="n">${esc(nameOf(r.uid))}</span>
      <span class="s">${esc(noteFn ? noteFn(r) : teamOf(r.uid))}</span>
      ${was ? `<span class="was">opened ${esc(fmtOdds(was.price))}
        ${moveChip(r.p, was.p)}</span>` : ""}</span>${priceTile(r)}`;
    btn.onclick = () => openProfile(r.uid);
    b.appendChild(btn);
  });
  return b;
}

/** Who is hurt, and what the model thinks it costs. */
/**
 * What is wrong, in the fewest words that are still true.
 *
 * The body part comes from Sleeper and the severity from ESPN, and the two
 * overlap often enough — a concussion is both — that saying it twice has to be
 * guarded against rather than hoped about.
 */
function injuryDetail(rec) {
  if (!rec) return "";
  const bp = String(rec.bp || "").trim();
  const sev = String(rec.sev || "").trim();
  if (bp && sev && bp.toLowerCase() !== sev.toLowerCase()) return `${bp}, ${sev.toLowerCase()}`;
  return bp || sev;
}

/**
 * When he is expected back, said the way a reader would say it.
 *
 * ESPN dates a season-ending injury to the middle of February, which is true
 * and useless — nobody needs the day. Past a hundred-odd days it is simply the
 * season, and inside that a date is what a manager actually wants.
 */
function returnLabel(iso) {
  if (!iso) return "";
  const [y, m, d] = String(iso).split("-").map(Number);
  if (!y || !m || !d) return "";
  // Built from parts rather than parsed: an ISO date is midnight UTC, and in a
  // western timezone that prints as the day before.
  const when = new Date(y, m - 1, d);
  const days = (when - Date.now()) / 86400000;
  // The status badge beside this already says OUT or IR, so "out for the season"
  // would read as "OUT OUT FOR THE SEASON".
  if (days > 110) return "rest of season";
  return `back ${when.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
}

function injuryBoard(model, avail, inj) {
  const rows = model.teams
    .map(t => ({ t, a: avail.get(t.rid) }))
    .filter(x => x.a && x.a.hurt.length)
    .sort((a, b) => a.a.mult - b.a.mult);
  const b = el("div", "board");
  b.innerHTML = `<div class="bhead"><span class="bt">The injury report
    <span class="bs">what next week's lineups are missing</span></span></div>`;
  if (!rows.length) {
    b.appendChild(el("div", "irow none",
      `<span>Nobody in a starting lineup is carrying a status right now. Every team is
       priced at full strength.</span>`));
    return b;
  }
  for (const { t, a } of rows) {
    const r = el("div", "irow");
    const list = a.hurt.map(h => {
      const p = h.rec || injPlayer(h.pid, inj);
      const nm = p ? p.n : h.pid;
      const dot = "\u2009\u00b7\u2009";
      const sub = [p && p.p ? `${p.p}${dot}${p.t}` : "", injuryDetail(p)]
        .filter(Boolean).join(dot);
      const back = returnLabel(p && p.ret);
      // The note is ESPN's prose and runs to a couple of hundred characters,
      // which is more than a chip can hold. It hangs off the title so the
      // report stays scannable and the detail is one hover away.
      const tip = p && p.note ? ` title="${esc(p.note)}"` : "";
      return `<span class="ip"${tip}><b>${esc(nm)}</b>${sub ? `<i>${esc(sub)}</i>` : ""}
        <span class="st st-${esc(h.status.toLowerCase())}">${esc(h.status)}</span>${
          back ? `<em>${esc(back)}</em>` : ""}</span>`;
    }).join("");
    r.innerHTML = `${avatarHTML(t.uid, "sm avcell")}
      <span class="who"><span class="n">${esc(nameOf(t.uid))}</span>
        <span class="plist">${list}</span></span>
      <span class="cost ${a.mult < 0.97 ? "bite" : ""}">−${((1 - a.mult) * 100).toFixed(1)}%<span class="k">next week</span></span>`;
    b.appendChild(r);
  }
  return b;
}

/**
 * The board before there is anything to reprice from: the season has not
 * produced a finished week yet, so the opening line still stands. Said plainly
 * rather than dressed up as a live number.
 */
function renderLiveWaiting(host, R, inj, avail, board) {
  host.innerHTML = "";
  if (board && board.ok && board.games.length) {
    host.appendChild(sechead(`Week ${board.week}, live`,
      "The week is being played. These are win probabilities, not results — nothing here moves a record."));
    host.appendChild(liveMatchupBoard(board));
  }
  const why = !R || !R.ready
    ? "The regular season is over — there is nothing left to simulate."
    : "No week has finished yet, so there is nothing to update the season line with.";
  host.appendChild(el("div", "livenote",
    `<b>The season board has not moved.</b> ${esc(why)} Every price below is the line as it opened
     after the draft, and it will reprice on its own the moment a week is in the book.`));
  if (inj && inj.map.size) host.appendChild(injuryNote(inj, avail));
}

/** A one-line provenance note on the injury feed. */
function injuryNote(inj, avail) {
  const hurt = [...(avail || new Map()).values()].reduce((a, x) => a + x.hurt.length, 0);
  // Only claim the second source when the loaded feed actually carries it: the
  // 5MB fallback path is Sleeper alone.
  const outlook = [...inj.map.values()].some(r => r && (r.sev || r.ret || r.note));
  const when = inj.at ? new Date(inj.at).toLocaleString(undefined,
    { weekday: "short", hour: "numeric", minute: "2-digit" }) : null;
  const d = el("div", "srcnote");
  d.innerHTML = inj.source === "unavailable"
    ? `<b>No injury data.</b> Sleeper's player file didn't load, so every lineup is priced
       at full strength. ${esc(inj.error || "")}`
    : `<b>${hurt}</b> player${hurt === 1 ? "" : "s"} in a DFFL starting lineup currently carries a
       status, from Sleeper's own injury feed${outlook ? ", with severity and expected return from ESPN's" : ""}${when ? ` · read ${esc(when)}` : ""}
       ${inj.source === "cache" ? " · from this browser's cache" : ""}.`;
  return d;
}

/**
 * The markets that used to exist only on the opening line: division winners,
 * division cellar, last place overall. They were rendered from the preseason
 * simulation and never moved, so after two weeks a 0-2 team still carried its
 * draft-day division price. Given any simulation they now render from that one,
 * with the opening price and the movement chip beside each, exactly as the
 * title and playoff boards do.
 */
function marketBoards(host, model, S, n, sim, o) {
  const T = model.teams;
  const divs = [...model.divNames.keys()].sort((a, b) => a - b);
  // The team carries its own division; the model has no divOf map.
  const idxByDiv = d => T.map((t, i) => i).filter(i => T[i].div === d);
  // An opening price is only meaningful against the same market it is priced in,
  // so each board's opening field is vigged on its own — a division of four, not
  // the league of twelve.
  const openOf = (ids, key) => new Map(priceMarket(ids.map(i => ({ uid: T[i].uid, p: sim[key][i] / o })))
    .map(r => [r.uid, { p: r.p, price: r.price }]));

  host.appendChild(sechead("Division winners",
    "Four-team divisions, and the three winners take the top three playoff seeds. A soft division is worth more than a good record — which is why these prices don't line up with the title board."));
  const dw = el("div", "bgrid");
  for (const d of divs) {
    const ids = idxByDiv(d);
    const rows = priceMarket(ids.map(i => ({ uid: T[i].uid, i, p: S.divWin[i] / n })).sort((a, b) => b.p - a.p));
    dw.appendChild(liveBoard(`${model.divNames.get(d)} — to win`, "division title",
      rows, openOf(ids, "divWin"), r => `projects ${f1(S.wins[r.i] / n)} wins`));
  }
  host.appendChild(dw);

  host.appendChild(sechead("Division cellar",
    "To finish last in your own division, on regular-season record."));
  const dl = el("div", "bgrid");
  for (const d of divs) {
    const ids = idxByDiv(d);
    const rows = priceMarket(ids.map(i => ({ uid: T[i].uid, i, p: S.divLast[i] / n })).sort((a, b) => b.p - a.p));
    dl.appendChild(liveBoard(`${model.divNames.get(d)} — to finish last`, "within the division",
      rows, openOf(ids, "divLast"), r => `projects ${f1(S.wins[r.i] / n)} wins`));
  }
  host.appendChild(dl);

  host.appendChild(sechead("Last place overall",
    "Twelfth is settled in the consolation bracket, not the standings — and Sleeper builds that bracket so the two worst records in the league are never in it."));
  const allIds = T.map((t, i) => i);
  const last = priceMarket(allIds.map(i => ({ uid: T[i].uid, i, p: S.last[i] / n })).sort((a, b) => b.p - a.p));
  host.appendChild(liveBoard("To finish 12th", "loser of the consolation elimination game",
    last, openOf(allIds, "last"), r => `projects ${f1(S.wins[r.i] / n)} wins`));
}

/**
 * The live board. Same markets as the opening line, priced off what has actually
 * been scored, who is actually hurt, and who is actually left to play.
 */
function renderLive(host, model, sim, live, lsim, inj, avail, board, R, asOf = null) {
  host.innerHTML = "";
  // A rewound board has no week in flight and no contemporaneous injury report,
  // so the two surfaces that depend on "now" are left out rather than shown
  // stale. Everything else is priced exactly as it was at the end of that week.
  const past = asOf != null;
  if (past) { board = null; inj = null; avail = null; }
  const n = lsim.sims, o = sim.sims, T = model.teams;
  const inFlight = live.liveWeek;
  const lastDone = inFlight != null ? inFlight - 1
    : (live.adjWeek != null ? live.adjWeek - 1 : 0);

  host.appendChild(sechead("The live board",
    `${inFlight != null
      ? `Week ${inFlight} is being played, and these prices move with it — every matchup is valued off
         where the lineups actually stand, not off who happens to be ahead.`
      : `Repriced off ${live.decided} finished game${live.decided === 1 ? "" : "s"} and the
         ${live.remaining} fixtures still on the schedule.`}
     The opening line is kept beside every price so you can see what the season has changed.`));

  if (R) {
    const weeks = pricedWeeks();
    if (weeks.length) {
      const bar = el("div", "asofbar");
      const sel = el("select");
      const now = el("option", null, "Now — latest prices"); now.value = ""; sel.appendChild(now);
      for (const w of weeks) {
        const o = el("option", null, `As they stood after week ${w}`);
        o.value = String(w);
        if (past && Number(asOf) === w) o.selected = true;
        sel.appendChild(o);
      }
      sel.onchange = () => {
        const v = sel.value;
        if (!v) {
          const N = LIVE_NOW;
          if (N) renderLive(host, model, sim, N.live, N.lsim, N.inj, N.avail, N.board, N.R, null);
          return;
        }
        const b = boardAsOf(model, Number(v), R);
        if (!b) return;
        renderLive(host, model, sim, b.live, b.lsim, null, null, null, R, Number(v));
      };
      sel.id = "asof-sel";
      const lab = el("label", "k", "Board"); lab.htmlFor = sel.id;
      bar.appendChild(lab);
      bar.appendChild(sel);
      if (past) bar.appendChild(el("span", "rewound",
        `Rewound to the end of week ${asOf} \u00b7 priced healthy, with no week in flight`));
      host.appendChild(bar);
    }
  }

  const strip = el("div", "livestrip");
  strip.innerHTML = `
    <span><span class="k">Through</span><b>Week ${Math.max(0, lastDone)}</b></span>
    <span><span class="k">${inFlight != null ? "In play" : "Next up"}</span>
      <b>Week ${inFlight != null ? inFlight : (live.adjWeek ?? "—")}</b></span>
    <span><span class="k">Games banked</span><b>${live.decided}</b></span>
    <span><span class="k">Left to play</span><b>${live.remaining + (live.pending || []).length}</b></span>
    <span><span class="k">Updated</span><b>${esc(new Date(live.at || Date.now())
      .toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }))}</b></span>`;
  host.appendChild(strip);

  if (board && board.ok && board.games.length) host.appendChild(liveMatchupBoard(board));
  else if (board && !board.ok) host.appendChild(liveBoardProblem(board));
  if (inj) host.appendChild(injuryNote(inj, avail));

  // The opening price has to be vigged against the whole opening field, exactly
  // as the live price is. Pricing one probability on its own is not a cheaper
  // way to get the same number — addVig normalises to the sum it is handed, so a
  // single runner always comes back a 99.5% certainty. That is what printed
  // "opened -19900" against all twelve teams. Title is one race, playoffs are
  // twelve yes/no books, so each uses the market function its board uses.
  const openTitle = new Map(priceMarket(T.map((t, i) => ({ uid: t.uid, p: sim.title[i] / o })))
    .map(r => [r.uid, { p: r.p, price: r.price }]));
  const openPlay = new Map(priceBinary(T.map((t, i) => ({ uid: t.uid, p: sim.playoff[i] / o })))
    .map(r => [r.uid, { p: r.p, price: r.price }]));

  // The cut on the next simulated week, and how long it runs.
  const injNote = r => live.plan && live.adjWeek != null
    ? injuryFuturesNote(live.plan, T[r.i].rid, live.adjWeek) : "";
  const title = priceMarket(T.map((t, i) => ({ uid: t.uid, i, p: lsim.title[i] / n }))
    .sort((a, b) => b.p - a.p));
  host.appendChild(liveBoard("To win the DFFL championship",
    esc(updatedAt(live.at || Date.now())), title, openTitle,
    r => `Makes the playoffs ${(lsim.playoff[r.i] / n * 100).toFixed(0)}% · projects ${f1(lsim.wins[r.i] / n)} wins${injNote(r)}`));

  // Six of twelve make it, so this is twelve yes/no books, not one race.
  const play = priceBinary(T.map((t, i) => ({ uid: t.uid, i, p: lsim.playoff[i] / n }))
    .sort((a, b) => b.p - a.p));
  host.appendChild(liveBoard("To make the playoffs",
    `six of twelve · ${updatedAt(live.at || Date.now(), "updated")}`, play, openPlay,
    r => `${f1(lsim.wins[r.i] / n)} projected wins${injNote(r)}`));

  // Every other market, now priced off the same simulation rather than off the
  // draft-day line it used to be stuck on.
  marketBoards(host, model, lsim, n, sim, o);

  if (inj && avail) host.appendChild(injuryBoard(model, avail, inj));

  const meth = el("div", "notice live");
  meth.innerHTML = `<div class="nt">How the line moves</div>
    <p><b>Results update the projection, they do not replace it.</b> Each finished week is one
       observation of a team's true level, read through week-to-week noise of ±${f1(model.weekSd)}
       points. The draft-day projection carries ±${f1(model.seasonSd)}. The board is the
       precision-weighted blend of the two, which is why one big Sunday barely moves a price and
       six of them move it a long way.</p>
    <p><b>Injuries are charged for as long as they last.</b> A starter ruled out costs his team
       ${((1 - REPLACEMENT) * 100).toFixed(0)}% of his share of the lineup — not all of it, because
       somebody comes off the bench and scores. Questionable is priced at
       ${(INJ_AVAIL.Questionable * 100).toFixed(0)}% availability, doubtful at
       ${(INJ_AVAIL.Doubtful * 100).toFixed(0)}%. With no return date the cut is for one week only.
       When ESPN gives a return date, every week that kicks off before it is cut; a season-ending
       injury is cut for the rest of the season, playoffs included. The cut shrinks as weeks played without
       him are finished, because those weeks are already in the team's average and would
       otherwise be counted twice. During a game, a ruled-out starter whose game has not
       started counts as ${(REPLACEMENT * 100).toFixed(0)}% of his slot.</p>
    <p><b>Still not known:</b> who gets claimed off waivers, who gets traded, and which bench
       player is about to become a starter.</p>`;
  host.appendChild(meth);
}

/**
 * The board as it stood at the end of a given week.
 *
 * raceAsOf rewinds the schedule — everything after `week` becomes a fixture
 * again — and livePosterior is told to forget those results too, so the model
 * is looking at exactly what it could have seen then. Two things are
 * deliberately NOT rewound because they cannot be: there is no week in flight
 * in the past, and the injury list is today's. A historical board is therefore
 * priced healthy, which is the honest reading of "what did the numbers say
 * after week 3" rather than a pretence of a contemporaneous injury report.
 */
function boardAsOf(model, week, R) {
  const season = DB.seasons[0];
  if (!model || !model.ok || !season || !R) return null;
  // Scope the REAL race data rather than rebuilding it. raceAsOf() looks only at
  // games already played, so for the newest week it finds nothing left to play
  // and the state bails out — the genuine remaining schedule is fetched by
  // raceData() and lives only on R.
  const decided = (R.decided || []).filter(g => g.week <= week);
  const replay = (R.decided || []).filter(g => g.week > week)
    .map(g => ({ week: g.week, a: g.a.rid, b: g.b.rid }));
  const upcoming = [...replay, ...(R.upcoming || [])]
    .sort((x, y) => x.week - y.week || x.a - y.a);
  const scoped = { ...R, decided, upcoming, ready: upcoming.length > 0 };
  const live = liveState(model, season, scoped, null, null, week);
  if (!live) return null;
  return { live, lsim: simulateSeason(model, ODDS_SIMS, live), R: scoped };
}

/** Every finished regular-season week, newest first. */
function pricedWeeks() {
  const season = DB.seasons[0];
  if (!season) return [];
  const lastReg = (season.pws || 15) - 1;
  const done = new Set((season.games || [])
    .filter(g => !g.playoff && g.week <= lastReg).map(g => g.week));
  return [...done].sort((a, b) => b - a);
}

/* ------------------------------------------- live prices, on every surface */

/**
 * Anything that should redraw when the live board moves registers here. The
 * scoreboard and the front page both show win probabilities they cannot compute
 * themselves — they are built before the schedule has been read — so they
 * subscribe and repaint once it has.
 */
const LIVE_SUBS = new Set();
function onLive(fn) { LIVE_SUBS.add(fn); return fn; }
function emitLive() {
  for (const fn of LIVE_SUBS) { try { fn(); } catch (e) { console.error(e); } }
}

/** The live board for a given season and week, if one has been priced. */
function liveGameFor(season, week, ridA, ridB) {
  const b = window.__BOARD;
  if (!b || !b.ok || b.week !== week) return null;
  return b.games.find(g =>
    (g.a.rid === ridA && g.b.rid === ridB) || (g.a.rid === ridB && g.b.rid === ridA)) || null;
}

/** A win probability, as a pill. Deliberately not styled as a price. */
function winChip(p, settled) {
  const pc = p * 100;
  const txt = settled ? (p >= 0.5 ? "won" : "lost")
    : pc >= 99.5 ? ">99%" : pc <= 0.5 ? "<1%" : `${pc.toFixed(0)}%`;
  const cls = settled ? "done" : p >= 0.5 ? "ahead" : "behind";
  return `<span class="wchip ${cls}">${esc(txt)}</span>`;
}

/** When the numbers were last worked out, in the reader's own clock. */
function updatedAt(ms, label) {
  const t = new Date(ms).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return `${label || "Odds updated"} ${t}`;
}

/**
 * Every matchup being played, with the chance each side wins it.
 *
 * This is the one board on the site that moves while you are looking at it, and
 * the only place a number is allowed to change before a week is over. It still
 * awards nothing: no record, no ranking and no standing moves off anything here.
 */
function liveMatchupBoard(board) {
  const b = el("div", "board live");
  b.dataset.board = "matchups";
  b.innerHTML = `<div class="bhead">
    <span class="bt">Week ${board.week}, live
      <span class="bs">${board.settled
        ? "every lineup has finished — waiting on the NFL to make it official"
        : "win probability from where the lineups actually stand"}</span></span>
    <span class="stamp">${esc(updatedAt(board.at, "Updated"))}</span></div>`;
  for (const g of board.games) {
    const row = el("div", "lrow");
    const side = (s, S, p, lead) => `
      <span class="lside ${lead ? "up" : ""}">
        ${avatarHTML(s.uid, "xs")}
        <span class="ln">${esc(nameOf(s.uid))}</span>
        <span class="lpts">${f2(S.scored)}</span>
        ${winChip(p, g.settled)}
        <span class="lleft">${S.frac < 0.001
          ? "all played"
          : `${S.toPlay + S.inPlay} to come · ${(S.frac * 100).toFixed(0)}% of the lineup`}</span>
      </span>`;
    row.innerHTML = side(g.a, g.A, g.pA, g.pA >= 0.5) + side(g.b, g.B, g.pB, g.pB > 0.5);
    b.appendChild(row);
  }
  const foot = el("div", "lfoot");
  foot.innerHTML = board.nfl
    ? `${board.nfl.post} NFL game${board.nfl.post === 1 ? "" : "s"} final ·
       ${board.nfl.live} in play · ${board.nfl.pre} still to kick off. A game already under way
       counts as half played — Sleeper's schedule carries no clock.
       ${board.shares ? "Points still to come are weighted by what each lineup slot has historically scored in this league."
        : "With no finished weeks on record yet, every lineup slot is weighted the same."}`
    : "";
  b.appendChild(foot);
  return b;
}

/** The board could not be priced — said plainly rather than shown as certainty. */
function liveBoardProblem(board) {
  const d = el("div", "srcnote");
  d.innerHTML = board.why === "no-espn"
    ? `<b>No live game data.</b> Sleeper's NFL schedule didn't load, so the site can't tell a
       starter who has played from one who hasn't, and won't guess at a live number.`
    : `<b>No roster map yet.</b> rosters.json hasn't been published, so the site doesn't know which
       club each starter plays for. Run <code>node build-rosters.mjs</code>.`;
  return d;
}

/**
 * Keep the live board moving.
 *
 * Only while a week is actually in flight, and only when something has changed:
 * scores, or the state of an NFL game. Re-running twenty thousand seasons
 * against an identical board would cost a phone its battery for nothing.
 */
let LIVE_TIMER = null, LIVE_SIG = null;
const LIVE_POLL = 60 * 1000;

function liveSignature(season, board) {
  const scores = (season.live || []).map(g => `${g.a.rid}:${g.a.pts}|${g.b.rid}:${g.b.pts}`).join(",");
  const nfl = board && board.nfl ? `${board.nfl.pre}/${board.nfl.live}/${board.nfl.post}` : "-";
  return scores + "#" + nfl;
}

async function refreshLive() {
  const season = DB.seasons[0];
  if (!season || !season.liveWeek) return false;
  try {
    // Re-read the week's scores from Sleeper before repricing anything.
    const d = await getWeek(season.leagueId, season.liveWeek).catch(() => null);
    if (d) {
      const fresh = new Map();
      for (const [a, b] of pairWeek(d)) { fresh.set(a.rid, a.pts); fresh.set(b.rid, b.pts); }
      for (const g of season.live) {
        if (fresh.has(g.a.rid)) g.a.pts = fresh.get(g.a.rid);
        if (fresh.has(g.b.rid)) g.b.pts = fresh.get(g.b.rid);
      }
    }
    await loadNflGames(true);
    LIVE_P = null;
    const out = await liveOnce(LIVE_FULL ? { full: true } : undefined);
    const sig = liveSignature(season, out.board);
    const moved = sig !== LIVE_SIG;
    LIVE_SIG = sig;
    emitLive();
    return moved;
  } catch (e) { console.error(e); return false; }
}

function startLivePolling() {
  const season = DB.seasons[0];
  if (LIVE_TIMER || !season || !season.liveWeek) return;
  LIVE_TIMER = setInterval(async () => {
    // Nothing to do while the tab is in the background.
    if (document.hidden) return;
    await refreshLive();
    const b = window.__BOARD;
    if (b && b.ok && b.settled) { clearInterval(LIVE_TIMER); LIVE_TIMER = null; }
  }, LIVE_POLL);
  // A reader coming back to the tab wants it current immediately, not in a minute.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && LIVE_TIMER) refreshLive();
  });
}

// The current board, kept aside so the week selector can get back to it. Reading
// renderLive's own parameters instead does not work: inside a rewound render
// those ARE the rewound values, so "Now" would redraw the week you were already
// looking at.
let LIVE_NOW = null;
let LIVE_STARTED = false;
async function ensureLiveOdds() {
  if (LIVE_STARTED) return;
  LIVE_STARTED = true;
  const host = $("#liveHost");
  if (!host) return;
  const model = window.__ODDS, sim = window.__SIM;
  if (!model || !model.ok || !sim) { host.remove(); return; }
  try {
    const { R, inj, avail, live, lsim, board } = await liveOnce({ full: true });
    if (!live || !lsim) {
      renderLiveWaiting(host, R, inj, avail, board);
      document.body.dataset.liveReady = "waiting";
      fxmLive("waiting");
      return;
    }
    LIVE_NOW = { live, lsim, inj, avail, board, R };
    renderLive(host, model, sim, live, lsim, inj, avail, board, R);
    document.body.dataset.liveReady = "1";
    fxmLive("ready");
    startLivePolling();
  } catch (e) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty",
      `<b>Couldn't reprice the board</b>${esc(e.message)}<br>The opening line below still stands.`));
    document.body.dataset.liveReady = "error";
    fxmLive("error");
    console.error(e);
  }
}

/* ------------------------------------------------ game lines, this week */

/** To the nearest half point, the way a book posts a spread or a total. */
const halfPt = x => Math.round(x * 2) / 2;

/**
 * One matchup posted as a game: moneyline, spread and total.
 *
 * A and B are lineupState-shaped: { expected, sd }. Nothing new is modelled here.
 *   Pregame:  expected = the team's posterior weekly mean through last week,
 *             sd = √(weekSd² + levelSd²) — week-to-week noise plus uncertainty in the
 *             team's level, as in the futures sim (weekSd alone if levelSd is missing).
 *   In play:  expected = scored + mean·frac, sd = weekSd·√frac, straight off the live board.
 *
 *   pA       = liveWinProb(A, B) = Φ((expA − expB) / √(sdA² + sdB²))
 *   Money    = [vA, vB] = addVig([pA, 1 − pA], ODDS_HOLD); price = roundOdds(americanOdds(v))
 *   Spread   = expA − expB to the nearest 0.5 (A's margin; A posts −spread, B +spread; 0 is PK)
 *   Total    = expA + expB to the nearest 0.5
 *   Spread and total are set at the model's median, so both sides are a coin flip and
 *   both post roundOdds(americanOdds(addVig([.5, .5])[0])).
 *
 * A game with no uncertainty left is decided: it gets a result, not a price. A game
 * so lopsided that addVig's 0.995 ceiling binds can't post a two-sided moneyline
 * that holds together, so that market comes off the board (spread and total stay).
 */
function gameLine(A, B, hold = ODDS_HOLD) {
  if (!A || !B || !isFinite(A.expected) || !isFinite(B.expected)) return null;
  const sdA = isFinite(A.sd) ? A.sd : 0, sdB = isFinite(B.sd) ? B.sd : 0;
  const pA = liveWinProb({ expected: A.expected, sd: sdA }, { expected: B.expected, sd: sdB });
  const decided = !(Math.sqrt(sdA * sdA + sdB * sdB) > 0.001);
  const v = addVig([pA, 1 - pA], hold);
  const offBoard = !decided && v.some(x => x >= 0.995 || x <= 0);
  const ml = decided || offBoard ? [null, null] : v.map(x => roundOdds(americanOdds(x)));
  const even = roundOdds(americanOdds(addVig([0.5, 0.5], hold)[0]));
  const spread = halfPt(A.expected - B.expected) || 0;   // || 0 folds −0 into 0
  return {
    pA, pB: 1 - pA, decided, offBoard, expA: A.expected, expB: B.expected,
    ml, spread, total: halfPt(A.expected + B.expected), spreadPrice: even, totalPrice: even,
  };
}

/** A spread as posted for one side: −6.5, +6.5, or PK. */
const fmtSpread = s => !isFinite(s) ? "—" : s === 0 ? "PK" : (s > 0 ? "+" : "") + s.toFixed(1);

/**
 * Did the pregame favourite cover the pregame spread? spread is A's pregame
 * margin, rounded to the half point; margin is A's final score minus B's.
 */
function coverResult(spread, margin) {
  if (!isFinite(spread) || !isFinite(margin) || spread === 0) return null;
  // To the cent, so a push isn't lost to float noise in the summed scores.
  const m = Math.round(margin * 100) / 100;
  const favBy = spread > 0 ? m : -m;
  const need = Math.abs(spread);
  return favBy > need ? "covered" : favBy === need ? "push" : "missed";
}

/**
 * The line-history file and the latest snapshot, both optional. A missing or
 * malformed file means no path, never an error.
 */
let OHIST_P = null;
function oddsHistoryOnce() {
  return OHIST_P || (OHIST_P = Promise.all([
    jget("data/odds-history.json").catch(() => null),
    jget("data/odds-snapshot.json").catch(() => null),
  ]).then(([h, s]) => ({
    weeks: h && h.weeks && typeof h.weeks === "object" ? h.weeks : {},
    snap: s && Array.isArray(s.games) ? s : null,
  })));
}

/**
 * How one matchup's line moved over the week, from ridA's side. The path is the
 * model's pregame line (openP: livePosterior through the previous week, flagged
 * pre and placed just before the earliest snapshot), then every committed
 * data/odds-snapshot.json reading for that week (via data/odds-history.json plus
 * the current snapshot), then the live number now. Rows name managers by
 * username, so they're matched on name, either order.
 */
function linePath(hist, seasonId, week, uidA, uidB, nowP, nowAt, nowLive, openP) {
  const namesA = new Set([nameOf(uidA)]), namesB = new Set([nameOf(uidB)]);
  const snap = hist && hist.snap;
  for (const t of (snap && snap.teams) || []) {
    if (t.uid === uidA && t.manager) namesA.add(t.manager);
    if (t.uid === uidB && t.manager) namesB.add(t.manager);
  }
  const key = `${seasonId}-${week}`;
  const rows = [...((hist && Array.isArray(hist.weeks[key])) ? hist.weeks[key] : [])];
  if (snap && `${snap.season}-${snap.liveWeek ?? snap.week}` === key) {
    const seen = new Set(rows.map(r => r && r.at));
    if (!seen.has(snap.generated)) for (const g of snap.games) rows.push({ ...g, at: snap.generated });
  }
  const pts = [];
  for (const r of rows) {
    if (!r || typeof r.pA !== "number" || !isFinite(Date.parse(r.at))) continue;
    const fwd = namesA.has(r.a) && namesB.has(r.b), rev = namesA.has(r.b) && namesB.has(r.a);
    if (!fwd && !rev) continue;
    pts.push({ t: Date.parse(r.at), p: fwd ? r.pA : 1 - r.pA, live: (r.aPts || 0) > 0 || (r.bPts || 0) > 0 });
  }
  if (nowP != null && isFinite(nowP)) pts.push({ t: nowAt || Date.now(), p: nowP, live: !!nowLive, now: true });
  pts.sort((x, y) => x.t - y.t);
  // Every committed snapshot so far was taken after kickoff, so without this the
  // "open" would be an in-game reading.
  if (openP != null && isFinite(openP)) pts.unshift({ t: (pts.length ? pts[0].t : Date.now()) - 1, p: openP, live: false, pre: true });
  return pts;
}

/** A 50%-lined sparkline of a win probability; in-game readings in gold. */
function lineSpark(pts) {
  const W = 88, H = 24, n = pts.length;
  const x = i => (2 + i * (W - 4) / (n - 1)).toFixed(1), y = p => (2 + (1 - p) * (H - 4)).toFixed(1);
  const line = pts.map((q, i) => `${x(i)},${y(q.p)}`).join(" ");
  const dots = pts.map((q, i) => `<circle cx="${x(i)}" cy="${y(q.p)}" r="1.8" fill="${q.live ? "var(--gold)" : "var(--muted)"}"/>`).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--grid)" stroke-dasharray="2 2"/>
    <polyline points="${line}" fill="none" stroke="var(--blue)" stroke-width="1.5"/>${dots}</svg>`;
}

function pathHTML(pts, uid) {
  const pc = p => `${(p * 100).toFixed(0)}%`;
  if (!pts.length) return `<div class="glpath">No line history yet</div>`;
  const tag = pts[0].pre ? " (pregame model)" : "";
  if (pts.length === 1) return `<div class="glpath">${esc(nameOf(uid))} opened at <b>${pc(pts[0].p)}</b>${tag}</div>`;
  const open = pts[0].p, now = pts[pts.length - 1].p, live = pts.filter(q => q.live).length;
  return `<div class="glpath">${pts.length >= 3 ? lineSpark(pts) : ""}
    <span>${esc(nameOf(uid))} to win: open <b>${pc(open)}</b>${tag} → now <b>${pc(now)}</b>${moveChip(now, open, " pp")}</span>
    <span>${pts.length} readings · ${pts.length - live} pre-kickoff, ${live} in-game</span></div>`;
}

/**
 * The week's matchups with a pregame and a current line each. The week in flight
 * if there is one, otherwise the next week on the schedule, otherwise nothing.
 */
function gameLinesData(R, hist, plan = window.__PLAN) {
  const model = window.__ODDS, season = DB.seasons[0];
  const out = { week: null, status: "none", games: [], byes: [], at: Date.now() };
  if (!season) return out;
  const weekSd = model && model.weekSd;
  const uidOf = new Map();
  for (const g of [...(season.games || []), ...(season.live || [])]) {
    uidOf.set(g.a.rid, g.a.uid); uidOf.set(g.b.rid, g.b.uid);
  }
  let pairs = [], inFlight = false;
  if (season.liveWeek && (season.live || []).length) {
    out.week = season.liveWeek; inFlight = true;
    pairs = season.live.map(g => ({ a: g.a, b: g.b }));
  } else if (R && R.nextWeek != null) {
    out.week = R.nextWeek;
    pairs = (R.upcoming || []).filter(g => g.week === R.nextWeek)
      .map(g => ({ a: { rid: g.a, uid: uidOf.get(g.a), pts: 0 }, b: { rid: g.b, uid: uidOf.get(g.b), pts: 0 } }))
      .filter(g => g.a.uid && g.b.uid);
  }
  if (out.week == null) return out;
  // Levels through the previous week only, so the pregame line never sees this week's scores.
  const teams = (model && model.ok && livePosterior(model, season, out.week - 1)) || [];
  const byRid = new Map(teams.map(t => [t.rid, t]));
  const board = window.__BOARD && window.__BOARD.ok && window.__BOARD.week === out.week ? window.__BOARD : null;
  if (board) out.at = board.at;
  // Pregame sd = √(weekSd² + levelSd²): week-to-week noise plus uncertainty in the
  // team's level, the same per-game spread the futures sim draws from.
  // The level is cut by that week's injuries. Anyone who has already scored this
  // week was available at kickoff, so an injury suffered during the game does not
  // rewrite the opener after the fact.
  const wm = (season.playerWeek && season.playerWeek.get(out.week)) || new Map();
  const excl = new Set([...wm].filter(([, v]) => Number(v) !== 0).map(([pid]) => String(pid)));
  const cutOf = rid => plan ? injuryMult(plan, rid, out.week, excl) : 1;
  const preLabel = rid => plan ? injuryLabel(plan, rid, out.week, excl) : null;
  const pre = (t, rid) => t && isFinite(t.mean) && weekSd > 0
    ? { expected: t.mean * cutOf(rid), sd: isFinite(t.levelSd) ? Math.sqrt(weekSd ** 2 + t.levelSd ** 2) : weekSd } : null;
  const played = new Set();
  for (const g of pairs) {
    played.add(g.a.rid); played.add(g.b.rid);
    const bg = board ? board.games.find(x => x.a.rid === g.a.rid && x.b.rid === g.b.rid) : null;
    const A0 = pre(byRid.get(g.a.rid), g.a.rid), B0 = pre(byRid.get(g.b.rid), g.b.rid);
    const open = A0 && B0 ? gameLine(A0, B0) : null;
    const now = bg ? gameLine(bg.A, bg.B) : open;
    const aPts = bg ? bg.A.scored : (g.a.pts || 0), bPts = bg ? bg.B.scored : (g.b.pts || 0);
    const started = inFlight && (aPts > 0 || bPts > 0);
    const settled = !!(bg && bg.settled);
    const path = linePath(hist, season.season, out.week, g.a.uid, g.b.uid,
      now ? now.pA : null, board ? board.at : Date.now(), started, open ? open.pA : null);
    // Once the game is under way the card shows the live cut (hurt starters still
    // to play); before that, the pregame one. Copies, so season.live is untouched.
    const a = { ...g.a, inj: bg && started ? (bg.A.inj || null) : preLabel(g.a.rid) };
    const b = { ...g.b, inj: bg && started ? (bg.B.inj || null) : preLabel(g.b.rid) };
    out.games.push({
      a, b, aPts, bPts, open, now, settled, started, path,
      cover: settled && open ? coverResult(open.spread, aPts - bPts) : null,
    });
  }
  for (const t of teams) if (!played.has(t.rid) && uidOf.get(t.rid)) out.byes.push({ rid: t.rid, uid: uidOf.get(t.rid) });
  out.status = !out.games.length ? "none"
    : out.games.every(g => g.settled) ? "final"
    : out.games.some(g => g.started) ? "live" : "upcoming";
  return out;
}

function gameCardHTML(g) {
  const L = g.now, O = g.open;
  const state = g.settled ? "final" : !L ? "none" : L.decided ? "decided" : g.started ? "live" : "upcoming";
  const odds = o => o == null ? `<span class="r">—</span>`
    : `<span class="o ${o > 0 ? "plus" : ""}" data-odds="${o}">${esc(fmtOdds(o))}</span>`;
  const done = g.settled || (L && L.decided);
  const cell = (mkt, line, lineNum, price, extra = "") =>
    `<div class="glbtn" data-mkt="${mkt}"${lineNum != null && isFinite(lineNum) ? ` data-line="${lineNum}"` : ""}>
      ${line != null ? `<span class="l">${esc(line)}</span>` : ""}${extra || odds(price)}</div>`;
  // Settled: the pregame line and the result, no prices. Otherwise the current line.
  const S = done ? O : L;
  const row = (side, i) => {
    const pts = i ? g.bPts : g.aPts, opp = i ? g.aPts : g.bPts;
    const res = done ? (pts > opp ? "won" : pts < opp ? "lost" : "") : "";
    const sp = S ? (i ? S.spread : -S.spread) : NaN;
    const mlExtra = done ? `<span class="r">${res === "won" ? "Won" : res === "lost" ? "Lost" : "Tie"}</span>`
      : L && L.offBoard ? `<span class="r" title="Too one-sided to post a two-way price">OTB</span>` : "";
    return `<div class="glrow">
      <span class="glwho ${res}">${avatarHTML(side.uid, "xs")}<span class="n">${esc(nameOf(side.uid))}</span>
        ${g.started || done ? `<span class="sc">${f2(pts)}</span>` : ""}</span>
      ${cell("spread", S ? fmtSpread(sp) : "—", S ? sp : null, done ? null : S && S.spreadPrice, done ? " " : "")}
      ${cell("ml", null, null, L && !done ? L.ml[i] : null, mlExtra)}
      ${cell("total", S ? `${i ? "U" : "O"} ${S.total.toFixed(1)}` : "—", S ? S.total : null,
        done ? null : S && S.totalPrice, done ? " " : "")}
    </div>${side.inj && !g.settled ? `<div class="inj-tag" data-inj="${side.rid}" data-cut="${side.inj.cut.toFixed(4)}">${esc(side.inj.text)}</div>` : ""}`;
  };
  const status = state === "final" ? "Final" : state === "decided" ? "Decided"
    : state === "live" ? `<span class="live">Live</span>` : state === "upcoming" ? "Upcoming" : "—";
  const lineNote = done ? "Pregame line" : state === "live" ? "Live line" : "Opening line";
  let res = "";
  if (g.settled) {
    const cv = g.cover, fav = O && O.spread !== 0 ? (O.spread > 0 ? g.a : g.b) : null;
    res = `<div class="glres">Final${O ? ` · pregame ${O.spread === 0 ? "PK"
      : `${esc(nameOf(fav.uid))} −${Math.abs(O.spread).toFixed(1)}`}` : ""}${cv
      ? ` · <span class="cv ${cv === "covered" ? "yes" : cv === "push" ? "push" : "no"}">${cv === "covered"
        ? "Covered" : cv === "push" ? "Push" : "Didn't cover"}</span>` : ""}</div>`;
  }
  return `<div class="glcard" data-card="gameline" data-a="${g.a.rid}" data-b="${g.b.rid}" data-state="${state}">
    <div class="glst"><span>${status}</span><span>${lineNote}</span></div>
    <div class="glrow glhd"><span></span><span>Spread</span><span>Money</span><span>Total</span></div>
    ${row(g.a, 0)}${row(g.b, 1)}${res}
    ${pathHTML(g.path, g.a.uid)}
  </div>`;
}

function paintGameLines(data) {
  const host = $("#glHost");
  if (!host) return;
  window.__LINES = data;
  host.innerHTML = "";
  const b = el("div", "board gl");
  b.dataset.board = "gamelines";
  if (data.week == null) {
    b.innerHTML = `<div class="bhead"><span class="bt">Game lines</span></div>`;
    b.appendChild(el("div", "empty", `<b>No games to price</b><br>There's no current week on the schedule — lines post
      once the next week's matchups are set.`));
    host.appendChild(b);
    return;
  }
  const st = { upcoming: "Upcoming", live: "Live", final: "Final", none: "—" }[data.status];
  b.innerHTML = `<div class="bhead">
    <span class="bt">Week ${data.week} lines
      <span class="bs">${st} · priced from each lineup's expected score and the model's week-to-week spread</span></span>
    <span class="stamp">${esc(updatedAt(data.at, "Updated"))}</span></div>`;
  const grid = el("div", "glgrid");
  grid.innerHTML = data.games.map(gameCardHTML).join("") + data.byes.map(t =>
    `<div class="glbye">${avatarHTML(t.uid, "xs")}<span>${esc(nameOf(t.uid))} — Bye</span></div>`).join("");
  if (!data.games.length) grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No matchups found for week ${data.week}.</div>`;
  b.appendChild(grid);
  const how = el("details", "gloss glhow");
  how.innerHTML = `<summary>How these lines are made</summary><div class="gitems">
    <p>Nothing new is modelled. Before kickoff each lineup is expected to score its team's weekly
      level on the power model (through last week), with a spread of √(weekSd² + levelSd²): the model's
      week-to-week noise of ±${f1((window.__ODDS || {}).weekSd || 0)} pts plus how unsure it still is of the
      team's level — the same per-game spread the futures simulation uses. That level is cut for the
      week's injuries, the same cut the futures use, and the cut is printed under the team. Once games start it's what's already scored plus that level times the share of the lineup still to play,
      and the spread shrinks with the square root of that share — the same numbers as the live board below.</p>
    <p><b>Money:</b> win chance <code>Φ((expA − expB) / √(sdA² + sdB²))</code>, a ${(ODDS_HOLD * 100).toFixed(0)}%
      hold added across both sides, rounded to the prices a book posts.
      <b>Spread:</b> the expected margin to the nearest half point. <b>Total:</b> the expected combined score to the
      nearest half point. Both are set where the model sees a coin flip, so each side carries the same vigged price.</p>
    <p><b>The path</b> under each game is the listed team's win chance: first the model's pregame line (the
      power model through last week, before a ball was kicked), then every snapshot of the odds the site
      committed this week (<code>data/odds-snapshot.json</code>, collected in <code>data/odds-history.json</code>,
      plus the current snapshot), then the live number now. Grey dots are pre-kickoff, gold in-game. A lineup with nothing left to play
      shows its result, not a price. These are not real betting lines.</p></div>`;
  b.appendChild(how);
  host.appendChild(b);
}

let GL_STARTED = false;
async function ensureGameLines() {
  if (GL_STARTED) return;
  GL_STARTED = true;
  const host = $("#glHost");
  if (host) host.innerHTML = `<div class="board gl" data-board="gamelines"><div class="bhead">
    <span class="bt">Game lines<span class="bs">Pricing this week's games…</span></span></div></div>`;
  let R = null, hist = null;
  const paint = () => {
    try { paintGameLines(gameLinesData(R, hist)); }
    catch (e) { console.error(e); }
  };
  try {
    [R, hist] = await Promise.all([
      raceDataOnce().catch(() => null),
      oddsHistoryOnce().catch(() => null),
      liveOnce().catch(() => null),
    ]);
  } catch (e) { console.error(e); }
  paint();
  onLive(paint);
  document.body.dataset.linesReady = "1";
}

/**
 * The futures, laid out like a sportsbook's futures page: a row of market chips,
 * one clean list of teams per market, sort / division / team controls, and a
 * Live / Opening switch.
 *
 * Presentation only. Each line is one simulateSeason run read through the same
 * priceMarket / winTotals / priceTile the boards always used: Opening is the
 * draft-day SIM, Live is LIVE_NOW.lsim, the very run the live board below is
 * drawn from, so the two can never disagree. Division filtering hides rows; it
 * never re-prices a market.
 */
const FXM_VIEWS = new Set();
/** The live board hands every futures view its line: "ready", "waiting" or "error". */
function fxmLive(status) {
  for (const v of FXM_VIEWS) {
    if (v.root.isConnected) v.setLive(status === "ready" ? LIVE_NOW : null, status);
    else FXM_VIEWS.delete(v);
  }
}

function futuresMarkets(model, sim) {
  const T = model.teams;
  const all = T.map((t, i) => i);
  const divs = [...model.divNames.keys()].sort((a, b) => a - b);
  const byDiv = d => all.filter(i => T[i].div === d);
  const pc = x => `${(x * 100).toFixed(0)}%`;

  const CHIPS = [
    { id: "title", chip: "Championship",
      blurb: "Every price carries a 6% hold, the way a real book's does. The small figure under each price is the model's own probability, with the vig taken back out — the number a sportsbook keeps to itself." },
    { id: "divWin", chip: "Division winners", grid: true,
      blurb: "Four-team divisions, and the three winners take the top three playoff seeds. A soft division is worth more than a good record — which is why these prices don't line up with the title board." },
    { id: "playoff", chip: "Make playoffs", two: true,
      blurb: "Six of twelve get in: the three division winners take seeds 1-3, then the best three records left over. Priced both ways — every manager has a yes and a no." },
    { id: "bye", chip: "First-round bye", two: true,
      blurb: "Seeds 1 and 2 sit out the first playoff round. Priced both ways off the same simulated seasons, the same way as the playoff market." },
    { id: "wins", chip: "Win totals", two: true,
      blurb: "Fourteen games. Each line sits where the simulation is closest to a coin flip, always on the half-win so there's no push. Sorting by odds orders this market by projected wins." },
    { id: "divLast", chip: "Division cellar", grid: true,
      blurb: "To finish last in your own division, on regular-season record." },
    { id: "last", chip: "Last place",
      blurb: "Twelfth is settled in the consolation bracket, not the standings — and Sleeper builds that bracket so the two worst records in the league are never in it." },
  ];

  // Every market for one line, read off one simulation's counts.
  const boardsFor = (S, kind, stamp, LV) => {
    const n = S.sims;
    // The live board's own injury note, on the Live line's championship and
    // playoff rows only — the opening line knows nothing about injuries.
    const inj = i => kind === "live" && LV && LV.plan && LV.adjWeek != null
      ? injuryFuturesNote(LV.plan, T[i].rid, LV.adjWeek) : "";
    const proj = i => `projects ${f1(S.wins[i] / n)} wins`;
    // One winner from the field: priced as a race, exactly as the opening and
    // live boards price it (priceMarket over the field, marketHold for the hold).
    const race = (title, sub, ids, key, note, div, injured) => {
      const priced = priceMarket(ids.map(i => ({ uid: T[i].uid, i, p: S[key][i] / n })));
      return { title, sub, div, hold: `Hold ${(marketHold(priced) * 100).toFixed(1)}%`,
        rows: priced.map(r => ({ i: r.i, key: r.p, prices: [r], labels: [null], note: note(r.i), inj: injured ? inj(r.i) : "" })) };
    };
    // A yes/no book holds on each runner separately: the label is marketHold's
    // average two-way overround, exactly as the live board's playoff board posts it.
    const twoWayHold = rows => `Hold ${(marketHold(rows.map(r =>
      ({ postedP: r.prices[0].postedP, noPostedP: r.prices[1].postedP }))) * 100).toFixed(1)}%`;
    // Every manager is his own yes/no book, as the playoff board always priced it.
    const yesNo = (title, sub, key, note, injured) => {
      const rows = all.map(i => {
        const p = S[key][i] / n;
        return { i, key: p, prices: priceMarket([{ p }, { p: 1 - p }]), labels: ["Yes", "No"], note: note(i), inj: injured ? inj(i) : "" };
      });
      return { title, sub, hold: twoWayHold(rows), rows };
    };
    const lineSub = kind === "live" ? `live line · ${stamp}` : `opening line · ${n.toLocaleString()} simulations`;
    return {
      title: [race("To win the DFFL championship", `${model.season} season · ${lineSub}`,
        all, "title", i => `Makes the playoffs ${pc(S.playoff[i] / n)} · ${proj(i)}`, undefined, true)],
      divWin: divs.map(d => race(`${model.divNames.get(d)} — to win`, `division title · ${lineSub}`, byDiv(d), "divWin", proj, d)),
      playoff: [yesNo("Playoff qualification", `yes / no · six of twelve qualify · ${lineSub}`, "playoff",
        i => `wins the division ${pc(S.divWin[i] / n)} · first-round bye ${pc(S.bye[i] / n)}`, true)],
      bye: [yesNo("First-round bye", `yes / no · the top two seeds skip round one · ${lineSub}`, "bye",
        i => `makes the playoffs ${pc(S.playoff[i] / n)} · ${proj(i)}`)],
      wins: [(() => {
        const rows = winTotals(model, S).map(w => {
          const L = w.line.toFixed(1);
          return { i: w.i, key: w.avg, prices: priceMarket([{ p: w.pOver }, { p: w.pUnder }]),
            labels: [`Over ${L}`, `Under ${L}`], note: `line ${L} · projects ${f1(w.avg)} wins` };
        });
        return { title: "Regular-season wins", sub: `over / under · ${model.weeks} games · ${lineSub}`, hold: twoWayHold(rows), rows };
      })()],
      divLast: divs.map(d => race(`${model.divNames.get(d)} — to finish last`, `within the division · ${lineSub}`, byDiv(d), "divLast", proj, d)),
      last: [race("To finish 12th", `loser of the consolation elimination game · ${lineSub}`, all, "last", proj)],
    };
  };

  const st = { line: "opening", market: "title", sort: "odds", div: "", team: "" };
  const lines = { opening: null, live: null };
  let liveStatus = "pending", liveInfo = null;
  const root = el("div", "fxm");
  root.id = "fxmMarkets";
  const tiles = r => r.prices.map((x, k) => priceTile(x, r.labels[k])).join("");

  const src = el("div", "fxm-src");
  src.innerHTML = `<div class="fxm-seg fxm-lineseg" role="group" aria-label="Price line">
      <button type="button" data-line="live">Live</button><button type="button" data-line="opening">Opening</button></div>
    <p class="fxm-srctxt"></p>`;
  root.appendChild(src);
  const lineBtns = [...src.querySelectorAll("[data-line]")], srcTxt = src.querySelector(".fxm-srctxt");

  const chips = el("div", "fxm-chips");
  chips.setAttribute("role", "tablist");
  chips.setAttribute("aria-label", "Futures markets");
  chips.innerHTML = CHIPS.map(m =>
    `<button type="button" class="fxm-chip" role="tab" data-market="${m.id}">${esc(m.chip)}</button>`).join("");
  root.appendChild(chips);

  const byName = all.slice().sort((a, b) => nameOf(T[a].uid).localeCompare(nameOf(T[b].uid)));
  const bar = el("div", "fxm-bar");
  bar.innerHTML = `<div class="fxm-seg" role="group" aria-label="Sort">
      <button type="button" data-sort="odds">Best odds</button><button type="button" data-sort="name">Name</button></div>
    <label class="fxm-sel">Division<select data-fxm="div"><option value="">All</option>${divs.map(d =>
      `<option value="${d}">${esc(model.divNames.get(d))}</option>`).join("")}</select></label>
    <label class="fxm-sel">Team<select data-fxm="team"><option value="">All teams</option>${byName.map(i =>
      `<option value="${esc(T[i].uid)}">${esc(nameOf(T[i].uid))}</option>`).join("")}</select></label>`;
  root.appendChild(bar);
  const divSel = bar.querySelector('[data-fxm="div"]'), teamSel = bar.querySelector('[data-fxm="team"]');
  const sortBtns = [...bar.querySelectorAll("[data-sort]")];

  const blurb = el("p", "fxm-blurb");
  root.appendChild(blurb);
  const linesHost = el("div", "fxm-lines");
  root.appendChild(linesHost);

  // One line's worth of market lists. Both lines stay in the page so switching
  // between them is instant and every control keeps its state.
  const makeLine = (kind, S, stamp, LV) => {
    const view = el("div", "fxm-line-view");
    view.dataset.line = kind;
    const B = boardsFor(S, kind, stamp, LV), secs = {};
    for (const m of CHIPS) {
      const sec = el("div", "fxm-mkt");
      sec.dataset.market = m.id;
      const wrap = m.grid ? el("div", "bgrid") : sec;
      for (const bd of B[m.id]) {
        bd.el = el("div", "board");
        // The opening boards keep the name the rest of the tab (and verify) knows them by.
        bd.el.dataset.board = kind === "live" ? "fxm-live" : "opening";
        if (bd.div != null) bd.el.dataset.div = bd.div;
        bd.el.innerHTML = `<div class="bhead">
          <span class="bt">${esc(bd.title)}<span class="bs">${esc(bd.sub)}</span></span>
          <span class="hold">${bd.hold}</span></div>`;
        bd.items = bd.rows.map(r => {
          const uid = T[r.i].uid, row = el("button", `orow fxm-row${m.two ? " two" : ""}`);
          row.type = "button";
          Object.assign(row.dataset, { uid, div: T[r.i].div, key: r.key, name: nameOf(uid), price: r.prices[0].price });
          row.innerHTML = `<span class="rk"></span>${avatarHTML(uid, "sm avcell")}
            <span class="who"><span class="n">${esc(nameOf(uid))}</span><span class="s">${esc(r.note)}</span>${r.inj ? `<span class="fxm-inj">${esc(r.inj.replace(/^ · /, ""))}</span>` : ""}</span>
            ${m.two ? `<span class="prices">${tiles(r)}</span>` : tiles(r)}`;
          row.title = `All of ${nameOf(uid)}'s prices`;
          row.onclick = () => { st.team = uid; apply(); };
          return { r, row, name: nameOf(uid) };
        });
        wrap.appendChild(bd.el);
      }
      if (m.grid) sec.appendChild(wrap);
      view.appendChild(sec);
      secs[m.id] = { sec, boards: B[m.id] };
    }
    return { kind, S, view, secs };
  };
  lines.opening = makeLine("opening", sim);
  linesHost.appendChild(lines.opening.view);

  const quirk = el("div", "method fxm-quirk");
  quirk.innerHTML = `<h3>How last place is decided</h3>
    <p>The six teams that miss the playoffs go into a toilet bowl, and it runs backwards: you advance by
       losing. The four best of them play the first round, and the two that lose it carry on. The two
       worst records sit that round out and enter next, already one defeat from the final — and losing
       the final is twelfth.</p>
    <p>So the bottom of this league is played for rather than awarded, and the seeding pushes the worst
       two teams towards it rather than away. It has landed on the worst record in the league twice in
       four seasons, and on a middling one twice.</p>`;
  root.appendChild(quirk);

  const teamHost = el("div", "fxm-teamhost");
  root.appendChild(teamHost);

  const links = el("div", "fxm-links");
  links.innerHTML = `<span>Also on this board:</span>
    <button type="button" data-jump="liveHost">Live board</button>
    <button type="button" data-jump="fxmNotice">House notice</button>
    <button type="button" data-jump="fxmHow">How it's priced</button>`;
  root.appendChild(links);
  root.addEventListener("click", e => {
    const b = e.target.closest("button[data-jump]");
    const t = b && document.getElementById(b.dataset.jump);
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  const paintTeam = uid => {
    const i = T.findIndex(t => t.uid === uid), L = lines[st.line];
    teamHost.innerHTML = "";
    if (i < 0 || !L) return;
    const n = L.S.sims;
    const card = el("div", "board fxm-card");
    card.dataset.uid = uid;
    card.dataset.line = st.line;
    card.innerHTML = `<div class="bhead"><span class="bt fxm-th">${avatarHTML(uid, "sm")}
      <span class="fxm-tn">${esc(nameOf(uid))}<span class="bs">${esc(model.divNames.get(T[i].div))} · projects ${f1(L.S.wins[i] / n)} wins · ${st.line === "live" ? "live" : "opening"} line</span></span></span>
      <button type="button" class="fxm-prof">Profile</button></div>`;
    card.querySelector(".fxm-prof").onclick = () => openProfile(uid);
    for (const m of CHIPS) {
      for (const bd of L.secs[m.id].boards) {
        const r = bd.rows.find(x => x.i === i);
        if (!r) continue;
        const row = el("div", `fxm-trow${m.two ? " two" : ""}`);
        row.dataset.market = m.id;
        row.innerHTML = `<span class="fxm-tm"><span class="mk">${esc(m.chip)}</span><span class="s">${esc(bd.title)}</span>${r.inj ? `<span class="fxm-inj">${esc(r.inj.replace(/^ · /, ""))}</span>` : ""}</span>
          <span class="prices">${tiles(r)}</span>`;
        card.appendChild(row);
      }
    }
    teamHost.appendChild(card);
  };

  const srcText = () => {
    if (st.line === "live" && liveInfo) {
      const d = liveInfo.decided, left = liveInfo.remaining + (liveInfo.pending || []).length;
      return `<b>Live line</b> · repriced off ${d} finished game${d === 1 ? "" : "s"} with ${left} still to play —
        the same prices as the <button type="button" data-jump="liveHost">live board</button>.
        ${esc(updatedAt(liveInfo.at || Date.now()))}.`;
    }
    const why = { pending: "Live prices are on their way.",
      waiting: "There's no live line to show yet, so this is the only one.",
      error: "The live line couldn't be priced, so this is the only one.",
      ready: "Switch to Live for the prices that move with the season." }[liveStatus] || "";
    return `<b>Opening line</b> · priced when the draft finished and not moved by results since. ${why}`;
  };

  function apply() {
    const cmp = st.sort === "name"
      ? (a, b) => a.name.localeCompare(b.name) || b.r.key - a.r.key
      : (a, b) => b.r.key - a.r.key || a.name.localeCompare(b.name);
    for (const L of Object.values(lines)) {
      if (!L) continue;
      L.view.hidden = L.kind !== st.line;
      for (const m of CHIPS) {
        const { sec, boards } = L.secs[m.id];
        sec.hidden = !!st.team || m.id !== st.market;
        for (const bd of boards) {
          bd.items.sort(cmp).forEach(it => bd.el.appendChild(it.row));
          let k = 0;
          for (const it of bd.items) {
            const show = !st.div || String(T[it.r.i].div) === st.div;
            it.row.hidden = !show;
            // A rank only means something when the list is in price order.
            if (show) { k++; it.row.querySelector(".rk").textContent = st.sort === "odds" ? k : ""; }
          }
          bd.el.hidden = k === 0;
        }
      }
    }
    quirk.hidden = !!st.team || st.market !== "last";
    for (const c of chips.children) c.setAttribute("aria-selected", String(!st.team && c.dataset.market === st.market));
    for (const b of sortBtns) { b.setAttribute("aria-pressed", String(b.dataset.sort === st.sort)); b.disabled = !!st.team; }
    for (const b of lineBtns) {
      b.setAttribute("aria-pressed", String(b.dataset.line === st.line));
      b.disabled = b.dataset.line === "live" && !lines.live;
    }
    lineBtns[0].title = lines.live ? "" : "The live line isn't available yet";
    srcTxt.innerHTML = srcText();
    divSel.value = st.div; divSel.disabled = !!st.team;
    teamSel.value = st.team;
    teamHost.hidden = !st.team;
    if (st.team) paintTeam(st.team);
    const m = CHIPS.find(x => x.id === st.market);
    blurb.textContent = st.team
      ? `Every market, one manager. Pick a market above or "All teams" to go back to the full lists.`
      : m.blurb;
    Object.assign(root.dataset, { line: st.line, market: st.market, sort: st.sort, div: st.div, team: st.team, live: liveStatus });
  }

  // A new live line (first arrival, or a poll that repriced it) swaps in its
  // lists and leaves every control, and the reader's scroll, where it was.
  function setLive(N, status) {
    if (status) liveStatus = status;
    if (N && N.lsim && (!lines.live || lines.live.S !== N.lsim)) {
      const y = window.scrollY, first = !lines.live;
      liveInfo = N.live || null;
      const fresh = makeLine("live", N.lsim, updatedAt((N.live && N.live.at) || Date.now()), N.live);
      if (lines.live) lines.live.view.replaceWith(fresh.view); else linesHost.appendChild(fresh.view);
      lines.live = fresh;
      liveStatus = "ready";
      // Live leads once it exists: the first arrival switches to it on its own.
      if (first) st.line = "live";
      apply();
      if (window.scrollY !== y) window.scrollTo(0, y);
      return;
    }
    apply();
  }

  chips.addEventListener("click", e => {
    const c = e.target.closest(".fxm-chip");
    if (!c) return;
    st.market = c.dataset.market; st.team = "";
    apply();
  });
  bar.addEventListener("click", e => {
    const b = e.target.closest("[data-sort]");
    if (!b || b.disabled) return;
    st.sort = b.dataset.sort;
    apply();
  });
  src.addEventListener("click", e => {
    const b = e.target.closest("[data-line]");
    if (!b || b.disabled) return;
    st.line = b.dataset.line;
    apply();
  });
  divSel.onchange = () => { st.div = divSel.value; apply(); };
  teamSel.onchange = () => { st.team = teamSel.value; apply(); };

  const view = { root, setLive, state: () => ({ ...st, liveStatus }) };
  root._fxm = view;
  FXM_VIEWS.add(view);
  // Polls re-read the live board's own line, so the two stay in step.
  onLive(() => { if (root.isConnected && LIVE_NOW) setLive(LIVE_NOW); });
  if (LIVE_NOW) setLive(LIVE_NOW, "ready"); else apply();
  return root;
}

function panelOdds(model, sim) {

    const mode = el("div", "mode");
    mode.innerHTML = post
      ? `<span class="pill post">Repriced · post-draft</span>
         <span class="what">The draft is in. Every roster has been valued against the pre-draft
           market and the whole board has moved — these are no longer prices about the managers,
           they are prices about the teams.</span>`
      : `<span class="pill pre">Opening line · pre-draft</span>
         <span class="what">${model.draftStatus === "drafting"
            ? "The draft is under way. Half-built rosters price badly, so the board holds this line and re-prices in one move the moment the draft finishes."
            : "The draft hasn't run. The board re-prices itself automatically once it does — reload the page after the draft and every number here will have moved."}</span>`;
    p.appendChild(mode);
  }

  // Filled in lazily the first time the tab is opened: the live board needs the
  // remaining schedule and the injury feed, neither of which should hold up the
  // first paint of the whole site.
  const liveHost = el("div"); liveHost.id = "liveHost";

  const notice = el("div", "notice"); notice.id = "fxmNotice";
  notice.innerHTML = `<div class="nt">House notice</div>
    <p><b>These are not real betting lines.</b> No sportsbook offers markets on a
       twelve-man friend league, nothing here is accepting a wager, and every price
       was invented by a model running in your browser.</p>
    ${post ? `
    <p><b>These prices know your rosters, not the season.</b> Every drafted player is
       valued at what a pick at his draft position has historically delivered to a DFFL
       lineup. That is a real signal — about half of a team's draft-day edge shows up in
       its scoring — but it cannot see injuries, waiver pickups, trades, or a rookie
       breaking out.</p>
    <p>Roughly a third of what decides a fantasy season is now on the board. The rest
       hasn't happened.</p>` : `
    <p><b>The board ignores the keepers and the draft order.</b> Both are already public
       on Sleeper, and a ninth-round keeper is a real edge — but a partial roster prices
       worse than none at all, so the model waits for the full draft rather than guessing
       from three players.</p>
    <p><b>It is pre-draft.</b> DFFL re-drafts every season and carries only three keepers
       forward, so most of what decides the year still hasn't happened.</p>
    <p>Read this as a prior on the managers, not a projection of the season.</p>`}`;

  if (!model || !model.ok || !sim) {
    p.appendChild(liveHost);
    p.appendChild(notice);
    p.appendChild(el("div", "empty",
      `<b>No board today</b>The simulation only prices the format it has been checked
       against — twelve teams, three divisions, six playoff teams, a fourteen-week
       season. This league doesn't currently match it, so rather than post numbers
       that don't mean anything, it posts nothing.`));
    return p;
  }

  const n = sim.sims;

  // A sportsbook's futures page first: every season market as chips and lists.
  // The live board and the house notice follow it, moved below rather than removed.
  p.appendChild(futuresMarkets(model, sim));
  p.appendChild(liveHost);
  p.appendChild(notice);

  /* ---- what the draft did (only once there is a draft) ---- */
  if (post) {
    p.appendChild(sechead("What the draft did",
      `Every pick is worth what that draft slot has historically returned to a DFFL starting
       lineup${model.rosterCap ? `, and each manager is scored on his best ${model.rosterCap} of them —
       one per round, so a manager who traded for extra picks is not paid for the extra roster
       slots` : ", summed across the roster"}. The last three columns split each projection into the part that came from the draft and the part that came from the manager's own record.`));
    const byDraft = model.teams.slice().sort((a, b) => b.rosterEdge - a.rosterEdge);
    p.appendChild(tableCard(
      [{ label: "Manager" }, { label: "Roster", num: 1, title: model.rosterCap ? `Points per week this roster projects to deliver, best ${model.rosterCap} picks` : "Points per week this roster projects to deliver" },
      { label: "vs field", num: 1, title: "How far that sits from the average DFFL draft" },
      { label: "From draft", num: 1 }, { label: "From record", num: 1 }, { label: "Projected week", num: 1 }],
      byDraft.map(t => {
        const fromDraft = W_ROSTER * t.rosterEdge, fromRec = W_HIST_POST * t.rawEdge;
        const sgn = (v, d = 1) => `${v >= 0 ? "+" : ""}${d === 1 ? f1(v) : f2(v)}`;
        return `<tr>
          <td><span class="nmcell">${avatarHTML(t.uid, "sm")}${esc(nameOf(t.uid))}</span></td>
          <td class="num">${f1(t.rosterValue)}</td>
          <td class="num ${t.rosterEdge >= 0 ? "pos-t" : "neg-t"}"><b>${sgn(t.rosterEdge)}</b></td>
          <td class="num ${fromDraft >= 0 ? "pos-t" : "neg-t"}">${sgn(fromDraft)}</td>
          <td class="num ${fromRec >= 0 ? "pos-t" : "neg-t"}">${sgn(fromRec)}</td>
          <td class="num"><b>${f1(t.mean)}</b></td></tr>`;
      })));
    if ((model.matchRate != null && model.matchRate < 0.98) || model.picksDropped > 0) {
      const m = el("div", "method");
      m.innerHTML = `${model.matchRate < 0.98 ? `<p>${(model.matchRate * 100).toFixed(0)}% of the
        ${model.picksPriced} picks matched a player on the pre-draft market;
        the rest — team defenses and deep fliers nobody was drafting — were
        valued at the board's floor. Every roster carries a couple, so this
        moves the ordering very little.</p>` : ""}
        ${model.picksDropped > 0 ? `<p>${model.picksDropped}
        ${model.picksDropped === 1 ? "pick was" : "picks were"} traded into rosters beyond
        ${model.rosterCap} players and ${model.picksDropped === 1 ? "does" : "do"} not count.
        A ${model.rosterCap + 1}th player never enters a lineup, so paying for him would price
        roster size rather than roster quality — each manager is valued on his best
        ${model.rosterCap}.</p>` : ""}`;
      p.appendChild(m);
    }
  }

  /* ---- methodology ---- */
  const how = sechead("How the board is priced"); how.id = "fxmHow";
  p.appendChild(how);
  const m = el("div", "method");
  const yrs = `${model.seasons[0]}–${model.seasons[model.seasons.length - 1]}`;
  m.innerHTML = `
    <h3>What the model is told</h3>
    <p>Every regular-season weekly score in DFFL history, ${yrs}. Each manager is
       measured against the league average of his own season, so a higher-scoring year
       doesn't flatter anyone.</p>
    ${post ? `
    <p>And, since the draft ran, every pick all twelve managers made — valued against
       the pre-draft market${model.adpMeta ? ` (${model.adpMeta.source}, ${model.adpMeta.teams}-team
       ${model.adpMeta.format}, ${model.adpMeta.drafts.toLocaleString()} drafts sampled
       ${model.adpMeta.sampled.replace("..", " to ")})` : ""}. Keepers need no special
       treatment here: a player kept in the ninth round is simply a player, priced at
       what he was worth on the open board.</p>
    ${model.rosterCap ? `<p>Each manager is scored on his best ${model.rosterCap} picks — one per
       round of the draft. Picks get traded in DFFL, so rosters leave the draft at different
       sizes, and counting all of them would pay a manager for owning roster slots rather
       than better players: a ${model.rosterCap + 1}th player never enters a lineup. Trading up
       still shows, because it shows in the players.</p>` : ""}
