<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DFFL — League Record Book</title>
<meta name="description" content="All-time records, champions, and weekly recaps for the DFFL fantasy football league.">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0f'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='16' font-weight='800' fill='%233987e5' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --plane:#0b0b0f; --surface:#17171c; --raised:#1f1f26; --hover:#262630;
    --ink:#ffffff; --ink-2:#c6c5cf; --muted:#8b8a95;
    --grid:#2a2a33; --ring:rgba(255,255,255,.09);
    --blue:#3987e5; --red:#e66767; --aqua:#199e70; --gold:#c98500; --violet:#9085e9;
    --good:#0ca30c; --crit:#d03b3b; --mid:#383840;
    --plus:#3ad07f; --hold:#c98500;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --r:14px; --rs:10px;
    --pad:max(16px,env(safe-area-inset-left));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 var(--pad)}
  button{font:inherit;color:inherit}

  /* ============ hero ============ */
  header.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--grid);padding:26px 0 22px}
  header.hero::before{
    content:"";position:absolute;inset:-60% 40% 40% -20%;
    background:radial-gradient(circle at 30% 40%,rgba(57,135,229,.20),transparent 62%);pointer-events:none}
  header.hero::after{
    content:"";position:absolute;inset:-40% -20% 30% 45%;
    background:radial-gradient(circle at 70% 30%,rgba(144,133,233,.15),transparent 62%);pointer-events:none}
  .hero .wrap{position:relative}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1.name{
    font-size:clamp(38px,10vw,64px);margin:4px 0 2px;font-weight:900;letter-spacing:-.035em;line-height:.98;
    background:linear-gradient(96deg,#fff 20%,var(--blue) 70%,var(--violet) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--ink-2);font-size:15px;margin:0}

  /* ============ nav ============ */
  nav.tabs{position:sticky;top:0;z-index:40;background:rgba(11,11,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--grid)}
  .tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
  .tabrow::-webkit-scrollbar{display:none}
  .tabrow button{
    background:transparent;border:1px solid transparent;border-radius:999px;color:var(--muted);
    font-weight:650;font-size:14.5px;padding:8px 15px;cursor:pointer;white-space:nowrap;transition:.14s}
  .tabrow button:hover{color:var(--ink-2);background:var(--raised)}
  .tabrow button[aria-selected="true"]{color:#fff;background:var(--blue);border-color:var(--blue)}

  main{padding:22px 0 90px;min-height:60vh}
  .panel[hidden]{display:none}

  .sechead{margin:34px 0 12px}
  .sechead:first-child{margin-top:0}
  .sechead h2{font-size:23px;margin:0;letter-spacing:-.02em;font-weight:800}
  .sechead p{margin:5px 0 0;color:var(--muted);font-size:14px;max-width:70ch;line-height:1.55}

  /* ============ stat tiles ============ */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
  .tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:13px 15px}
  .tile .l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
  .tile .n{font-size:12.5px;color:var(--ink-2);margin-top:2px}

  /* ============ champ banner ============ */
  .champbar{
    display:flex;align-items:center;gap:15px;margin-top:18px;padding:16px 18px;
    background:linear-gradient(100deg,rgba(201,133,0,.16),rgba(201,133,0,.03) 60%,transparent);
    border:1px solid rgba(201,133,0,.35);border-radius:var(--r)}
  .champbar .ring{width:54px;height:54px;border-radius:50%;flex:none;border:2px solid var(--gold);
    display:grid;place-items:center;overflow:hidden;background:var(--raised);font-weight:800;color:var(--gold)}
  .champbar .ring img{width:100%;height:100%;object-fit:cover}
  .champbar .who{min-width:0}
  .champbar .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .champbar .nm{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .champbar .tm{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ============ manager grid ============ */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .mcard{
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:14px;
    text-align:left;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:9px;width:100%}
  .mcard:hover{background:var(--raised);border-color:rgba(57,135,229,.5);transform:translateY(-2px)}
  .mcard .top{display:flex;align-items:center;gap:10px;min-width:0}
  .mcard .nm{font-weight:700;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .mcard .tm{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .mcard .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .mcard .rec{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .mcard .pc{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mcard .go{font-size:12px;color:var(--blue);font-weight:650;margin-top:auto}

  .av{width:36px;height:36px;border-radius:50%;background:var(--raised);border:1px solid var(--ring);
      display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2);flex:none;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .av.sm{width:28px;height:28px;font-size:10.5px}
  .av.lg{width:66px;height:66px;font-size:20px}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;
    padding:2px 8px;border-radius:999px;border:1px solid var(--ring);white-space:nowrap}
  .badge.gold{color:var(--gold);border-color:rgba(201,133,0,.45);background:rgba(201,133,0,.10)}
  .badge.blue{color:var(--blue);border-color:rgba(57,135,229,.45);background:rgba(57,135,229,.10)}
  .badge.red{color:var(--red);border-color:rgba(230,103,103,.45);background:rgba(230,103,103,.10)}

  /* ============ responsive row-cards ============ */
  .rows{display:flex;flex-direction:column;gap:7px}
  .rowc{
    display:grid;grid-template-columns:30px auto 1fr;align-items:center;gap:11px;
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);padding:11px 13px;
    cursor:pointer;transition:.13s;text-align:left;width:100%}
  .rowc:hover{background:var(--raised);border-color:rgba(57,135,229,.4)}
  .rowc .pos{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
  .rowc .id{min-width:0}
  .rowc .id .n{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rowc .id .s{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowc .stats{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
  .chip{background:var(--raised);border-radius:7px;padding:5px 9px;text-align:center;min-width:56px}
  .chip .cv{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2;display:block}
  .chip .cl{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:1px;display:block}
  .chip.pos-v .cv{color:var(--good)} .chip.neg-v .cv{color:var(--crit)}
  @media(max-width:620px){
    .rowc{grid-template-columns:26px auto 1fr;grid-template-areas:"pos av id" "stats stats stats";gap:8px 9px}
    .rowc .pos{grid-area:pos} .rowc .nmcell{grid-area:av} .rowc .id{grid-area:id}
    .rowc .stats{grid-area:stats;justify-content:flex-start;margin-top:2px}
    .chip{min-width:0;flex:1}
  }

  /* ============ bars ============ */
  .barbox{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .bars{display:grid;gap:8px}
  .bar{display:grid;grid-template-columns:minmax(88px,132px) 1fr 56px;align-items:center;gap:10px;font-size:13.5px}
  .bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .bar .track{display:block;height:17px;background:var(--raised);border-radius:0 5px 5px 0;overflow:hidden}
  .bar .fill{display:block;height:100%;min-width:3px;border-radius:0 5px 5px 0;background:var(--blue)}
  .bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .divbar{display:grid;grid-template-columns:minmax(88px,132px) 1fr 56px;align-items:center;gap:10px;font-size:13.5px}
  .divbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
  .divbar .track{display:block;height:17px;position:relative;background:var(--raised);border-radius:4px}
  .divbar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--mid);left:50%}
  .divbar .fill{position:absolute;top:0;bottom:0;border-radius:4px}
  .divbar .v{text-align:right;font-variant-numeric:tabular-nums}

  /* ============ trophies ============ */
  .trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
  .trophy{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
  .trophy::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),rgba(201,133,0,.2))}
  .trophy .yr{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .trophy .win{display:flex;align-items:center;gap:11px;margin:11px 0 3px}
  .trophy .win .nm{font-size:21px;font-weight:850;letter-spacing:-.02em}
  .trophy dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
  .trophy dt{color:var(--muted)} .trophy dd{margin:0;text-align:right;font-weight:600}
  .trophy dd.last{color:var(--red)}

  /* ============ record cards ============ */
  .recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:11px}
  .rec{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .rec .l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .rec .v{font-size:32px;font-weight:900;letter-spacing:-.03em;margin:6px 0 3px;font-variant-numeric:tabular-nums}
  .rec .w{font-size:14.5px;font-weight:650}
  .rec .c{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .rec.up .v{color:var(--blue)} .rec.down .v{color:var(--red)}

  /* ============ tables ============ */
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750;background:var(--raised)}
  td.num,th.num{font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
  th:first-child{background:var(--raised);z-index:2}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td,tbody tr:hover td:first-child{background:var(--hover)}
  .nmcell{display:flex;align-items:center;gap:8px}
  .pos-t{color:var(--good)} .neg-t{color:var(--crit)}

  /* ============ h2h ============ */
  .h2h td.cell{text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;padding:8px 6px;border:1px solid var(--plane)}
  .h2h td.self{background:var(--raised);color:var(--muted)}
  .h2h th.rot{font-size:10.5px;letter-spacing:0;text-transform:none;padding:9px 5px}
  .legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:11px;flex-wrap:wrap}
  .ramp{display:flex;height:11px;width:150px;border-radius:3px;overflow:hidden;border:1px solid var(--ring)}
  .ramp i{flex:1}

  /* ============ compare ============ */
  .compare{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .cpick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .cpick .vs{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em}
  .cout{margin-top:15px;padding-top:15px;border-top:1px solid var(--grid)}
  .cscore{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
  .cscore .big{font-size:42px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
  .cscore .dash{color:var(--muted);font-size:19px;font-weight:700}
  .cscore .lbl{font-size:12.5px;color:var(--muted);margin-top:5px}
  .cmeta{display:flex;gap:9px;justify-content:center;margin-top:14px;flex-wrap:wrap}

  /* ============ profile ============ */
  .back{background:var(--raised);border:1px solid var(--ring);border-radius:999px;padding:7px 15px;
    font-size:13.5px;font-weight:650;cursor:pointer;color:var(--ink-2);margin-bottom:16px;transition:.13s}
  .back:hover{background:var(--hover);color:var(--ink)}
  .phead{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:6px}
  .phead .nm{font-size:clamp(27px,7vw,38px);font-weight:900;letter-spacing:-.03em;line-height:1.05}
  .phead .tm{color:var(--ink-2);font-size:14.5px}
  .pbadges{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

  /* ============ recaps ============ */
  .recap{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:17px 18px;margin-bottom:11px}
  .recap h3{margin:0 0 5px;font-size:17.5px;letter-spacing:-.015em;font-weight:750}
  .recap .sc{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:10px;font-weight:600}
  .recap p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.65}
  .wkhead{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
  .wkhead h3{margin:0;font-size:20px;font-weight:800}
  .wkhead span{color:var(--muted);font-size:13px}

  /* ============ glossary ============ */
  details.gloss{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);margin-top:22px}
  details.gloss summary{padding:14px 16px;cursor:pointer;font-weight:700;font-size:14.5px;list-style:none}
  details.gloss summary::-webkit-details-marker{display:none}
  details.gloss summary::before{content:"? ";color:var(--blue);font-weight:900}
  details.gloss[open] summary{border-bottom:1px solid var(--grid)}
  .gitems{padding:12px 16px 16px;display:grid;gap:11px}
  .gitem b{display:block;font-size:13.5px;margin-bottom:2px}
  .gitem span{font-size:13.5px;color:var(--muted);line-height:1.55}

  /* ============ scoreboard ============ */
  .sbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:11px}
  .game{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden}
  .gside{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px;
    width:100%;background:transparent;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:.13s}
  .gside:hover{background:var(--hover)}
  .gside.win:hover{background:linear-gradient(90deg,rgba(57,135,229,.20),var(--hover))}
  .gside + .gside{border-top:1px solid var(--grid)}
  .gside.win{background:linear-gradient(90deg,rgba(57,135,229,.11),transparent)}
  .gside .gn{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gside .gt{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .gside .gp{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .gside.win .gp{color:var(--blue)}
  .gside.lose .gn,.gside.lose .gp{color:var(--ink-2)}
  .gfoot{padding:8px 14px;background:var(--raised);font-size:11.5px;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .gfoot a{color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}
  .gfoot a:hover{text-decoration:underline}
  .pickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin-bottom:14px}

  /* ============ awards ============ */
  .awgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .awcard{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:15px}
  .awcard > .yr{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
  .aw{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 0}
  .aw + .aw{border-top:1px solid var(--grid)}
  .aw .t{font-size:13px;font-weight:700}
  .aw .d{font-size:11.5px;color:var(--muted);display:block;line-height:1.4}
  .aw .n{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .aw .ic{font-size:17px;width:22px;text-align:center}

  /* ============ odds board ============ */
  .notice{border:1px solid rgba(201,133,0,.42);background:rgba(201,133,0,.07);border-radius:var(--r);
    padding:14px 16px;margin-bottom:20px}
  .notice .nt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--hold);font-weight:700;margin-bottom:7px}
  .notice p{margin:0 0 7px;font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:76ch}
  .notice p:last-child{margin-bottom:0}
  .notice b{color:var(--ink);font-weight:700}

  .board{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
    overflow:hidden;margin-bottom:11px}
  .bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 15px;background:var(--raised);border-bottom:1px solid var(--grid)}
  .bhead .bt{font-size:14.5px;font-weight:800;letter-spacing:-.01em;min-width:0}
  .bhead .bs{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-top:2px;line-height:1.4}
  .bhead .hold{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--hold);border:1px solid rgba(201,133,0,.4);background:rgba(201,133,0,.09);
    border-radius:6px;padding:4px 7px;white-space:nowrap;font-weight:700;flex:none}

  .orow{display:grid;grid-template-columns:20px auto minmax(0,1fr) auto;align-items:center;gap:10px;
    padding:9px 15px;width:100%;background:transparent;border:0;border-top:1px solid var(--grid);
    text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .13s}
  .board .orow:first-of-type{border-top:0}
  .orow:hover{background:var(--hover)}
  .orow:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .orow .rk{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
  .orow .who{min-width:0}
  .orow .who .n{font-weight:700;font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .orow .who .s{font-size:11.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* the price tile — a posted number, and underneath it the number the book hides */
  .price{display:block;min-width:74px;border:1px solid var(--ring);background:var(--raised);
    border-radius:9px;padding:6px 9px;text-align:center;transition:border-color .13s,background .13s}
  .price .o{font-family:var(--mono);font-size:15.5px;font-weight:700;line-height:1.15;display:block;
    font-variant-numeric:tabular-nums}
  .price.plus .o{color:var(--plus)}
  .price .tp{font-family:var(--mono);font-size:9.5px;color:var(--muted);display:block;margin-top:2px}
  .price .k{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    font-weight:700;display:block;margin-bottom:3px}
  .orow:hover .price{border-color:rgba(57,135,229,.55);background:var(--hover)}
  .prices{display:flex;gap:7px}
  @media(max-width:560px){
    .orow.two{grid-template-columns:20px auto minmax(0,1fr);grid-template-areas:"rk av who" "pr pr pr"}
    .orow.two .rk{grid-area:rk} .orow.two .avcell{grid-area:av} .orow.two .who{grid-area:who}
    .orow.two .prices{grid-area:pr;margin-top:3px}
    .orow.two .prices .price{flex:1;min-width:0}
  }
  @media(prefers-reduced-motion:reduce){.orow,.price{transition:none}}

  .bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:11px}

  .mode{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin:0 0 16px}
  .mode .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;flex:none}
  .mode .pill.pre{color:var(--hold);border:1px solid rgba(201,133,0,.45);background:rgba(201,133,0,.10)}
  .mode .pill.post{color:var(--plus);border:1px solid rgba(58,208,127,.42);background:rgba(58,208,127,.10)}
  .mode .what{font-size:13.5px;color:var(--ink-2);line-height:1.55;min-width:0}

  .method{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px;margin-top:22px}
  .method h3{margin:0 0 4px;font-size:15px;font-weight:800}
  .method p{margin:0 0 11px;font-size:13.5px;color:var(--ink-2);line-height:1.6;max-width:78ch}
  .method p:last-child{margin-bottom:0}
  .method code{font-family:var(--mono);font-size:12.5px;background:var(--raised);border-radius:5px;padding:1px 5px;color:var(--ink)}
  .method dl{margin:0 0 13px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
  .method dt{color:var(--muted)} .method dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ============ draft board ============ */
  .pos-dot{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:19px;
    border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.04em;padding:0 5px;flex:none;
    background:var(--raised);color:var(--ink-2);border:1px solid var(--ring)}
  .pos-dot.qb{color:#b3a9ff;border-color:rgba(144,133,233,.45);background:rgba(144,133,233,.13)}
  .pos-dot.rb{color:#3fc79a;border-color:rgba(25,158,112,.45);background:rgba(25,158,112,.13)}
  .pos-dot.wr{color:#7fb4f2;border-color:rgba(57,135,229,.45);background:rgba(57,135,229,.13)}
  .pos-dot.te{color:#e0a63c;border-color:rgba(201,133,0,.45);background:rgba(201,133,0,.13)}
  .pos-dot.kk{color:var(--muted)}
  .pos-dot.def{color:#f09090;border-color:rgba(230,103,103,.45);background:rgba(230,103,103,.13)}

  .dboard{display:grid;gap:1px;background:var(--grid);padding:1px;min-width:max-content}
  .dboard .bh{background:var(--raised);padding:8px 7px;font-size:10.5px;font-weight:750;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-align:center}
  .dboard .bh.corner{background:var(--raised)}
  .dboard .brd{background:var(--raised);display:grid;place-items:center;font-size:11.5px;font-weight:800;
    color:var(--muted);font-variant-numeric:tabular-nums}
  .dboard .bc{background:var(--surface);border:0;border-left:3px solid var(--mid);padding:7px 8px;
    text-align:left;cursor:pointer;font:inherit;color:inherit;display:grid;gap:1px;transition:background .12s;
    min-width:0}
  .dboard .bc:hover{background:var(--hover)}
  .dboard .bc:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .dboard .bc.empty{background:var(--plane);border-left-color:transparent;cursor:default}
  .dboard .bc .no{font-size:9.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .dboard .bc .no .k{color:var(--gold);font-weight:900}
  .dboard .bc .nm{font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dboard .bc .mt{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dboard .bc.qb{border-left-color:#9085e9} .dboard .bc.rb{border-left-color:#199e70}
  .dboard .bc.wr{border-left-color:#3987e5} .dboard .bc.te{border-left-color:#c98500}
  .dboard .bc.def{border-left-color:#e66767} .dboard .bc.kk{border-left-color:var(--mid)}

  .mgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
  .dcard{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden}
  .dh{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--raised);
    border-bottom:1px solid var(--grid)}
  .dh .n{font-weight:750;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dh .tot{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;flex:none}
  .dpicks{display:grid}
  .dp{display:grid;grid-template-columns:20px 34px minmax(0,1fr) auto;align-items:center;gap:8px;
    padding:7px 12px;background:transparent;border:0;border-top:1px solid var(--grid);text-align:left;
    font:inherit;color:inherit;cursor:pointer;transition:background .12s}
  .dpicks .dp:first-child{border-top:0}
  .dp:hover{background:var(--hover)}
  .dp .rd{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .dp .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dp .nm .k{color:var(--gold);font-size:10.5px;font-weight:900}
  .dp .pts{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* ============ player card ============ */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);
    display:grid;place-items:center;padding:16px}
  .mbox{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);width:min(560px,100%);
    max-height:88vh;overflow:auto;padding:18px 20px 20px;position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .mx{position:absolute;top:10px;right:12px;background:transparent;border:0;color:var(--muted);
    font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
  .mx:hover{color:var(--ink);background:var(--raised)}
  .mhead{display:flex;align-items:center;gap:11px;padding-right:30px}
  .mhead .who{min-width:0}
  .mhead .n{font-size:21px;font-weight:850;letter-spacing:-.02em;line-height:1.2}
  .mhead .s{font-size:12.5px;color:var(--muted);margin-top:2px}
  .mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:15px 0 4px}
  .ms{background:var(--raised);border-radius:9px;padding:9px 11px}
  .ms b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ms span{font-size:10.5px;color:var(--muted);line-height:1.3;display:block;margin-top:1px}
  .wkchart{display:flex;align-items:flex-end;gap:3px;height:104px;margin:14px 0 0}
  .wkchart .wk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    height:100%;gap:3px;min-width:0}
  .wkchart .bar{display:block;width:100%;background:var(--blue);border-radius:2px 2px 0 0}
  .wkchart .wk.post .bar{background:var(--mid)}
  .wkchart .n{font-size:8.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mnote{font-size:12.5px;color:var(--muted);line-height:1.55;margin:12px 0 0}
  .mempty{background:var(--raised);border-radius:9px;padding:18px;text-align:center;color:var(--muted);
    font-size:13.5px;margin-top:15px}

  /* ============ long-form articles ============ */
  .artl{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
    padding:26px 26px 28px;margin-bottom:16px;overflow:hidden}
  .ahdr{border-bottom:1px solid var(--grid);padding-bottom:16px;margin-bottom:20px}
  .ak{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--red);font-weight:700}
  .artl h2{font-size:clamp(29px,5.4vw,44px);line-height:1.03;letter-spacing:-.035em;font-weight:900;
    margin:10px 0 0;text-wrap:balance}
  .adek{font-size:17px;line-height:1.5;color:var(--ink-2);margin:11px 0 0;max-width:60ch;text-wrap:pretty}
  .aby{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  .aby b{color:var(--ink-2);font-weight:700}
  .abd{max-width:66ch}
  .apara{font-size:16.5px;line-height:1.7;color:var(--ink-2);margin:0 0 17px;text-wrap:pretty}
  .apara b{color:var(--ink);font-weight:750}
  .apara.lead{font-size:18px;color:var(--ink)}
  .ahead{margin:30px 0 12px}
  .ahead .ae{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--blue);font-weight:700}
  .ahead h3{margin:5px 0 0;font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
  .astat{display:flex;gap:15px;align-items:baseline;border-top:2px solid var(--ink);
    border-bottom:1px solid var(--grid);padding:15px 0 16px;margin:22px 0}
  .astat .n{font-size:44px;font-weight:900;letter-spacing:-.04em;color:var(--blue);
    font-variant-numeric:tabular-nums;line-height:.9;flex:none}
  .astat .t{font-size:14.5px;line-height:1.5;color:var(--ink-2)}
  .anote{font-size:13px;line-height:1.6;color:var(--muted);border-top:1px solid var(--grid);
    padding-top:14px;margin:24px 0 0}

  .abars{margin:24px 0;max-width:none}
  .abars .at{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .abars .as{font-size:12.5px;color:var(--muted);margin:3px 0 14px;line-height:1.45}
  .abody{display:grid;gap:6px}
  .abar{display:grid;grid-template-columns:minmax(84px,124px) 1fr 46px;align-items:center;gap:10px}
  .abar .who{font-size:13px;font-weight:650;text-align:right;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;line-height:1.2}
  .abar .who i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);font-weight:700}
  .abar .track{position:relative;height:20px;background:var(--raised);border-radius:3px}
  .abar .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--mid);left:50%}
  .abar .fill{position:absolute;top:3px;bottom:3px;border-radius:2px;background:var(--blue)}
  .abar.g2 .fill{background:var(--aqua)} .abar.g3 .fill{background:var(--gold)}
  .abar .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
    text-align:right;color:var(--ink-2)}

  .acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin:22px 0}
  .acard{background:var(--raised);border:1px solid var(--ring);border-radius:var(--rs);padding:14px 15px}
  .acard.lead{border-color:rgba(57,135,229,.5)}
  .acard .ct{font-size:12px;letter-spacing:.11em;text-transform:uppercase;font-weight:800}
  .acard .cb{font-family:var(--mono);font-size:23px;font-variant-numeric:tabular-nums;margin:5px 0 2px;
    letter-spacing:-.02em}
  .acard .cs{font-size:11.5px;color:var(--muted);line-height:1.4;margin-bottom:10px}
  .acard .cr{display:grid;gap:4px}
  .acard .cr span{display:flex;align-items:baseline;gap:8px;font-size:13px}
  .acard .cr i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acard .cr b{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:400;
    color:var(--muted);font-variant-numeric:tabular-nums}

  .apicks{margin:20px 0;border-top:2px solid var(--ink)}
  .apick{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;
    padding:10px 0;border-bottom:1px solid var(--grid)}
  .apick .sl{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .apick .nm{font-size:14.5px;line-height:1.3}
  .apick .nm i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
  .apick .dl{font-family:var(--mono);font-size:13px;color:var(--plus);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  @media(max-width:560px){
    .artl{padding:20px 17px 22px}
    .astat{flex-direction:column;gap:7px}
    .astat .n{font-size:38px}
    .abar{grid-template-columns:minmax(70px,92px) 1fr 42px;gap:8px}
  }

  /* ============ recap notebook ============ */
  .lede{background:var(--surface);border:1px solid var(--ring);border-left:3px solid var(--blue);
    border-radius:var(--rs);padding:14px 16px;margin-bottom:12px}
  .lede p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink-2)}
  .movers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:14px}
  .mgrp{background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);padding:11px 13px}
  .mgrp .ml{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin-bottom:8px}
  .mvr{display:flex;align-items:center;gap:9px;padding:4px 0}
  .mvr .who{min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .mvr .who b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mvr .who i{font-size:11.5px;color:var(--muted);font-style:normal}
  .mvr .mv{margin-left:auto;flex:none}
  .around{display:grid;gap:9px}
  .atl{display:grid;grid-template-columns:26px 1fr;gap:11px;background:var(--surface);
    border:1px solid var(--ring);border-radius:var(--rs);padding:13px 15px}
  .atl .ic{font-size:14px;color:var(--blue);font-weight:800;text-align:center;line-height:1.5}
  .atl .kl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .atl h4{margin:2px 0 4px;font-size:15.5px;font-weight:750;letter-spacing:-.01em}
  .atl p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}

  /* ============ power rankings ============ */
  .pwrow{
    display:grid;grid-template-columns:30px 52px auto minmax(0,1fr) auto auto;align-items:center;gap:11px;
    background:var(--surface);border:1px solid var(--ring);border-radius:var(--rs);padding:11px 13px}
  .pwrow .pr{font-size:17px;font-weight:850;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center;
    letter-spacing:-.02em}
  .mv{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;
    display:inline-block}
  .mv.up{color:var(--good)} .mv.down{color:var(--crit)}
  .mv.flat,.mv.none{color:var(--muted)}
  .pwrow .id{min-width:0}
  .pwrow .id .n{font-weight:750;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pwrow .id .s{font-size:12.5px;color:var(--muted);display:block;line-height:1.45}
  .pwrow .sp{display:flex;align-items:center;flex:none}
  .spark{display:block}
  .pwrow .stats{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
  @media(max-width:820px){
    .pwrow{grid-template-columns:30px 52px auto minmax(0,1fr);
      grid-template-areas:"pr mv av id" "sp sp sp sp" "st st st st";gap:8px 10px}
    .pwrow .pr{grid-area:pr} .pwrow .mv{grid-area:mv} .pwrow .av{grid-area:av} .pwrow .id{grid-area:id}
    .pwrow .sp{grid-area:sp;justify-content:flex-start}
    .pwrow .stats{grid-area:st;justify-content:flex-start}
    .pwrow .stats .chip{flex:1;min-width:0}
  }
  @media(max-width:420px){.pwrow .sp{display:none}}

  /* ============ race ============ */
  .bigg{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px;margin:0 0 18px;
    background:linear-gradient(100deg,rgba(57,135,229,.18),rgba(144,133,233,.06) 58%,transparent);
    border:1px solid rgba(57,135,229,.40)}
  .bigg .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:700}
  .bigg .vs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 4px}
  .bigg .side{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 220px}
  .bigg .side .n{font-size:17px;font-weight:800;letter-spacing:-.02em;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .bigg .side .sw{margin-left:auto;font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;flex:none}
  .bigg .x{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.1em;flex:none}
  .bigg .c{font-size:13px;color:var(--ink-2);line-height:1.55;max-width:74ch;margin-top:6px}
  @media(max-width:560px){.bigg .x{display:none}}

  /* ============ trades ============ */
  .fleece{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px;margin-top:18px;
    background:linear-gradient(100deg,rgba(230,103,103,.17),rgba(230,103,103,.03) 58%,transparent);
    border:1px solid rgba(230,103,103,.38)}
  .fleece .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--red);font-weight:700}
  .fleece .v{font-size:clamp(30px,9vw,42px);font-weight:900;letter-spacing:-.035em;line-height:1.05;margin:6px 0 2px;
    font-variant-numeric:tabular-nums}
  .fleece .w{font-size:16px;font-weight:750;letter-spacing:-.01em}
  .fleece .c{font-size:13px;color:var(--ink-2);margin-top:5px;line-height:1.5;max-width:64ch}

  .trade{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);overflow:hidden;margin-bottom:11px}
  .thead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 14px;background:var(--raised);border-bottom:1px solid var(--grid)}
  .thead .twhen{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .verd{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
    border-radius:999px;padding:4px 10px;white-space:nowrap;border:1px solid var(--ring);color:var(--ink-2)}
  .verd.even{color:var(--muted)}
  .verd.win{color:var(--blue);border-color:rgba(57,135,229,.45);background:rgba(57,135,229,.10)}
  .verd.lop{color:var(--hold);border-color:rgba(201,133,0,.45);background:rgba(201,133,0,.10)}
  .verd.fleeced{color:var(--red);border-color:rgba(230,103,103,.45);background:rgba(230,103,103,.10)}
  .verd.none{color:var(--muted);border-style:dashed}

  .tsides{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .tside{padding:12px 14px;min-width:0;border-top:1px solid var(--grid)}
  .tside + .tside{border-left:1px solid var(--grid)}
  @media(max-width:560px){.tside + .tside{border-left:0}}
  .tside.won{background:linear-gradient(180deg,rgba(57,135,229,.09),transparent 70%)}
  .tside .who{display:flex;align-items:center;gap:9px;min-width:0}
  .tside .who .n{font-weight:750;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tside .net{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;flex:none}
  .tlist{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:4px}
  .tline{display:flex;align-items:baseline;gap:8px;font-size:13.5px;min-width:0}
  .tline .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);min-width:0}

  .tline .pn{white-space:normal}
  .tline .sub{font-size:11px;color:var(--muted);font-style:normal;display:block;line-height:1.35}

  .tfilter{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:430px;margin:0 0 14px}
  .back.more{display:block;width:100%;margin:4px 0 0;text-align:center}

  /* ============ misc ============ */
  select{background:var(--raised);color:var(--ink);border:1px solid var(--ring);border-radius:9px;
    padding:10px 11px;font:inherit;font-size:14px;width:100%;cursor:pointer}
  .empty{background:var(--surface);border:1px dashed var(--mid);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink-2);font-size:16px;margin-bottom:6px;font-weight:700}
  #loader{padding:76px 0;text-align:center;color:var(--muted)}
  .prog{height:5px;background:var(--raised);border-radius:3px;max-width:300px;margin:17px auto 0;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));width:0%;transition:width .18s}
  .err{background:#241618;border:1px solid var(--crit);border-radius:var(--r);padding:17px;color:#f0c9c9}
  footer{border-top:1px solid var(--grid);padding:22px 0 46px;color:var(--muted);font-size:12.5px;line-height:1.6}
  .tip{position:fixed;pointer-events:none;z-index:99;background:#000;border:1px solid var(--ring);border-radius:9px;
       padding:8px 11px;font-size:12.5px;color:var(--ink);box-shadow:0 8px 26px rgba(0,0,0,.7);opacity:0;transition:opacity .1s;left:0;top:0;max-width:250px}
  @media(hover:none){.tip{display:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">Fantasy Football</div>
    <h1 class="name" id="lgName">DFFL</h1>
    <p class="tagline" id="lgSub">Loading every season from Sleeper…</p>
  </div>
</header>

<nav class="tabs"><div class="wrap"><div class="tabrow" id="tabs" role="tablist"></div></div></nav>

<main class="wrap">
  <div id="loader">
    Pulling every season from Sleeper…
    <div class="prog"><i id="progBar"></i></div>
    <div id="progTxt" style="font-size:12.5px;margin-top:9px"></div>
  </div>
  <div id="app" hidden></div>
</main>

<footer><div class="wrap">
  Live from the public Sleeper API — this page reads the league straight from Sleeper every time it
  loads, so it can never be out of date.<span id="footNote"></span>
</div></footer>

<div class="tip" id="tip"></div>

<script>
/* =========================================================================
   DFFL League Record Book — pure client-side, reads the public Sleeper API.
   ========================================================================= */

const CURRENT_LEAGUE_ID = "1318040218183417856";
const API = "https://api.sleeper.app/v1";
const MOCK = new URLSearchParams(location.search).has("mock");

/* ---------------------------------------------------------------- utils */
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const f2 = n => (Math.round(n * 100) / 100).toFixed(2);
const pct = n => (n * 100).toFixed(1) + "%";
const ord = n => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}
async function pool(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

/* ------------------------------------------------------------ mock mode */
let MOCKDATA = null;
async function mockInit() { MOCKDATA = await jget("fixtures/2025.json"); }

/* ------------------------------------------------------------ data load */
let done = 0, total = 1;
function tick(msg) {
  done++;
  const bar = $("#progBar"); if (bar) bar.style.width = Math.min(100, (done / total) * 100) + "%";
  const txt = $("#progTxt"); if (txt && msg) txt.textContent = msg;
}
async function getLeague(id) {
  if (MOCK) return { ...MOCKDATA.league, previous_league_id: null };
  return jget(`${API}/league/${id}`);
}
async function getSide(id, path) {
  if (MOCK) return MOCKDATA[path] ?? [];
  return jget(`${API}/league/${id}/${path}`);
}
async function getWeek(id, wk) {
  if (MOCK) return MOCKDATA.matchups[String(wk)] ?? [];
  return jget(`${API}/league/${id}/matchups/${wk}`);
}

async function loadChain() {
  const chain = [];
  let id = CURRENT_LEAGUE_ID;
  const seen = new Set();
  while (id && !seen.has(id) && chain.length < 30) {
    seen.add(id);
    const lg = await getLeague(id);
    if (!lg || !lg.league_id) break;
    chain.push(lg);
    id = lg.previous_league_id;
  }
  return chain;
}

/** Pair a week's raw entries into head-to-head games via matchup_id. */
function pairWeek(entries) {
  const by = new Map();
  for (const e of entries || []) {
    if (e.matchup_id == null) continue;
    if (!by.has(e.matchup_id)) by.set(e.matchup_id, []);
    by.get(e.matchup_id).push(e);
  }
  const games = [];
  for (const arr of by.values()) {
    if (arr.length !== 2) continue;
    const [a, b] = arr;
    const pa = Number(a.points), pb = Number(b.points);
    if (!isFinite(pa) || !isFinite(pb)) continue;
    if (pa === 0 && pb === 0) continue;
    games.push([{ rid: a.roster_id, pts: pa }, { rid: b.roster_id, pts: pb }]);
  }
  return games;
}

/**
 * Sleeper brackets → { place: roster_id }.
 * winners_bracket p=k decides places k and k+1.
 * losers_bracket  p=k decides places (playoffTeams+k) and (playoffTeams+k+1).
 */
function placementsOf(wb, lb, playoffTeams) {
  const p = {};
  for (const g of wb || []) if (g.p && g.w != null && g.l != null) { p[g.p] = g.w; p[g.p + 1] = g.l; }
  for (const g of lb || []) if (g.p && g.w != null && g.l != null) { p[playoffTeams + g.p] = g.w; p[playoffTeams + g.p + 1] = g.l; }
  return p;
}

const DB = { seasons: [], games: [], mgr: new Map(), state: null };

function mgrOf(uid, seedName) {
  if (!DB.mgr.has(uid)) DB.mgr.set(uid, { uid, name: seedName || "Unknown", team: "", avatar: null });
  const m = DB.mgr.get(uid);
  if (seedName && !m.locked) m.name = seedName;
  return m;
}

async function loadSeason(lg) {
  const id = lg.league_id;
  const pws = Number(lg.settings && lg.settings.playoff_week_start) || 15;
  const ptm = Number(lg.settings && lg.settings.playoff_teams) || 6;
  const started = lg.status !== "pre_draft" && lg.status !== "drafting";

  const [users, rosters, wb, lb, drafts] = await Promise.all([
    getSide(id, "users").catch(() => []),
    getSide(id, "rosters").catch(() => []),
    started ? getSide(id, "winners_bracket").catch(() => []) : Promise.resolve([]),
    started ? getSide(id, "losers_bracket").catch(() => []) : Promise.resolve([]),
    // Always: the current season's draft exists (with keepers already in it)
    // before the season starts, and the odds board re-prices the moment it ends.
    getSide(id, "drafts").catch(() => []),
  ]);
  tick(`${lg.season} season`);

  const uidOf = new Map(rosters.map(r => [r.roster_id, r.owner_id]));
  const userById = new Map(users.map(u => [u.user_id, u]));

  for (const r of rosters) {
    const u = userById.get(r.owner_id);
    if (!u) continue;
    const m = mgrOf(r.owner_id, u.display_name);
    if (!m.avatar && u.avatar) m.avatar = u.avatar;
    const tn = u.metadata && u.metadata.team_name;
    if (tn && !m.team) m.team = tn;
    m.locked = true;
  }

  let lastWeek = pws + 2;
  if (started && lg.status !== "complete") {
    const cur = DB.state && String(DB.state.season) === String(lg.season) ? Number(DB.state.week) : lastWeek;
    lastWeek = Math.max(0, Math.min(lastWeek, cur));
  }
  const weeks = started ? Array.from({ length: lastWeek }, (_, i) => i + 1) : [];

  const raw = await pool(weeks, 6, async wk => {
    const d = await getWeek(id, wk).catch(() => []);
    tick(`${lg.season} · week ${wk}`);
    return { wk, d };
  });

  const seasonGames = [];
  for (const { wk, d } of raw) {
    for (const [a, b] of pairWeek(d)) {
      const g = {
        season: lg.season, week: wk, playoff: wk >= pws,
        a: { rid: a.rid, uid: uidOf.get(a.rid), pts: a.pts },
        b: { rid: b.rid, uid: uidOf.get(b.rid), pts: b.pts },
      };
      if (!g.a.uid || !g.b.uid) continue;
      seasonGames.push(g);
      DB.games.push(g);
    }
  }

  // Per-player production under THIS league's scoring. Two shapes of the same
  // numbers: playerPts is the regular-season total, which is what a draft pick
  // is judged on; playerWeek keeps them week by week, which is what a trade has
  // to be judged on — a trade can only be credited with points scored after it.
  const playerPts = new Map();
  const playerWeek = new Map();
  for (const { wk, d } of raw) {
    for (const e of d || []) {
      const pp = e.players_points;
      if (!pp) continue;
      let wm = playerWeek.get(wk);
      if (!wm) playerWeek.set(wk, wm = new Map());
      for (const pid of Object.keys(pp)) {
        const v = Number(pp[pid]);
        if (!isFinite(v)) continue;
        wm.set(pid, v);
        if (wk < pws) playerPts.set(pid, (playerPts.get(pid) || 0) + v);
      }
    }
  }

  // Draft picks for this season (names ride along in pick.metadata).
  let picks = [];
  const draft = (drafts && drafts[0]) || null;
  const draftId = (draft && draft.draft_id) || null;
  if (draftId && !MOCK) picks = await jget(`${API}/draft/${draftId}/picks`).catch(() => []);
  if (picks.length) tick(`${lg.season} draft`);

  // A draft is only "done" when Sleeper says complete AND the board is full.
  // Mid-draft the roster is half-built, so the odds stay on the pre-draft model.
  const draftRounds = Number(draft && draft.settings && draft.settings.rounds) || 0;
  const draftSlots = draftRounds * (Number(draft && draft.settings && draft.settings.teams) || rosters.length || 0);
  const draftDone = !!draft && draft.status === "complete" && draftSlots > 0 && picks.length >= draftSlots;

  // Divisions live in two places: the names hang off league.metadata.division_N,
  // the membership off each roster's settings.division.
  const meta = lg.metadata || {};
  const divCount = Number(lg.settings && lg.settings.divisions) || 0;
  const divNames = new Map();
  for (let d = 1; d <= divCount; d++) divNames.set(d, meta[`division_${d}`] || `Division ${d}`);
  const divOf = new Map();
  for (const r of rosters) {
    const d = r.settings && r.settings.division;
    if (d != null) divOf.set(r.roster_id, Number(d));
  }

  DB.seasons.push({
    leagueId: id, season: lg.season, name: lg.name, status: lg.status,
    pws, playoffTeams: ptm, rosters, users, uidOf, userById,
    places: placementsOf(wb, lb, ptm), wb, lb, games: seasonGames,
    complete: lg.status === "complete",
    picks, playerPts, playerWeek, draftId,
    draftStatus: (draft && draft.status) || null, draftRounds, draftSlots, draftDone,
    meta, divCount, divNames, divOf,
  });
}

/* -------------------------------------------------------- derived stats */
function regGames() { return DB.games.filter(g => !g.playoff); }

function allTime() {
  const rows = new Map();
  const get = uid => {
    if (!rows.has(uid)) rows.set(uid, {
      uid, w: 0, l: 0, t: 0, pf: 0, pa: 0, g: 0, seasons: new Set(),
      apW: 0, apL: 0, titles: 0, playoffs: 0, podium: 0, best: 99, lasts: 0,
    });
    return rows.get(uid);
  };
  for (const g of regGames()) {
    const A = get(g.a.uid), B = get(g.b.uid);
    A.seasons.add(g.season); B.seasons.add(g.season);
    A.g++; B.g++;
    A.pf += g.a.pts; A.pa += g.b.pts;
    B.pf += g.b.pts; B.pa += g.a.pts;
    if (g.a.pts > g.b.pts) { A.w++; B.l++; }
    else if (g.b.pts > g.a.pts) { B.w++; A.l++; }
    else { A.t++; B.t++; }
  }
  const byWeek = new Map();
  for (const g of regGames()) {
    const k = g.season + "|" + g.week;
    if (!byWeek.has(k)) byWeek.set(k, []);
    byWeek.get(k).push({ uid: g.a.uid, pts: g.a.pts }, { uid: g.b.uid, pts: g.b.pts });
  }
  for (const arr of byWeek.values()) {
    for (const x of arr) {
      const r = get(x.uid);
      for (const y of arr) {
        if (y === x) continue;
        if (x.pts > y.pts) r.apW++; else if (x.pts < y.pts) r.apL++;
      }
    }
  }
  for (const s of DB.seasons) {
    if (!s.complete) continue;
    const keys = Object.keys(s.places).map(Number);
    if (!keys.length) continue;
    const lastPlace = Math.max(...keys);
    for (const [place, rid] of Object.entries(s.places)) {
      const uid = s.uidOf.get(Number(rid));
      if (!uid || !rows.has(uid)) continue;
      const r = rows.get(uid), p = Number(place);
      r.best = Math.min(r.best, p);
      if (p === 1) r.titles++;
      if (p <= 3) r.podium++;
      if (p <= s.playoffTeams) r.playoffs++;
      if (p === lastPlace) r.lasts++;
    }
  }
  return [...rows.values()].map(r => {
    const dec = r.w + r.l + r.t, apT = r.apW + r.apL;
    const expW = apT ? (r.apW / apT) * r.g : 0;
    return {
      ...r,
      winPct: dec ? (r.w + r.t / 2) / dec : 0,
      ppg: r.g ? r.pf / r.g : 0, papg: r.g ? r.pa / r.g : 0,
      apPct: apT ? r.apW / apT : 0,
      expW, luck: r.w - expW, nSeasons: r.seasons.size,
    };
  }).sort((a, b) => b.winPct - a.winPct || b.pf - a.pf);
}

function h2hMap() {
  const m = new Map();
  const key = (x, y) => x + "|" + y;
  const cell = (x, y) => {
    if (!m.has(key(x, y))) m.set(key(x, y), { w: 0, l: 0, t: 0, pf: 0, pa: 0 });
    return m.get(key(x, y));
  };
  for (const g of DB.games) {
    const A = cell(g.a.uid, g.b.uid), B = cell(g.b.uid, g.a.uid);
    if (g.a.pts > g.b.pts) { A.w++; B.l++; }
    else if (g.b.pts > g.a.pts) { B.w++; A.l++; }
    else { A.t++; B.t++; }
    A.pf += g.a.pts; A.pa += g.b.pts;
    B.pf += g.b.pts; B.pa += g.a.pts;
  }
  return m;
}

function recordBook() {
  const sides = [];
  for (const g of DB.games) {
    const aw = g.a.pts > g.b.pts, bw = g.b.pts > g.a.pts;
    sides.push({ ...g.a, opp: g.b, season: g.season, week: g.week, playoff: g.playoff, won: aw, tie: !aw && !bw });
    sides.push({ ...g.b, opp: g.a, season: g.season, week: g.week, playoff: g.playoff, won: bw, tie: !aw && !bw });
  }
  const byGame = DB.games.map(g => ({ g, margin: Math.abs(g.a.pts - g.b.pts), total: g.a.pts + g.b.pts }));
  const best = (arr, sel, dir = -1) => arr.length ? arr.slice().sort((x, y) => dir * (sel(x) - sel(y)))[0] : null;

  const order = new Map(DB.seasons.slice().sort((a, b) => Number(a.season) - Number(b.season)).map((s, i) => [s.season, i]));
  const logs = new Map();
  for (const g of regGames()) {
    for (const [me, op] of [[g.a, g.b], [g.b, g.a]]) {
      if (!logs.has(me.uid)) logs.set(me.uid, []);
      logs.get(me.uid).push({ k: order.get(g.season) * 100 + g.week, won: me.pts > op.pts, season: g.season, week: g.week });
    }
  }
  const streaks = { win: { n: 0 }, loss: { n: 0 } }, perMgr = new Map();
  for (const [uid, log] of logs) {
    log.sort((a, b) => a.k - b.k);
    let cw = 0, cl = 0, bw = 0, bl = 0;
    for (const e of log) {
      cw = e.won ? cw + 1 : 0; cl = e.won ? 0 : cl + 1;
      bw = Math.max(bw, cw); bl = Math.max(bl, cl);
      if (cw > streaks.win.n) streaks.win = { n: cw, uid, end: e };
      if (cl > streaks.loss.n) streaks.loss = { n: cl, uid, end: e };
    }
    perMgr.set(uid, { bestWin: bw, worstLoss: bl });
  }

  const seasonPF = [];
  for (const s of DB.seasons) {
    const tot = new Map();
    for (const g of s.games) {
      if (g.playoff) continue;
      tot.set(g.a.uid, (tot.get(g.a.uid) || 0) + g.a.pts);
      tot.set(g.b.uid, (tot.get(g.b.uid) || 0) + g.b.pts);
    }
    for (const [uid, pf] of tot) seasonPF.push({ uid, pf, season: s.season });
  }

  return {
    high: best(sides, s => s.pts), low: best(sides, s => s.pts, 1),
    blowout: best(byGame, x => x.margin),
    nailbiter: best(byGame.filter(x => x.margin > 0), x => x.margin, 1),
    shootout: best(byGame, x => x.total), snoozer: best(byGame, x => x.total, 1),
    unlucky: best(sides.filter(s => !s.won && !s.tie), s => s.pts),
    lucky: best(sides.filter(s => s.won), s => s.pts, 1),
    streakW: streaks.win, streakL: streaks.loss, perMgr,
    seasonHi: best(seasonPF, s => s.pf), seasonLo: best(seasonPF, s => s.pf, 1),
    sides,
  };
}

/* ------------------------------------------------------------- helpers */
const nameOf = uid => (DB.mgr.get(uid) || {}).name || "—";
const teamOf = uid => (DB.mgr.get(uid) || {}).team || "";
const initials = n => String(n || "?").replace(/[^a-zA-Z0-9]/g, "").slice(0, 2).toUpperCase();
function avatarHTML(uid, cls = "") {
  const m = DB.mgr.get(uid);
  const inner = m && m.avatar
    ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(m.avatar)}" alt="" loading="lazy">`
    : esc(initials(m && m.name));
  return `<span class="av ${cls}">${inner}</span>`;
}
const tipEl = $("#tip");
function bindTip(node, html) {
  const move = e => {
    const r = tipEl.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
    tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  };
  node.addEventListener("mouseenter", e => { tipEl.innerHTML = html; tipEl.style.opacity = "1"; move(e); });
  node.addEventListener("mousemove", move);
  node.addEventListener("mouseleave", () => { tipEl.style.opacity = "0"; });
}
/** Diverging blue↔red about a neutral gray midpoint (the documented pair). */
function divergeColor(v, max) {
  if (!isFinite(v) || !max) return "var(--mid)";
  const t = Math.max(-1, Math.min(1, v / max)), a = Math.abs(t);
  if (a < 0.06) return "var(--mid)";
  const hue = t > 0 ? "57,135,229" : "230,103,103";
  return `rgba(${hue},${(0.20 + 0.75 * a).toFixed(3)})`;
}
function sechead(title, sub) {
  return el("div", "sechead", `<h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}`);
}
function tableCard(headers, rows) {
  const c = el("div", "card"), s = el("div", "scroll"), t = el("table");
  t.innerHTML = `<thead><tr>${headers.map(h =>
    `<th class="${h.num ? "num" : ""}"${h.title ? ` title="${esc(h.title)}"` : ""}>${esc(h.label)}</th>`).join("")}</tr></thead>`;
  const tb = el("tbody"); tb.innerHTML = rows.join("");
  t.appendChild(tb); s.appendChild(t); c.appendChild(s);
  return c;
}
function barCard(items, valFmt, tipFn) {
  const max = Math.max(...items.map(i => i.v), 1e-9);
  const box = el("div", "barbox"), inner = el("div", "bars");
  items.forEach(it => {
    const row = el("div", "bar");
    row.innerHTML = `<span class="nm">${esc(it.label)}</span>
      <span class="track"><span class="fill" style="width:${(it.v / max * 100).toFixed(1)}%"></span></span>
      <span class="v">${esc(valFmt(it.v))}</span>`;
    if (tipFn) bindTip(row, tipFn(it));
    inner.appendChild(row);
  });
  box.appendChild(inner);
  return box;
}
function glossary(items) {
  const d = el("details", "gloss");
  d.innerHTML = `<summary>What do these numbers mean?</summary>
    <div class="gitems">${items.map(i => `<div class="gitem"><b>${esc(i.t)}</b><span>${esc(i.d)}</span></div>`).join("")}</div>`;
  return d;
}

/* ------------------------------------------------------------- routing */
const TABS = [
  { id: "home", label: "Home" },
  { id: "scores", label: "Scoreboard" },
  { id: "managers", label: "Managers" },
  { id: "records", label: "Records" },
  { id: "matchups", label: "Matchups" },
  { id: "power", label: "Power" },
  { id: "odds", label: "Odds" },
  { id: "race", label: "Race" },
  { id: "draft", label: "Draft" },
  { id: "trades", label: "Trades" },
  // The id stays "recaps" so links people have already shared keep working.
  { id: "recaps", label: "News & Articles" },
];
function buildTabs() {
  const bar = $("#tabs"); bar.innerHTML = "";
  TABS.forEach(t => {
    const b = el("button", null, t.label);
    b.setAttribute("role", "tab"); b.dataset.tab = t.id;
    b.onclick = () => show(t.id);
    bar.appendChild(b);
  });
}
function show(id) {
  const prof = $('[data-panel="profile"]');
  if (prof) prof.remove();
  // The trade block reads five seasons of transactions and a 5MB name file.
  // Nobody pays for that until they ask to see it.
  if (id === "trades") ensureTrades();
  // Same deal for the race: it reads the rest of the schedule and runs tens of
  // thousands of seasons, so it waits until somebody asks for it.
  if (id === "race") ensureRace();
  const dp = $('[data-panel="draft"]');
  if (id === "draft" && dp && dp._draw && !dp.dataset.drawn) { dp.dataset.drawn = "1"; dp._draw(); }
  for (const b of $("#tabs").children) b.setAttribute("aria-selected", String(b.dataset.tab === id));
  for (const p of $("#app").children) p.hidden = p.dataset.panel !== id;
  history.replaceState(null, "", "#" + id);
  scrollTo(0, 0);
}

/* =============================================== HOME =============== */
function panelHome(AT, RB, model, sim) {
  const p = el("div", "panel"); p.dataset.panel = "home";

  const completed = DB.seasons.filter(s => s.complete && Object.keys(s.places).length);
  const cs = completed[0];
  const champ = cs ? cs.uidOf.get(cs.places[1]) : null;
  if (champ) {
    const m = DB.mgr.get(champ);
    const bar = el("div", "champbar");
    bar.innerHTML = `<span class="ring">${m && m.avatar
      ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(m.avatar)}" alt="">` : esc(initials(m && m.name))}</span>
      <span class="who"><span class="k">${esc(cs.season)} Champion</span>
        <div class="nm">${esc(nameOf(champ))}</div>
        ${teamOf(champ) ? `<div class="tm">${esc(teamOf(champ))}</div>` : ""}</span>`;
    p.appendChild(bar);
  }

  const top = AT[0];
  const tiles = [
    { l: "Seasons played", v: completed.length, n: DB.seasons.length ? `${DB.seasons[DB.seasons.length - 1].season}–${DB.seasons[0].season}` : "" },
    { l: "Games on record", v: DB.games.length, n: "regular season + playoffs" },
    { l: "Best win rate", v: top ? pct(top.winPct) : "—", n: top ? `${nameOf(top.uid)} · ${top.w}-${top.l}` : "" },
    { l: "Highest score ever", v: RB.high ? f2(RB.high.pts) : "—", n: RB.high ? `${nameOf(RB.high.uid)} · ${RB.high.season} week ${RB.high.week}` : "" },
  ];
  const tw = el("div", "tiles");
  tw.innerHTML = tiles.map(t =>
    `<div class="tile"><div class="l">${esc(t.l)}</div><div class="v">${esc(String(t.v))}</div><div class="n">${esc(t.n)}</div></div>`).join("");
  p.appendChild(tw);

  p.appendChild(sechead("Find yourself",
    "Tap anyone to see their whole career — every season, their best and worst weeks, and exactly who they own."));
  p.appendChild(managerGrid(AT));

  p.appendChild(sechead("Who's actually the best?",
    "This ranks everyone by how their weekly score would have done against all 11 other teams that same week — not just the one guy they happened to be scheduled against. It takes luck out of it."));
  p.appendChild(barCard(
    AT.slice().sort((a, b) => b.apPct - a.apPct).map((r, i) => ({ label: `${i + 1}. ${nameOf(r.uid)}`, v: r.apPct, r })),
    v => pct(v),
    it => `<b>${esc(nameOf(it.r.uid))}</b><br>Beat ${it.r.apW} of ${it.r.apW + it.r.apL} teams week-for-week<br>Actual record ${it.r.w}-${it.r.l}`
  ));

  p.appendChild(sechead("Who's been luckiest?",
    "How many more — or fewer — wins each manager has than their scoring earned them. Positive means the schedule has been kind: they keep catching people on their bad weeks."));
  const luck = AT.slice().sort((a, b) => b.luck - a.luck);
  const max = Math.max(...luck.map(r => Math.abs(r.luck)), 0.5);
  const box = el("div", "barbox"), inner = el("div", "bars");
  for (const r of luck) {
    const w = Math.abs(r.luck) / max * 50;
    const style = r.luck >= 0
      ? `left:50%;width:${w.toFixed(1)}%;background:var(--blue)`
      : `right:50%;width:${w.toFixed(1)}%;background:var(--red)`;
    const row = el("div", "divbar");
    row.innerHTML = `<span class="nm">${esc(nameOf(r.uid))}</span>
      <span class="track"><span class="zero"></span><span class="fill" style="${style}"></span></span>
      <span class="v ${r.luck >= 0 ? "pos-t" : "neg-t"}">${r.luck >= 0 ? "+" : ""}${f1(r.luck)}</span>`;
    bindTip(row, `<b>${esc(nameOf(r.uid))}</b><br>Actual ${r.w}-${r.l}<br>Earned about ${f1(r.expW)} wins<br>${r.luck >= 0 ? "Up" : "Down"} ${f1(Math.abs(r.luck))} on luck`);
    inner.appendChild(row);
  }
  box.appendChild(inner); p.appendChild(box);

  /* ---- pre-season outlook: the same model the Odds tab prices from ---- */
  if (model && model.ok && sim) {
    const n = sim.sims;
    const rows = model.teams
      .map((t, i) => ({ uid: t.uid, title: sim.title[i] / n, playoff: sim.playoff[i] / n, wins: sim.wins[i] / n }))
      .sort((a, b) => b.title - a.title);
    p.appendChild(sechead("Next season, for argument's sake",
      `Twenty thousand simulated ${model.season} seasons on the real format — fourteen weeks, three divisions, six playoff spots. ${model.postDraft
        ? "Now that the draft has run, every roster is valued against the pre-draft market, and about half of a team's draft-day edge is carried into its projection."
        : "It is pre-draft, so this knows only how these managers have scored before, and roughly a third of even that is discarded as roster luck. It re-prices itself once you draft."} The Odds tab prices the whole board and shows its working.`));
    p.appendChild(tableCard(
      [{ label: "Manager" }, { label: "Title odds", num: 1 }, { label: "Makes playoffs", num: 1 }, { label: "Projected wins", num: 1 }],
      rows.map(r => `<tr>
        <td><span class="nmcell">${avatarHTML(r.uid, "sm")}${esc(nameOf(r.uid))}</span></td>
        <td class="num"><b>${(r.title * 100).toFixed(1)}%</b></td>
        <td class="num">${(r.playoff * 100).toFixed(0)}%</td>
        <td class="num">${f1(r.wins)}</td></tr>`)));
  }

  p.appendChild(glossary([
    { t: "Win rate", d: "Regular-season wins divided by games played. Playoffs are counted separately, so these tie out exactly to Sleeper's own standings." },
    { t: "Title odds", d: "From simulating the season twenty thousand times off each manager's scoring history. Entertainment only — it cannot see rosters, trades, injuries, or the draft. The Odds tab explains exactly how little it knows." },
    { t: "Points / points allowed", d: "Total fantasy points your lineup scored, and the total your opponents put up against you." },
    { t: "Beat-everyone rate", d: "If you had played all 11 other teams every single week, what share would you have beaten? The fairest measure of how good someone actually is." },
    { t: "Luck", d: "Actual wins minus the wins your scoring earned. +2 means you've won two more games than your points deserved." },
  ]));
  return p;
}

/* ---------------------------------------------- manager grid + profile */
function managerGrid(AT) {
  const g = el("div", "mgrid");
  for (const r of AT) {
    const b = el("button", "mcard");
    b.innerHTML = `
      <span class="top">${avatarHTML(r.uid)}
        <span style="min-width:0"><span class="nm">${esc(nameOf(r.uid))}</span>
        ${teamOf(r.uid) ? `<span class="tm">${esc(teamOf(r.uid))}</span>` : ""}</span></span>
      <span class="row"><span class="rec">${r.w}-${r.l}</span><span class="pc">${pct(r.winPct)}</span>
        ${r.titles ? `<span class="badge gold">${r.titles}× champ</span>` : ""}</span>
      <span class="go">View career →</span>`;
    b.onclick = () => openProfile(r.uid);
    g.appendChild(b);
  }
  return g;

let LAST_TAB = "home";
function openProfile(uid) {
  const cur = [...$("#app").children].find(c => !c.hidden);
  if (cur && cur.dataset.panel !== "profile") LAST_TAB = cur.dataset.panel;
  const old = $('[data-panel="profile"]');
  if (old) old.remove();
  const p = buildProfile(uid);
  $("#app").appendChild(p);
  for (const c of $("#app").children) c.hidden = c !== p;
  for (const b of $("#tabs").children) b.setAttribute("aria-selected", "false");
  scrollTo(0, 0);
}

function buildProfile(uid) {
  const p = el("div", "panel"); p.dataset.panel = "profile";
  const AT = window.__AT, RB = window.__RB, M = window.__H2H;
  const r = AT.find(x => x.uid === uid);

  const back = el("button", "back", "← Back");
  back.onclick = () => show(LAST_TAB);
  p.appendChild(back);

  const head = el("div", "phead");
  head.innerHTML = `${avatarHTML(uid, "lg")}
    <span><div class="nm">${esc(nameOf(uid))}</div>
    ${teamOf(uid) ? `<div class="tm">${esc(teamOf(uid))}</div>` : ""}</span>`;
  p.appendChild(head);

  const bits = [];
  if (r.titles) bits.push(`<span class="badge gold">${r.titles}× champion</span>`);
  if (r.podium) bits.push(`<span class="badge blue">${r.podium}× top 3</span>`);
  if (r.playoffs) bits.push(`<span class="badge blue">${r.playoffs}× playoffs</span>`);
  if (r.lasts) bits.push(`<span class="badge red">${r.lasts}× last place</span>`);
  if (bits.length) { const b = el("div", "pbadges"); b.innerHTML = bits.join(""); p.appendChild(b); }

  const t = el("div", "tiles");
  t.innerHTML = [
    { l: "Career record", v: `${r.w}-${r.l}${r.t ? "-" + r.t : ""}`, n: `${pct(r.winPct)} · ${r.nSeasons} season${r.nSeasons === 1 ? "" : "s"}` },
    { l: "Points per game", v: f1(r.ppg), n: `${f1(r.papg)} allowed per game` },
    { l: "Best finish", v: r.best < 99 ? ord(r.best) : "—", n: r.titles ? "won it all" : "so far" },
    { l: "Luck", v: `${r.luck >= 0 ? "+" : ""}${f1(r.luck)}`, n: r.luck >= 0 ? "wins above what he earned" : "wins below what he earned" },
  ].map(x => `<div class="tile"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div><div class="n">${esc(x.n)}</div></div>`).join("");
  p.appendChild(t);

  const mine = RB.sides.filter(s => s.uid === uid);
  const hi = mine.slice().sort((a, b) => b.pts - a.pts)[0];
  const lo = mine.slice().sort((a, b) => a.pts - b.pts)[0];
  const st = RB.perMgr.get(uid) || {};
  p.appendChild(sechead("Career highs and lows"));
  const rc = el("div", "recs");
  rc.innerHTML = [
    hi && { c: "up", l: "Best week ever", v: f2(hi.pts), w: `vs ${nameOf(hi.opp.uid)}`, x: `${hi.season} · week ${hi.week}${hi.playoff ? " (playoffs)" : ""} · ${hi.pts > hi.opp.pts ? "won" : "still lost"}` },
    lo && { c: "down", l: "Worst week ever", v: f2(lo.pts), w: `vs ${nameOf(lo.opp.uid)}`, x: `${lo.season} · week ${lo.week}${lo.playoff ? " (playoffs)" : ""} · ${lo.pts > lo.opp.pts ? "somehow won" : "lost"}` },
    st.bestWin && { c: "up", l: "Longest win streak", v: st.bestWin + "W", w: "in a row", x: "regular season, all years" },
    st.worstLoss && { c: "down", l: "Longest losing streak", v: st.worstLoss + "L", w: "in a row", x: "regular season, all years" },
  ].filter(Boolean).map(x =>
    `<div class="rec ${x.c}"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div>
     <div class="w">${esc(x.w)}</div><div class="c">${esc(x.x)}</div></div>`).join("");
  p.appendChild(rc);

  p.appendChild(sechead("Season by season"));
  const rows = [];
  for (const s of DB.seasons) {
    let w = 0, l = 0, tt = 0, pf = 0, pa = 0;
    for (const g of s.games) {
      if (g.playoff) continue;
      for (const [me, op] of [[g.a, g.b], [g.b, g.a]]) {
        if (me.uid !== uid) continue;
        if (me.pts > op.pts) w++; else if (me.pts < op.pts) l++; else tt++;
        pf += me.pts; pa += op.pts;
      }
    }
    if (!(w + l + tt)) continue;
    let place = null;
    for (const [pl, rid] of Object.entries(s.places)) if (s.uidOf.get(Number(rid)) === uid) place = Number(pl);
    rows.push(`<tr>
      <td>${esc(s.season)}${place === 1 ? ' <span class="badge gold">CHAMP</span>' : ""}</td>
      <td class="num">${place ? ord(place) : "—"}</td>
      <td class="num">${w}-${l}${tt ? "-" + tt : ""}</td>
      <td class="num">${f2(pf)}</td><td class="num">${f2(pa)}</td>
      <td class="num">${f1(pf / (w + l + tt))}</td></tr>`);
  }
  p.appendChild(tableCard([{ label: "Season" }, { label: "Finish", num: 1 }, { label: "Record", num: 1 },
  { label: "Points", num: 1 }, { label: "Allowed", num: 1 }, { label: "Per game", num: 1 }], rows));

  const vs = [];
  for (const other of AT) {
    if (other.uid === uid) continue;
    const c = M.get(uid + "|" + other.uid);
    if (!c) continue;
    const n = c.w + c.l + c.t;
    if (!n) continue;
    vs.push({ uid: other.uid, ...c, n, edge: (c.w - c.l) / n });
  }
  if (vs.length) {
    p.appendChild(sechead("Who he owns, and who owns him", "All-time head-to-head, playoffs included."));
    const rr = vs.slice().sort((a, b) => b.edge - a.edge || b.n - a.n).map(v => `<tr>
      <td><span class="nmcell">${avatarHTML(v.uid, "sm")}${esc(nameOf(v.uid))}</span></td>
      <td class="num ${v.w > v.l ? "pos-t" : v.l > v.w ? "neg-t" : ""}"><b>${v.w}-${v.l}${v.t ? "-" + v.t : ""}</b></td>
      <td class="num">${f1(v.pf / v.n)}</td><td class="num">${f1(v.pa / v.n)}</td></tr>`);
    p.appendChild(tableCard([{ label: "Opponent" }, { label: "Record vs", num: 1 },
    { label: "His avg", num: 1 }, { label: "Their avg", num: 1 }], rr));
  }
  return p;
}

/* =========================================== MANAGERS =============== */
function panelManagers(AT) {
  const p = el("div", "panel"); p.dataset.panel = "managers";
  p.appendChild(sechead("Every manager", "Tap anyone for their full career. Sort the list however you like."));

  const sel = el("select");
  [["win", "Best win rate"], ["ppg", "Most points per game"], ["titles", "Most championships"],
  ["luck", "Luckiest first"], ["unluck", "Unluckiest first"], ["az", "A to Z"]]
    .forEach(([v, t]) => { const o = el("option", null, t); o.value = v; sel.appendChild(o); });
  const wrap = el("div"); wrap.style.cssText = "margin:0 0 14px;max-width:260px";
  wrap.appendChild(sel); p.appendChild(wrap);

  const host = el("div"); p.appendChild(host);
  const draw = () => {
    const s = sel.value;
    const sorted = AT.slice().sort((a, b) =>
      s === "ppg" ? b.ppg - a.ppg :
        s === "titles" ? (b.titles - a.titles) || (b.winPct - a.winPct) :
          s === "luck" ? b.luck - a.luck :
            s === "unluck" ? a.luck - b.luck :
              s === "az" ? nameOf(a.uid).toLowerCase().localeCompare(nameOf(b.uid).toLowerCase()) :
                b.winPct - a.winPct);
    host.innerHTML = "";
    const rows = el("div", "rows");
    sorted.forEach((r, i) => {
      const b = el("button", "rowc");
      b.innerHTML = `<span class="pos">${i + 1}</span>
        <span class="nmcell">${avatarHTML(r.uid)}</span>
        <span class="id"><span class="n">${esc(nameOf(r.uid))}
          ${r.titles ? `<span class="badge gold">${r.titles}×</span>` : ""}</span>
          <span class="s">${esc(teamOf(r.uid) || `${r.nSeasons} season${r.nSeasons === 1 ? "" : "s"}`)}</span></span>
        <span class="stats">
          <span class="chip"><span class="cv">${r.w}-${r.l}</span><span class="cl">Record</span></span>
          <span class="chip"><span class="cv">${pct(r.winPct)}</span><span class="cl">Win rate</span></span>
          <span class="chip"><span class="cv">${f1(r.ppg)}</span><span class="cl">Pts/gm</span></span>
          <span class="chip ${r.luck >= 0 ? "pos-v" : "neg-v"}"><span class="cv">${r.luck >= 0 ? "+" : ""}${f1(r.luck)}</span><span class="cl">Luck</span></span>
        </span>`;
      b.onclick = () => openProfile(r.uid);
      rows.appendChild(b);
    });
    host.appendChild(rows);
  };
  sel.onchange = draw; draw();
  p.appendChild(glossary([
    { t: "Record", d: "Regular-season wins and losses across every season this manager has played." },
    { t: "Win rate", d: "Wins divided by games played." },
    { t: "Pts/gm", d: "Average fantasy points scored per week." },
    { t: "Luck", d: "Wins above or below what their scoring earned. Positive means the schedule has been friendly." },
  ]));
  return p;
}

    RB.snoozer && { c: "down", l: "Lowest-scoring game", v: f2(RB.snoozer.total), w: vs(RB.snoozer), x: gwhen(RB.snoozer) },
    RB.streakW && RB.streakW.uid && { c: "up", l: "Longest win streak", v: RB.streakW.n + "W", w: nameOf(RB.streakW.uid), x: `ended ${RB.streakW.end.season} week ${RB.streakW.end.week}` },
    RB.streakL && RB.streakL.uid && { c: "down", l: "Longest losing streak", v: RB.streakL.n + "L", w: nameOf(RB.streakL.uid), x: `ended ${RB.streakL.end.season} week ${RB.streakL.end.week}` },
    RB.seasonHi && { c: "up", l: "Best season of scoring", v: f2(RB.seasonHi.pf), w: nameOf(RB.seasonHi.uid), x: `${RB.seasonHi.season} regular season` },

     <div class="w">${esc(c.w)}</div><div class="c">${esc(c.x)}</div></div>`).join("");
  p.appendChild(rg);

  const row = s => `<tr>
    <td><span class="nmcell">${avatarHTML(s.uid, "sm")}${esc(nameOf(s.uid))}</span></td>
    <td class="num"><b>${f2(s.pts)}</b></td>

  const head = [{ label: "Manager" }, { label: "Score", num: 1 }, { label: "Season" },
  { label: "Wk", num: 1 }, { label: "Opponent" }, { label: "They had", num: 1 }, { label: "Result", num: 1 }];

  p.appendChild(tableCard(head, RB.sides.slice().sort((a, b) => a.pts - b.pts).slice(0, 10).map(row)));

  /* ---- season awards ---- */

  if (awarded.length) {
    p.appendChild(sechead("Season awards",
      "Handed out automatically from the scoring. “Consistency” is how much a manager's weekly score bounced around — low means you knew what you were getting every Sunday."));
    const ag = el("div", "awgrid");
    for (const { s, a } of awarded) {
      const line = (ic, t, d, who, n) => who
        ? `<div class="aw"><span class="ic">${ic}</span>
             <span><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span></span>
             <span class="n">${esc(nameOf(who.uid))}<br><span style="color:var(--muted);font-weight:600">${esc(n)}</span></span></div>` : "";
      const card = el("div", "awcard");
      card.innerHTML = `<div class="yr">${esc(s.season)} awards</div>` + [
        line("🔥", "Points Machine", "Most total points scored", a.machine, f1(a.machine && a.machine.total)),
        line("💤", "Sleepwalker", "Fewest total points scored", a.sleepwalker, f1(a.sleepwalker && a.sleepwalker.total)),
        line("📏", "Mr. Consistent", "Same score every week", a.consistent, "±" + f1(a.consistent && a.consistent.sd)),
        line("🎢", "Boom or Bust", "Wildest week-to-week swings", a.boom, "±" + f1(a.boom && a.boom.sd)),
        line("💔", "Hard Luck", "Losses despite scoring above the league's middle that week", a.hardLuck, (a.hardLuck && a.hardLuck.hardLuck) + " times"),
        line("🍀", "Daylight Robbery", "Wins despite scoring below the league's middle that week", a.thief, (a.thief && a.thief.stolen) + " times"),
        line("📄", "Paper Champion", "Best regular-season record, no title", a.paper, a.paper ? `${a.paper.w}-${a.paper.l}` : ""),
      ].join("");

  /* ---- weekly crowns ---- */
  const cr = weeklyCrowns();
  if (cr.weeks) {
    p.appendChild(sechead("Weekly crowns",
      `Across all ${cr.weeks} weeks the league has played, how often each manager posted the single highest — or lowest — score of the week.`));
    const rows2 = [...DB.mgr.keys()]
      .map(uid => ({ uid, hi: cr.hi.get(uid) || 0, lo: cr.lo.get(uid) || 0 }))
      .filter(x => x.hi || x.lo)
      .sort((a, b) => b.hi - a.hi || a.lo - b.lo)
      .map(x => `<tr>
        <td><span class="nmcell">${avatarHTML(x.uid, "sm")}${esc(nameOf(x.uid))}</span></td>

        <td class="num ${x.lo ? "neg-t" : ""}"><b>${x.lo}</b></td>
